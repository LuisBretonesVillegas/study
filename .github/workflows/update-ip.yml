# Regenera IP/index.html cada noche a las 00:00 (hora de Madrid) a partir de lo que
# haya en GitHub en JAVA-MASTERCLASS: apuntes, ejercicios de Udemy y de Liang.
# Solo hace commit si algo ha cambiado.
name: Update IP notes

on:
  schedule:
    # GitHub solo admite cron en UTC: medianoche en Madrid es 23:00 UTC en invierno
    # y 22:00 UTC en verano. Se programan las dos y el primer paso descarta la que no toca.
    - cron: "0 23 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/update-ip.yml]

permissions:
  contents: write

concurrency:
  group: update-ip
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check it is midnight in Madrid
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=Europe/Madrid date +%z)
          run=true
          if [ -n "$SCHEDULE" ]; then
            if [ "$offset" = "+0100" ] && [ "$SCHEDULE" != "0 23 * * *" ]; then run=false; fi
            if [ "$offset" = "+0200" ] && [ "$SCHEDULE" != "0 22 * * *" ]; then run=false; fi
          fi
          echo "Madrid offset $offset, schedule '$SCHEDULE', run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          repository: LuisBretonesVillegas/JAVA-MASTERCLASS
          path: _src
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      # Un clon nuevo tiene todas las fechas de modificación iguales (la del checkout).
      # Se ponen las del último commit de cada archivo, para que "editado el ..." sea real
      # y para que la salida no cambie si no hay commits nuevos.
      - name: Set file dates from git history
        if: steps.gate.outputs.run == 'true'
        working-directory: _src
        run: |
          python - <<'EOF'
          import os, subprocess
          log = subprocess.run(["git", "log", "--format=@%ct", "--name-only", "--no-renames"],
                               capture_output=True, text=True, check=True).stdout
          seen, t = set(), None
          for line in log.splitlines():
              if line.startswith("@"):
                  t = int(line[1:])
              elif line and line not in seen:
                  seen.add(line)
                  if os.path.isfile(line):
                      os.utime(line, ns=(t * 10**9, t * 10**9))
          EOF
          echo "BUILD_TIME_MS=$(git log -1 --format=%ct)000" >> "$GITHUB_ENV"

      - name: Build IP/index.html
        if: steps.gate.outputs.run == 'true'
        run: python _src/src/preparationIntroductionToProgramingExam/viewer/build_static.py IP/index.html

      - name: Commit if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          if git diff --quiet -- IP/index.html; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add IP/index.html
          git commit -m "Update IP notes from JAVA-MASTERCLASS"
          git push
