<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #eef1f5; --text: #1b2130; --muted: #5b6475; --border: #d8dde5;
  --accent: #2c56c9; --accent-ink: #ffffff; --accent-soft: #e5ecfc;
  --ok: #17784a; --ok-soft: #e1f3e9; --bad: #b0233a; --bad-soft: #fbe6ea; --warn: #8f5a00; --warn-soft: #fff1d1;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 2px 6px rgba(16,24,40,.06);
  --radius: 12px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1117; --surface: #161a22; --surface-2: #1d2330; --text: #e5e8ee; --muted: #9aa3b3; --border: #2a3140;
    --accent: #7fa4ff; --accent-ink: #0a1020; --accent-soft: #1b2847;
    --ok: #4fc68a; --ok-soft: #10301f; --bad: #ff7d8c; --bad-soft: #3a1820; --warn: #f0b95a; --warn-soft: #3a2c10;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1117; --surface: #161a22; --surface-2: #1d2330; --text: #e5e8ee; --muted: #9aa3b3; --border: #2a3140;
  --accent: #7fa4ff; --accent-ink: #0a1020; --accent-soft: #1b2847;
  --ok: #4fc68a; --ok-soft: #10301f; --bad: #ff7d8c; --bad-soft: #3a1820; --warn: #f0b95a; --warn-soft: #3a2c10;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 840px; margin: 0 auto; padding: 16px 16px 48px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 16px; }
header.top h1 { font-size: 1.35rem; margin: 0; letter-spacing: -.01em; }
header.top .sub { color: var(--muted); font-size: .9rem; margin: 2px 0 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin: 0 0 16px; }
.card h2 { font-size: 1.05rem; margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spacer { flex: 1; }
.btn { appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 10px; padding: 9px 14px; cursor: pointer; line-height: 1.2; font-weight: 550; transition: background .12s, border-color .12s; }
@media (hover: hover) { .btn:hover:not(:disabled) { border-color: var(--accent); } }
.btn:focus-visible, .opt:focus-visible, .chip:focus-visible, .navq:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
@media (hover: hover) { .btn.primary:hover:not(:disabled) { filter: brightness(1.06); } }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.big { padding: 12px 18px; font-size: 1rem; }
.icon-btn { width: 40px; height: 40px; padding: 0; display: inline-grid; place-items: center; font-size: 1.1rem; }
.chip { appearance: none; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: .9rem; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--text); font-weight: 600; }
.field { margin: 12px 0 0; }
.field > .lbl { display: block; font-size: .85rem; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
/* Temas */
.temas { display: grid; gap: 8px; }
.tema { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; background: var(--surface); }
@media (hover: hover) { .tema:hover { border-color: var(--accent); } }
.tema.on { background: var(--accent-soft); border-color: var(--accent); }
.tema input { margin: 4px 0 0; width: 18px; height: 18px; accent-color: var(--accent); }
.tema .tt { font-weight: 650; }
.tema .meta { font-size: .82rem; color: var(--muted); }
.bar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 680px) { .modes { grid-template-columns: 1fr; } }
.mode { display: flex; flex-direction: column; }
.mode p { margin: 0 0 4px; }
.mode .actions { margin-top: auto; padding-top: 14px; display: grid; gap: 8px; }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--warn-soft); border: 1px solid var(--warn); color: var(--text); border-radius: var(--radius); padding: 12px 14px; margin: 0 0 16px; }
/* Barra de sesión */
.sessbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 10px; margin: -6px 0 10px; border-bottom: 1px solid var(--border); }
.sessbar .row { gap: 10px; }
.sessbar .title { font-weight: 700; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); font-size: .88rem; font-variant-numeric: tabular-nums; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.05rem; padding: 4px 10px; border-radius: 8px; background: var(--surface-2); }
.timer.low { background: var(--bad-soft); color: var(--bad); }
.progress { height: 4px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 10px; }
.progress > i { display: block; height: 100%; background: var(--accent); }
/* Pregunta */
.qmeta { font-size: .82rem; color: var(--muted); margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 6px 12px; }
.qtext { font-size: 1.07rem; font-weight: 560; margin: 0 0 14px; overflow-wrap: anywhere; }
.qtext pre, .opt pre, .rv pre { font-family: var(--mono); font-size: .85rem; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: pre; margin: 10px 0; font-weight: 400; line-height: 1.45; }
code { font-family: var(--mono); font-size: .92em; background: var(--surface-2); border-radius: 5px; padding: 1px 5px; }
pre code { background: none; padding: 0; }
sup, sub { font-size: .72em; line-height: 0; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: start; width: 100%; text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 10px 12px; cursor: pointer; line-height: 1.45; overflow-wrap: anywhere; }
@media (hover: hover) { button.opt:hover:not(:disabled) { border-color: var(--accent); } }
.opt:disabled { cursor: default; }
.opt .let { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-weight: 700; font-size: .85rem; background: var(--surface-2); color: var(--muted); }
.opt .mk { font-weight: 700; font-size: .85rem; white-space: nowrap; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .let { background: var(--accent); color: var(--accent-ink); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.ok .let { background: var(--ok); color: #fff; }
.opt.ok .mk { color: var(--ok); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.bad .let { background: var(--bad); color: #fff; }
.opt.bad .mk { color: var(--bad); }
.opt.dim .otext { color: var(--muted); }
div.opt { cursor: default; grid-template-columns: 30px 1fr; }
.opt .body { display: grid; gap: 6px; min-width: 0; }
.opt .why { font-size: .92rem; padding-top: 7px; border-top: 1px dashed var(--border); }
.opt.ok .why { border-top-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.opt.bad .why { border-top-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.opt .tag { font-size: .72rem; font-weight: 750; text-transform: uppercase; letter-spacing: .04em; margin-right: 6px; color: var(--muted); }
.opt.ok .tag { color: var(--ok); }
.opt.bad .tag { color: var(--bad); }
.hide-why .opt .why { display: none; }
.feedback { margin: 16px 0 0; padding: 12px 14px; border-radius: 10px; font-weight: 650; }
.feedback.ok { background: var(--ok-soft); color: var(--ok); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.source { font-size: .82rem; color: var(--muted); margin: 10px 0 0; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
.controls .spacer { min-width: 8px; }
.kbd { font-size: .78rem; color: var(--muted); margin: 10px 0 0; }
kbd { font-family: var(--mono); font-size: .75rem; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--surface); }
/* Navegador del examen */
.navgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
.navq { appearance: none; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: .82rem; font-variant-numeric: tabular-nums; padding: 0; }
.navq.ans { background: var(--accent-soft); border-color: var(--accent); font-weight: 650; }
.navq.skip { border-style: dashed; border-color: var(--warn); }
.navq.cur { outline: 2px solid var(--text); outline-offset: 1px; }
.navq.r-ok { background: var(--ok-soft); border-color: var(--ok); }
.navq.r-bad { background: var(--bad-soft); border-color: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .8rem; color: var(--muted); margin: 10px 0 0; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--border); margin-right: 5px; vertical-align: -2px; }
.legend .l-ans::before { background: var(--accent-soft); border-color: var(--accent); }
.legend .l-skip::before { border-style: dashed; border-color: var(--warn); }
details.navwrap > summary { cursor: pointer; font-weight: 600; font-size: .92rem; list-style: none; }
details.navwrap > summary::-webkit-details-marker { display: none; }
details.navwrap > summary::before { content: "▸ "; color: var(--muted); }
details.navwrap[open] > summary::before { content: "▾ "; }
details.navwrap > .navgrid { margin-top: 10px; }
/* Resultados */
.score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.score .nota { font-size: 2.4rem; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
.score .nota small { font-size: 1rem; color: var(--muted); font-weight: 600; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0 0; }
@media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
.kpi { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.kpi b { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.kpi span { font-size: .8rem; color: var(--muted); }
.kpi.ok b { color: var(--ok); } .kpi.bad b { color: var(--bad); }
.tablewrap { overflow-x: auto; margin: 6px 0 0; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
th { color: var(--muted); font-weight: 600; font-size: .8rem; }
.rv { border-top: 1px solid var(--border); padding: 14px 0 4px; }
.rv:first-of-type { border-top: 0; }
.rv .qtext { font-size: 1rem; }
.rvhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 6px; }
.formula { font-size: .9rem; color: var(--muted); }
/* Modal */
.overlay { position: fixed; inset: 0; background: rgba(10,14,22,.55); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 14px; max-width: 440px; width: 100%; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.modal h3 { margin: 0 0 8px; font-size: 1.1rem; }
.modal p { margin: 0 0 16px; color: var(--muted); }
.modal .row { justify-content: flex-end; }
footer.foot { color: var(--muted); font-size: .8rem; margin: 24px 0 0; }
.empty { padding: 14px; text-align: center; color: var(--muted); }
@media (hover: none) { .kbd { display: none; } }
@media (max-width: 480px) {
  .card { padding: 14px; }
  .qtext { font-size: 1.02rem; }
  .opt { grid-template-columns: 26px 1fr; gap: 8px; padding: 10px; }
  .opt .mk { grid-column: 2; }
  .controls .btn { flex: 1 1 auto; }
  .sessbar .icon-btn { display: none; }
  .sessbar .row { gap: 6px; }
  .sessbar .btn { padding: 7px 10px; }
  .sessbar .title { font-size: .95rem; }
  .sessbar.exam .title, .hide-sm { display: none; }
}
</style>
<style>
.vf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.vf .btn { padding: 14px; font-size: 1.05rem; }
.vf .btn.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.vf .btn.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.why { margin: 12px 0 0; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); }
.secs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0 28px; }
.secs .chip { font-size: .8rem; padding: 4px 10px; }
.temablock { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.temablock.on { background: var(--accent-soft); border-color: var(--accent); }
.temablock label { display: grid; grid-template-columns: auto 1fr; gap: 10px; cursor: pointer; }
.temablock input { margin: 4px 0 0; width: 18px; height: 18px; accent-color: var(--accent); }
</style>
</head>

<script>
const BANK = [{"n":1,"nombre":"Visión general de los sistemas operativos","secs":["1.1 Conceptos básicos de un ordenador","1.2 Conceptos básicos de Sistemas Operativos","1.3 Arquitecturas de Sistemas Operativos","1.4 Visión de los SO por parte de los usuarios","1.5 Máquinas virtuales y Contenedores","1.6 Unidades de medida"],"qs":[[0,"La aportación clave del modelo de Von Neumann (1946) fue el ordenador con programa almacenado.",1,"Es su aportación más importante según los apuntes: datos e instrucciones en la misma memoria."],[0,"La memoria principal almacena solo datos; las instrucciones se guardan en la CPU.",0,"La memoria principal guarda <b>tanto datos como instrucciones máquina</b>."],[0,"Todas las celdas de la memoria principal tienen el mismo tamaño.",1,"Todas tienen el mismo número de bits y se identifican por una dirección de memoria."],[0,"La memoria RAM es la que usa el procesador para buscar instrucciones y datos y guardar resultados.",1,"Es la memoria que necesita el procesador para ejecutar los programas."],[0,"Los módulos DDR permiten dos transferencias en un mismo ciclo de reloj.",1,"DDR = Double Data Rate: doble tasa de transferencia."],[0,"Un módulo DDR tiene 240 pines.",0,"DDR tiene <b>184</b> pines. Los 240 son de DDR2 y DDR3."],[0,"Los módulos DDR2 y DDR3 tienen el mismo número de pines.",1,"Ambos tienen <b>240</b> pines."],[0,"Un módulo DDR4 tiene 288 pines.",1,"DDR4: 288 pines (DDR 184, DDR2 y DDR3 240)."],[0,"DDR2 realiza cuatro transferencias por ciclo de reloj.",1,"Trabaja al doble de la frecuencia del núcleo: 4 transferencias por ciclo."],[0,"DDR3 transfiere datos ocho veces más rápido que DDR.",1,"Es el dato que dan los apuntes para DDR3."],[0,"DDR4 trabaja a frecuencias de 2133 a 4266 MHz.",1,"Además: 1600 a 3200 MB/s y 4 a 16 GB por módulo."],[0,"Un módulo DDR4 puede almacenar hasta 128 GB.",0,"DDR4 llega a <b>16 GB</b>. Los 128 GB son de DDR5."],[0,"DDR5 consume más energía que DDR4 a cambio de más ancho de banda.",0,"DDR5 <b>reduce considerablemente</b> el consumo, con 6,4 GB/s de ancho de banda."],[0,"Para la memoria DDR es más adecuado expresar la velocidad en MT/s que en MHz.",1,"Como hace 2 transferencias por ciclo, los MHz ya no coinciden con las transferencias por segundo."],[0,"Una memoria DDR a 300 MHz tiene una velocidad de 300 MT/s.",0,"Son <b>600 MT/s</b>: dos transferencias por ciclo."],[0,"Una memoria a 600 MT/s con un bus de 64 bits tiene un ancho de banda de 4800 MB/s.",1,"600 M × 8 bytes = 4800 MB/s."],[0,"La unidad de control es la que realiza las operaciones aritméticas y lógicas.",0,"Eso lo hace la <b>ALU</b>. La unidad de control sincroniza las unidades funcionales."],[0,"El Intel Core i9-13900KS tiene 24 núcleos: 8 P-cores y 16 E-cores.",1,"P-cores = rendimiento, E-cores = eficiencia."],[0,"En los procesadores Intel, Hyper-Threading se aplica tanto a los P-cores como a los E-cores.",0,"Solo se aplica a los <b>P-cores</b>."],[0,"Para el SO, un Intel Core i9-13900KS aparece como 24 CPUs.",0,"Aparece como <b>32</b>: 16 de los E-cores + 8 P-cores × 2 (Hyper-Threading)."],[0,"En todas las arquitecturas, un ciclo de reloj equivale a una operación básica.",0,"Según la arquitectura, un ciclo puede hacer una operación, varias, o hacer falta varios ciclos por operación."],[0,"Las unidades de E/S también se llaman controladoras.",1,"Transfieren información con los periféricos."],[0,"La resolución FHD es de 1920 × 1080 píxeles.",1,"HD es 1280 × 720 y UHD 3840 × 2160."],[0,"La densidad de píxeles de una pantalla se mide en FPS.",0,"Se mide en <b>PPI</b> (puntos por pulgada). FPS son imágenes por segundo."],[0,"Con 24 bits por píxel se pueden representar 16.777.216 colores.",1,"2^24 = 16.777.216. Con 8 bits, 256 colores."],[0,"El canal gestiona la transferencia de información entre los periféricos y la memoria principal.",1,"Es la definición de canal de los apuntes."],[0,"El overclocking es seguro para cualquier modelo de procesador.",0,"No todos los modelos lo soportan y puede <b>dañar el hardware</b>."],[0,"El overclocking se puede aplicar a la CPU, a la GPU y a los módulos RAM.",1,"Son los tres ejemplos que citan los apuntes."],[0,"En la jerarquía de memoria, cuanto más alto es el nivel, más rápida, más pequeña y más cara es la memoria.",1,"Al bajar de nivel las memorias son más lentas, más grandes y más baratas."],[0,"La memoria externa está formada por los niveles 3, 4 y 5 de la jerarquía.",0,"La externa son los niveles <b>4 y 5</b>. La interna son los niveles 1, 2 y 3."],[0,"Si la información de un nivel inferior se modifica en un nivel superior, el sistema vuelve a bajarla para actualizarla.",1,"Lo poco usado queda abajo, sube cuando se necesita y baja de nuevo si se modifica."],[0,"La memoria caché es más pequeña y más rápida que la memoria principal.",1,"Guarda la información de la memoria principal que más se usa."],[0,"La caché L1 se encuentra dentro del propio núcleo de la CPU.",1,"Típicamente entre 16 y 128 KiB por núcleo."],[0,"La caché L3 está dentro del núcleo, igual que la L1.",0,"Según los apuntes, la L3 es <b>externa al procesador</b>, entre la memoria principal y la CPU."],[0,"Según los apuntes, dentro de la CPU hay tres niveles de caché.",0,"Hay <b>dos</b>: L1 y L2. La L3 está fuera del procesador."],[0,"Un tamaño típico de la caché L2 es de 256 a 512 KiB por núcleo.",1,"L1: 16 a 128 KiB por núcleo. L3: 2 a 64 MiB."],[0,"La memoria virtual emula una memoria principal más grande de la que existe realmente.",1,"Es la definición de memoria virtual."],[0,"Las direcciones virtuales las genera la MMU.",0,"Las genera el <b>programa</b>. La MMU las traduce a direcciones físicas."],[0,"La dirección que se escribe en el bus es la dirección virtual.",0,"En el bus se escribe la dirección <b>física</b>, ya traducida por la MMU."],[0,"La MMU se implementa en hardware porque es más rápido que hacerlo por software.",1,"Es la razón que dan los apuntes."],[0,"Una razón para que el SO controle la E/S es que la interfaz hardware de los periféricos es compleja.",1,"Las tres razones: interfaz compleja, recursos compartidos e interfaz uniforme."],[0,"El SO controla la E/S para que los usuarios accedan directamente al hardware de cada periférico.",0,"Es al revés: ofrece una interfaz <b>uniforme</b> para referirse a los dispositivos por nombre sin conocer la configuración de la máquina."],[0,"Los periféricos son recursos compartidos que el SO protege y asigna.",1,"Así los accesos son correctos y seguros."],[0,"Una interrupción guarda automáticamente el estado de la CPU para poder continuar después.",1,"Y transfiere el control a una rutina específica."],[0,"Las interrupciones responden a sucesos asíncronos o excepcionales.",1,"Es parte de su definición."],[0,"Las interrupciones las gestiona la MMU.",0,"Las gestiona el <b>controlador de interrupciones</b>."],[0,"Tras gestionar una interrupción, siempre continúa el proceso que fue interrumpido.",0,"Puede continuar, o la CPU puede <b>asignarse a otro proceso</b>."],[0,"Una división por cero genera una interrupción de E/S.",0,"Genera una interrupción <b>de programa</b>."],[0,"Un acceso a memoria fuera del espacio permitido genera una interrupción de programa.",1,"Igual que el desbordamiento aritmético, la división por cero o una instrucción ilegal."],[0,"Las interrupciones de reloj permiten al SO realizar funciones con regularidad.",1,"Las genera el reloj interno del procesador."],[0,"Un corte de energía genera una interrupción de programa.",0,"Genera una interrupción <b>por fallo de hardware</b>, igual que un error de paridad de memoria."],[0,"Las interrupciones de E/S indican que una operación ha terminado o que ha habido un error.",1,"Las genera un controlador de E/S."],[0,"Las llamadas al sistema se gestionan mediante interrupciones.",1,"Con la interrupción de llamada al núcleo o supervisor."],[0,"Una interrupción nunca puede ser interrumpida por otra.",0,"Puede interrumpirla otra de <b>mayor prioridad</b>."],[1,"El SO actúa de interfaz entre los programas de usuario y el hardware.",1,"Además controla los recursos, resuelve conflictos y optimiza el rendimiento."],[1,"La BIOS es un firmware almacenado en memoria RAM.",0,"Se almacena en <b>ROM</b>, para que no se borre al apagar."],[1,"Los dos tipos de BIOS son BIOS Legacy y UEFI.",1,"UEFI es la más moderna."],[1,"UEFI carga directamente el kernel en memoria.",0,"UEFI ejecuta un programa que localiza el <b>bootloader</b>, y es este quien carga el kernel."],[1,"Lo primero que hace UEFI es inicializar y comprobar el hardware.",1,"Memoria, CPU, discos... e informa de errores."],[1,"Desde la UEFI se puede cambiar el orden de arranque y monitorizar la temperatura.",1,"También actualizar el firmware, cambiar fecha y hora, activar puertos y ver información del sistema."],[1,"El SO como máquina extendida presenta al usuario una máquina más fácil de programar.",1,"Oculta la complejidad del hardware."],[1,"En el ejemplo del controlador NEC PD765, el usuario tiene que usar sus 16 comandos para manejar el disco.",0,"Gracias a la máquina extendida, el usuario solo ve <b>una colección de archivos</b>."],[1,"Las dos actividades del SO como gestor de recursos son la asignación y la protección.",1,"Asignar según disponibilidad y prioridad, y proteger para que no haya conflictos."],[1,"Si dos usuarios mandan a imprimir a la vez, el SO rechaza uno de los trabajos.",0,"Mantiene una <b>lista</b> de archivos y los envía uno a uno."],[1,"Una llamada al sistema conmuta la máquina de modo usuario a modo núcleo.",1,"Y transfiere el control al SO."],[1,"En modo usuario están permitidas todas las instrucciones.",0,"Eso es el modo <b>núcleo</b>. En modo usuario no se permiten la E/S ni otras instrucciones determinadas."],[1,"En modo usuario se permiten las operaciones aritméticas y el acceso a memoria principal.",1,"Son operaciones que no requieren un servicio del SO."],[1,"Los programas de usuario se ejecutan en modo núcleo.",0,"Se ejecutan en modo <b>usuario</b>. El núcleo del SO es el que se ejecuta en modo núcleo."],[1,"Los modos usuario y núcleo son un esquema de protección.",1,"Así lo describen los apuntes."],[1,"Las llamadas al sistema se usan para pedir servicios al SO.",1,"El programa no accede directamente al hardware: se lo pide al SO."],[1,"Al terminar una llamada al sistema, la máquina sigue en modo núcleo.",0,"En la última fase se devuelve el control y se conmuta a modo <b>usuario</b>."],[1,"Los servicios del SO solo se pueden pedir mediante llamadas al sistema.",0,"También mediante la <b>interfaz de usuario</b> (intérprete de comandos o interfaz gráfica)."],[1,"Un programa es un concepto dinámico y un proceso uno estático.",0,"Es al revés: el programa (solo código) es <b>estático</b> y el proceso es <b>dinámico</b>."],[1,"Un proceso está formado por el programa, la pila y los registros del procesador.",1,"Por ejemplo el contador de programa y los acumuladores."],[1,"Un mismo programa no puede estar involucrado en más de un proceso.",0,"Sí puede: el <b>código reentrante</b> de un compilador lo ejecutan varios procesos con sus propios datos."],[1,"Un proceso puede involucrar la ejecución de más de un programa.",1,"Por ejemplo, partes del SO que crean procesos en los terminales de los usuarios."],[1,"La concurrencia es la activación de varios procesos a la vez.",1,"Es la definición de los apuntes."],[1,"En un sistema uniprocesador puede haber concurrencia real.",0,"En uniprocesador la concurrencia es <b>aparente</b>. La real solo se da en multiprocesadores."],[1,"La concurrencia aparente consiste en alternar varios procesos en un mismo procesador.",1,"También se llama simulada o ficticia."],[1,"La concurrencia entre varias aplicaciones utiliza procesos cooperantes.",0,"Utiliza procesos <b>independientes</b>. Los cooperantes son de las aplicaciones estructuradas."],[1,"El propio SO puede diseñarse como un conjunto de procesos concurrentes.",1,"Es el tercer contexto de la concurrencia."],[1,"La programación concurrente es más fácil de depurar que la secuencial.",0,"Es <b>más difícil</b> de escribir, depurar, modificar y probar."],[1,"Una ventaja de la programación concurrente es un mayor aprovechamiento de los recursos.",1,"Junto a la forma natural de algunas soluciones, mayor velocidad y atender a más usuarios."],[1,"Un hilo es la unidad básica de utilización de la CPU.",1,"Tiene código, datos, pila y atributos (contador de programa, registros...)."],[1,"En un SO con hilos, un proceso puede no tener ningún hilo.",0,"Un proceso tiene <b>al menos un</b> hilo."],[1,"Un sistema que utiliza hilos también tiene procesos.",1,"Los procesos están formados por uno o más hilos."],[1,"En un SO con hilos, el código se asocia a los procesos y no a los hilos.",0,"Es al revés: el código se asocia a los <b>hilos</b>."],[1,"Crear un hilo en un proceso existente es más rápido que crear un proceso nuevo.",1,"También es más rápido terminarlo y conmutar entre hilos del mismo proceso."],[1,"La comunicación entre procesos es más eficiente que entre hilos.",0,"Es al revés: entre procesos hace falta que <b>intervenga el SO</b>."],[1,"En el modelo muchos-a-uno, varios hilos de usuario de un proceso se canalizan a un único hilo del núcleo.",1,"Es la definición del modelo muchos-a-uno."],[1,"En el modelo muchos-a-muchos hay siempre más hilos del núcleo que hilos de usuario.",0,"Multiplexa los hilos de usuario en un número <b>igual o menor</b> de hilos del núcleo."],[1,"En el modelo uno-a-uno, cada hilo de usuario se asigna a un hilo del núcleo.",1,"Es la definición del modelo uno-a-uno."],[1,"El multiprocesamiento consiste en un solo procesador con varios procesos concurrentes.",0,"Eso es la <b>multitarea</b>. Multiprocesamiento es tener varios procesadores hardware."],[1,"La multitarea implica concurrencia ficticia.",1,"Un solo procesador con varios procesos que se alternan."],[1,"En ASMP, el SO se ejecuta en cualquier procesador libre.",0,"Eso es <b>SMP</b>. En ASMP un procesador ejecuta el SO y los demás, trabajos de usuario."],[1,"Los SO de multiproceso asimétrico son fáciles de implementar pero difíciles de transportar.",1,"Es la característica que dan los apuntes de ASMP."],[1,"SMP es más robusto que ASMP porque, si falla un procesador, el SO puede seguir en otro.",1,"Además aprovecha mejor los procesadores."],[1,"En SMP cada procesador tiene su propia memoria, sin compartirla.",0,"En SMP la memoria se <b>comparte</b> entre todos los procesadores."],[1,"Un SO multiacceso es el que soporta múltiples usuarios.",0,"Ese es el <b>multiusuario</b>. Multiacceso es el que soporta múltiples accesos."],[1,"La multiprogramación incluye gestión de memoria y de archivos, además de la ejecución concurrente de programas.",1,"Es un concepto más general que la multitarea."],[1,"Todo SO multitarea es de multiprogramación.",0,"Los de multiprogramación son multitarea, pero <b>lo contrario no es cierto</b>."],[1,"Las ventajas de la multiprogramación son el aprovechamiento de la memoria y de los tiempos muertos del procesador.",1,"Mientras un proceso espera, la CPU ejecuta otro."],[1,"La mayoría de los SO actuales usan multiprogramación de tiempo compartido.",1,"Es la que describen los apuntes como la más usada."],[1,"En tiempo compartido, un proceso solo pierde la CPU cuando termina.",0,"También cuando <b>agota su quantum</b> o entra en una instrucción de E/S."],[1,"Un sistema de multiprocesamiento no puede ser multiprogramado.",0,"Sí puede, y es lo habitual: cada procesador alterna entre varios procesos."],[2,"En un SO por capas, el código de un nivel puede invocar código de cualquier otro nivel.",0,"Solo puede invocar código de niveles <b>más bajos</b>."],[2,"El primer SO por capas fue THE, de Dijkstra (1968), con 6 capas.",1,"Es el ejemplo de los apuntes."],[2,"En VMS y Multics la estratificación en capas la impone incluso el hardware.",1,"Mediante modos de procesador múltiples y jerárquicos."],[2,"En un SO por capas se puede reemplazar una capa sin afectar a las demás.",1,"Es una de sus ventajas, junto a limitar la dispersión del código y depurar por niveles."],[2,"Un SO por capas se depura empezando por los niveles más altos.",0,"Se depura empezando por los niveles <b>más bajos</b>."],[2,"El modelo cliente-servidor intenta dejar un núcleo mínimo.",1,"Desplaza el código a los niveles más altos posibles (micronúcleo)."],[2,"En el modelo cliente-servidor, los servidores se ejecutan en modo núcleo.",0,"Se ejecutan en modo <b>usuario</b>, como procesos de usuario."],[2,"En el modelo cliente-servidor, el cliente y el servidor se comunican mediante mensajes que transporta el núcleo.",1,"El núcleo recoge el mensaje, lo entrega al servidor y devuelve el resultado en otro mensaje."],[2,"En el modelo cliente-servidor, si falla un servidor cae todo el SO.",0,"Un servidor puede fallar y <b>reiniciarse</b> sin afectar al resto del SO."],[2,"El modelo cliente-servidor solo puede usarse en sistemas distribuidos.",0,"Es una forma de estructurar el SO y sirve en <b>un solo ordenador</b>. La distribución es una ventaja añadida."],[2,"El modelo cliente-servidor es adecuado para entornos distribuidos.",1,"Los servidores pueden estar en procesadores u ordenadores distintos."],[2,"Mach implementa en su núcleo la planificación, el paso de mensajes, la memoria virtual y los controladores.",1,"Todo lo demás (API, sistemas de archivos, redes) va en modo usuario."],[3,"Los usuarios del lenguaje de órdenes pueden obtener servicios del SO mediante scripts.",1,"También mediante órdenes en el terminal o en un entorno gráfico."],[3,"Los programadores de aplicaciones son usuarios del lenguaje de órdenes.",0,"Son usuarios de las <b>llamadas al sistema</b>: las invocan desde sus programas."],[3,"Las llamadas al sistema son un superconjunto de las funciones accesibles con órdenes.",1,"Dan más control y un acceso más directo al hardware, sobre todo a la E/S."],[3,"Los lenguajes de órdenes son iguales en todos los SO.",0,"Son <b>específicos</b> de cada sistema, aunque sus funciones suelen parecerse."],[3,"Cuando actuamos como programadores de sistemas, somos usuarios de las llamadas al sistema.",1,"Invocamos los servicios del SO desde nuestros programas."],[4,"El SO de una máquina virtual tiene que ser el mismo que el del anfitrión.",0,"El SO de la máquina virtual <b>puede ser distinto</b> al del anfitrión."],[4,"El hipervisor crea una abstracción del hardware del anfitrión y se la ofrece a cada máquina virtual.",1,"También se llama VMM (Virtual Machine Monitor)."],[4,"ESXi es un SO de VMware que integra el hipervisor.",1,"Está basado en Linux y se usa en infraestructuras cloud."],[4,"Docker es un sistema de máquinas virtuales.",0,"Docker es un sistema de <b>contenedores</b>. VirtualBox, Xen, Hyper-V o KVM son de máquinas virtuales."],[4,"Un contenedor comparte el kernel del SO anfitrión.",1,"También sus binarios y librerías."],[4,"Los contenedores son ligeros porque no reproducen el SO completo.",1,"Ocupan unos megabytes y arrancan en pocos segundos."],[4,"Docker usa cgroups y namespaces del kernel de Linux para aislar los contenedores.",1,"cgroups aíslan recursos y namespaces dan espacios de nombres independientes."],[4,"Las máquinas virtuales ofrecen rendimiento nativo y los contenedores, rendimiento limitado.",0,"Es al revés: la VM tiene rendimiento <b>limitado</b> y el contenedor, <b>nativo</b>."],[4,"Las máquinas virtuales virtualizan a nivel de hardware y los contenedores, a nivel de SO.",1,"Es una de las diferencias de la tabla comparativa."],[4,"Una máquina virtual arranca en milisegundos.",0,"Arranca en <b>minutos</b>. Los contenedores, en milisegundos."],[4,"Las máquinas virtuales son más seguras que los contenedores.",1,"Están completamente aisladas; los contenedores solo a nivel de proceso."],[4,"Windows puede ejecutar aplicaciones de otro SO mediante una máquina virtual.",1,"La VM puede tener como huésped un SO distinto del anfitrión."],[5,"1 KB son 1024 bytes según el Sistema Internacional.",0,"En el SI, 1 KB = <b>10^3</b> bytes. Los 1024 bytes (2^10) son 1 <b>KiB</b>."],[5,"Las unidades KiB, MiB y GiB usan potencias de 2^10.",1,"Son las de ISO/IEC 80000-13 (binario)."],[5,"Un disco de 1 TB aparece en el SO como unos 931 GiB.",1,"El fabricante cuenta 10^12 bytes y el SO cuenta en GiB (2^30 bytes)."],[5,"La velocidad en Hz es una buena forma de comparar procesadores.",0,"No lo es: unos necesitan varios ciclos por instrucción y otros hacen varias por ciclo."],[5,"El tamaño de la palabra es el mismo en todas las arquitecturas.",0,"Varía entre arquitecturas e incluso dentro de una. Típicos: 16, 32 o 64 bits."],[5,"La palabra se usa para la transferencia de información entre la CPU y la memoria principal.",1,"También suele marcar el tamaño de los registros y de los enteros."],[2,"UNIX debe parte de su portabilidad a estar escrito casi por completo en C.",1,"Pregunta de la Sesión 4 (no está en los apuntes). Otras razones: multiusuario, shell potente, código fuente disponible."]]},{"n":2,"nombre":"Comunicación y sincronización de procesos","secs":["2.1 Introducción","2.2 Conceptos sobre comunicación y sincronización","2.3 Problemas típicos de comunicación y sincronización","2.4.1 Inhabilitación de las interrupciones","2.4.2 La instrucción TSL","2.4.3 Señales","2.4.4 Semáforos","2.4.5 Monitores","2.4.6 Tuberías","2.4.7 Paso de mensajes","2.4.8 Memoria compartida"],"qs":[[0,"Los procesos suelen ser independientes por razones de seguridad.",1,"No deben interferir unos con otros, y eso permite ejecutarlos de forma concurrente."],[0,"Cuando varios procesos cooperan, el SO debe permitir que se comuniquen aunque eso rompa los esquemas de seguridad.",0,"Los servicios de comunicación y sincronización deben permitir la cooperación <b>sin romper</b> la seguridad."],[0,"La sincronización consiste en que los procesos intercambien datos y órdenes.",0,"Eso es la <b>comunicación</b>. La sincronización coordina el orden de ejecución de sus acciones."],[1,"La CPU es un recurso compartible.",1,"También los archivos de lectura y las áreas de memoria no modificables."],[1,"Un archivo con permisos de solo lectura puede ser un recurso compartible.",1,"Nadie lo modifica, así que varios procesos pueden leerlo a la vez sin interferir."],[1,"Un archivo de escritura es un recurso compartible.",0,"Es <b>no compartible</b>: la acción de un proceso interferiría en la de otro."],[1,"Un recurso puede ser no compartible por su naturaleza física, como una impresora.",1,"La otra razón es que su uso simultáneo haría interferir a los procesos (archivo de escritura, posición de memoria)."],[1,"Hay una condición de carrera cuando el resultado final depende del orden de ejecución de los procesos que comparten un recurso.",1,"Es la definición de condición de carrera."],[1,"Las condiciones de carrera también se producen en monoprogramación.",0,"Los apuntes indican que <b>no</b> suceden en monoprogramación."],[1,"En el ejemplo del spooler, IN señala el próximo archivo a imprimir.",0,"IN señala la próxima <b>ranura libre</b>. El próximo archivo a imprimir lo señala OUT."],[1,"En el ejemplo del spooler, el archivo del proceso B nunca se imprime porque A lo sobrescribe en la misma ranura.",1,"Los dos leyeron IN = 7 antes de que se incrementara."],[1,"En el ejemplo de las agencias de viajes, la agencia A pierde la reserva realizada.",1,"Ambas vieron la misma plaza libre antes de que se incrementara sig_libre."],[1,"La exclusión mutua asegura que un recurso no compartible solo lo use un proceso a la vez.",1,"Es la definición de exclusión mutua."],[1,"Una sección crítica es un fragmento de código que accede a recursos no compartibles.",1,"Es la definición de sección (o región) crítica."],[1,"Un mismo programa solo puede tener una sección crítica.",0,"Puede tener <b>varias</b>, una por cada recurso no compartible."],[1,"Dos secciones críticas diferentes que no usan las mismas variables compartidas pueden ejecutarse a la vez.",1,"La exclusión mutua solo se exige entre secciones críticas del <b>mismo recurso</b>."],[1,"Evitar que dos procesos estén a la vez en sus secciones críticas impide que cooperen usando datos compartidos.",0,"Los apuntes aclaran que <b>no lo impide</b>: pueden cooperar correcta y eficientemente."],[1,"Las secciones críticas condicionales aportan sincronización además de exclusión mutua.",1,"El proceso espera en una cola especial a que se cumpla una condición, sin impedir que otros usen el recurso."],[1,"Para evitar condiciones de carrera se puede suponer cuántas CPUs tiene el sistema.",0,"Una de las 4 condiciones es <b>no hacer suposiciones</b> sobre velocidades ni número de CPUs."],[1,"Un proceso que se para fuera de su sección crítica no debe bloquear a otros procesos.",1,"Es la condición 3."],[1,"Las secciones críticas deben ejecutarse tan rápido como sea posible.",1,"Para que ningún proceso espere mucho para entrar (condición 4)."],[1,"Un proceso puede bloquearse dentro de su sección crítica sin consecuencias.",0,"Normalmente provoca un <b>interbloqueo</b>."],[1,"La espera ocupada consiste en seguir intentando entrar en la sección crítica hasta agotar el tiempo de CPU.",1,"También se llama espera activa (busy waiting)."],[1,"El algoritmo de Peterson es una solución hardware a la exclusión mutua.",0,"Es una solución <b>software</b>."],[1,"El algoritmo de Peterson sirve para cualquier número de procesos.",0,"Solo es válido para <b>2 procesos</b>. Para N hay otras soluciones (Dijkstra, Lamport...)."],[1,"El algoritmo de Peterson utiliza espera ocupada.",1,"El proceso se queda en un bucle MIENTRAS hasta que puede entrar."],[1,"En la suma de los 100 primeros naturales con 3 procesos, el proceso principal debe esperar a que A y B terminen.",1,"Es el ejemplo de sincronización: TOTAL := A + B se calcula al final."],[1,"Los semáforos son un mecanismo de sincronización.",1,"Junto a señales, monitores, tuberías, paso de mensajes, mutex y variables condicionales."],[1,"La memoria compartida es un mecanismo de comunicación.",1,"Junto a archivos, tuberías y paso de mensajes."],[1,"Las tuberías y el paso de mensajes sirven tanto para sincronizar como para comunicar.",1,"Son los dos mecanismos que aparecen en ambas listas."],[1,"Las señales son un mecanismo de comunicación de datos.",0,"Los apuntes las incluyen entre los mecanismos de <b>sincronización</b>."],[1,"Un interbloqueo se produce cuando los recursos que necesita cada proceso los tienen ocupados los otros.",1,"Ninguno de ellos puede progresar."],[1,"Los interbloqueos solo pueden darse entre dos procesos.",0,"Pueden darse con <b>tres o más</b>: A espera a B, B espera a C y C espera a A."],[1,"Puede producirse un interbloqueo cuando los procesos tienen acceso exclusivo a un dispositivo.",1,"El acceso exclusivo es justo lo que lo hace posible: cada uno retiene un dispositivo y espera el que tiene otro."],[1,"En la alternación estricta, un proceso no entra en su sección crítica hasta que el otro lo haya hecho.",1,"Los procesos entran por turnos estrictos."],[1,"La alternación estricta es buena solución cuando un proceso es mucho más lento que el otro.",0,"Es <b>mala</b>: un proceso puede quedar bloqueado por otro que no está en su sección crítica."],[1,"La alternación estricta incumple la condición de que un proceso fuera de su sección crítica no bloquee a otros.",1,"Si el turno es del proceso lento, el rápido espera aunque el lento esté en su sección no crítica."],[2,"En el productor-consumidor, el productor no puede depositar si el búfer está lleno.",1,"Y el consumidor no puede extraer si está vacío."],[2,"En el productor-consumidor, productor y consumidor pueden acceder a la vez al mismo elemento del búfer.",0,"<b>No</b> se debe permitir que accedan al mismo elemento a la vez."],[2,"Usar un búfer circular permite reutilizar los elementos del búfer.",1,"Es una de las variantes del productor-consumidor."],[2,"El spooler de impresión es un ejemplo de productor-consumidor en el que el spooler es el productor.",0,"El spooler es el <b>consumidor</b>; los procesos que quieren imprimir son los productores."],[2,"La cena de los filósofos la propuso Dijkstra en 1965.",1,"Es un problema clásico por representar muchos problemas de sincronización, no por su utilidad práctica."],[2,"En la cena de los filósofos, un filósofo puede coger los dos tenedores a la vez.",0,"Solo puede coger <b>un tenedor cada vez</b>, y no el que ya tiene su vecino."],[2,"En lectores-escritores, dos lectores pueden acceder a los datos simultáneamente.",1,"Leer a la vez no causa problemas. El escritor sí necesita acceso exclusivo."],[2,"En el primer problema de lectores-escritores se da prioridad a los escritores.",0,"Se da prioridad a los <b>lectores</b>: ningún lector espera salvo que un escritor ya tenga permiso."],[2,"En el segundo problema de lectores-escritores, si un escritor espera, ningún lector nuevo puede empezar a leer.",1,"Es la prioridad a los escritores."],[2,"Las dos variantes del problema de lectores-escritores pueden provocar que un proceso quede bloqueado indefinidamente.",1,"En la primera pueden esperar siempre los escritores; en la segunda, los lectores."],[2,"En el barbero dormilón, si no hay sillas libres en la sala de espera, el cliente espera de pie.",0,"Si no hay sillas libres, el cliente <b>se va</b> de la barbería."],[2,"En el barbero dormilón, el barbero se duerme cuando no hay clientes esperando.",1,"Un cliente que llega lo despierta."],[3,"Inhabilitar las interrupciones es una solución hardware a la exclusión mutua.",1,"El proceso las inhabilita al entrar en su sección crítica y las habilita al salir."],[3,"Inhabilitar las interrupciones es una buena técnica para los procesos de usuario.",0,"Un proceso de usuario podría <b>apoderarse del sistema</b>. Solo es útil dentro del núcleo."],[3,"Inhabilitar las interrupciones garantiza la exclusión mutua en un multiprocesador.",0,"Solo afecta a la <b>CPU</b> que ejecuta ese proceso."],[4,"La instrucción TSL es una solución hardware al problema de la exclusión mutua.",1,"Forma parte del conjunto de instrucciones de la CPU."],[4,"La instrucción TSL evita la espera ocupada.",0,"TSL <b>requiere</b> espera ocupada: el proceso repite la instrucción hasta poder entrar."],[4,"TSL lee una palabra de memoria, la copia en un registro y guarda en ella un valor no nulo.",1,"Todo ello de forma indivisible."],[4,"TSL es una operación indivisible.",1,"Ningún otro procesador puede acceder a esa palabra hasta que la instrucción termina."],[4,"TSL puede usarse para la exclusión mutua en un sistema con varios procesadores y memoria común.",1,"Gracias a su indivisibilidad, a diferencia de inhabilitar interrupciones."],[4,"Con TSL, si flag vale 1 el proceso entra en su sección crítica.",0,"Si flag vale 1 el proceso tiene que <b>esperar</b>. Entra cuando flag vale 0."],[4,"La función salir() de TSL pone flag a 0.",1,"Con MOV flag, 0. Así otro proceso puede entrar."],[5,"Una señal es un evento que recibe un proceso, similar a una interrupción.",1,"Se usan en entornos Unix."],[5,"La rutina de tratamiento de una señal la proporciona el SO.",0,"La rutina debe formar parte del <b>propio proceso</b>."],[5,"Después de tratar una señal, el proceso continúa en la instrucción donde fue interrumpido.",1,"Detiene su ejecución, trata la señal y sigue en la misma instrucción."],[5,"Un proceso puede enviar una señal a cualquier otro proceso.",0,"Solo a procesos con su <b>mismo uid</b>, salvo el superusuario."],[5,"Armar una señal es indicar al SO qué rutina del proceso tratará ese tipo de señal.",1,"En POSIX se hace con sigaction."],[5,"Las señales enmascaradas se desechan.",0,"Quedan <b>bloqueadas</b> hasta que el proceso las desenmascare."],[5,"Si un proceso recibe una señal sin haberla armado ni enmascarado, normalmente se elimina el proceso.",1,"Es la acción por defecto en la mayoría de los casos."],[5,"En Unix y POSIX, la llamada al sistema para enviar señales es kill.",1,"Y pause deja al proceso bloqueado esperando una señal."],[5,"Las señales son un mecanismo muy apropiado para sincronizar procesos.",0,"No lo son: son <b>asíncronas</b> y <b>no se encolan</b>, así que se pueden perder eventos."],[5,"Las señales no se encolan: si llega otra del mismo tipo estando una pendiente, la primera se pierde.",1,"Por eso se pueden perder eventos de sincronización."],[6,"Un semáforo es un entero no negativo sobre el que solo se puede actuar con WAIT y SIGNAL tras inicializarlo.",1,"Es la definición de los apuntes. Los introdujo Dijkstra en 1965."],[6,"En alguna bibliografía, WAIT y SIGNAL se llaman P y V.",1,"Son los nombres originales de Dijkstra."],[6,"WAIT sobre un semáforo con valor 0 decrementa su valor a -1.",0,"Si vale 0, WAIT <b>bloquea</b> al proceso y lo añade a la cola, sin modificar el valor."],[6,"SIGNAL siempre incrementa el valor del semáforo.",0,"Solo lo incrementa si la cola está vacía. Si hay procesos bloqueados, <b>desbloquea uno</b> y lo pasa a Preparado."],[6,"Si hay varios procesos bloqueados en un semáforo, un SIGNAL los desbloquea a todos.",0,"Solo desbloquea a <b>uno</b>, normalmente en orden FIFO."],[6,"WAIT y SIGNAL son operaciones indivisibles.",1,"Así dos procesos no pueden actuar a la vez sobre el mismo semáforo."],[6,"Un semáforo puede inicializarse a un valor negativo.",0,"Es un entero <b>no negativo</b>."],[6,"Según los apuntes, un semáforo puede tomar un valor negativo.",0,"Si vale 0, WAIT bloquea sin decrementar: el valor nunca baja de 0."],[6,"Un semáforo inicializado a 9 tras 27 WAIT y 23 SIGNAL vale 7.",0,"val = 9 + 23 - 27 = <b>5</b>."],[6,"Un semáforo inicializado a 3 tras 5 WAIT y 4 SIGNAL vale 2.",1,"val = 3 + 4 - 5 = 2."],[6,"En un semáforo siempre se cumple nw ≤ C + ns.",1,"Porque val(sem) ≥ 0. La igualdad solo se da cuando val(sem) = 0."],[6,"Un semáforo binario solo puede utilizarse cuando el número máximo de procesos es 2.",0,"Binario se refiere a sus <b>valores</b> (0 y 1), no al número de procesos."],[6,"Los semáforos binarios solo pueden tomar los valores 0 y 1.",1,"Los generales pueden tomar cualquier valor entero no negativo."],[6,"Un semáforo con valor inicial N > 1 puede ser compartido por N procesos.",1,"La compartición la marca el valor inicial."],[6,"WAIT y SIGNAL son primitivas de alto nivel.",0,"Son de <b>bajo nivel</b>. Los monitores son primitivas de alto nivel."],[6,"Para implementar un semáforo se usa una variable entera y una cola de procesos bloqueados.",1,"Con WAIT y SIGNAL como operaciones indivisibles."],[6,"Para la exclusión mutua con semáforos se usa un semáforo inicializado a 1.",1,"WAIT al entrar en la sección crítica y SIGNAL al salir."],[6,"Para la exclusión mutua con semáforos se usa un semáforo inicializado a 0.",0,"Se inicializa a <b>1</b>. Con 0 ningún proceso podría entrar."],[6,"En la exclusión mutua con semáforos se cumple nw(excmut) ≤ ns(excmut) + 1.",1,"Solo un proceso puede completar su WAIT antes de que haya un SIGNAL."],[6,"En la sincronización asimétrica, el semáforo seguir se inicializa a 0.",1,"A hace WAIT(seguir) y queda bloqueado hasta que B hace SIGNAL(seguir)."],[6,"En la sincronización asimétrica, el proceso que espera es el que hace SIGNAL.",0,"El que espera hace <b>WAIT</b>; el que lo libera hace SIGNAL."],[6,"Si A hace WAIT(x) y WAIT(y), y B hace WAIT(y) y WAIT(x), con x = y = 1, puede producirse un interbloqueo.",1,"Cada uno puede retener el semáforo que necesita el otro."],[6,"Un WAIT sobre un semáforo dentro de la sección crítica que ese mismo semáforo controla produce un interbloqueo.",1,"El proceso se bloquea dentro de su sección crítica y nadie puede hacer el SIGNAL que lo libere."],[6,"En el productor-consumidor, el semáforo manipulación del búfer se usa para la sincronización.",0,"Se usa para la <b>exclusión mutua</b>. Los de sincronización son espacio libre y elemento disponible."],[6,"En el productor-consumidor, el semáforo espacio libre se inicializa a N.",1,"Cuenta los huecos libres y al principio están todos libres."],[6,"En el productor-consumidor, el semáforo elemento disponible se inicializa a N.",0,"Se inicializa a <b>0</b>: al principio el búfer está vacío."],[6,"En el productor-consumidor, el productor hace WAIT(espacio libre) antes de WAIT(manipulación del búfer).",1,"Al revés, podría bloquearse con el búfer lleno dentro de la sección crítica y provocar un interbloqueo."],[6,"En el productor-consumidor debe cumplirse 0 ≤ d - e ≤ N.",1,"d = elementos almacenados, e = elementos extraídos."],[6,"En la cena de los filósofos con semáforos, cada filósofo tiene su propio semáforo inicializado a 1.",0,"Los semáforos s[i] se inicializan a <b>0</b>. El que está a 1 es exmut."],[6,"En la cena de los filósofos, un filósofo pasa a comer si está hambriento y ninguno de sus vecinos está comiendo.",1,"Es lo que comprueba la función test()."],[6,"En la solución de lectores-escritores, todos los lectores hacen wait(db) al entrar.",0,"Solo el <b>primer</b> lector hace wait(db), y solo el último hace signal(db)."],[6,"En lectores-escritores, el semáforo exmut protege la variable re.",1,"re cuenta los lectores que están leyendo."],[7,"Los monitores surgen por la dificultad de diseñar programas con semáforos.",1,"Por el orden incorrecto de WAIT y SIGNAL o por omisiones."],[7,"Solo un proceso puede estar activo en un monitor en cada instante.",1,"Es la propiedad fundamental de un monitor."],[7,"Los procesos pueden acceder directamente a las estructuras de datos internas de un monitor.",0,"Solo pueden llamar a sus <b>procedimientos</b>."],[7,"Los monitores son construcciones del lenguaje de programación.",1,"El compilador genera los WAIT y SIGNAL necesarios."],[7,"Casi todos los lenguajes de programación incorporan monitores.",0,"Son <b>pocos</b>: por ejemplo Concurrent Euclid y Pascal Concurrente."],[7,"Cada variable de condición tiene su propia cola de procesos bloqueados.",1,"Los procesos se bloquean en ella con WAITM."],[7,"Una variable de condición es lo mismo que un semáforo.",0,"No tiene valor: WAITM <b>siempre bloquea</b> y solo se usa dentro de un monitor."],[7,"En la solución de Hoare, tras un SIGNALM el proceso desbloqueado suspende al que hizo el SIGNALM.",1,"Así no hay dos procesos activos en el monitor."],[7,"En la solución de Brinch Hansen, el proceso que hace SIGNALM sale inmediatamente del monitor.",1,"SIGNALM es la última sentencia del procedimiento. Es más fácil de implementar."],[7,"La solución de Hoare es más fácil de implementar que la de Brinch Hansen.",0,"La más fácil de implementar es la de <b>Brinch Hansen</b>."],[8,"El flujo de datos en una tubería es bidireccional.",0,"Es <b>unidireccional</b>. Para comunicación bidireccional hacen falta dos tuberías."],[8,"Una tubería es un mecanismo de comunicación con almacenamiento.",1,"Un tamaño típico es 4 KB."],[8,"Escribir en una tubería llena bloquea al proceso escritor.",1,"Hasta que pueda completar la escritura."],[8,"Escribir en una tubería que nadie tiene abierta para leer bloquea al escritor.",0,"Devuelve <b>error</b>."],[8,"Leer de una tubería vacía bloquea al lector si hay escritores.",1,"Espera hasta que alguien escriba."],[8,"Leer de una tubería vacía sin escritores devuelve fin de archivo.",1,"Y el proceso no se bloquea."],[8,"Si se piden n bytes y la tubería tiene M < n, la lectura se bloquea hasta tener n bytes.",0,"Devuelve los <b>M bytes</b> disponibles. Una lectura nunca bloquea si hay datos."],[8,"Las operaciones de lectura y escritura sobre una tubería son atómicas.",1,"Si dos procesos escriben a la vez, uno espera a que termine el otro."],[8,"Las tuberías sin nombre pueden usarlas procesos independientes.",0,"Solo los procesos <b>descendientes</b> del que la creó. Las de procesos independientes son las tuberías con nombre."],[8,"Con una tubería se puede construir una sección crítica usando un dato testigo.",1,"Leer el testigo para entrar y volver a escribirlo al salir. Si la tubería está vacía, el resto se bloquea."],[9,"Los semáforos y los monitores sirven para CPUs con memoria privada conectadas por red.",0,"Son <b>inaplicables</b> sin memoria común. Para eso está el paso de mensajes."],[9,"El paso de mensajes sirve tanto para sincronizar como para comunicar procesos.",1,"El mensaje lleva la información y RECEIVE bloquea al receptor hasta que llega."],[9,"RECEIVE bloquea al proceso hasta que le llega un mensaje.",1,"SEND envía el mensaje al destino."],[9,"Un mensaje solo puede contener datos.",0,"Puede contener datos, <b>órdenes e incluso código</b>."],[9,"En la designación indirecta de mensajes se usan buzones.",1,"En la directa se indica explícitamente el proceso."],[9,"Los números de secuencia permiten distinguir un mensaje nuevo de uno retransmitido.",1,"Si se pierde el reconocimiento, el receptor recibe el mensaje dos veces."],[9,"Pasar parámetros por dirección es fácil con paso de mensajes.",0,"Es uno de sus <b>inconvenientes</b>, junto a la conversión de formato y la semántica del fallo."],[9,"En el productor-consumidor con mensajes, el consumidor envía primero N mensajes vacíos.",1,"Simulan un búfer de N elementos."],[10,"La memoria compartida permite comunicar procesos que se ejecutan en ordenadores distintos.",0,"Solo procesos del <b>mismo ordenador</b>."],[10,"La memoria compartida forma parte de la imagen de memoria de cada proceso que la usa.",1,"Se accede a ella como a un vector unidimensional."],[10,"En Unix, uno de los procesos debe crear la memoria compartida.",1,"Después cualquier proceso puede acceder a ella."],[6,"En el productor-consumidor con búfer circular, IN = OUT puede darse con el búfer vacío y con el búfer lleno.",1,"Vacío: ED = 0. Lleno: EL = 0. Los semáforos distinguen ambos casos."],[6,"En el búfer circular con un productor y un consumidor, ambos pueden manipular a la vez el mismo elemento.",0,"Si IN = OUT, el búfer está vacío (consumidor bloqueado) o lleno (productor bloqueado)."],[6,"La solución del búfer circular sin exclusión mutua es válida con varios consumidores.",0,"Comparten OUT sin protección: dos consumidores pueden leer el mismo elemento. Hace falta un semáforo a 1."]]},{"n":3,"nombre":"Procesos e hilos","secs":["3.1 Introducción","3.2 Información y gestión de los procesos","3.3 Hilos","3.4.1 Niveles de planificación","3.4.2 Criterios para la planificación a corto plazo","3.4.3 Planificación apropiativa vs no apropiativa","3.4.4 Algoritmos de planificación"],"qs":[[0,"En un multiprocesador con más procesos que procesadores hay a la vez concurrencia real y aparente.",1,"Los procesos se ejecutan en paralelo y además se alternan en cada procesador."],[0,"La concurrencia real se da en sistemas multiprocesador y/o multinúcleo.",1,"En uniprocesador solo hay concurrencia aparente."],[1,"El SO organiza su información en cuatro categorías de tablas: memoria, E/S, archivos y procesos.",1,"Y están relacionadas entre sí, porque cada proceso tiene elementos de cada categoría."],[1,"Las tablas de memoria solo gestionan la memoria principal.",0,"También la memoria <b>secundaria</b> (virtual), cuando hay memoria virtual."],[1,"Las tablas de E/S indican a qué proceso está asignado cada dispositivo.",1,"También el estado de la operación y la posición de memoria origen o destino."],[1,"Cada proceso se representa mediante un bloque de control de proceso (BCP).",1,"También llamado descriptor de proceso."],[1,"El PID del proceso padre forma parte de la información de identificación del BCP.",1,"Junto al PID, el identificador de usuario y el de grupo."],[1,"El contador de programa forma parte de la información de control del proceso.",0,"Forma parte del <b>estado del procesador</b>."],[1,"El entorno volátil es la información que debe preservarse para poder continuar la ejecución del proceso.",1,"Lo forma el estado del procesador (todos sus registros)."],[1,"La prioridad del proceso se guarda en el estado del procesador.",0,"Se guarda en la <b>información de control</b> (planificación y estado)."],[1,"El BCP puede contener espacio para señales o mensajes enviados al proceso.",1,"Es la parte de comunicación entre procesos de la información de control."],[1,"Los BCP se agrupan en colas asociadas a los posibles sucesos.",1,"Una cola de preparados y otras para los distintos sucesos que esperan los bloqueados."],[1,"La cabecera de un ejecutable contiene una palabra mágica que lo identifica como ejecutable.",1,"También el estado inicial de los registros y el tamaño del código y de los datos."],[1,"El código de un proceso suele ser de lectura y escritura.",0,"Generalmente es estático, así que solo se <b>lee</b>."],[1,"Los datos inicializados de un proceso se obtienen del archivo ejecutable.",1,"Su valor se fija al compilar."],[1,"Los datos sin valor inicial son dinámicos.",0,"Son <b>estáticos</b> pero sin valor asignado. Los dinámicos se crean y destruyen durante la ejecución."],[1,"La pila almacena los bloques de activación de los procedimientos llamados.",1,"Es una estructura dinámica de la imagen de memoria."],[1,"La imagen de un proceso está formada por su imagen de memoria y sus atributos.",1,"Imagen de memoria = código, datos y pila."],[1,"Si un proceso accede fuera de su imagen de memoria, el hardware de protección genera una excepción.",1,"El proceso solo puede tener información dentro de su imagen de memoria."],[1,"El modelo de un único segmento de tamaño fijo se usa en sistemas con memoria virtual.",0,"Se usa en sistemas <b>sin</b> memoria virtual."],[1,"En el modelo de número fijo de segmentos de tamaño variable, los datos y la pila crecen en el mismo sentido.",0,"Crecen en sentido <b>opuesto</b>."],[1,"Las primeras versiones de Unix usaban tres segmentos: código, datos y pila.",1,"Es el modelo de número fijo de segmentos de tamaño variable."],[1,"Windows NT y los Unix actuales usan un número variable de segmentos de tamaño variable.",1,"Es el modelo más flexible."],[1,"Un proceso en estado Preparado está en memoria principal, sin E/S pendientes, esperando la CPU.",1,"Obtiene la CPU cuando lo indique el SO."],[1,"La transición Planificar lleva un proceso de Ejecución a Preparado.",0,"Planificar (o Expedir) va de <b>Preparado a Ejecución</b>. De Ejecución a Preparado es Finalizar plazo."],[1,"La transición Finalizar plazo se produce, por ejemplo, cuando un proceso agota su fracción de tiempo.",1,"También se llama Replanificar."],[1,"La transición Admitir lleva un proceso de Nuevo a Preparado.",1,"Se produce cuando el proceso es admitido para su ejecución."],[1,"Un wait sobre un semáforo a 0 provoca la transición Esperar un suceso.",1,"El proceso pasa de Ejecución a Bloqueado."],[1,"Cuando ocurre el suceso que esperaba, un proceso bloqueado pasa directamente a Ejecución.",0,"Pasa a <b>Preparado</b> (Ocurrir un suceso), y luego debe ser planificado."],[1,"Un proceso solo puede llegar a Terminado desde Ejecución.",0,"En algunos sistemas también desde <b>Bloqueado o Preparado</b> (por ejemplo, si el padre lo finaliza)."],[1,"El estado Bloqueado puede tener varias colas, una por cada tipo de suceso.",1,"Hay una cola por estado, y Bloqueado puede tener varias."],[1,"Un proceso puede ser creado por otro proceso existente.",1,"Por ejemplo, los que lanza el intérprete de órdenes."],[1,"Un error aritmético como la división por cero puede provocar la finalización de un proceso.",1,"Es uno de los motivos de finalización."],[1,"Un proceso solo puede finalizar por sí mismo.",0,"También por el padre, el operador, el SO, errores, tiempo excedido..."],[1,"El primer paso para crear un proceso es asignarle un PID.",1,"Eso añade un nuevo BCP a la tabla de procesos."],[1,"Al crear un proceso, el contador de programa se inicializa a 0.",0,"Se inicializa con el <b>punto de entrada</b> del programa."],[1,"Al crear un proceso, su estado suele iniciarse a Ejecución.",0,"Suele iniciarse a <b>Preparado</b> o a Preparado y suspendido."],[1,"El entorno global es común a todos los procesos y los procesos nuevos lo heredan.",1,"Persiste hasta que se cambia. En Unix se examina con set."],[1,"El entorno local se aplica a todos los procesos del usuario.",0,"Se aplica a <b>un único proceso</b>. Normalmente son parámetros de la línea de órdenes."],[1,"El intérprete de órdenes interpreta los parámetros de cada programa.",0,"Solo los empaqueta como cadenas; es el <b>programa</b> quien los interpreta."],[1,"En telnet filabres.ual.es, el nombre del servidor forma parte del entorno local del proceso.",1,"Es un parámetro de la línea de órdenes que da información extra al programa."],[1,"Un cambio de proceso consiste en interrumpir al proceso en ejecución y asignar la CPU a otro.",1,"Puede producirse en cualquier momento."],[1,"Una llamada al sistema para hacer E/S puede provocar un cambio de proceso.",1,"El proceso pasa normalmente a Bloqueado."],[1,"Un cambio de contexto implica siempre un cambio de proceso.",0,"Tras un cambio de contexto puede <b>seguir el mismo proceso</b>."],[1,"Un cambio de contexto consiste en guardar el estado del procesador en el BCP y ejecutar la rutina de tratamiento de la interrupción.",1,"Son las dos operaciones del cambio de contexto."],[1,"Un cambio de proceso provoca dos cambios de contexto.",1,"Del proceso al SO y del SO al nuevo proceso."],[1,"El despachador copia en los registros el entorno volátil del BCP y salta al contador de programa.",1,"Así el proceso continúa en las mismas condiciones en que se paró."],[1,"El despachador interviene cuando un proceso pasa de Bloqueado a Preparado.",1,"Para asegurarse de que se ejecuta el de mayor prioridad."],[1,"El despachador solo interviene cuando un proceso termina.",0,"También con un wait sin éxito, al iniciar una E/S, al agotar el plazo o cuando un proceso se desbloquea."],[2,"Los SO modernos llaman hilo a la unidad de propiedad de los recursos.",0,"El hilo es la unidad de <b>planificación</b>. La de propiedad de los recursos sigue siendo el proceso."],[2,"Un hilo también se llama hebra o proceso ligero.",1,"En inglés thread o light-weight process."],[2,"Cambiar entre dos hilos del mismo proceso es más rápido que cambiar entre dos procesos.",1,"Igual que crearlos y terminarlos."],[2,"Un servidor web con un solo hilo atiende varias peticiones a la vez.",0,"Solo atendería <b>una</b> cada vez, y muchos clientes esperarían mucho."],[2,"Un hilo que hace copias de seguridad periódicas en un procesador de textos es un ejemplo de proceso asíncrono.",1,"No interactúa con el usuario."],[2,"El núcleo pone en la CPU hilos de usuario.",0,"Pone <b>hilos del núcleo</b>, que son la unidad de planificación del SO."],[2,"Un hilo de usuario solo existe en una biblioteca del espacio de usuario.",1,"Para ejecutarse lo hace encima de algún hilo del núcleo."],[2,"En el modelo N:1, si un hilo hace una llamada bloqueante se bloquea todo el proceso.",1,"El núcleo solo ve un hilo."],[2,"El modelo N:1 aprovecha bien varios procesadores.",0,"No los aprovecha: el núcleo solo ve <b>un hilo</b>."],[2,"En el modelo N:1 la gestión de hilos es muy rápida porque no hace llamadas al sistema.",1,"La hace la biblioteca en el espacio de usuario."],[2,"En el modelo 1:1 un hilo bloqueado no detiene a los demás.",1,"Y los hilos pueden ejecutarse en paralelo en varios núcleos."],[2,"En el modelo 1:1 crear un hilo es más barato que en N:1.",0,"Es más <b>caro</b>: crear un hilo de usuario implica crear uno del núcleo."],[2,"En el modelo M:N, el número de hilos del núcleo es menor o igual que el de hilos de usuario.",1,"M hilos de usuario sobre N hilos del núcleo, con N ≤ M."],[2,"El modelo M:N es el más sencillo de implementar.",0,"Es el más <b>complejo</b>: hay que coordinar el planificador de la biblioteca y el del núcleo."],[2,"El modelo de dos niveles es una variante de M:N.",1,"Permite además vincular un hilo de usuario concreto a un hilo del núcleo."],[2,"En el modelo N:1 el núcleo desconoce por completo los hilos de usuario.",1,"Solo ve un proceso con un hilo."],[2,"En Linux, pthread_create acaba en la llamada al sistema clone().",1,"Por eso en 1:1 se dice que los hilos los gestiona el núcleo."],[2,"Las activaciones del planificador se usan en el modelo 1:1.",0,"Se usan en <b>M:N</b>: el núcleo avisa a la biblioteca cuando un hilo s const KEY = 'ssoo-vf.';
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} }
};
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const id = (t, i) => t + '-' + i;
let stats = store.get('stats', {});        // id -> [aciertos, fallos, último resultado (1/0)]
let cfg = store.get('cfg', { temas: { 1: true, 2: true, 3: true }, secs: {}, n: 30, solo: 'todas' });
let S = null;                              // sesión en curso

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function secOn(t, s) { return cfg.secs[t + ':' + s] !== false; }
function pool() {
  const out = [];
  for (const t of BANK) {
    if (!cfg.temas[t.n]) continue;
    t.qs.forEach((q, i) => {
      if (!secOn(t.n, q[0])) return;
      const st = stats[id(t.n, i)];
      if (cfg.solo === 'falladas' && !(st && st[2] === 0)) return;
      if (cfg.solo === 'nuevas' && st) return;
      out.push({ t: t.n, i });
    });
  }
  return out;
}

function home() {
  S = null;
  const p = pool();
  const temas = BANK.map(t => {
    const seen = t.qs.filter((q, i) => stats[id(t.n, i)]).length;
    const on = !!cfg.temas[t.n];
    const chips = t.secs.map((s, k) => `<button class="chip" aria-pressed="${secOn(t.n, k)}" data-sec="${t.n}:${k}">${esc(s)}</button>`).join('');
    return `<div class="temablock ${on ? 'on' : ''}">
      <label><input type="checkbox" data-tema="${t.n}" ${on ? 'checked' : ''}>
        <span><span class="tt"><b>Tema ${t.n}.</b> ${esc(t.nombre)}</span>
        <span class="meta muted small"> · ${t.qs.length} afirmaciones · vistas ${seen}</span>
        <span class="bar"><i style="width:${Math.round(100 * seen / t.qs.length)}%"></i></span></span></label>
      ${on ? `<div class="secs">${chips}</div>` : ''}</div>`;
  }).join('');
  const opt = (v, l, cur) => `<button class="chip" aria-pressed="${cur === v}" data-${typeof v === 'number' ? 'n' : 'solo'}="${v}">${l}</button>`;
  app.innerHTML = `
    <header class="top"><div><h1>Test de teoría · SSOO</h1><p class="sub">Sistemas Operativos · verdadero o falso</p></div>
      <button class="btn icon-btn" data-action="theme" title="Cambiar tema" aria-label="Cambiar tema">◐</button></header>
    <div class="card"><h2>Temas y apartados</h2><div class="temas">${temas}</div></div>
    <div class="card"><h2>Sesión</h2>
      <div class="field"><span class="lbl">Número de afirmaciones</span><div class="row">${[10, 20, 30, 50, 0].map(v => opt(v, v || 'Todas', cfg.n)).join('')}</div></div>
      <div class="field"><span class="lbl">Cuáles</span><div class="row">${opt('todas', 'Todas', cfg.solo)}${opt('nuevas', 'No vistas', cfg.solo)}${opt('falladas', 'Falladas la última vez', cfg.solo)}</div></div>
      <div class="row" style="margin-top:16px"><button class="btn primary big" data-action="start" ${p.length ? '' : 'disabled'}>Empezar (${cfg.n ? Math.min(cfg.n, p.length) : p.length} de ${p.length})</button>
      <span class="spacer"></span><button class="btn ghost danger small" data-action="reset">Borrar progreso</button></div>
    </div>
    <footer class="foot">Afirmaciones de verdadero o falso con justificación, tomadas de las tarjetas de Anki de los Temas 1–3 de Sistemas Operativos (curso 2026-27). El progreso se guarda solo en este navegador.</footer>`;
}

function start(items) {
  S = { items, k: 0, ans: [] };
  question();
}

function question() {
  const it = S.items[S.k], t = BANK.find(b => b.n === it.t), q = t.qs[it.i];
  const a = S.ans[S.k];
  const ok = S.ans.filter(x => x && x.ok).length, bad = S.ans.filter(x => x && !x.ok).length;
  const cls = v => a === undefined ? '' : (q[2] === v ? 'ok' : (a.v === v ? 'bad' : ''));
  app.innerHTML = `
    <div class="sessbar"><div class="row"><span class="title">${S.k + 1} / ${S.items.length}</span>
      <span class="pill ok">✓ ${ok}</span><span class="pill bad">✗ ${bad}</span><span class="spacer"></span>
      <button class="btn small" data-action="finish">Terminar</button></div>
      <div class="progress"><i style="width:${100 * (S.k + (a ? 1 : 0)) / S.items.length}%"></i></div></div>
    <div class="card">
      <p class="qmeta"><span>Tema ${t.n}</span><span>${esc(t.secs[q[0]])}</span></p>
      <p class="qtext">${q[1]}</p>
      <div class="vf"><button class="btn ${cls(1)}" data-v="1" ${a ? 'disabled' : ''}>Verdadero</button><button class="btn ${cls(0)}" data-v="0" ${a ? 'disabled' : ''}>Falso</button></div>
      ${a ? `<div class="feedback ${a.ok ? 'ok' : 'bad'}">${a.ok ? 'Correcto' : 'Incorrecto'}: es ${q[2] ? 'VERDADERA' : 'FALSA'}.</div><div class="why">${q[3]}</div>
        <div class="controls"><span class="spacer"></span><button class="btn primary" data-action="next">${S.k + 1 < S.items.length ? 'Siguiente' : 'Ver resultado'}</button></div>` : ''}
      <p class="kbd"><kbd>V</kbd> verdadero · <kbd>F</kbd> falso · <kbd>Enter</kbd> siguiente</p>
    </div>`;
}

function answer(v) {
  if (!S || S.ans[S.k]) return;
  const it = S.items[S.k], q = BANK.find(b => b.n === it.t).qs[it.i], ok = q[2] === v;
  S.ans[S.k] = { v, ok };
  const k = id(it.t, it.i), st = stats[k] || [0, 0, 0];
  st[ok ? 0 : 1]++; st[2] = ok ? 1 : 0; stats[k] = st; store.set('stats', stats);
  question();
}

function finish() {
  const done = S.items.map((it, k) => ({ it, a: S.ans[k] })).filter(x => x.a);
  const ok = done.filter(x => x.a.ok).length, bad = done.length - ok;
  const wrong = done.filter(x => !x.a.ok);
  const list = wrong.map(({ it, a }) => {
    const t = BANK.find(b => b.n === it.t), q = t.qs[it.i];
    return `<div class="rv"><p class="qmeta"><span>Tema ${t.n}</span><span>${esc(t.secs[q[0]])}</span></p><p class="qtext">${q[1]}</p>
      <p class="small"><b>Es ${q[2] ? 'verdadera' : 'falsa'}</b> (respondiste ${a.v ? 'verdadero' : 'falso'}).</p><div class="why small">${q[3]}</div></div>`;
  }).join('');
  S.wrong = wrong.map(x => x.it);
  app.innerHTML = `
    <div class="card"><h2>Resultado</h2>
      <div class="score"><span class="nota">${done.length ? Math.round(100 * ok / done.length) : 0}<small> %</small></span><span class="muted">${ok} aciertos de ${done.length} respondidas</span></div>
      <div class="kpis"><div class="kpi ok"><b>${ok}</b><span>Aciertos</span></div><div class="kpi bad"><b>${bad}</b><span>Fallos</span></div>
        <div class="kpi"><b>${S.items.length - done.length}</b><span>Sin responder</span></div><div class="kpi"><b>${S.items.length}</b><span>Total</span></div></div>
      <div class="controls"><button class="btn" data-action="home">Inicio</button><span class="spacer"></span>
        ${wrong.length ? '<button class="btn primary" data-action="retry">Repetir los fallos</button>' : ''}</div></div>
    ${wrong.length ? `<div class="card"><h2>Fallos</h2>${list}</div>` : ''}`;
}

app.addEventListener('click', e => {
  const b = e.target.closest('button, input'); if (!b) return;
  if (b.dataset.tema) { cfg.temas[b.dataset.tema] = b.checked; store.set('cfg', cfg); return home(); }
  if (b.dataset.sec) { const k = b.dataset.sec; cfg.secs[k] = cfg.secs[k] === false; store.set('cfg', cfg); return home(); }
  if (b.dataset.n !== undefined) { cfg.n = +b.dataset.n; store.set('cfg', cfg); return home(); }
  if (b.dataset.solo) { cfg.solo = b.dataset.solo; store.set('cfg', cfg); return home(); }
  if (b.dataset.v !== undefined) return answer(+b.dataset.v);
  switch (b.dataset.action) {
    case 'start': { const p = shuffle(pool()); return start(cfg.n ? p.slice(0, cfg.n) : p); }
    case 'next': return next();
    case 'finish': return finish();
    case 'retry': return start(shuffle(S.wrong.slice()));
    case 'home': return home();
    case 'reset': if (confirm('¿Borrar todo el progreso guardado?')) { stats = {}; store.set('stats', stats); home(); } return;
    case 'theme': {
      const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      const nt = cur === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', nt); store.set('theme', nt); return;
    }
  }
});
function next() { if (!S.ans[S.k]) return; if (S.k + 1 < S.items.length) { S.k++; question(); window.scrollTo(0, 0); } else finish(); }
document.addEventListener('keydown', e => {
  if (!S || e.ctrlKey || e.metaKey || e.altKey || !app.querySelector('.vf')) return;
  const k = e.key.toLowerCase();
  if (k === 'v') answer(1); else if (k === 'f') answer(0); else if (k === 'enter') { e.preventDefault(); next(); }
});
home();
</script>
</body>
</html>
