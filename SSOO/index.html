colocar P en CPU0 cuesta 1000?","o":["Porque CPU0 pasaría a 400, el grupo sube a frecuencia alta y todo cuesta el doble: (400 + 100) × 2.","Porque CPU0 es un núcleo grande.","Porque solo sube de frecuencia CPU0: 400 × 2 + 100 × 1 = 900.","Porque P cuesta 4 por unidad en cualquier núcleo y 200 × 4 = 800, más los 200 que ya tenía CPU0.","Porque se supera el 80 % de carga en CPU0 y EAS deja de buscar el ahorro de energía."],"e":["Los núcleos de un grupo comparten frecuencia.","Es pequeño.","Sube todo el grupo.","No es el cálculo.","No es la razón del coste."]},{"s":"real","c":"winprio","q":"¿Cómo se reparten los 32 niveles de prioridad de Windows?","o":["16–31 tiempo real (no cambian), 1–15 prioridad variable y 0 para el hilo que pone a cero la memoria.","0–15 tiempo real y 16–31 variable.","Todos cambian dinámicamente.","1–15 para el sistema y 16–31 para las aplicaciones, que así tienen más prioridad que el SO.","0–31 iguales, todos con prioridad variable que sube y baja según el comportamiento del hilo."],"e":["Los dinámicos son los del rango 1–15.","Está invertido.","Solo 1–15.","No es el reparto.","No."]},{"s":"real","c":"winprio","q":"¿De qué prioridad base parte la mayoría de hilos de Windows?","o":["8: nivel normal en la clase normal.","0.","15.","24, porque las aplicaciones se crean en la clase de tiempo real por defecto.","31."],"e":["El nivel normal vale 13 en la clase alta y 24 en tiempo real.","Es solo el hilo que pone a cero la memoria.","Es el máximo del rango variable.","24 es el nivel normal de la clase tiempo real.","Es el máximo absoluto."]},{"s":"real","c":"winboost","q":"En Windows, ¿cuánto sube la prioridad de un hilo cuando llega entrada de teclado o ratón?","o":["+6.","+1.","+8.","+15, para que el hilo interactivo pase directamente al máximo del rango variable.","+2."],"e":["Disco +1, red +2, teclado o ratón +6, sonido +8.","Es la de disco.","Es la de sonido.","No es la subida.","Es la de red."]},{"s":"real","c":"winboost","q":"Un hilo de Windows con prioridad base 12 recibe una subida de +6. ¿Qué prioridad alcanza?","o":["15, porque un hilo variable nunca supera 15.","18.","12, porque las subidas solo afectan a hilos de prioridad 8.","16, el primer nivel de tiempo real, porque la subida le da derecho a cambiar de rango.","6."],"e":["No puede entrar en el rango de tiempo real.","No puede pasar de 15.","Sí se aplica, pero con tope.","Nunca pasa de 15.","No."]},{"s":"real","c":"winq","q":"¿Qué quantum usa Windows de escritorio frente a Windows Server?","o":["Escritorio unos 31 ms (2 ticks); Server unos 190 ms (12 ticks).","Escritorio 190 ms y Server 31 ms.","Los dos unos 94 ms.","Escritorio 2 ms y Server 20 ms, el rango de compromiso de los algoritmos clásicos.","No usan quantum."],"e":["Server favorece el rendimiento total.","Es al revés.","94 ms es el de ULE en FreeBSD.","No son los datos.","Sí lo usan."]},{"s":"real","c":"winq","q":"¿Cómo evita Windows la inanición de un hilo de baja prioridad?","o":["El balance set manager lo sube a 15 si lleva unos 4 s sin ejecutarse, y luego lo devuelve a su base.","Le sube la prioridad +6.","Con decaimiento.","Lo pasa al rango de tiempo real de forma permanente para que no vuelva a quedarse sin CPU.","No la evita: un hilo de prioridad baja puede quedarse sin CPU para siempre si hay hilos de mayor prioridad listos."],"e":["Revisa cada segundo los hilos listos.","Es la subida por teclado.","El decaimiento baja la prioridad.","Solo lo sube a 15 durante un intervalo.","Sí la evita."]},{"s":"real","c":"mac","q":"¿En qué tres pasos decide macOS (Clutch) qué ejecutar?","o":["Clase de importancia (QoS), aplicación e hilo.","Elegibilidad, plazo virtual y núcleo.","Prioridad, quantum y decaimiento.","Puntuación de interactividad, rango de prioridad y cola circular de calendario.","Núcleo, frecuencia y energía, igual que EAS en Android."],"e":["Agrupa los hilos según la aplicación para la que trabajan.","Eso se parece a EEVDF con EAS.","No son los pasos.","Eso es ULE.","No."]},{"s":"real","c":"mac","q":"En macOS, ¿cómo se elige la clase de importancia?","o":["La de plazo más temprano; cada clase con hilos listos tiene plazo = ahora + su espera máxima.","Siempre la de mayor importancia.","Por Round Robin entre las cinco.","La que más tiempo de CPU ha recibido, para mantener su rendimiento interactivo.","Al azar, con más probabilidad cuanto más importante es la clase, para que ninguna se quede sin turno."],"e":["Así las de segundo plano nunca se quedan sin turno.","Las de segundo plano también reciben turno.","No.","No es el criterio.","No."]},{"s":"real","c":"macej","q":"En macOS hay hilos listos en IN (espera 37,5 ms) y BG (250 ms) desde t = 0. Tras elegir 6 veces IN, su plazo es 262,5 y el de BG 250. ¿Qué se elige?","o":["BG, porque su plazo es ahora el más temprano.","IN, porque es más importante.","IN, porque BG nunca se elige mientras haya hilos en IN.","Ninguna, porque los plazos solo se comparan cuando las dos clases tienen la misma espera máxima.","Las dos a la vez."],"e":["IN se elige unas 6 veces por cada vez que se elige BG.","Gana el plazo más temprano.","BG siempre acaba recibiendo turno.","Se comparan siempre.","No."]},{"s":"real","c":"macej","q":"¿Qué espera máxima tiene la clase interactiva (FG) de macOS?","o":["0 ms.","250 ms.","37,5 ms.","75 ms, la clase por defecto, que es la que reciben las animaciones de la interfaz.","150 ms."],"e":["IN 37,5; DF 75; UT 150; BG 250.","Es la de segundo plano.","Es la de iniciada por el usuario.","Las animaciones son FG.","Es la de utilidad."]},{"s":"real","c":"ulepunt","q":"En ULE, un hilo ha dormido 900 ms y ejecutado 100 ms. ¿Qué puntuación de interactividad tiene?","o":["Unos 6: 50 × 100 / 900.","Unos 94: 100 − 50 × 100 / 900.","450: 50 × 900 / 100.","10, porque se divide el tiempo de ejecución entre el de sueño y se multiplica por 100.","50."],"e":["Duerme más de lo que ejecuta, rango 0–50: es interactivo.","Esa fórmula es para cuando ejecuta más de lo que duerme.","La fracción está invertida.","El factor es 50.","No es el cálculo."]},{"s":"real","c":"ulepunt","q":"En ULE, un hilo ha dormido 100 ms y ejecutado 900 ms. ¿Qué puntuación tiene?","o":["Unos 94: 100 − 50 × 100 / 900.","Unos 6.","Unos 56.","450, porque se multiplica 50 por la relación entre ejecución y sueño (900 / 100).","0."],"e":["Ejecuta más de lo que duerme: rango 50–100, no interactivo.","Es la del caso inverso.","No es el cálculo.","No es la fórmula.","No."]},{"s":"real","c":"uleumbral","q":"¿Cuándo considera ULE que un hilo es interactivo?","o":["Cuando su puntuación más su nice es menor que 30.","Cuando su puntuación es mayor que 30.","Cuando lleva más de 4 s sin ejecutarse.","Cuando su puntuación es exactamente 50, el punto en que duerme lo mismo que ejecuta.","Cuando tiene nice −20."],"e":["Solo cuenta el sueño voluntario.","Es al revés.","Es la regla de antiinanición de Windows.","El umbral es 30.","No basta."]},{"s":"real","c":"uleumbral","q":"Un hilo de ULE tiene puntuación 33 con nice 0. ¿Qué ocurre si se sube su nice a 10?","o":["Su valor pasa a 43 y queda más lejos todavía del umbral de 30.","Pasa a 23 y se vuelve interactivo.","Pasa a ser de tiempo real.","No cambia nada, porque el nice solo afecta a la cola circular de los hilos no interactivos.","Pasa a la cola idle, que solo se ejecuta si no hay nada más."],"e":["Sigue sin ser interactivo.","El nice se suma.","No.","Se suma a la puntuación.","No."]},{"s":"real","c":"ulecola","q":"¿Cómo trata ULE a los hilos no interactivos?","o":["En una cola circular de calendario: se insertan más lejos cuanto peor es su prioridad, pero ninguno se queda sin turno.","Con prioridad estricta.","Solo se ejecutan si no hay nada más.","Los expulsa de memoria hasta que vuelven a ser interactivos según su historial reciente.","Por plazo virtual: se ejecuta antes el que pidió el intervalo de ejecución más corto en su último turno."],"e":["En el diseño de 2003 eran dos colas que se intercambiaban.","Eso es para tiempo real e interactivos.","Eso es el rango idle.","No es así.","Eso es EEVDF."]},{"s":"real","c":"ulecola","q":"¿Cuál es el intervalo de ejecución por defecto en ULE?","o":["Unos 94 ms, que con más de 2 hilos listos por CPU se divide entre la carga (mínimo unos 16 ms).","Unos 31 ms.","Unos 190 ms.","Entre 2 y 20 ms, el valor de compromiso que proponen los apuntes para Round Robin.","Un segundo, el mismo para todos los hilos, sin importar cuántos haya listos en la CPU."],"e":["Así se acota la espera en sistemas cargados.","Es el de Windows de escritorio.","Es el de Windows Server.","No es el de ULE.","No."]}]},"4":{"n":4,"nombre":"Gestión del almacenamiento principal","secs":{"req":["Requisitos de la gestión de memoria","Unidad 4 §4.1 y Sesión 12"],"org":["Gestor de memoria, organización y políticas","Unidad 4 §4.2"],"real":["Monoprogramación y multiprogramación con almacenamiento real","Unidad 4 §4.3"],"pag":["Memoria virtual paginada y traducción de direcciones","Unidad 4 §4.4–4.4.2.2"],"esq":["Esquemas de transformación","Unidad 4 §4.4.2.3–4.4.2.6"],"sust":["Algoritmos de sustitución de página","Unidad 4 §4.4.3"],"ct":["Políticas de obtención y conjunto de trabajo","Unidad 4 §4.4.4"],"dis":["Características de diseño","Unidad 4 §4.4.5"],"seg":["Segmentación, compartición e intercambio","Unidad 4 §4.5–4.8"],"act":["Gestión de memoria en los SO actuales","Unidad 4 §4.9"]},"qs":[{"s":"req","c":"reubic","q":"¿Por qué la gestión de memoria debe permitir reubicar un proceso en cualquier zona de la memoria principal?","o":["Porque no se sabe a priori dónde se colocará y, si va a disco, al volver difícilmente ocupará la misma zona.","Porque los procesos se dividen en módulos de distintos grados de protección.","Porque varios procesos deben poder acceder a la misma porción de memoria, por ejemplo al mismo código.","Porque la memoria secundaria es más lenta y barata que la principal, aunque no sea volátil.","Porque así no hace falta proteger los procesos entre sí, ya que cada uno queda en una zona fija que el compilador conoce de antemano."],"e":["Son las dos razones que dan los apuntes.","Eso es el requisito de organización lógica.","Eso es el requisito de compartición.","Eso es el requisito de organización física.","La protección es otro requisito igualmente necesario."]},{"s":"req","c":"reubic","q":"¿Cómo se consigue la reubicación de los procesos en la memoria principal?","o":["Traduciendo en tiempo de ejecución las direcciones que genera el proceso (MMU) en direcciones físicas.","Compilando cada programa para una dirección física fija de la memoria.","Reservando siempre la misma partición fija para cada proceso, que la recupera cada vez que vuelve de disco.","Con la técnica de superposición (overlays), que el programador organiza para cada zona de memoria.","Comprimiendo los procesos en memoria para que quepan siempre en la misma zona y no haya que recalcular sus direcciones."],"e":["Pregunta de la Sesión 12: así el proceso puede cargarse en cualquier zona.","Eso impediría colocarlo en otra zona.","Precisamente no se puede garantizar la misma zona.","Los overlays reparten la misma región entre módulos de un programa.","No tiene relación con la reubicación."]},{"s":"req","c":"protec","q":"¿Por qué el requisito de protección de memoria lo debe satisfacer el hardware y no el SO?","o":["Porque el SO no puede anticipar todas las referencias que hará un programa y comprobarlas sería muy costoso.","Porque el SO no tiene acceso a la memoria principal.","Porque la protección solo es necesaria entre procesos de distintos ordenadores conectados en red.","Porque el hardware puede comprobar las referencias al compilar el programa, antes de ejecutarlo.","Porque el SO no se ejecuta en modo núcleo y, por tanto, no tiene permiso para leer la memoria de los procesos de usuario."],"e":["Todas las referencias deben comprobarse en tiempo de ejecución.","Sí tiene acceso.","Es necesaria entre procesos del mismo sistema.","Se comprueban en tiempo de ejecución.","Sí se ejecuta en modo núcleo."]},{"s":"req","c":"protec","q":"¿Cómo protege el SO a un proceso de los accesos de otros procesos?","o":["El hardware comprueba en tiempo de ejecución cada referencia a memoria del proceso.","Comprobando antes de cargarlo todas las direcciones que usará el programa durante su ejecución.","Asignando a cada proceso un procesador propio.","Impidiendo que dos procesos compartan nunca ninguna página o segmento de memoria.","Cifrando la memoria de cada proceso con una clave propia que solo conoce el núcleo del SO."],"e":["Pregunta de la Sesión 12: por ejemplo, la MMU con la tabla del proceso o el registro de longitud del segmento.","No se pueden anticipar todas las referencias.","No es el mecanismo.","La protección debe permitir la compartición.","No es lo que describen los apuntes."]},{"s":"req","c":"logica","q":"¿Qué organización de memoria satisface mejor el requisito de organización lógica?","o":["La segmentación.","La paginación pura.","Las particiones fijas, porque cada módulo del programa se coloca en una partición distinta.","La superposición (overlays), porque el programador decide qué módulo ocupa cada región.","La monoprogramación."],"e":["Trata los procesos como módulos, con protección y compartición por módulo.","Divide el espacio de forma física, no lógica.","No es la que citan los apuntes.","Es una técnica de organización física.","No tiene relación."]},{"s":"req","c":"logica","q":"¿Qué exige el requisito de compartición?","o":["Que varios procesos puedan acceder a la misma porción de memoria sin comprometer la protección.","Que todos los procesos compartan toda su memoria.","Que ningún proceso comparta memoria con otro, para que la protección sea completa.","Que la memoria principal se divida entre varios procesos con particiones de igual tamaño.","Que los procesos se puedan reubicar en cualquier zona libre de la memoria cada vez que vuelven del disco."],"e":["Por ejemplo, el mismo código de un programa.","No es así.","Debe permitirse la compartición.","Eso es una forma de organización, no el requisito.","Eso es otro requisito."]},{"s":"req","c":"fisica","q":"¿Qué es la superposición (overlays)?","o":["Organizar un programa para que varios módulos usen la misma región de memoria y se intercambien desde disco.","Una técnica del SO que mueve procesos completos al área de swap del disco.","Compactar los huecos de memoria en uno solo.","Cargar varias páginas virtuales en el mismo marco de página a la vez para ahorrar memoria principal.","Compartir un marco de página entre varios procesos para que ejecuten el mismo código reentrante sin copiarlo en memoria."],"e":["La implementa el programador.","Eso es el intercambio.","Eso es la compactación.","Un marco contiene una página.","Eso es compartición de memoria."]},{"s":"req","c":"fisica","q":"¿Por qué la superposición (overlays) no es muy eficiente en sistemas multiprogramados?","o":["Porque al codificar no se sabe cuánto espacio habrá disponible ni dónde.","Porque la implementa el hardware y es lenta.","Porque obliga a usar segmentación.","Porque cada módulo tiene que cargarse en la misma dirección física en todas las ejecuciones del programa.","Porque necesita memoria virtual, que el programador no puede usar directamente."],"e":["Además la tiene que implementar el programador.","La implementa el programador.","No es la razón.","No es la razón que dan los apuntes.","Precisamente es anterior a ella."]},{"s":"org","c":"gestor","q":"¿Qué hace el gestor o administrador de memoria?","o":["Lleva registro de la memoria libre y ocupada, la asigna y la libera, y gestiona el intercambio con el disco.","Traduce las direcciones virtuales en físicas en cada acceso, consultando la tabla de páginas del proceso en ejecución.","Decide qué proceso se ejecuta en cada instante.","Comprueba en cada acceso que el proceso no salga de su espacio, porque la protección es tarea del SO.","Compila los programas para una zona concreta de memoria."],"e":["Es la parte del SO que gestiona la memoria.","Eso lo hace la MMU, que es hardware.","Eso es el planificador a corto plazo.","La protección la hace el hardware.","No es su función."]},{"s":"org","c":"gestor","q":"¿Cuándo es no contigua la asignación del almacenamiento?","o":["Cuando el proceso se divide en bloques que se colocan en fragmentos no adyacentes.","Cuando cada proceso ocupa un único bloque de posiciones contiguas.","Cuando el proceso está entero en disco.","Cuando dos procesos comparten las mismas posiciones de memoria porque ejecutan el mismo código.","Cuando hay un único usuario y su proceso ocupa toda la memoria que no usa el sistema operativo."],"e":["Es más difícil de controlar, pero aprovecha mejor los huecos.","Eso es asignación contigua.","No es la definición.","Eso es compartición.","No es la definición."]},{"s":"org","c":"politicas","q":"¿Qué determinan las políticas de colocación?","o":["En qué parte de la memoria principal se coloca un proceso entrante.","Cuándo se trae la siguiente parte de un proceso del disco.","Qué parte de qué proceso se desaloja cuando la memoria está llena.","Cuántos procesos pueden estar a la vez en memoria, es decir, el grado de multiprogramación.","Qué página se trae por adelantado antes de que el proceso la referencie."],"e":["Las de obtención dicen cuándo y las de reemplazo qué se desaloja.","Eso son las de obtención.","Eso son las de reemplazo.","No es la definición.","Es una política de obtención anticipatoria."]},{"s":"org","c":"politicas","q":"¿Cuáles son las tres categorías de políticas de administración del almacenamiento?","o":["Obtención, colocación y reemplazo.","Asignación, protección y compartición.","Reubicación, protección y organización.","Primer ajuste, mejor ajuste y peor ajuste, que son las formas de elegir el hueco para un proceso.","FIFO, LRU y NFU."],"e":["Responden a cuándo, dónde y qué se desaloja.","No son las tres categorías de políticas.","Son requisitos de la gestión de memoria.","Son algoritmos de colocación.","Son algoritmos de reemplazo."]},{"s":"org","c":"ajuste","q":"Los huecos libres son, desde el inicio de memoria: 10, 4, 20, 18, 7, 9, 12 y 15 KB. Llega un proceso de 8 KB. ¿Qué hueco elige el mejor ajuste?","o":["El de 9 KB.","El de 10 KB.","El de 20 KB.","El de 7 KB, que es el más cercano a 8 KB aunque el proceso no quepa entero.","El de 12 KB."],"e":["Es el hueco más pequeño en el que cabe.","Es el que elige el primer ajuste.","Es el que elige el peor ajuste.","El proceso tiene que caber.","No es el más pequeño en el que cabe."]},{"s":"org","c":"ajuste","q":"Con los mismos huecos (10, 4, 20, 18, 7, 9, 12 y 15 KB) y un proceso de 8 KB, ¿qué hueco elige el primer ajuste?","o":["El de 10 KB.","El de 9 KB.","El de 20 KB.","El de 4 KB, porque es el primero de la lista que deja un hueco libre más pequeño.","El de 15 KB."],"e":["Es el primero en el que cabe empezando desde el principio.","Lo elige el mejor ajuste.","Lo elige el peor ajuste.","No cabe.","No es el primero en el que cabe."]},{"s":"org","c":"peorprox","q":"¿Qué hueco asigna el algoritmo del peor ajuste?","o":["El hueco más grande.","El hueco más pequeño en el que quepa.","El primero en el que quepa desde el principio de la memoria.","El primero en el que quepa empezando donde terminó la búsqueda anterior.","Un hueco al azar."],"e":["Con huecos de 10, 4, 20, 18, 7, 9, 12 y 15 KB, elegiría el de 20.","Eso es el mejor ajuste.","Eso es el primer ajuste.","Eso es el próximo ajuste.","No es un algoritmo de los apuntes."]},{"s":"org","c":"peorprox","q":"¿En qué se diferencia el próximo ajuste del primer ajuste?","o":["Empieza a buscar desde donde se quedó la última búsqueda, no desde el principio.","Elige el hueco más pequeño.","Elige el hueco más grande.","Busca siempre desde el final de la memoria hacia el principio para aprovechar los huecos altos.","No se diferencian en nada: los dos recorren la lista de huecos desde el principio."],"e":["Asigna el primer hueco en el que quepa.","Eso es el mejor ajuste.","Eso es el peor ajuste.","No es la definición.","Cambia el punto de inicio de la búsqueda."]},{"s":"real","c":"mono","q":"¿Cuál NO es un inconveniente de la monoprogramación según los apuntes?","o":["La fragmentación externa por la entrada y salida de procesos.","El desperdicio de memoria por su mala utilización.","El tiempo de ocio de la CPU durante las operaciones de E/S.","La limitación en el tamaño total del proceso.","Que cada proceso debía incluir los controladores de los dispositivos que usaba."],"e":["Sí es la respuesta: es un problema de las particiones variables.","Sí es un inconveniente.","Sí es un inconveniente.","Sí es un inconveniente.","Sí es una característica de los primeros sistemas monoprogramados."]},{"s":"real","c":"mono","q":"¿Cuáles son las dos motivaciones principales de la multiprogramación?","o":["Desdoblar un programa en procesos y aprovechar la CPU solapando E/S con cálculo.","Eliminar la necesidad de memoria virtual y de sistema operativo.","Reducir el tamaño de los programas y del sistema operativo para que quepan en memoria.","Permitir que cada proceso tenga su propia CPU y que no haya que compartir la memoria.","Evitar las interrupciones."],"e":["Es lo que dicen los apuntes.","No son las motivaciones.","No es lo que dicen los apuntes.","No es la motivación.","No es una motivación."]},{"s":"real","c":"partic","q":"¿Cuál es el inconveniente principal de la multiprogramación con particiones fijas?","o":["Se desaprovecha el espacio de cada partición que no ocupa el proceso.","La fragmentación externa entre particiones.","El crecimiento dinámico de los segmentos de datos.","Que todas las particiones deben tener el mismo tamaño, lo que obliga a desperdiciar memoria.","Que no permite multiprogramación, porque cada partición solo admite un proceso."],"e":["Los procesos entraban por una cola simple o por colas según su tamaño.","Es el problema de las particiones variables.","Es otro problema de las particiones variables.","No tienen por qué tener el mismo tamaño.","Sí la permite."]},{"s":"real","c":"partic","q":"Con particiones variables, ¿cómo se resolvía la fragmentación de la memoria?","o":["Con la compactación, aunque consumía mucho tiempo de CPU o hardware especial.","Reservando espacio extra para cada proceso.","Pasando a particiones fijas.","Con la superposición (overlays), dividiendo los procesos en módulos que caben en los huecos.","Con memoria virtual, cargando en memoria solo las partes del proceso que se usaban."],"e":["Combinaba los huecos pequeños en uno grande.","Esa era la solución al crecimiento dinámico.","No era la solución.","No era la solución citada.","No era la solución que se adoptó en ese esquema."]},{"s":"pag","c":"mvdef","q":"¿Qué implica que todos los sistemas operativos actuales usen memoria virtual?","o":["Que la memoria principal debe tener un esquema de asignación no contigua.","Que los procesos deben estar cargados completamente en memoria principal.","Que no hace falta MMU, porque el SO traduce las direcciones al cargar el proceso.","Que el tamaño del programa nunca puede superar al de la memoria principal disponible.","Que solo puede haber un proceso en memoria."],"e":["Es la nota de los apuntes.","Eso es almacenamiento real.","La MMU es imprescindible.","Precisamente puede superarlo.","No."]},{"s":"pag","c":"mvdef","q":"¿Qué hace la CPU mientras un proceso espera a que se cargue desde disco otra parte de él?","o":["Puede asignarse a otro proceso para aprovecharla al máximo.","Espera ociosa a que termine la carga.","Ejecuta el código de la parte que falta desde el disco.","Compacta la memoria para que la nueva parte quepa en un único bloque contiguo.","Se apaga para ahorrar energía hasta que vuelva a necesitarla el mismo proceso."],"e":["Forma parte de la definición de memoria virtual.","Se asigna a otro proceso.","Hay que cargarla en memoria.","No es lo que describen los apuntes.","Un marco libre se asigna a otro proceso; no se apaga."]},{"s":"pag","c":"pagdef","q":"En un sistema paginado, ¿qué son los marcos de página?","o":["Divisiones de la memoria principal del mismo tamaño que las páginas virtuales.","Divisiones del espacio virtual de tamaño variable.","Las entradas de la tabla de páginas.","Bloques del área de swap donde se guardan las páginas que no caben en memoria principal.","Los registros PAR, uno por cada página virtual de los procesos cargados en memoria."],"e":["En cada marco se carga una página de un proceso.","Eso serían segmentos.","No es la definición.","No es la definición.","Los PAR son registros de la memoria asociativa, no divisiones de la memoria principal."]},{"s":"pag","c":"pagdef","q":"¿Por qué se usa un tamaño de página potencia de 2?","o":["Para facilitar la gestión y simplificar la transformación de direcciones.","Porque la memoria solo puede tener tamaños potencia de 2.","Para reducir la fragmentación interna a cero.","Porque así cada página coincide exactamente con un sector del disco y se transfiere más rápido.","Para que quepan más procesos, porque así desaparece la fragmentación interna."],"e":["Así los bits bajos son el desplazamiento y los altos el número de página.","No es la razón dada.","Siempre hay fragmentación interna.","No es la razón dada.","La paginación no elimina la fragmentación interna; el motivo es simplificar la gestión y la traducción."]},{"s":"pag","c":"presencia","q":"¿Para qué sirve el bit de presencia/ausencia de la tabla de páginas?","o":["Para indicar si la página virtual está cargada en memoria principal (1) o no (0).","Para indicar si la página se ha modificado.","Para indicar si la página se ha referenciado recientemente.","Para indicar si la página pertenece al conjunto de trabajo del proceso que la está usando.","Para indicar si la página es compartida con otros procesos o es privada del proceso."],"e":["Clasifica las páginas en activas e inactivas.","Eso es el bit M.","Eso es el bit R.","No es su función.","No es su función."]},{"s":"pag","c":"presencia","q":"Ante una falta de página, ¿qué hace el sistema operativo?","o":["Saca un marco si hace falta (escribiéndolo si se modificó), carga la página, actualiza la tabla y reanuda la instrucción.","Termina el proceso.","Pasa el proceso a Terminado y lo vuelve a crear.","Copia siempre la página expulsada en el disco, aunque no se haya modificado, para no perderla.","Ignora el acceso y devuelve un cero al proceso, que sigue con la siguiente instrucción sin cargar nada desde el disco."],"e":["Es el tratamiento descrito en los apuntes.","Carga la página que falta.","No.","Solo se copia si ha sufrido alguna modificación.","La falta de página no se ignora: se carga la página y se reanuda la instrucción."]},{"s":"pag","c":"traduc","q":"Con páginas de 4096 bytes, la página virtual 4 está en el marco 5. ¿Qué dirección física corresponde a la dirección virtual 16394?","o":["20490.","16394.","20480.","16384, el inicio de la página 4, porque el desplazamiento se descarta al traducir.","40970."],"e":["16394 = 4 × 4096 + 10; DF = 5 × 4096 + 10 = 20490.","Sería si la página 4 estuviera en el marco 4.","Olvida sumar el desplazamiento de 10.","El desplazamiento se mantiene.","No es el cálculo."]},{"s":"pag","c":"traduc","q":"Con páginas de 1024 bytes, una dirección virtual cae en una página cargada en el marco 6 con desplazamiento 100. ¿Cuál es la dirección física?","o":["6244.","6144.","700.","6124, porque el desplazamiento se resta del inicio del marco siguiente.","106."],"e":["DF = MP × TP + Despl = 6 × 1024 + 100.","Olvida el desplazamiento.","Suma marco y desplazamiento sin multiplicar.","Se suma al inicio del marco.","No es el cálculo."]},{"s":"pag","c":"bits","q":"Un sistema tiene direcciones virtuales de 20 bits y páginas de 512 palabras. ¿Cuántas páginas virtuales hay?","o":["2^11.","2^9.","2^20.","2^5, que se obtiene restando los bits de desplazamiento a los de la dirección física.","512."],"e":["512 = 2^9: 9 bits de desplazamiento y 20 − 9 = 11 bits de página.","Es el tamaño de la página.","Es el tamaño del espacio virtual en palabras.","Eso da los marcos, no las páginas virtuales.","Es el tamaño de página."]},{"s":"pag","c":"bits","q":"En ese mismo sistema (páginas de 512 palabras), las direcciones físicas son de 14 bits. ¿Cuántos marcos de página hay?","o":["32 (2^5).","2^11.","2^14.","512, porque hay tantos marcos como palabras tiene cada página del sistema.","16."],"e":["14 − 9 = 5 bits para el marco.","Son las páginas virtuales.","Es el tamaño de la memoria física en palabras.","No es la relación.","No es el cálculo."]},{"s":"pag","c":"bits2","q":"Un proceso tiene un espacio virtual de 64 KiB con páginas de 4 KiB. ¿Cuántos bits ocupa el número de página virtual?","o":["4 bits, porque hay 16 páginas.","12 bits.","16 bits.","3 bits, el mismo número que necesita el marco de página en la memoria principal de 32 KiB.","6 bits."],"e":["Las direcciones son de 16 bits: 4 de página y 12 de desplazamiento.","Es el desplazamiento.","Es la dirección virtual completa.","Eso es el número de marco.","No es el cálculo."]},{"s":"pag","c":"bits2","q":"Con páginas de 4 KiB y una memoria principal de 32 KiB asignada al proceso, ¿de cuántos bits son las direcciones físicas?","o":["15 bits: 3 de marco y 12 de desplazamiento.","16 bits.","12 bits.","32 bits, porque la memoria es de 32 KiB y cada KiB necesita un bit de dirección.","8 bits."],"e":["2^15 B = 32 KiB.","Es el tamaño de la dirección virtual del ejemplo.","Es solo el desplazamiento.","No es el cálculo.","No es el cálculo."]},{"s":"pag","c":"dirpag","q":"Con un tamaño de página P, ¿qué direcciones ocupa la página virtual X?","o":["De X·P a (X + 1)·P − 1.","De X a X + P.","De (X − 1)·P a X·P.","De X·P a X·P + X − 1, porque cada página tiene tantas posiciones como su número.","De 0 a P − 1."],"e":["Porque el espacio virtual paginado es unidimensional.","No es la fórmula.","Desplaza una página.","No es la fórmula.","Solo para la página 0."]},{"s":"pag","c":"dirpag","q":"Con páginas de 4096 bytes, ¿qué rango de direcciones virtuales ocupa la página 3?","o":["De 12288 a 16383.","De 12288 a 16384.","De 3 a 4099.","De 8192 a 12287, porque la numeración de páginas empieza en 1.","De 0 a 4095."],"e":["3 × 4096 = 12288 y 4 × 4096 − 1 = 16383.","La última es 16383.","No es la fórmula.","Empieza en 0: ese es el rango de la página 2.","Es la página 0."]},{"s":"esq","c":"directa","q":"En la transformación directa de direcciones, ¿cuántos accesos a memoria principal hacen falta para leer un dato?","o":["Dos: uno a la tabla de páginas y otro a la posición deseada.","Uno, porque la MMU traduce la dirección sin consultar la memoria.","Ninguno, la tabla está en la CPU.","Tres: al directorio de páginas, a la tabla de páginas y a la posición deseada.","Depende del número de PAR."],"e":["La tabla está en memoria principal.","Hay que consultar antes la tabla de páginas, que está en memoria.","Está en memoria principal.","Eso es la transformación de dos niveles.","No usa PAR."]},{"s":"esq","c":"directa","q":"En la transformación directa, ¿qué indica el registro hardware asociado?","o":["La dirección base de la tabla de páginas del proceso en ejecución, y forma parte de su entorno volátil.","El número de marcos libres.","El desplazamiento dentro de la página que se está consultando.","La página virtual más usada recientemente por el proceso, que se guarda para acelerar la traducción.","El tamaño de la página, que la MMU necesita para separar el número de página del desplazamiento en cada dirección."],"e":["Hay una tabla de páginas por proceso.","No es su contenido.","No es su contenido.","Eso se parece a la memoria asociativa.","El tamaño de página lo fija el hardware; el registro guarda la dirección de la tabla."]},{"s":"esq","c":"asociativa","q":"¿Cuál es el inconveniente de la transformación asociativa pura?","o":["Hace falta un PAR por cada marco de página, lo que encarece memorias grandes.","Necesita dos accesos a memoria.","Los PAR se consultan de uno en uno.","Solo puede traducir direcciones de un único proceso, porque no tiene forma de distinguirlos.","No permite paginación por demanda, porque los PAR solo sirven para memoria segmentada."],"e":["Los PAR se consultan todos a la vez.","Eso es la transformación directa.","Se consultan simultáneamente.","Se añade un campo en cada PAR para distinguirlos.","Los PAR se usan precisamente en paginación."]},{"s":"esq","c":"asociativa","q":"¿Qué hace falta añadir a cada PAR para distinguir las páginas de distintos procesos?","o":["Un campo que identifique el proceso.","Un bit de modificado.","Un contador de 64 bits.","Una copia de la tabla de páginas completa de cada proceso, para buscar en ella en paralelo.","Nada más: basta con el número de página."],"e":["Es lo que indican los apuntes.","No distingue procesos.","Es de LRU.","No es así.","Hace falta un campo."]},{"s":"esq","c":"intermedia","q":"¿Qué hace la solución intermedia directa/asociativa?","o":["Usa una pequeña memoria asociativa para unas pocas páginas, las más recientes, y la tabla en memoria.","Usa un PAR por cada marco de memoria principal y prescinde por completo de la tabla de páginas en memoria.","Usa solo la tabla de páginas en memoria.","Usa dos niveles de tablas de páginas, uno en memoria asociativa y otro en memoria virtual.","Elimina la tabla de páginas."],"e":["La búsqueda se solapa entre ambas.","Eso es la asociativa pura.","Eso es la directa.","Eso no es lo que describen.","No."]},{"s":"esq","c":"intermedia","q":"Según los apuntes, ¿qué rendimiento puede lograr un mapa parcial con solo 8 o 16 PAR?","o":["El 90 % o más del de un mapa asociativo completo.","Apenas el 10 % del de un mapa asociativo completo.","El 50 %.","El 100 %, porque las páginas más recientes son siempre las únicas que se vuelven a usar.","Ninguna mejora."],"e":["Por la localidad de las referencias.","Es mucho mayor.","Es mayor.","Es el 90 % o más.","Mejora mucho."]},{"s":"esq","c":"dosniv","q":"¿Por qué se usa la transformación de dos niveles?","o":["Porque la tabla de páginas de un proceso puede ser enorme y se guarda en memoria virtual.","Porque es más rápida que la directa.","Para eliminar las faltas de página.","Porque la memoria asociativa no puede guardar tablas de más de 16 entradas en ninguna arquitectura.","Para usar segmentación dentro de cada página y reducir la fragmentación interna del proceso."],"e":["En VAX, 2^31 bytes con páginas de 2^9 dan 2^22 entradas.","No es la razón.","Puede haberlas también en la tabla.","No es la razón.","No tiene relación con la segmentación."]},{"s":"esq","c":"dosniv","q":"Con direcciones de 32 bits, páginas de 4 KiB y entradas de 4 bytes, ¿cuánto ocupa la tabla de páginas completa?","o":["4 MiB.","4 KiB.","4 GiB.","1 MiB, que es el número de entradas, porque cada una ocupa un byte.","16 MiB."],"e":["2^20 páginas × 4 bytes = 2^22 bytes.","Es lo que ocupa la tabla raíz de 2^10 entradas.","Es el espacio virtual.","Cada entrada ocupa 4 bytes.","No es el cálculo."]},{"s":"esq","c":"dosniv2","q":"En la transformación de dos niveles del ejemplo (32 bits, 4 KiB), ¿para qué se usan los 10 primeros bits de la dirección virtual?","o":["Para indexar la tabla de páginas raíz (directorio).","Para indicar el desplazamiento dentro de la página de 4 KiB.","Para indexar directamente la página de datos.","Para elegir el registro PAR que contiene la traducción, si la página es reciente.","Para el número de proceso."],"e":["Los 10 siguientes indexan la página de la tabla de páginas.","El desplazamiento son los 12 bits bajos.","Indexan el primer nivel.","No es su uso.","No."]},{"s":"esq","c":"dosniv2","q":"En la transformación de dos niveles, ¿qué ocurre si la página que contiene la parte necesaria de la tabla de páginas no está en memoria?","o":["Se produce un fallo de página, como con cualquier página que falte.","Se produce una violación de memoria y se aborta el proceso.","No puede ocurrir, porque toda la tabla está en memoria principal.","Se consulta la tabla raíz, que contiene también la traducción de todas las páginas.","Se usa la página 0 del proceso, que siempre está cargada en memoria."],"e":["La tabla raíz sí está siempre en memoria principal.","Es un fallo de página normal.","La tabla completa se guarda en memoria virtual.","La raíz apunta a las tablas, no a las páginas de datos.","No: la página falta y se produce un fallo de página."]},{"s":"sust","c":"nru","q":"En NRU, ¿de qué clase se saca la página a reemplazar?","o":["De la clase más baja no vacía, al azar.","De la clase más alta.","Siempre de la clase 0, aunque esté vacía.","De la clase 1, porque las páginas modificadas no referenciadas son las que más estorban.","La más antigua."],"e":["Clase 0 (R=0, M=0) hasta clase 3 (R=1, M=1).","Es la más baja.","Si está vacía, se pasa a la siguiente.","Es la más baja no vacía.","Eso es FIFO."]},{"s":"sust","c":"nru","q":"En NRU hay tres páginas: A (R=1, M=0), B (R=0, M=1) y C (R=1, M=1). ¿Cuál se reemplaza?","o":["B, de clase 1.","A, de clase 2.","C, de clase 3.","A, porque no está modificada y no hay que escribirla en el disco antes de sacarla.","Cualquiera de las tres."],"e":["A es de clase 2 y C de clase 3.","Hay una de clase más baja.","Es la clase más alta.","Se elige la clase más baja; B tiene R = 0.","Se elige la clase más baja no vacía."]},{"s":"sust","c":"nrubits","q":"En NRU, ¿quién pone a 0 el bit R y cuándo?","o":["El SO lo limpia periódicamente, en cada ciclo de reloj (unos 20 ms).","El hardware, en cada acceso.","Nunca se pone a 0.","El SO, cada vez que la página se escribe, para indicar que ahora está modificada.","El usuario, mediante una llamada al sistema cuando quiere liberar memoria."],"e":["Así distingue las páginas no referenciadas recientemente.","El hardware lo pone a 1 en cada acceso.","Se limpia periódicamente.","Escribir pone M a 1.","Lo hace el SO periódicamente."]},{"s":"sust","c":"nrubits","q":"¿Cuándo pone el hardware a 1 el bit M de una página?","o":["Cuando se escribe en la página modificando su contenido.","En cualquier acceso, de lectura o escritura.","Cuando la página entra en memoria.","Cuando la página lleva más de un ciclo de reloj sin referenciarse y hay que marcarla para sacarla.","Nunca: lo pone a 1 el SO al cargar la página desde el disco."],"e":["R se pone a 1 en cualquier acceso.","Eso es el bit R.","Al crear el proceso se ponen a 0.","No es su significado.","Lo pone el hardware."]},{"s":"sust","c":"fifo","q":"¿Cuál es el principal inconveniente de FIFO?","o":["Que la página más antigua puede ser muy usada, como el código reentrante de un compilador.","Que es muy costoso de implementar con hardware especial.","Que nunca olvida las referencias.","Que no tiene criterio para decidir entre páginas referenciadas en el mismo ciclo de reloj.","Que necesita una matriz de n × n bits, siendo n el número de marcos, que hay que actualizar en cada referencia."],"e":["FIFO sustituye la que más tiempo lleva cargada.","Eso se dice de LRU.","Eso es de NFU.","Eso se dice de LRU frente al envejecimiento.","Es de LRU."]},{"s":"sust","c":"fifo","q":"En el algoritmo de la segunda oportunidad, ¿qué ocurre si la página más antigua tiene R = 1?","o":["Se pone R a 0, se lleva al final de la lista y se inspecciona la siguiente.","Se reemplaza inmediatamente.","Se pasa a la lista de páginas modificadas.","Se mantiene en su posición y se reemplaza la más reciente de la lista para no perderla.","Se escribe en disco aunque no esté modificada y se reemplaza inmediatamente."],"e":["Si todas tienen R = 1, se comporta como FIFO puro.","Eso pasa si R = 0.","Eso es el búfer de páginas.","No es así.","No es el paso descrito: si R = 1 la página recibe una segunda oportunidad."]},{"s":"sust","c":"belady","q":"¿Qué es la anomalía de Belady?","o":["Que FIFO cause más faltas de página con 4 marcos que con 3 en casos particulares.","Que LRU cause más faltas con más marcos.","Que un proceso cause muchas faltas cada pocas instrucciones.","Que el conjunto de trabajo crezca sin límite cuando se asignan más marcos al proceso.","Que LRU cause más faltas de página con 4 marcos que con 3 cuando el proceso recorre un bucle."],"e":["Los apuntes la consideran una curiosidad.","Es propia de FIFO.","Eso es el azotado (thrashing).","No es la definición.","LRU no presenta la anomalía de Belady; la presenta FIFO."]},{"s":"sust","c":"belady","q":"Con FIFO y la secuencia 1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5, ¿cuántas faltas hay con 3 y con 4 marcos?","o":["9 con 3 marcos y 10 con 4 marcos.","10 con 3 marcos y 9 con 4 marcos.","12 con 3 marcos y 12 con 4 marcos.","9 con 3 marcos y 8 con 4 marcos, porque más marcos siempre reducen las faltas.","5 en ambos casos."],"e":["Es el ejemplo clásico de la anomalía de Belady.","Sería lo esperable, pero aquí ocurre lo contrario.","No todas las referencias fallan.","Precisamente aquí no se cumple.","No es el cálculo."]},{"s":"sust","c":"lru","q":"¿Cómo implementa LRU la opción del contador hardware C de 64 bits?","o":["Guarda C en la entrada de la página referenciada y reemplaza la de menor contador.","Reemplaza la página con mayor contador.","Suma el bit R al contador en cada tick.","Desplaza el contador a la derecha en cada tick e introduce el bit R por la izquierda.","Reemplaza la página que lleva más tiempo cargada, sin tener en cuenta el contador C."],"e":["C se incrementa con cada instrucción.","Sería la más reciente.","Eso es NFU.","Eso es el envejecimiento.","Eso es FIFO."]},{"s":"sust","c":"lru","q":"En la implementación de LRU con matriz de N × N bits, ¿qué hace el hardware al referenciar la página k?","o":["Pone a 1 la fila k y después a 0 la columna k.","Pone a 0 la fila k y a 1 la columna k.","Incrementa el contador de k.","Pone a 1 la diagonal y reemplaza la página cuya columna tenga más unos.","Nada: la matriz solo cambia cuando hay una falta."],"e":["La menos usada recientemente es la de fila con menor valor binario.","Es al revés.","Eso es otra implementación.","No es el procedimiento.","La matriz se actualiza en cada referencia."]},{"s":"sust","c":"lruej","q":"Con LRU y 4 marcos, la secuencia de accesos es 1, 0, 3, 2, 3, 0, 1, 0, 2, 3. Si se produce ahora una falta de página, ¿qué página se reemplaza?","o":["La 1.","La 0.","La 3.","La 2, porque es la que más tiempo lleva cargada en memoria desde su primera referencia.","Cualquiera, porque todas se han usado."],"e":["Su último uso es el más antiguo; en la matriz su fila vale 0000.","Se usó en la posición 8.","Es la última usada.","Ese criterio es FIFO; LRU mira el último uso.","LRU elige la menos usada recientemente."]},{"s":"sust","c":"lruej","q":"Con LRU y 3 marcos que contienen las páginas 0, 1 y 2, los últimos accesos son 0, 1, 2, 0, 2. Se referencia la página 3. ¿Qué página sale?","o":["La 1.","La 0.","La 2.","La 0, porque fue la primera en cargarse y es la más antigua de la memoria.","La 3."],"e":["Su último uso es el más antiguo de las tres.","Se usó después que la 1.","Es la última usada.","Ese criterio es FIFO.","Es la que entra."]},{"s":"sust","c":"nfu","q":"¿Cuál es el principal inconveniente de NFU?","o":["Que nunca olvida: páginas muy usadas en el pasado pueden no reemplazarse aunque ya no se usen.","Que necesita hardware especial muy costoso.","Que la página más antigua puede ser muy usada.","Que solo puede guardar las referencias de los últimos 8 ciclos de reloj.","Que no usa el bit R, así que no distingue las páginas referenciadas de las que no se han usado."],"e":["Ejemplo: un compilador de varias pasadas.","Es de LRU.","Es de FIFO.","Esa limitación es del envejecimiento con contador de 8 bits.","Sí lo usa."]},{"s":"sust","c":"nfu","q":"¿En qué se diferencia el algoritmo de envejecimiento (aging) de NFU?","o":["En vez de sumar R al contador, lo introduce por la izquierda desplazando el valor.","Suma el bit M en lugar del bit R.","Reemplaza la página con el contador más alto.","Cuenta el número total de accesos a la página desde que se cargó en memoria, sin olvidar ninguno.","No usa contador: guarda solo el último valor del bit R de cada página en la tabla de páginas."],"e":["Así se acerca más a LRU.","No es la diferencia.","Reemplaza la de valor más bajo.","Eso describe NFU.","Usa un contador de varios bits por página."]},{"s":"sust","c":"agingej","q":"Con envejecimiento, 6 marcos y contadores de 8 bits: ciclo 0 se accede a 1 y 3; ciclo 1 a 1, 2 y 4; ciclo 2 a 0, 3 y 5; ciclo 3 a 0, 2 y 5; ciclo 4 a 1. ¿Qué página se reemplaza?","o":["La 4, con contador 00010000.","La 3, con contador 00101000.","La 1, que no se usa desde el ciclo 1.","La 0, porque no se referenció en los dos primeros ciclos y su contador es 01100000.","La 5."],"e":["Es el valor más bajo de las seis.","Hay uno más bajo.","Se usó en el ciclo 4.","Ese valor es mayor que el de la página 4.","Su contador es 01100000."]},{"s":"sust","c":"agingej","q":"En ese ejemplo, si la falta ocurre justo tras el ciclo 2, las páginas 3 (10100000) y 5 (10000000) se usaron por última vez en ese ciclo. ¿Qué hace cada algoritmo?","o":["LRU no tiene criterio para elegir; el envejecimiento reemplaza la 5.","Los dos reemplazan la 3.","LRU reemplaza la 5 y el envejecimiento no tiene criterio.","Los dos reemplazan la 5, porque se cargó más tarde que la 3 y es la más reciente de las dos.","Ninguno reemplaza nada, porque todas las páginas tienen el bit R a 1."],"e":["La 3 también se referenció en el ciclo 0.","El envejecimiento elige la 5.","Es al revés.","LRU no distingue entre referencias del mismo ciclo.","Hay una falta y hay que reemplazar una página."]},{"s":"sust","c":"agingvslru","q":"Con contadores de 8 bits y un tick cada unos 20 ms, ¿de cuánto tiempo guarda referencias el algoritmo de envejecimiento?","o":["De unos 160 ms.","De unos 20 ms.","De unos 8 ms.","De todo el tiempo desde que se cargó la página, porque el contador acumula los accesos.","De unos 2,5 ms."],"e":["8 ciclos × 20 ms.","Es un solo ciclo.","No es el cálculo.","Eso es NFU.","No es el cálculo."]},{"s":"sust","c":"agingvslru","q":"Dos páginas se referenciaron por última vez hace 10 y hace 12 ciclos. Con contador de 8 bits, ¿qué hacen LRU y el envejecimiento?","o":["LRU reemplaza la de hace 12; el envejecimiento no puede decidir: ambos contadores valen 00000000.","Los dos reemplazan la de hace 12.","LRU no puede decidir y el envejecimiento reemplaza la de hace 12.","Los dos reemplazan la de hace 10, porque es la que tiene el contador más bajo de las dos.","Ninguno puede decidir, porque los dos algoritmos solo guardan la información de las últimas 8 referencias."],"e":["Es la segunda diferencia que citan los apuntes.","El envejecimiento no las distingue.","Es al revés.","No es así.","LRU sí puede: recuerda el orden exacto de las referencias."]},{"s":"ct","c":"demanda","q":"En la obtención de páginas por demanda, ¿cómo empieza a ejecutarse un proceso?","o":["Sin ninguna página cargada: la primera instrucción provoca una falta de página.","Con todas sus páginas cargadas.","Con su conjunto de trabajo cargado.","Con las páginas que el principio de localidad predice que va a usar en su primera fase.","Con la mitad de sus páginas, cargadas por adelantado según el tamaño del ejecutable."],"e":["El resto se cargan cuando se necesitan, nunca por adelantado.","Eso sería almacenamiento real.","Eso es el modelo del conjunto de trabajo.","Eso es una política anticipatoria.","En paginación por demanda pura empieza sin ninguna página."]},{"s":"ct","c":"demanda","q":"¿En qué se basan las políticas de obtención anticipatorias para prever el comportamiento de un proceso?","o":["En el principio de localidad (postulado de Denning).","En el algoritmo de Belady.","En el bit M de cada página.","En la prioridad del proceso, porque los procesos importantes necesitan sus páginas antes que los demás.","En el tamaño de página, que debe ser igual al de un bloque del disco."],"e":["Usan su comportamiento pasado y su estructura.","No es un fundamento.","No es su fundamento.","No es lo que dicen los apuntes.","Se basa en el principio de localidad."]},{"s":"ct","c":"localidad","q":"Un bucle que repite las mismas instrucciones es un ejemplo de...","o":["Localidad temporal.","Localidad espacial.","Fragmentación interna.","Anomalía de Belady, porque el bucle provoca más faltas cuantos más marcos tiene el proceso.","Azotado."],"e":["Lo referenciado recientemente se volverá a referenciar pronto.","Esa es la de posiciones próximas, como recorrer un vector.","No tiene relación.","No tiene relación.","No es un ejemplo de azotado."]},{"s":"ct","c":"localidad","q":"Procesar un vector posición a posición es un ejemplo de...","o":["Localidad espacial.","Localidad temporal.","Conjunto de trabajo vacío.","Política de reemplazo global, porque el vector se reparte entre las páginas de varios procesos.","Segmentación."],"e":["Tras una posición es muy probable referenciar otra próxima.","Esa es la de bucles, procedimientos y pilas.","No es un concepto de los apuntes.","No tiene relación.","No."]},{"s":"ct","c":"ws","q":"¿Qué es el conjunto de trabajo w(t, h) de un proceso?","o":["El conjunto de páginas que aparecen en sus h últimas referencias.","Todas las páginas del proceso que están cargadas en memoria principal.","Las páginas modificadas del proceso.","El número de marcos de página que el SO asigna al proceso cuando se crea.","Las páginas en el área de swap."],"e":["Por el principio de localidad, varía lentamente.","Solo las usadas recientemente.","No es la definición.","No es la definición.","No."]},{"s":"ct","c":"ws","q":"Si la suma de los conjuntos de trabajo de todos los procesos supera la memoria disponible, ¿qué ocurre y cómo debe resolverlo el SO?","o":["Se produce azotado (thrashing), y el SO debe reducir el grado de multiprogramación.","Se produce la anomalía de Belady, y el SO debe añadir más marcos.","No pasa nada, porque las páginas se cargan por demanda.","Se produce fragmentación externa, y el SO debe compactar la memoria para juntar los huecos.","El SO aumenta el tamaño de página para que cada proceso necesite menos marcos libres."],"e":["Nunca se debe sacar una página del conjunto de trabajo de un proceso.","No es la anomalía de Belady.","Los procesos causarían muchas faltas.","No es el problema.","No es la solución."]},{"s":"dis","c":"bufer","q":"En el búfer de páginas de VAX VMS, ¿qué ocurre con una página reemplazada no modificada?","o":["Pasa a la lista de páginas libres sin moverse físicamente de la memoria.","Se borra inmediatamente.","Se escribe en el disco.","Pasa a la lista de páginas modificadas, que se escriben todas juntas en el disco.","Se comprime en memoria y se guarda en una zona reservada para páginas expulsadas."],"e":["Si se vuelve a referenciar, se recupera con bajo coste.","Se mantiene en memoria.","No está modificada.","Esa es para las modificadas.","No es lo que describe VMS."]},{"s":"dis","c":"bufer","q":"¿Qué ventaja aporta la lista de páginas modificadas del búfer de páginas?","o":["Sus páginas se escriben en el disco en grupo, reduciendo las operaciones de E/S.","Evita escribir nunca las páginas modificadas.","Permite usar LRU exacto, porque el búfer guarda el orden de todas las referencias.","Hace que el algoritmo FIFO no tenga que buscar la página más antigua en cada reemplazo.","Elimina las faltas de página."],"e":["Además, junto con la lista libre, actúa como caché de páginas.","Se escriben, pero en grupo.","VMS usa FIFO sencillo.","No es la ventaja citada.","No."]},{"s":"dis","c":"asign","q":"¿Qué combinación de asignación y ámbito de reemplazo NO es posible?","o":["Asignación fija con ámbito global.","Asignación fija con ámbito local.","Asignación variable con ámbito global.","Asignación variable con ámbito local.","Ninguna de las combinaciones con ámbito local."],"e":["Sí es la respuesta: con un número fijo de marcos solo se puede reemplazar dentro del proceso.","Sí es posible.","Sí es posible; la adoptan muchos SO.","Sí es posible: se reevalúa con el conjunto de trabajo.","Las dos con ámbito local son posibles."]},{"s":"dis","c":"asign","q":"¿Qué caracteriza a la asignación variable con ámbito global?","o":["El SO tiene una lista de marcos libres y añade uno al proceso que sufre una falta.","Cada proceso tiene un número fijo de marcos.","Solo se reemplazan páginas del proceso que causó la falta.","El SO reevalúa periódicamente la asignación de cada proceso con su conjunto de trabajo, sin lista de libres.","No permite faltas de página, porque asigna desde el principio todos los marcos que necesita el proceso."],"e":["Si un proceso tiene muchas faltas, su conjunto residente crece.","Eso es asignación fija.","Eso es ámbito local.","Eso describe la variable con ámbito local.","Sí hay faltas: se añade un marco al proceso que falla."]},{"s":"dis","c":"ambito","q":"Debe entrar la página A-6 del proceso A. Con reemplazo local se sustituye A-4 y con global B-3. ¿Por qué?","o":["El local solo elige entre las páginas residentes del proceso que falla; el global, entre todas las no bloqueadas.","El local elige la página más antigua de la memoria y el global la menos usada de cada proceso.","Porque A-4 está modificada.","Porque el global solo puede reemplazar páginas de procesos que estén bloqueados en ese momento.","El local elige al azar entre todas las páginas de la memoria; el global, siempre la página más antigua del proceso que falla."],"e":["Es el ejemplo de la figura 4-13.","No es la diferencia.","No es el criterio.","Considera todas las páginas no bloqueadas.","Es al revés en cuanto al alcance, y ninguno se define por azar ni por antigüedad."]},{"s":"dis","c":"ambito","q":"¿Qué intenta hacer el algoritmo PFF (Page Fault Frequency)?","o":["Mantener el ritmo de faltas de página de cada proceso entre unos límites aceptables.","Reemplazar la página con menos faltas.","Calcular el tamaño de página óptimo para cada proceso según el número de faltas que produce.","Eliminar la anomalía de Belady de los algoritmos FIFO y segunda oportunidad.","Elegir el hueco más pequeño en el que quepa la página que provoca la falta de página."],"e":["Asigna más marcos si hay muchas faltas, porque el ritmo baja al asignar más (salvo Belady).","No es un algoritmo de reemplazo.","No es su función.","No es su función.","Eso es el mejor ajuste."]},{"s":"dis","c":"tampag","q":"Con páginas de 4 KiB y 10 procesos, ¿cuánta memoria se desaprovecha en promedio por fragmentación interna?","o":["20 KiB.","40 KiB.","2 KiB.","0, porque en paginación todo el espacio de la última página se aprovecha para la pila.","4 KiB."],"e":["Cada proceso desperdicia de media la mitad de su última página: N × P / 2.","Supone que cada proceso desperdicia una página entera.","Es lo de un solo proceso.","Siempre se desperdicia algo de media.","Es una sola página."]},{"s":"dis","c":"tampag","q":"¿Qué inconveniente tienen las páginas muy pequeñas?","o":["Se necesitan muchas páginas y una tabla de páginas muy grande.","Mucha fragmentación interna.","Mucha fragmentación externa.","Que la tendencia histórica ha ido hacia páginas más pequeñas por la velocidad de los discos.","No tienen inconvenientes, salvo una fragmentación interna algo mayor."],"e":["Además, transferir una página pequeña cuesta casi lo mismo que una grande.","Eso ocurre con páginas grandes.","La paginación tiene fragmentación interna.","La tendencia ha sido hacia páginas mayores.","Sí los tienen, y la fragmentación interna es menor con páginas pequeñas."]},{"s":"dis","c":"frag","q":"¿Qué tipo de fragmentación se produce en los sistemas paginados?","o":["La interna: espacio asignado a un proceso que este no usa.","La externa: huecos sin asignar demasiado pequeños.","Ninguna, porque cada página se ajusta exactamente al proceso.","Las dos por igual, porque las páginas tienen tamaño fijo y los huecos entre marcos también.","Solo en el área de swap."],"e":["La externa se daba con particiones variables.","Es la de las particiones variables.","Hay fragmentación interna.","No hay huecos externos entre marcos.","No."]},{"s":"dis","c":"frag","q":"Según la tabla de tamaños de página, ¿qué tamaño usaban la familia VAX y el IBM AS/400?","o":["512 bytes.","4 KiB.","8 KiB.","De 4 KiB a 4 MiB, igual que el Pentium.","1024 palabras de 36 bits."],"e":["DEC Alpha usaba 8 KiB y el PowerPC 4 KiB.","Es el de IBM 370/XA y PowerPC.","Es el de DEC Alpha.","Es el rango del Pentium.","Es el de Honeywell-Multics."]},{"s":"seg","c":"segdef","q":"¿Qué información contiene cada entrada de la tabla de segmentos?","o":["Bit de presencia/ausencia, registro base y registro longitud.","Número de marco y bit de presencia.","Los bits R y M, junto con el número de marco y el desplazamiento.","El número de página del segmento y el desplazamiento dentro de esa página.","Solo la dirección base."],"e":["La longitud sirve para controlar violaciones de memoria.","Es la tabla de páginas.","Son de los algoritmos de sustitución de página.","No es su contenido.","Falta el bit de presencia y la longitud."]},{"s":"seg","c":"segdef","q":"En memoria segmentada, ¿cómo se direcciona cada byte?","o":["Con un par (segmento, desplazamiento).","Con una única dirección lineal.","Con (marco, desplazamiento).","Con (proceso, página, desplazamiento), igual que en la transformación de dos niveles.","Con el número de PAR que le asigna la MMU."],"e":["Cada segmento puede crecer de forma independiente.","Eso es paginación.","Es la dirección física paginada.","No es la forma descrita.","Se usa un par (segmento, desplazamiento)."]},{"s":"seg","c":"segtrad","q":"El segmento 0 tiene base 219 y longitud 600 y está cargado. ¿Qué dirección física corresponde a (0, 430)?","o":["649.","430.","1030.","818, el final del segmento, porque el desplazamiento se cuenta desde el final.","211."],"e":["DF = RB + Despl = 219 + 430.","Falta sumar la base.","Suma longitud y desplazamiento.","Se suma a la base.","No es el cálculo."]},{"s":"seg","c":"segtrad","q":"Con el segmento 0 de base 219 y longitud 600, ¿qué ocurre al acceder a (0, 700)?","o":["Una violación de memoria que aborta el proceso, porque el desplazamiento supera la longitud.","Se accede a la dirección 919.","Una falta de segmento, que trae el segmento desde el disco y reanuda la instrucción que falló.","Se amplía automáticamente el segmento hasta 700 para que el acceso sea válido.","Se accede a la dirección 100."],"e":["Se comprueba antes de generar la dirección física.","El desplazamiento no es válido.","El segmento está cargado.","No es lo que describe la traducción.","No."]},{"s":"seg","c":"pagseg","q":"¿Qué diferencia hay entre paginación y segmentación respecto a la división de la dirección?","o":["En paginación la hace el hardware; en segmentación, el programador.","En las dos la hace el programador.","En paginación la hace el programador.","En las dos la hace la MMU, porque es la única que conoce el tamaño de páginas y segmentos.","En ninguna hay división: los dos esquemas cargan el proceso entero."],"e":["Es una de las diferencias de §4.6.","En paginación la hace el hardware.","Es al revés.","En segmentación la hace el programador.","Sí la hay."]},{"s":"seg","c":"pagseg","q":"¿Cómo es el espacio de direcciones en paginación y en segmentación?","o":["Lineal (unidimensional) en paginación y bidimensional en segmentación.","Bidimensional en las dos, porque ambas usan pares (número, desplazamiento).","Bidimensional en paginación y lineal en segmentación.","Lineal en las dos, porque la memoria principal se organiza como un espacio unidimensional.","Tridimensional en segmentación."],"e":["La paginación hace una división física; la segmentación, lógica.","La paginación es lineal.","Es al revés.","La segmentación es bidimensional.","No."]},{"s":"seg","c":"compart","q":"¿Cómo se comparten páginas en un sistema paginado?","o":["Haciendo que entradas de las tablas de distintos procesos apunten al mismo marco.","Copiando la página en el espacio de cada proceso.","Con un único proceso dueño que las presta.","Moviendo la página al área de swap para que cualquier proceso la pueda cargar cuando la necesite.","No se pueden compartir: cada proceso necesita que facilita compartir y proteger el código por módulos lógicos del programa.","Paginación y segmentación combinadas a partes iguales.","Paginada con carga anticipatoria del conjunto de trabajo completo antes de ejecutar cada proceso.","Ninguna, usan almacenamiento real."],"e":["En x86-64 la segmentación está casi desactivada y ARM64 no la incluye.","No.","La segmentación no es el mecanismo principal.","Es carga por demanda.","Todos usan memoria virtual."]},{"s":"act","c":"somv","q":"¿Por qué Android no usa área de swap en disco?","o":["Porque las escrituras frecuentes desgastan la memoria flash y acortan su vida.","Porque los móviles no tienen almacenamiento.","Porque usa segmentación y la memoria flash no admite segmentos de tamaño variable.","Porque sus páginas de 16 KiB son demasiado grandes para escribirlas en el almacenamiento.","Porque no tiene memoria virtual."],"e":["Comprime en memoria (zRAM) y, si no basta, el low memory killer termina procesos.","Sí tienen.","No.","No es la razón.","Sí la tiene."]},{"s":"act","c":"sopag","q":"¿Qué tamaño de página usa macOS en los Mac con Apple Silicon?","o":["16 KiB.","4 KiB.","2 MiB.","64 KiB, igual que Android desde la versión 15.","512 bytes."],"e":["En los procesadores Intel, 4 KiB.","Es el de los Mac con Intel.","Son las páginas grandes de Linux, Windows y FreeBSD.","Android admite 16 KiB desde la 15.","No."]},{"s":"act","c":"sopag","q":"¿Qué inconveniente tienen las páginas grandes de 2 MiB de Linux, Windows y FreeBSD?","o":["Mayor fragmentación interna; por eso se reservan para procesos con mucha memoria.","Tablas de páginas más grandes, porque hay más entradas por cada proceso cargado en memoria.","Que la memoria asociativa resulta menos eficaz.","Mayor fragmentación externa, porque los marcos grandes dejan huecos entre ellos en la memoria.","Que no se pueden usar en x86-64."],"e":["A cambio, las tablas son más pequeñas y la memoria asociativa más eficaz.","Es al revés.","Resulta más eficaz.","Es interna.","No." function validSession(s) {
  try {
    if (!s || !Array.isArray(s.items) || !s.items.length || s.done) return null;
    if (!s.items.every(it => BANK[it.t] && BANK[it.t].qs[it.i] && Array.isArray(it.p) && it.p.length === 5)) return null;
    if (!Array.isArray(s.answers) || s.answers.length !== s.items.length) return null;
    if (!Array.isArray(s.visited)) s.visited = s.items.map(() => false);
    s.cur = Math.min(Math.max(0, s.cur | 0), s.items.length - 1);
    return s;
  } catch (e) { return null; }
}
const saveSession = () => { if (session && !session.done) LS.set(K_SESSION, session); else LS.del(K_SESSION); };

  const s = Math.max(0, Math.round(ms / 1000));

  return (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(ss).padStart(2, '0');
}
function record(it, ans) {
  const id = SSII.qid(it.t, it.i);
  const st = stats[id] || [0, 0, null];
  st[0]++; if (ans !== 0) st[1]++; st[2] = ans === 0 ? 1 : 0;
  stats[id] = st;
}
function temaStats(t) {

  BANK[t].qs.forEach((q, i) => { const st = stats[SSII.qid(t, i)]; if (st && st[0] > 0) { seen++; if (st[2] === 0) pending++; } });
  return { seen, pending, n: BANK[t].qs.length };
}

  const opts = answered
    ? it.p.map((orig, pos) => solvedOpt(q, orig, pos, ans)).join('')
    : it.p.map((orig, pos) => `<button class="opt" data-action="pick" data-pos="${pos}"><span class="let">${LET[pos]}</span><span class="otext">${q.o[orig]}</span></button>`).join('');

function solvedOpt(q, orig, pos, ans) {
