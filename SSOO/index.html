quedar bloqueado por otro que no está en su sección crítica.","Permite que dos procesos estén a la vez en su sección crítica.","No usa espera ocupada, así que el proceso que espera no consume CPU pero tarda en despertar.","Necesita hardware especial con una instrucción indivisible para cambiar la variable puerta.","Solo funciona con tres procesos."],"e":["Es malo cuando un proceso es mucho más lento.","Garantiza la exclusión mutua.","Sí usa espera ocupada.","Es una solución software.","El ejemplo es de 2."]},{"s":"sync","c":"alternacion","q":"En la alternación estricta de A y B, ¿qué ocurre si es el turno de B y B está en su sección no crítica durante mucho tiempo?","o":["A no puede entrar en su sección crítica aunque nadie la esté usando.","A entra porque la sección crítica está libre.","B pierde el turno automáticamente.","El SO detecta el interbloqueo y reinicia la variable puerta para que A pueda entrar.","Ambos entran a la vez, porque la variable puerta solo protege la sección no crítica."],"e":["Incumple la condición de que un proceso fuera de su sección crítica no bloquee a otros.","Debe esperar a que puerta valga 0.","No existe ese mecanismo.","No hay detección.","La exclusión mutua se mantiene."]},{"s":"prob","c":"prodcons","q":"¿Qué restricción NO forma parte del problema del productor-consumidor?","o":["El productor y el consumidor deben ejecutarse en procesadores distintos.","El productor no puede depositar si el búfer está lleno.","El consumidor no puede extraer si el búfer está vacío.","No pueden acceder a la vez al mismo elemento del búfer.","El búfer es acotado, de N elementos del mismo tamaño, en cada uno de los cuales se deposita una unidad de información."],"e":["Sí es la respuesta: no es una restricción del problema.","Sí es una restricción.","Sí es una restricción.","Sí es una restricción.","Sí forma parte del planteamiento."]},{"s":"prob","c":"prodcons","q":"En el ejemplo práctico del spooler de impresión como productor-consumidor, ¿quién es el consumidor?","o":["El spooler de impresión.","Los procesos que quieren imprimir.","La impresora física.","El SO, que extrae los archivos del directorio para comprobar sus permisos.","El usuario."],"e":["Los productores son los procesos que quieren imprimir.","Son los productores.","No es el papel que le dan los apuntes.","No es el papel descrito.","No es el papel descrito."]},{"s":"prob","c":"filosofos","q":"¿Quién propuso la cena de los filósofos y por qué se considera un problema clásico?","o":["Dijkstra (1965), porque representa a un gran conjunto de problemas de sincronización.","Peterson (1981), por su utilidad práctica.","Hoare (1974), al presentar los monitores, para mostrar la ventaja de las variables de condición.","Dijkstra (1968), porque es el problema del sistema THE con seis filósofos.","Brinch Hansen, por su relación con las tuberías."],"e":["No por su utilidad práctica.","Lo propuso Dijkstra y no por su utilidad práctica.","Lo propuso Dijkstra.","Fue en 1965 y son cinco filósofos.","No es correcto."]},{"s":"prob","c":"filosofos","q":"En la cena de los filósofos, ¿qué necesita un filósofo para comer?","o":["Los dos tenedores de sus lados, cogidos de uno en uno.","Un solo tenedor, el de su derecha, siempre que el vecino no lo esté usando.","Cualquier par de tenedores de la mesa.","Los cinco tenedores a la vez, para que ningún otro filósofo pueda comer mientras él come.","Permiso del filósofo de enfrente."],"e":["Si los consigue, come sin soltarlos.","Necesita dos.","Los de sus lados.","No es así.","No es la regla."]},{"s":"prob","c":"lectesc","q":"¿En qué consiste el primer problema de lectores-escritores?","o":["Ningún lector espera salvo que un escritor ya tenga permiso: prioridad a los lectores.","Si un escritor espera, ningún lector nuevo empieza.","Los lectores y escritores acceden siempre de uno en uno.","Los escritores pueden escribir a la vez si escriben en registros distintos de la base de datos.","Solo hay un lector y varios escritores, que acceden por turnos a la base de datos compartida."],"e":["Es la variante más simple.","Eso es el segundo problema.","Varios lectores pueden leer a la vez.","Los escritores necesitan acceso exclusivo.","No es el planteamiento."]},{"s":"prob","c":"lectesc","q":"¿Qué accesos simultáneos se permiten en lectores-escritores?","o":["Varios lectores a la vez; un escritor necesita acceso exclusivo.","Varios escritores a la vez.","Un lector y un escritor a la vez.","Ninguno: todos los procesos, lectores o escritores, acceden de uno en uno a los datos.","Solo escritores, porque leer no requiere ningún tipo de control de acceso."],"e":["Si un escritor y otro proceso acceden a la vez, puede producirse un caos.","Los escritores acceden de forma exclusiva.","Eso es lo que hay que evitar.","Varios lectores sí pueden a la vez.","No tiene sentido."]},{"s":"prob","c":"barbero","q":"En el barbero dormilón, ¿qué hace el barbero si no hay clientes esperando?","o":["Se duerme en su silla.","Cierra la barbería.","Espera de pie en la sala.","Atiende al siguiente cliente de la cola del semáforo aunque todavía no haya llegado.","Llama a otro barbero."],"e":["Un cliente que llega lo despierta.","No es así.","Se duerme en su silla.","No hay clientes.","Solo hay uno."]},{"s":"prob","c":"barbero","q":"En el barbero dormilón, llega un cliente con el barbero ocupado y sin sillas libres en la sala de espera. ¿Qué hace?","o":["Se va de la barbería.","Espera de pie.","Despierta al barbero.","Se sienta en la silla del barbero y espera a que el cliente actual termine de cortarse el pelo.","Echa a otro cliente."],"e":["Si hubiera sillas libres, se sentaría a esperar.","Se va.","Solo lo despierta si está dormido.","No es así.","No es así."]},{"s":"hw","c":"inhab","q":"¿Por qué inhabilitar las interrupciones solo es útil dentro del núcleo del SO?","o":["Un proceso de usuario podría apoderarse del sistema, y solo afecta a una CPU.","Porque es una solución software.","Porque usa espera ocupada y en modo usuario consumiría todo el tiempo de CPU del proceso.","Porque el núcleo es el único que puede ejecutar instrucciones indivisibles como TSL en varios procesadores.","Porque el núcleo no tiene secciones críticas."],"e":["Son sus dos inconvenientes.","Es hardware.","No es el motivo dado.","No es lo que dicen los apuntes.","Sí las tiene."]},{"s":"hw","c":"inhab","q":"En un multiprocesador, ¿garantiza inhabilitar las interrupciones la exclusión mutua?","o":["No, solo afecta a la CPU que ejecuta el proceso.","Sí, porque bloquea todas las CPU.","Sí, si se hace en modo usuario.","Sí, siempre que todas las CPU compartan la misma memoria principal y el mismo controlador.","Solo si se combina con semáforos binarios en cada CPU."],"e":["Las demás CPU pueden entrar en la sección crítica.","Solo afecta a una.","Además es peligroso en modo usuario.","No es así.","No tiene relación."]},{"s":"hw","c":"tsl","q":"¿Qué hace la instrucción TSL (Test and Set Lock)?","o":["Lee una palabra de memoria, la copia en un registro y escribe en ella un valor no nulo, de forma indivisible.","Bloquea al proceso hasta que una variable valga 0.","Inhabilita las interrupciones durante la sección crítica.","Envía una señal al proceso que tiene el recurso para que lo libere cuanto antes y deje paso.","Incrementa un semáforo de forma indivisible, despertando al primer proceso de su cola si estaba bloqueado."],"e":["Ningún otro procesador accede a la palabra hasta que termina.","No bloquea: hay espera ocupada.","Es otra solución.","No tiene relación.","Eso es SIGNAL."]},{"s":"hw","c":"tsl","q":"¿Se puede usar TSL para la exclusión mutua en un sistema con varios procesadores y memoria común?","o":["Sí, porque es indivisible y ningún otro procesador accede a la palabra durante la instrucción.","No, solo funciona en uniprocesadores.","No, porque es una solución software.","Solo si se combina con inhabilitar las interrupciones en todas las CPU a la vez.","Solo si se encapsula dentro de un monitor, que es el que garantiza la indivisibilidad entre procesadores."],"e":["Pregunta de la Sesión 6.","Funciona con memoria común.","Es una solución hardware.","No es necesario.","No es necesario."]},{"s":"hw","c":"tslent","q":"Con la función entrar() basada en TSL, ¿qué ocurre si flag vale 0?","o":["El proceso entra en su sección crítica y flag queda a 1.","El proceso espera en un bucle hasta que otro ponga flag a 1 al salir de su sección crítica.","Se produce una interrupción.","El proceso pone flag a 0 y sale, porque nadie más quería entrar en la sección crítica.","Se bloquea en una cola."],"e":["Si flag valiera 1, volvería a intentarlo.","Espera si flag vale 1.","No es así.","Eso es salir().","TSL no bloquea."]},{"s":"hw","c":"tslent","q":"¿Es cierto que la instrucción TSL es una solución hardware al problema de la exclusión mutua?","o":["Sí, forma parte del juego de instrucciones de la CPU y requiere espera ocupada.","No, es una solución software.","Sí, y además evita la espera ocupada.","No, es una llamada al sistema que el núcleo ejecuta en modo supervisor para cada proceso.","No, es un tipo de semáforo binario que gestiona el núcleo."],"e":["Pregunta de la Sesión 6.","Es hardware.","Requiere espera ocupada.","Es una instrucción de la CPU.","Es una instrucción."]},{"s":"sen","c":"sendef","q":"¿Qué hace un proceso al recibir una señal?","o":["Se detiene, ejecuta su rutina de tratamiento y continúa en la instrucción interrumpida.","Termina siempre, salvo que la señal sea de E/S asíncrona, que se ignora automáticamente.","La guarda en una cola y la trata al final.","Ejecuta una rutina del SO y vuelve a empezar desde el principio de su código.","Pasa a estado bloqueado."],"e":["La rutina forma parte del propio proceso.","Solo si no la ha armado ni enmascarado (acción por defecto).","Las señales no se encolan.","La rutina es del proceso y continúa donde estaba.","No es lo que describen los apuntes."]},{"s":"sen","c":"sendef","q":"¿A qué procesos puede enviar señales un proceso?","o":["A los que tienen su mismo uid; el superusuario, a cualquiera.","A cualquier proceso.","Solo a sus procesos hijos, que heredan el uid del padre al crearse.","Solo a los procesos del mismo grupo de usuarios que se ejecuten en el mismo terminal.","A ninguno: solo el SO envía señales."],"e":["Es la regla de los apuntes.","Solo con el mismo uid, salvo el superusuario.","No es la regla.","No es la regla.","También de proceso a proceso."]},{"s":"sen","c":"senarmar","q":"¿Qué significa armar una señal?","o":["Indicar al SO qué rutina del proceso tratará esa señal.","Enviarla a otro proceso.","Bloquearla hasta que se desenmascare.","Ignorarla para que no tenga efecto, aunque llegue en mitad de la ejecución del proceso.","Encolarla para que el SO la entregue cuando el proceso esté listo para tratarla."],"e":["En POSIX se hace con sigaction.","Eso se hace con kill.","Eso es enmascarar.","Es otra opción.","Las señales no se encolan."]},{"s":"sen","c":"senarmar","q":"¿Qué ocurre con una señal enmascarada?","o":["Queda bloqueada, no se desecha, hasta que el proceso la desenmascare.","Se desecha, porque una señal enmascarada indica que el proceso no quiere recibirla nunca.","Elimina al proceso.","Se reenvía al proceso padre para que la trate su rutina.","Se ejecuta inmediatamente."],"e":["Es la descripción de los apuntes.","No se desecha.","Eso es la acción por defecto sin armar ni enmascarar.","No es así.","Queda bloqueada."]},{"s":"sen","c":"sensinc","q":"¿Por qué las señales no son un mecanismo apropiado para sincronizar procesos?","o":["Porque son asíncronas y no se encolan, así que se pueden perder eventos.","Porque solo las puede enviar el superusuario.","Porque bloquean siempre al proceso que las envía.","Porque se encolan y el proceso puede acabar tratando eventos que ya no son relevantes.","Porque requieren espera ocupada mientras el proceso comprueba si la señal ha llegado."],"e":["Son las dos razones de los apuntes.","También un proceso con el mismo uid.","No es así.","No se encolan.","No es la razón."]},{"s":"sen","c":"sensinc","q":"En POSIX, ¿con qué llamadas se puede sincronizar un proceso mediante señales?","o":["pause para esperar una señal y kill para enviarla.","wait y signal, que en POSIX bloquean y despiertan al proceso igual que un semáforo.","sigaction y kill.","send y receive, que forman parte de la interfaz POSIX de señales entre procesos.","lock y unlock."],"e":["El proceso queda bloqueado hasta que otro hace kill.","Son operaciones de semáforos.","sigaction sirve para armar la señal.","Son de paso de mensajes.","Son de mutex."]},{"s":"sem","c":"semdef","q":"¿Qué es un semáforo según los apuntes?","o":["Un entero no negativo sobre el que solo se actúa con WAIT y SIGNAL tras su inicialización.","Un entero que puede tomar cualquier valor, también negativo.","Una instrucción hardware indivisible.","Un módulo de procedimientos que fuerza la exclusión mutua generado por el compilador.","Una variable de condición con un contador, que solo puede usarse dentro de un monitor."],"e":["Los introdujo Dijkstra en 1965.","Es no negativo.","Eso es TSL.","Eso es un monitor.","No es lo mismo."]},{"s":"sem","c":"semdef","q":"¿Son WAIT y SIGNAL operaciones indivisibles?","o":["Sí: dos procesos no pueden actuar a la vez sobre el mismo semáforo.","No, por eso hacen falta monitores.","Solo WAIT, porque SIGNAL nunca bloquea y por tanto no necesita ser indivisible.","Solo en sistemas con un procesador, porque en varios procesadores pueden solaparse.","Solo SIGNAL."],"e":["Pregunta de las Sesiones 6.","Sí son indivisibles.","Las dos lo son.","Son indivisibles siempre.","Las dos lo son."]},{"s":"sem","c":"waitsig","q":"¿Qué hace WAIT(s) si s vale 0?","o":["Añade el proceso a la cola del semáforo y lo bloquea, sin modificar s.","Pone s a −1 y bloquea al proceso, de modo que el valor indica cuántos procesos esperan.","No hace nada y el proceso continúa.","Incrementa s y despierta al primer proceso de la cola, que estaba esperando ese valor.","Termina el proceso."],"e":["Si s ≠ 0, decrementa s.","El semáforo nunca es negativo.","Se bloquea.","Eso se parece a SIGNAL.","Se bloquea."]},{"s":"sem","c":"waitsig","q":"¿Qué hace SIGNAL(s) si hay procesos bloqueados en la cola?","o":["Saca uno de la cola (normalmente FIFO) y lo pone en Preparado, sin incrementar s.","Incrementa s siempre.","Desbloquea a todos los procesos.","Incrementa s y además desbloquea a todos los procesos de la cola para que compitan por el recurso.","Pone s a 0 y despierta a todos los procesos de la cola para que compitan por el recurso."],"e":["Solo incrementa s si la cola está vacía.","Solo si la cola está vacía.","Solo a uno.","Solo desbloquea uno y no incrementa.","No es su efecto."]},{"s":"sem","c":"formula","q":"Un semáforo general se inicializa a 9. Se ejecutan 27 WAIT y 23 SIGNAL. ¿Qué valor tiene?","o":["5.","7.","13.","−5, porque los WAIT superan a los SIGNAL.","4."],"e":["val = C + ns − nw = 9 + 23 − 27 = 5. Pregunta de la Sesión 6, que proponía 7.","Es el valor que plantea la Sesión 6 como afirmación, y es falsa.","Resulta de restar los SIGNAL y sumar los WAIT.","El semáforo no es negativo y la fórmula da 5.","Resulta de restar 27 − 23."]},{"s":"sem","c":"formula","q":"¿Qué invariante cumple siempre un semáforo (C inicial, ns SIGNAL, nw WAIT)?","o":["nw ≤ C + ns.","nw ≥ C + ns.","ns ≤ C + nw.","nw = ns en todo momento, porque cada WAIT se empareja con un SIGNAL.","C ≤ nw."],"e":["Porque val = C + ns − nw ≥ 0; la igualdad solo cuando val = 0.","La desigualdad es al revés.","No es el invariante.","No tienen por qué coincidir.","No es el invariante."]},{"s":"sem","c":"negativo","q":"¿Puede un semáforo inicializarse a un valor negativo?","o":["No, es un entero no negativo.","Sí, para indicar procesos ya bloqueados.","Solo si es binario.","Sí, si es un semáforo general, porque estos pueden tomar cualquier valor entero.","Solo en exclusión mutua."],"e":["Pregunta de las Sesiones 6.","No según la definición de los apuntes.","Los binarios valen 0 o 1.","Los apuntes lo definen como no negativo.","No."]},{"s":"sem","c":"negativo","q":"Según la definición de WAIT de los apuntes, ¿puede un semáforo llegar a tomar un valor negativo?","o":["No: si vale 0, WAIT bloquea sin decrementar.","Sí, cada WAIT resta 1.","Sí, su valor absoluto da los procesos bloqueados.","Solo cuando hay más WAIT que SIGNAL y el valor inicial era cero desde el principio.","Solo en semáforos binarios."],"e":["Pregunta de la Sesión 6.","Solo resta si el valor es distinto de 0.","Eso ocurre en otras implementaciones, no en la de los apuntes.","Aun así WAIT bloquea sin decrementar.","No."]},{"s":"sem","c":"binario","q":"¿Es cierto que un semáforo binario solo se puede usar cuando el número máximo de procesos es 2?","o":["No: binario se refiere a sus valores (0 y 1), no al número de procesos.","Sí, uno por cada uno de los dos valores que puede tomar el semáforo.","Sí, si se usa para exclusión mutua.","No, solo se puede usar con un único proceso que alterne entre los dos valores posibles.","Sí, en sincronización asimétrica."],"e":["Pregunta de la Sesión 6.","Pueden usarlo muchos procesos.","Puede proteger una sección crítica entre muchos procesos.","Lo usan varios procesos.","No hay tal limitación."]},{"s":"sem","c":"binario","q":"¿Qué indica el valor inicial N de un semáforo?","o":["Cuántos procesos pueden compartirlo, es decir, pasar el WAIT sin bloquearse.","El número de procesos bloqueados.","El número máximo de SIGNAL permitidos.","El número de WAIT que se pueden hacer antes de que el semáforo pase a valer negativo.","La prioridad del semáforo frente a otros semáforos del mismo proceso."],"e":["La compartición viene dada por su valor inicial.","No es su significado.","No hay tal máximo.","Nunca es negativo.","No es su significado."]},{"s":"sem","c":"excsem","q":"¿Cómo se implementa la exclusión mutua con un semáforo?","o":["Semáforo inicializado a 1; WAIT antes de la sección crítica y SIGNAL después.","Semáforo inicializado a 0; WAIT antes y SIGNAL después.","Semáforo a 1; SIGNAL antes y WAIT después.","Semáforo inicializado al número de procesos, para que todos puedan entrar por turnos en la sección crítica.","Semáforo inicializado a N, con un solo WAIT antes de la sección crítica y sin SIGNAL."],"e":["Se cumple nw ≤ ns + 1.","Con 0 nadie podría entrar.","Es al revés.","Con N > 1 entrarían varios a la vez.","No garantiza la exclusión."]},{"s":"sem","c":"excsem","q":"El proceso A no puede avanzar hasta que B alcance cierto punto. ¿Cómo se resuelve con semáforos?","o":["Semáforo a 0; A hace WAIT y B hace SIGNAL.","Semáforo a 1; A hace WAIT y B hace SIGNAL.","Semáforo a 0; A hace SIGNAL y B hace WAIT.","Semáforo a 1 con WAIT y SIGNAL en los dos procesos, igual que para la exclusión mutua.","No se puede con semáforos: hace falta un monitor con una variable de condición."],"e":["Es la sincronización asimétrica: nw(seguir) ≤ ns(seguir).","Con 1, A pasaría sin esperar.","Es al revés: B esperaría a A.","Eso es exclusión mutua, no sincronización.","Sí se puede."]},{"s":"sem","c":"deadsem","q":"Con x = y = 1, A hace WAIT(x) y luego WAIT(y); B hace WAIT(y) y luego WAIT(x). ¿Qué puede pasar?","o":["Un interbloqueo: cada uno retiene el semáforo que el otro necesita.","Una condición de carrera.","Nada, porque WAIT es indivisible.","Que ambos entren a la vez en su sección crítica, porque cada uno tiene uno de los dos semáforos.","Inanición de x, porque A nunca llega a liberarlo al quedarse esperando por y."],"e":["Es el ejemplo de los apuntes.","Los semáforos evitan la condición de carrera.","La indivisibilidad no evita el orden incorrecto.","Se quedan bloqueados.","No es el caso."]},{"s":"sem","c":"deadsem","q":"¿Es cierto que un WAIT sobre un semáforo dentro de la sección crítica que controla ese semáforo produce un interbloqueo?","o":["Sí: el proceso se bloquea dentro y nadie puede hacer el SIGNAL que lo libere.","No: el WAIT se ignora porque el proceso ya tiene el semáforo.","No, el semáforo pasa a −1 y el proceso continúa.","No, porque el SO detecta que el proceso ya tiene el semáforo y le deja pasar el segundo WAIT.","Solo con semáforos generales."],"e":["Pregunta de la Sesión 6.","Se bloquea.","No toma valores negativos.","No hay tal detección.","Ocurre con el binario de exclusión mutua."]},{"s":"sem","c":"pcsem","q":"En el productor-consumidor con semáforos, ¿para qué se usa el semáforo «manipulación del búfer»?","o":["Para la exclusión mutua sobre el búfer.","Para la sincronización entre productor y consumidor.","Para contar el espacio libre.","Para contar los elementos disponibles en el búfer y bloquear al consumidor cuando no haya ninguno.","Para despertar al barbero."],"e":["Pregunta de la Sesión 6: no es de sincronización.","Esa la hacen espacio libre y elemento disponible.","Eso es «espacio libre».","Eso es «elemento disponible».","Es otro problema."]},{"s":"sem","c":"pcsem","q":"En el productor-consumidor con un búfer de N elementos, ¿con qué valores se inicializan «espacio libre» y «elemento disponible»?","o":["Espacio libre a N y elemento disponible a 0.","Los dos a 1, igual que manipulación del búfer.","Espacio libre a 0 y elemento disponible a N.","Los dos a N, porque ambos representan el tamaño del búfer en el momento de crearlo.","Los dos a 0."],"e":["Al principio el búfer está vacío.","1 es el valor de manipulación del búfer.","Es al revés.","Elemento disponible empieza en 0.","El productor no podría depositar."]},{"s":"sem","c":"pcorden","q":"¿Por qué el productor hace WAIT(espacio libre) antes que WAIT(manipulación del búfer)?","o":["Porque al revés podría bloquearse con el búfer lleno dentro de la sección crítica y provocar un interbloqueo.","Por eficiencia, sin otra consecuencia.","Porque WAIT(espacio libre) es indivisible y el otro no.","Porque así el consumidor puede leer el elemento mientras el productor lo está depositando.","Porque lo exige el valor inicial a 0 de espacio libre, que obliga a esperar antes de depositar el primer elemento."],"e":["El consumidor no podría entrar a liberar espacio.","El orden importa: evita el interbloqueo.","Ambos son indivisibles.","No pueden acceder a la vez.","No es la razón."]},{"s":"sem","c":"pcorden","q":"¿Qué relación hay que asegurar en el productor-consumidor (d = elementos almacenados, e = elementos extraídos)?","o":["0 ≤ d − e ≤ N.","d = e en todo momento.","0 ≤ e − d ≤ N.","d − e ≥ N, para que el búfer esté siempre lleno y el consumidor nunca espere.","d ≤ e."],"e":["Ni se extrae más de lo almacenado ni se supera la capacidad.","Entre ambos puede haber hasta N elementos.","Está invertida.","No es la relación.","No es la relación."]},{"s":"sem","c":"filsem","q":"En la solución de la cena de los filósofos con semáforos, ¿qué semáforos se usan?","o":["exmut a 1 para la exclusión mutua y un s[i] a 0 por filósofo.","Un semáforo a 1 por tenedor.","exmut a 0 y s[i] a 1.","Un único semáforo general a 5, que deja entrar a los cinco filósofos a la vez en la mesa.","db a 1 para la mesa y re como contador de filósofos que están comiendo."],"e":["Es la solución de los apuntes.","No es la solución de los apuntes.","Los valores están invertidos.","No es la solución.","db y re son de lectores-escritores."]},{"s":"sem","c":"filsem","q":"En la solución con semáforos de la cena de los filósofos, ¿cuándo pasa un filósofo a comer?","o":["Cuando está hambriento y ninguno de sus dos vecinos está comiendo.","En cuanto consigue un tenedor, y luego espera el segundo sin soltarlo.","Cuando le toca por turno estricto.","Cuando su vecino de la izquierda ha terminado de comer, aunque el de la derecha siga comiendo.","Cuando su semáforo s[i] vale 1 desde el principio."],"e":["Es lo que comprueba la función test().","Necesita que los vecinos no coman.","No hay turno estricto.","Ninguno de los dos puede estar comiendo.","s[i] se inicializa a 0."]},{"s":"sem","c":"lecsem","q":"En la solución de lectores-escritores con semáforos, ¿qué lectores hacen wait(db) y signal(db)?","o":["El primero que entra hace wait(db) y el último que sale hace signal(db).","Todos los lectores, al entrar y al salir de la base de datos.","Ninguno; db es solo de escritores.","Solo el último que entra, para cerrar el paso a los escritores que hayan llegado mientras tanto.","El primero hace los dos."],"e":["Así varios lectores leen a la vez.","Solo el primero y el último.","También lo usan el primer y el último lector.","No es la solución.","No."]},{"s":"sem","c":"lecsem","q":"En lectores-escritores con semáforos, ¿qué protege el semáforo exmut?","o":["La variable re, que cuenta los lectores que están leyendo.","El acceso a la base de datos.","La escritura en la base de datos, para que solo un escritor acceda a la vez.","La cola de escritores en espera, para que entren en el mismo orden en que llegaron.","Nada, es opcional."],"e":["db controla el acceso a la base de datos.","Eso es db.","Eso lo hace db.","No es lo que protege.","Es necesario para actualizar re."]},{"s":"sem","c":"bajonivel","q":"¿WAIT y SIGNAL son primitivas de bajo nivel?","o":["Sí: los semáforos son primitivas de bajo nivel, a diferencia de los monitores.","No, son de alto nivel.","Solo WAIT, porque SIGNAL lo genera el compilador al salir del monitor.","No, porque las genera el compilador del lenguaje dentro de los procedimientos del monitor.","Solo en Pascal Concurrente."],"e":["Pregunta de la Sesión 6.","Los de alto nivel son los monitores.","Ambas.","Eso es lo que hace un monitor con ellas.","No depende del lenguaje."]},{"s":"sem","c":"bajonivel","q":"¿Qué se utiliza para implementar un semáforo?","o":["Una variable entera no negativa y una cola de procesos bloqueados.","Solo una variable booleana.","Un monitor que guarda el valor del semáforo y una variable de condición.","Una tubería con un dato testigo que se lee y se escribe en cada operación.","Una variable de condición."],"e":["Pregunta de la Sesión 6, con WAIT y SIGNAL indivisibles.","Hace falta la cola y un entero.","Es al revés: el compilador implementa el monitor con semáforos.","Es otra forma de hacer secciones críticas.","No."]},{"s":"sem","c":"circular","q":"En el productor-consumidor con búfer circular sin semáforo de exclusión mutua (Sesión 7), ¿puede ocurrir IN = OUT?","o":["Sí, con el búfer vacío y con el búfer lleno.","Nunca, porque IN siempre va por delante de OUT.","Solo con el búfer vacío.","Solo si hay varios consumidores accediendo a la vez a la variable OUT.","Solo con el búfer lleno."],"e":["Vacío: ED = 0. Lleno: EL = 0.","Ocurre al inicio, por ejemplo.","También con el búfer lleno.","Ocurre también con uno.","También con el búfer vacío."]},{"s":"sem","c":"circular","q":"¿Es válida la solución del búfer circular sin semáforo de exclusión mutua si hay varios consumidores?","o":["No: comparten OUT sin protección y dos consumidores pueden leer el mismo elemento.","Sí, igual que con uno.","Sí, porque ED y EL ya protegen OUT.","No, porque con varios consumidores el búfer circular ya no puede llenarse nunca.","Solo si N es par, porque así cada consumidor recorre la mitad de las posiciones del búfer."],"e":["Hace falta un semáforo de exclusión mutua a 1 entre consumidores.","Aparece una condición de carrera sobre OUT.","ED y EL sincronizan, no protegen OUT.","No es el problema.","No depende de N."]},{"s":"sem","c":"circmismo","q":"En el búfer circular con un productor y un consumidor, ¿pueden manipular a la vez el mismo elemento?","o":["No: si IN = OUT, uno de los dos está bloqueado.","Sí, cuando IN = OUT.","Sí, siempre que el búfer esté medio lleno.","Sí, porque no hay semáforo de exclusión mutua que lo impida en esta solución.","Solo si N = 1, porque entonces IN y OUT apuntan siempre al mismo elemento."],"e":["Vacío: consumidor bloqueado. Lleno: productor bloqueado.","En ese caso uno está bloqueado.","Entonces IN ≠ OUT.","Los semáforos ED y EL lo impiden.","Ni siquiera entonces."]},{"s":"sem","c":"circmismo","q":"¿Por qué con un único productor y un único consumidor el búfer circular no necesita semáforo de exclusión mutua?","o":["Porque IN solo lo modifica el productor y OUT solo el consumidor.","Porque los dos se ejecutan en el mismo procesador.","Porque el búfer es circular y así el productor y el consumidor nunca se alcanzan.","Porque ED y EL se inicializan a 1 y por tanto actúan como semáforos de exclusión mutua.","Porque WAIT y SIGNAL bloquean el búfer entero."],"e":["No comparten ninguna variable modificable.","No es la razón.","La forma del búfer no es la razón.","Se inicializan a 0 y a N.","No es así."]},{"s":"mon","c":"mondef","q":"¿Por qué aparecen los monitores?","o":["Por la dificultad de diseñar con semáforos: orden incorrecto de WAIT y SIGNAL u omisiones.","Porque los semáforos no funcionan en multiprocesadores.","Para sustituir a las tuberías.","Porque los semáforos usan espera ocupada y gastan tiempo de CPU en todos los casos.","Para enviar señales entre procesos sin que se pierdan eventos de sincronización."],"e":["Los monitores son primitivas de alto nivel.","No es la razón.","No es la razón.","Los semáforos bloquean.","Las señales son otro mecanismo; los monitores surgen por las dificultades de los semáforos."]},{"s":"mon","c":"mondef","q":"¿Qué lenguajes incorporan monitores según los apuntes?","o":["Concurrent Euclid y Pascal Concurrente.","C y Java, que los ofrecen como palabras reservadas del lenguaje.","Todos los lenguajes modernos.","LISP y PROLOG, por ser lenguajes de inteligencia artificial con procesos cooperantes.","Solo ensamblador."],"e":["Son pocos los que los incorporan.","No son los que citan los apuntes.","Son pocos.","No son los citados.","No."]},{"s":"mon","c":"monprop","q":"¿Cuál es la propiedad fundamental de un monitor?","o":["Solo un proceso puede estar activo en el monitor en cada instante.","Todos los procesos pueden estar activos a la vez.","Los procesos acceden directamente a sus estructuras internas.","Cada proceso tiene su propia copia de las variables del monitor para evitar conflictos.","No necesita variables de condición."],"e":["Fuerza la exclusión mutua.","Solo uno.","Solo a través de sus procedimientos.","Las variables son compartidas.","Las usa."]},{"s":"mon","c":"monprop","q":"¿Quién garantiza la exclusión mutua en un monitor?","o":["El compilador, generando WAIT y SIGNAL sobre los semáforos apropiados.","El programador, poniendo WAIT y SIGNAL a mano.","El hardware, mediante la instrucción TSL en cada procedimiento.","El propio proceso, inhabilitando las interrupciones al llamar a cada procedimiento del monitor.","Nadie: no la garantiza."],"e":["Los monitores son construcciones del lenguaje.","Eso es lo que evita el monitor.","No es lo que dicen los apuntes.","No es así.","Sí la garantiza."]},{"s":"mon","c":"varcond","q":"¿Es una variable de condición igual que un semáforo?","o":["No: no tiene valor, WAITM siempre bloquea y solo se usa dentro de un monitor.","Sí, son sinónimos en los lenguajes que incorporan monitores.","Sí, pero de alto nivel.","No, porque una variable de condición sí recuerda los SIGNALM aunque nadie esté esperando.","Sí, si es binaria."],"e":["Pregunta de la Sesión 8.","Son distintos.","No tiene valor contador.","Un SIGNALM sin procesos esperando se pierde.","No."]},{"s":"mon","c":"varcond","q":"¿Qué ocurre cuando un proceso dentro de un monitor hace WAITM sobre una variable de condición?","o":["Se bloquea en su cola y deja entrar a otro proceso al monitor.","Sale del monitor y termina.","Sigue ejecutándose dentro del monitor hasta que otro proceso haga SIGNALM.","Decrementa el contador de la variable y solo se bloquea si llega a cero.","Bloquea a todos los procesos."],"e":["Hay una cola de bloqueados por variable.","Se bloquea.","WAITM bloquea.","La variable no tiene contador.","Solo a él."]},{"s":"mon","c":"hoare","q":"Tras un SIGNALM podría haber dos procesos activos en el monitor. ¿Qué propone Brinch Hansen?","o":["Que el proceso que hace SIGNALM salga inmediatamente del monitor.","Que el proceso desbloqueado suspenda al otro.","Que ambos sigan activos.","Que el proceso desbloqueado vuelva a la cola hasta que el otro salga del monitor.","Eliminar SIGNALM y que el proceso bloqueado se despierte solo al cumplirse la condición."],"e":["SIGNALM es la última sentencia; más fácil de implementar.","Eso propone Hoare.","Es lo que hay que evitar.","No es la propuesta.","No."]},{"s":"mon","c":"hoare","q":"¿Qué solución al problema de SIGNALM es más fácil de implementar?","o":["La de Brinch Hansen.","La de Hoare.","Las dos son iguales.","La de Dijkstra, que sustituye las variables de condición por semáforos binarios.","Ninguna se puede implementar."],"e":["El que hace SIGNALM sale del monitor.","El desbloqueado suspende al otro; es más compleja.","Los apuntes dicen que Brinch Hansen es más fácil.","No es una de las dos propuestas.","Ambas se pueden."]},{"s":"mon","c":"pcmon","q":"En el productor-consumidor con monitores, ¿qué hace el procedimiento entrar si cuenta = N?","o":["WAITM(lleno).","WAITM(vacío).","SIGNALM(lleno).","Deposita el elemento y luego hace WAITM(lleno) para que el consumidor lo saque cuanto antes.","Nada."],"e":["El búfer está lleno.","Eso lo hace sacar si cuenta = 0.","Lo hace sacar cuando cuenta = N − 1.","No deposita con el búfer lleno.","Se bloquea."]},{"s":"mon","c":"pcmon","q":"En el productor-consumidor con monitores, ¿cuándo hace entrar un SIGNALM(vacío)?","o":["Cuando cuenta pasa a valer 1.","Cuando cuenta vale N.","Siempre que deposita.","Cuando cuenta vale N − 1, porque entonces hay hueco para que el productor siga.","Nunca, porque es sacar quien despierta al productor."],"e":["El búfer deja de estar vacío.","Entonces hace WAITM(lleno).","Solo cuando cuenta = 1.","Eso lo hace sacar con SIGNALM(lleno).","Sí lo hace."]},{"s":"tub","c":"tubdef","q":"¿Cómo es el flujo de datos en una tubería?","o":["Unidireccional; para comunicación bidireccional hacen falta dos tuberías.","Bidireccional.","Aleatorio: el lector recibe los datos en cualquier orden respecto al de escritura.","LIFO: el último dato escrito es el primero que se lee, como en una pila.","Solo de padre a hijo."],"e":["Cada proceso usa una para emitir y otra para recibir.","Es unidireccional.","Es FIFO.","Es FIFO.","Las tuberías con nombre sirven a procesos independientes."]},{"s":"tub","c":"tubdef","q":"¿Qué tamaño típico tiene una tubería según los apuntes?","o":["4 KB.","4 MB.","Un solo byte.","El mismo que la memoria principal libre, porque crece según se escriben datos en ella.","512 bytes."],"e":["Depende del SO.","No es el dato.","Tiene almacenamiento.","No es así.","No es el dato."]},{"s":"tub","c":"tubesc","q":"¿Qué ocurre al escribir en una tubería que ningún proceso tiene abierta para lectura?","o":["La operación devuelve un error.","El escritor se bloquea hasta que algún proceso la abra para leer.","Los datos se pierden sin aviso.","Los datos se guardan hasta que algún proceso la abra para leer, aunque tarde mucho.","Se devuelve fin de archivo."],"e":["Si estuviera llena, el escritor se bloquearía.","Se bloquea si está llena.","Devuelve error.","Devuelve error.","Eso pasa al leer sin escritores."]},{"s":"tub","c":"tubesc","q":"Una tubería tiene M bytes y se piden n bytes, con M < n. ¿Qué devuelve la lectura?","o":["Los M bytes disponibles, que se eliminan de la tubería.","Bloquea hasta tener n bytes.","Error, porque no hay suficientes datos para atender la petición.","Fin de archivo, porque no hay suficientes datos para atender la petición completa.","n bytes, rellenando con ceros."],"e":["Una lectura nunca bloquea si hay datos.","No bloquea si hay datos.","No es error.","Eso ocurre con la tubería vacía y sin escritores.","No."]},{"s":"tub","c":"tubtipos","q":"¿Qué procesos pueden usar una tubería sin nombre?","o":["Solo los que descienden del proceso que la creó.","Cualquier proceso del sistema que conozca su descriptor.","Solo el que la creó.","Los que tengan el mismo uid que el creador, igual que con las señales.","Solo procesos de otra máquina."],"e":["Las tuberías con nombre las usan procesos independientes.","Eso es con nombre.","También sus descendientes.","No es la regla.","No."]},{"s":"tub","c":"tubtipos","q":"¿Cómo se construye una sección crítica con una tubería?","o":["Escribiendo un testigo al inicio; para entrar se lee y al salir se vuelve a escribir.","Escribiendo para entrar y leyendo para salir.","No se puede, porque las operaciones sobre una tubería no son atómicas.","Abriendo y cerrando la tubería en cada acceso para que solo un proceso la tenga abierta.","Con dos tuberías."],"e":["Si la tubería está vacía, los demás se bloquean al leer.","Es al revés.","Sí se puede.","No es la técnica.","Basta una."]},{"s":"msg","c":"msgpq","q":"¿Por qué hace falta el paso de mensajes si ya existen semáforos y monitores?","o":["Porque estos necesitan memoria común y no sirven con CPU de memoria privada en red.","Porque los semáforos usan espera ocupada.","Porque los monitores no garantizan exclusión mutua.","Porque el paso de mensajes es más rápido que cualquier otro mecanismo en un solo ordenador.","Porque las tuberías no existen en Unix."],"e":["Es la razón de los apuntes.","No es la razón.","Sí la garantizan.","No es la razón.","Sí existen."]},{"s":"msg","c":"msgpq","q":"¿Se puede usar el paso de mensajes para sincronizar y comunicar procesos?","o":["Sí: el mensaje lleva información y RECEIVE bloquea hasta que llega.","Solo para comunicar, porque SEND y RECEIVE nunca bloquean al proceso.","Solo para sincronizar.","No, porque necesita memoria compartida para guardar el mensaje mientras viaja.","Solo en un único ordenador."],"e":["Pregunta de la Sesión 8.","RECEIVE también sincroniza.","También transporta datos.","No la necesita.","Sirve en entornos distribuidos."]},{"s":"msg","c":"msgdis","q":"¿Cómo se envía un mensaje en la designación indirecta?","o":["A través de buzones.","Indicando el proceso receptor.","Por memoria compartida.","Pasando un puntero al mensaje entre los espacios de direcciones de los dos procesos.","Con una señal."],"e":["En la directa se indica explícitamente el proceso.","Eso es la designación directa.","No es la designación.","Eso es el paso por referencia.","No."]},{"s":"msg","c":"msgdis","q":"¿Cómo se distingue un mensaje nuevo de uno retransmitido?","o":["Con números de secuencia en cada mensaje original.","Con buzones distintos para los mensajes nuevos y los retransmitidos.","Por su longitud.","Con la llave de autentificación, que cambia en cada retransmisión.","No se puede distinguir."],"e":["Si se pierde el reconocimiento, el receptor recibe el mensaje dos veces.","No sirven para eso.","No.","No es lo descrito.","Sí, con números de secuencia."]},{"s":"msg","c":"msgpc","q":"En el productor-consumidor con mensajes, ¿qué hace el consumidor al empezar?","o":["Envía N mensajes vacíos, que simulan un búfer de N elementos.","Espera un mensaje lleno.","Envía un mensaje lleno.","Crea un buzón compartido de N elementos y espera a que el productor lo llene completamente.","Nada: espera a que el productor le envíe el primer mensaje lleno."],"e":["El productor toma un mensaje vacío y lo devuelve lleno.","Antes envía los N vacíos.","Envía vacíos.","No es la solución.","Envía los N mensajes."]},{"s":"msg","c":"msgpc","q":"¿Cuál NO es un inconveniente del paso de mensajes según los apuntes?","o":["Que necesita memoria compartida entre las máquinas.","Que el paso de parámetros por dirección es difícil.","La conversión a un formato de red estándar.","La semántica del fallo.","El tiempo gastado en convertir formatos entre arquitecturas distintas."],"e":["Sí es la respuesta: precisamente funciona sin memoria común.","Sí es un inconveniente.","Sí es un inconveniente.","Sí es un inconveniente.","Sí es un inconveniente."]},{"s":"msg","c":"memcomp","q":"¿Qué limitación tiene la memoria compartida como mecanismo de comunicación?","o":["Solo comunica procesos que se ejecutan en el mismo ordenador.","Solo sirve entre dos procesos.","Necesita una red para comunicar los procesos.","No se puede acceder a ella como a un vector, sino solo mediante llamadas de lectura y escritura.","Solo la puede crear el superusuario."],"e":["Es un segmento asignado a los procesos que lo comparten.","Pueden compartirla varios.","Es local.","Se accede como a un vector unidimensional.","No es lo que dicen."]},{"s":"msg","c":"memcomp","q":"¿Qué afirmación sobre la memoria compartida es correcta?","o":["Forma parte de la imagen de memoria de cada proceso que la usa.","Pertenece solo al proceso que la crea.","Sirve para sincronizar procesos igual que un semáforo.","La crea automáticamente el SO para todos los procesos al arrancar el sistema.","Se usa entre ordenadores distintos."],"e":["En Unix, uno de los procesos debe crearla.","La comparten todos.","Solo comunica.","La crea uno de los procesos.","Solo en el mismo ordenador."]}]},"3":{"n":3,"nombre":"Procesos e hilos","secs":{"info":["Tablas del SO y descriptor de proceso (BCP)","Unidad 3 §3.1–3.2.1 y Sesión 9"],"img":["Imagen de memoria de los procesos","Unidad 3 §3.2.2 y Sesión 9"],"est":["Estados y transiciones","Unidad 3 §3.2.3"],"crea":["Creación, destrucción y entorno de un proceso","Unidad 3 §3.2.4 y Sesión 9"],"ctx":["Cambio de proceso, cambio de contexto y activación","Unidad 3 §3.2.5–3.2.6 y Sesión 9"],"hil":["Hilos y modelos multihilo","Unidad 3 §3.3"],"posix":["Hilos en POSIX","Documento «Hilos en POSIX»"],"niv":["Niveles y criterios de planificación","Unidad 3 §3.4.1–3.4.3 y Sesión 10"],"clas":["Algoritmos clásicos: Round Robin, prioridades y MLFQ","Unidad 3 §3.4.4.1 y Sesión 10"],"real":["Planificadores actuales: Linux, Android, Windows, macOS y FreeBSD","Unidad 3 §3.4.4.2–3.4.4.6"]},"qs":[{"s":"info","c":"tablas","q":"¿En qué cuatro categorías organiza el SO las tablas con la información de las entidades que administra?","o":["Memoria, E/S, archivos y procesos.","Procesos, hilos, señales y semáforos.","Memoria principal, caché, registros y disco, siguiendo los niveles de la jerarquía de memoria.","Usuarios, grupos, permisos y archivos, igual que en el control de acceso de Unix.","CPU, memoria, red y energía."],"e":["Están relacionadas porque cada proceso tiene elementos de cada categoría.","No son las categorías de las tablas de control.","Son niveles de memoria, no categorías de tablas.","No son las categorías de los apuntes.","No son las categorías de los apuntes."]},{"s":"info","c":"tablas","q":"¿Qué información contienen las tablas de E/S?","o":["A qué proceso está asignado cada dispositivo, el estado de la operación y la memoria origen o destino.","Los archivos existentes y su posición en la memoria secundaria.","La asignación de memoria principal y secundaria a los procesos y sus atributos de protección.","Toda la información necesaria para administrar los procesos, incluido el dispositivo que espera cada uno y su prioridad.","Las prioridades de cada hilo y el quantum que le queda en el planificador a corto plazo."],"e":["Sirven para administrar dispositivos y canales de E/S.","Eso son las tablas de archivos.","Eso son las tablas de memoria.","Eso son las tablas de procesos.","No es su contenido."]},{"s":"info","c":"bcp","q":"¿Cuáles son las tres partes del bloque de control de proceso (BCP)?","o":["Identificación, estado del procesador e información de control.","Código, datos y pila.","Cabecera, código y datos inicializados y sin inicializar, tal como vienen del ejecutable.","Tabla de memoria, tabla de E/S y tabla de archivos del proceso, enlazadas entre sí.","PID, prioridad y quantum."],"e":["Es el descriptor de proceso de los apuntes.","Eso es la imagen de memoria.","Eso es la estructura del archivo ejecutable.","Son tablas del SO, no partes del BCP.","Son datos sueltos, no las tres partes."]},{"s":"info","c":"bcp","q":"¿En qué parte del BCP se guarda el contador de programa?","o":["En el estado del procesador.","En la información de identificación, porque identifica en qué punto del programa está el proceso.","En la información de control, junto con la prioridad y el evento que espera el proceso.","En la pila.","En la tabla de archivos."],"e":["Junto con los registros generales, el puntero de pila y el registro de estado.","La identificación guarda PID, PID del padre, uid y grupo.","Ahí van la planificación, la memoria y los recursos.","La pila es parte de la imagen de memoria.","No tiene relación."]},{"s":"info","c":"entvol","q":"¿Qué es el entorno volátil de un proceso?","o":["La información del estado del procesador que hay que preservar para poder continuar su ejecución.","Los parámetros con que se lanzó el proceso desde la línea de órdenes.","Las variables de entorno que heredan todos los procesos del sistema.","Los datos dinámicos que el proceso crea y destruye en tiempo de ejecución.","La parte de la memoria caché que pertenece al proceso y que se pierde cuando este deja la CPU."],"e":["Es el contenido de todos los registros.","Eso es el entorno local.","Eso es el entorno global.","Forman parte de la imagen de memoria.","No es la definición: el entorno volátil es el estado del procesador."]},{"s":"info","c":"entvol","q":"¿En qué parte del BCP se guarda la prioridad del proceso?","o":["En la información de control del proceso.","En el estado del procesador, junto con los registros generales.","En la información de identificación.","En el entorno volátil, porque cambia cada vez que el proceso pierde la CPU.","En la cabecera del ejecutable."],"e":["Junto al estado, el evento que espera y la información de planificación.","Ahí van los registros.","Ahí van PID, PID del padre, uid y grupo.","El entorno volátil es el estado del procesador.","No es parte del BCP."]},{"s":"info","c":"colas","q":"¿Cómo se agrupan los BCP de los procesos?","o":["En colas asociadas a los posibles sucesos.","En una única lista ordenada por PID.","En la tabla de páginas.","En un árbol que refleja la relación padre-hijo entre los procesos del sistema.","En la pila del SO, ordenados por el momento en que se crearon."],"e":["Una cola de preparados y otras para los sucesos que esperan los bloqueados.","Se agrupan en colas por suceso.","No tiene relación.","No es lo que describen los apuntes.","No es así."]},{"s":"info","c":"colas","q":"¿Cuántas colas puede tener el estado Bloqueado?","o":["Varias, una por cada tipo de suceso que se espera.","Exactamente una, igual que el estado Preparado.","Ninguna: los procesos bloqueados no se encolan.","Dos: una para E/S y otra para todos los demás sucesos.","Una por procesador, donde esperan los procesos que se ejecutarán en él."],"e":["Hay una cola por estado, y Bloqueado puede tener varias.","Puede tener varias.","Sí se encolan.","Puede tener tantas como tipos de suceso.","No es el criterio."]},{"s":"img","c":"ejecutable","q":"¿Qué contiene la cabecera de un archivo ejecutable?","o":["El estado inicial de los registros, el tamaño del código y de los datos y una palabra mágica.","El código del programa y la pila inicial.","El PID y el PID del padre, junto con el identificador de usuario que lanzó el programa.","Los datos dinámicos que el programa creará durante su ejecución.","La tabla de páginas del proceso."],"e":["La palabra mágica identifica el archivo como ejecutable.","El código va aparte; la pila se crea al ejecutar.","Se asignan al crear el proceso.","Se crean en tiempo de ejecución.","No forma parte del ejecutable."]},{"s":"img","c":"ejecutable","q":"¿De dónde se obtienen los valores de los datos inicializados de un proceso?","o":["Del archivo ejecutable: su valor se fija al compilar.","Los rellena el SO con valores predefinidos al crear el proceso.","Del entorno global del intérprete de órdenes.","De la pila, al llamar al primer procedimiento del programa.","Del BCP."],"e":["Son datos estáticos.","Eso puede pasar con los datos sin valor inicial.","No es su origen.","La pila guarda bloques de activación.","No es su origen."]},{"s":"img","c":"pila","q":"¿Qué es la pila de un proceso?","o":["Una estructura dinámica de su imagen de memoria que guarda los bloques de activación de los procedimientos.","La parte del BCP donde se guardan los registros cuando el proceso pierde la CPU.","Una cola del SO donde esperan los procesos bloqueados.","El segmento de código del programa.","La lista de procesos preparados que el planificador a corto plazo recorre para elegir el siguiente proceso."],"e":["Pregunta de la Sesión 9.","Eso es el estado del procesador del BCP.","Eso son las colas de sucesos.","El código es otra parte de la imagen.","No es la definición."]},{"s":"img","c":"pila","q":"¿De qué está formada la imagen de un proceso?","o":["De su imagen de memoria (código, datos y pila) y de sus atributos.","Solo del código del programa y de la cabecera del ejecutable.","Del archivo ejecutable completo, con su cabecera, tal como está guardado en el disco.","Del BCP y de las tablas de E/S y de archivos que tenga abiertas.","De la pila y del entorno global."],"e":["Los atributos son las estructuras internas como el contador de programa.","Incluye datos, pila y atributos.","El proceso obtiene información del ejecutable, pero no es lo mismo.","No es la definición.","No es la definición."]},{"s":"img","c":"modimg","q":"¿Qué modelo de imagen de memoria usaban las primeras versiones de Unix?","o":["Número fijo de segmentos (código, datos y pila) de tamaño variable.","Un único segmento de tamaño fijo.","Número variable de segmentos de tamaño variable.","Un segmento por procedimiento, creado y destruido cada vez que se llama a la función.","Páginas de tamaño fijo cargadas por demanda desde el ejecutable del disco."],"e":["Datos y pila crecen en sentido opuesto.","Es el modelo de los sistemas sin memoria virtual.","Es el de los SO modernos como Windows NT.","No es un modelo de los apuntes.","No es el modelo descrito."]},{"s":"img","c":"modimg","q":"En el modelo con número fijo de segmentos de tamaño variable, ¿cómo crecen los datos y la pila?","o":["En sentido opuesto, y el espacio de crecimiento lo gestiona el proceso.","En el mismo sentido, uno a continuación del otro.","No crecen: su tamaño se fija al compilar.","Cada uno en su propio segmento independiente, que el SO amplía cuando se llena.","Solo crece la pila, porque el tamaño de los datos se fija al compilar."],"e":["Es lo que muestra la figura 3-4 de los apuntes.","Crecen en sentido opuesto.","Precisamente pueden variar.","Eso se parece al modelo de segmentos variables.","También los datos dinámicos."]},{"s":"est","c":"estados","q":"¿Cuándo está un proceso en estado Preparado (Listo)?","o":["Cuando está en memoria principal, sin E/S pendientes y esperando que el SO le dé la CPU.","Cuando tiene el control de la CPU.","Cuando espera que termine una operación de E/S.","Cuando pretende iniciar su ejecución pero todavía no ha sido admitido por el planificador.","Cuando ha finalizado y espera que el SO libere su BCP y su memoria."],"e":["Obtendrá la CPU cuando lo indique el SO.","Eso es Ejecución.","Eso es Bloqueado.","Eso es Nuevo.","Eso es Terminado."]},{"s":"est","c":"estados","q":"¿Cuál NO es uno de los cinco estados básicos de un proceso?","o":["Suspendido-Ejecución.","Nuevo.","Bloqueado.","Terminado.","Preparado."],"e":["Sí es la respuesta: los básicos son Nuevo, Preparado, Ejecución, Bloqueado y Terminado.","Sí es un estado básico.","Sí es un estado básico.","Sí es un estado básico.","Sí es un estado básico."]},{"s":"est","c":"trans","q":"¿Qué transición lleva un proceso de Preparado a Ejecución?","o":["Planificar (o Expedir).","Admitir.","Finalizar plazo.","Ocurrir un suceso, porque el suceso que espera el proceso es precisamente la CPU.","Activar."],"e":["Se produce cuando se le asigna la CPU.","Lleva de Nuevo a Preparado.","Lleva de Ejecución a Preparado.","Lleva de Bloqueado a Preparado.","Saca de un estado suspendido."]},{"s":"est","c":"trans","q":"Un proceso agota su fracción de tiempo. ¿Qué transición se produce?","o":["Finalizar plazo (o Replanificar): pasa de Ejecución a Preparado.","Esperar un suceso: pasa a Bloqueado.","Terminar, porque el proceso ha consumido todo el tiempo de CPU que tenía permitido.","Suspender: pasa a Preparado-suspendido y sale de memoria principal hasta su próximo turno.","Planificar."],"e":["Volverá a planificarse.","No espera ningún suceso.","No ha terminado.","No es lo que provoca agotar el plazo.","Es la transición contraria."]},{"s":"est","c":"transbloq","q":"¿Qué transición produce un wait sobre un semáforo que vale 0?","o":["Esperar un suceso: el proceso pasa de Ejecución a Bloqueado.","Finalizar plazo.","Ocurrir un suceso.","Planificar, porque el SO tiene que elegir otro proceso para la CPU.","Terminar, porque un wait sin éxito se trata como un error del proceso."],"e":["Igual que pedir una E/S o recibir un mensaje.","No ha agotado su plazo.","Esa la provoca el signal correspondiente.","La transición del proceso es a Bloqueado.","No termina."]},{"s":"est","c":"transbloq","q":"Ocurre el suceso que esperaba un proceso bloqueado. ¿A qué estado pasa?","o":["A Preparado; después tendrá que ser planificado.","Directamente a Ejecución.","A Nuevo.","A Terminado, porque ya ha obtenido lo que necesitaba para acabar su trabajo.","Se queda en Bloqueado hasta su siguiente quantum."],"e":["Es la transición Ocurrir un suceso.","Pasa a Preparado.","No vuelve a Nuevo.","No es así.","Sale de Bloqueado."]},{"s":"est","c":"terminado","q":"¿Puede un proceso pasar a Terminado desde Bloqueado o desde Preparado?","o":["Sí, en algunos sistemas, por ejemplo si su padre le envía una señal de finalización.","No, solo desde Ejecución.","Solo desde Bloqueado, cuando el suceso que esperaba ya no va a producirse.","Solo si el proceso tiene la máxima prioridad y no hay otros procesos preparados.","Solo en monoprogramación."],"e":["No aparece en la figura básica, pero los apuntes lo indican.","Los apuntes admiten estos casos.","También desde Preparado.","No es la condición.","No es la condición."]},{"s":"est","c":"terminado","q":"¿Qué transición lleva un proceso de Nuevo a Preparado?","o":["Admitir.","Planificar.","Activar.","Ocurrir un suceso, porque la creación del proceso es el suceso que este esperaba.","Expedir."],"e":["Se produce cuando el proceso es admitido para su ejecución.","Lleva de Preparado a Ejecución.","Lleva desde los estados suspendidos.","Lleva de Bloqueado a Preparado.","Es otro nombre de Planificar."]},{"s":"crea","c":"creapasos","q":"¿Cuál es el primer paso que da el SO para crear un proceso?","o":["Asignarle un PID, lo que añade un nuevo BCP a la tabla de procesos.","Inicializar el BCP con el contador de programa y el estado Preparado.","Asignar espacio para la imagen.","Añadirlo a la cola de preparados para que el planificador lo tenga en cuenta.","Crear los archivos de contabilidad."],"e":["Después asigna espacio, inicializa el BCP y establece los enlaces.","Es el tercer paso.","Es el segundo paso.","Es el cuarto paso: establecer enlaces.","Es el último paso, si procede."]},{"s":"crea","c":"creapasos","q":"Al inicializar el BCP de un proceso nuevo, ¿con qué estado suele quedar?","o":["Preparado, o Preparado y suspendido.","Ejecución.","Bloqueado, hasta que el planificador a largo plazo lo admita.","Nuevo, hasta que el despachador copie su entorno volátil en los registros por primera vez.","Terminado."],"e":["Y el contador de programa con el punto de entrada del programa.","Aún no se le ha asignado la CPU.","No es lo que dicen los apuntes.","Los apuntes indican Preparado o Preparado y suspendido.","No."]},{"s":"crea","c":"motivos","q":"¿Cuál de estos es un motivo de creación de un proceso según los apuntes?","o":["Lo genera un proceso existente, como el intérprete de órdenes.","Un error de protección al acceder a una zona de memoria de otro proceso.","La finalización del proceso padre.","Que el proceso supere su tiempo máximo de espera por un suceso que nunca llega.","Una instrucción privilegiada."],"e":["También: trabajo por lotes, conexión interactiva o servicio del SO.","Es un motivo de finalización.","Es un motivo de finalización.", lo (estilo N:1).","Hilos del núcleo planificados por Windows.","El modelo M:N de Windows.","Procesos ligeros que comparten el BCP de su padre y se planifican igual que él.","Las bibliotecas de hilos de Android, como Bionic, que asocian cada hilo a una tarea."],"e":["Windows es 1:1, pero ofrece fibras.","Esos son los hilos normales.","Ese era User-Mode Scheduling.","No es su definición.","No."]},{"s":"hil","c":"fibras","q":"¿Qué afirmación sobre macOS y los hilos es correcta?","o":["Cada pthread se corresponde con un hilo de Mach y Grand Central Dispatch sigue siendo 1:1.","Usa el modelo N:1 con Grand Central Dispatch.","Usa la biblioteca NPTL.","Implementa un modelo M:N mediante activaciones del planificador heredadas de FreeBSD.","No tiene hilos propios: usa los procesos de Mach y reparte el trabajo con Grand Central Dispatch."],"e":["GCD reparte tareas sobre un conjunto de hilos 1:1.","Los hilos siguen siendo 1:1.","Esa es de Linux.","Es 1:1.","Sí tiene."]},{"s":"posix","c":"pcreate","q":"En POSIX, ¿qué función hace que un hilo espere a que termine otro?","o":["<code>pthread_join</code>.","<code>pthread_exit</code>.","<code>pthread_create</code>.","<code>pthread_mutex_lock</code>, que bloquea al hilo hasta que el otro libere su mutex al terminar.","<code>pthread_wait</code>."],"e":["<code>pthread_create</code> crea el hilo y <code>pthread_exit</code> lo termina.","Termina el hilo que la llama.","Crea el hilo.","Sirve para la exclusión mutua.","No aparece en el documento."]},{"s":"posix","c":"pcreate","q":"En el primer ejemplo del documento, main crea un hilo con <code>pthread_create</code> pero no llama a <code>pthread_join</code>. ¿Qué ocurre?","o":["main sigue ejecutándose, termina y el hilo hijo no llega a ejecutarse correctamente.","main se bloquea automáticamente hasta que el hilo termina, como si hubiera llamado a pthread_join.","El hilo hijo se ejecuta siempre entero antes de que main continúe.","El programa no compila, porque cada pthread_create debe ir acompañado de su pthread_join.","Se crea un proceso hijo en lugar de un hilo."],"e":["Por eso hace falta que un hilo espere a otro con pthread_join.","Sin pthread_join no espera.","No está garantizado.","Compila; el problema es de ejecución.","pthread_create crea hilos."]},{"s":"posix","c":"pmutex","q":"¿Qué funciones usa el documento para la exclusión mutua entre hilos?","o":["<code>pthread_mutex_init</code>, <code>pthread_mutex_lock</code> y <code>pthread_mutex_unlock</code>.","<code>pthread_create</code> y <code>pthread_join</code>.","WAIT y SIGNAL sobre un semáforo binario creado con pthread_create.","<code>pthread_exit</code> y <code>pthread_join</code>, porque solo un hilo puede terminar cada vez.","<code>sigaction</code> y <code>kill</code>."],"e":["Al final se libera con pthread_mutex_destroy.","Crean y esperan hilos.","Son operaciones de semáforos de la Unidad 2.","No implementan exclusión mutua.","Son de señales."]},{"s":"posix","c":"pmutex","q":"En el ejemplo de la suma, ¿por qué operando1, operando2 y suma se declaran fuera de main, como variables globales?","o":["Para que las compartan todos los hilos del proceso; las locales están en la pila de cada hilo.","Porque las variables globales no necesitan exclusión mutua.","Porque en C no se pueden declarar variables dentro de main.","Porque así cada hilo recibe una copia privada de las variables que no ven los demás hilos.","Porque pthread_create solo admite variables globales como argumentos."],"e":["Los hilos comparten el espacio de direcciones del proceso.","Precisamente por ser compartidas hace falta el mutex.","Sí se puede.","Es al revés: son compartidas.","No es la razón."]},{"s":"niv","c":"niveles","q":"¿Qué controla el planificador a largo plazo?","o":["El grado de multiprogramación, decidiendo qué trabajos se admiten.","Qué proceso se ejecuta en cada instante.","Qué procesos salen temporalmente de memoria.","El número de procesadores que puede usar cada proceso en un sistema multiprocesador.","La prioridad de cada hilo y el quantum que le corresponde."],"e":["El grado de multiprogramación es el número de procesos en memoria principal.","Eso es el planificador a corto plazo.","Eso es el planificador a medio plazo.","No es su función.","No es su función."]},{"s":"niv","c":"niveles","q":"¿Qué planificador realiza el intercambio (swapping)?","o":["El de medio plazo.","El de largo plazo.","El de corto plazo.","El despachador, al copiar el entorno volátil del proceso en los registros de la CPU.","El balance set manager."],"e":["Saca procesos de memoria y decide cuándo vuelven.","Admite trabajos.","Elige el proceso que se ejecuta.","No es su función.","Es de Windows y sirve contra la inanición."]},{"s":"niv","c":"corto","q":"¿Qué diferencia principal hay entre los planificadores a largo y a corto plazo?","o":["La frecuencia: el de corto plazo se ejecuta cada pocos milisegundos y el de largo plazo mucho menos.","El de largo plazo se ejecuta más a menudo.","El de corto plazo decide qué trabajos se admiten en el sistema.","El de largo plazo solo existe en sistemas de tiempo compartido con usuarios interactivos.","No hay diferencia: los dos se ejecutan en cada cambio de proceso."],"e":["Pueden pasar minutos hasta la llegada de nuevos trabajos.","Es al revés.","Eso es el de largo plazo.","En tiempo compartido puede estar ausente o ser mínimo.","Sí la hay."]},{"s":"niv","c":"corto","q":"En un sistema de tiempo compartido, ¿esperan los procesos interactivos en la cola del planificador a largo plazo?","o":["No: a los usuarios no se les puede hacer esperar a que el sistema los acepte.","Sí, igual que los trabajos por lotes.","Sí, hasta que se libere un procesador.","Solo si su prioridad es menor que la de los trabajos por lotes que ya están en memoria.","Solo en multiprocesadores, donde hay que repartir los procesos interactivos entre las CPU."],"e":["En esos sistemas el de largo plazo puede ser mínimo.","No esperan en cola.","No es así.","No es la regla.","No depende de eso."]},{"s":"niv","c":"susp","q":"¿Qué estados añade el planificador a medio plazo?","o":["Preparado-suspendido y Bloqueado-suspendido.","Nuevo y Terminado.","Ejecución-suspendido.","Preparado-bloqueado y Ejecución-bloqueado, para los procesos que esperan en memoria secundaria.","Zombi y huérfano, para los procesos sin padre."],"e":["Aparecen con el intercambio.","Son estados básicos.","No existe.","No son los estados de los apuntes.","No son estados de los apuntes."]},{"s":"niv","c":"susp","q":"Un proceso Bloqueado-suspendido recibe el suceso que esperaba. ¿A qué estado pasa?","o":["A Preparado-suspendido.","A Preparado, directamente.","A Ejecución.","A Bloqueado, porque primero tiene que volver a memoria principal antes de dejar de esperar.","A Terminado."],"e":["Sigue fuera de memoria, pero ya no espera nada.","Para eso haría falta además activarlo.","No directamente.","Pasa a Preparado-suspendido.","No."]},{"s":"niv","c":"criterios","q":"¿Para qué tipo de procesos se usa el tiempo de respuesta?","o":["Para los interactivos: desde que se pide la ejecución hasta que se empieza a recibir la respuesta.","Para los trabajos por lotes.","Para los procesos de tiempo real, que deben terminar antes de un plazo.","Para todos por igual, sumando el tiempo de espera de cada proceso en la cola de preparados.","Para los procesos del núcleo."],"e":["Debe ser bajo.","Para ellos se usa el tiempo de retorno.","Ese criterio es el de plazos.","No es la definición.","No es la clasificación."]},{"s":"niv","c":"criterios","q":"¿Qué incluye el tiempo de retorno?","o":["El tiempo de ejecución real y el de espera de recursos, incluida la CPU.","Solo el tiempo de CPU.","El tiempo hasta la primera respuesta.","Solo el tiempo que el proceso pasa bloqueado esperando que terminen sus operaciones de E/S.","El quantum de cada proceso."],"e":["Va desde el inicio hasta el fin; se usa con lotes.","Incluye también las esperas.","Eso es el tiempo de respuesta.","Incluye todo el intervalo.","No."]},{"s":"niv","c":"critsist","q":"¿Cuál de estos criterios de planificación está orientado al sistema?","o":["La productividad.","El tiempo de respuesta.","La previsibilidad.","El tiempo de retorno, porque depende de la carga total del sistema y no del usuario.","Los plazos."],"e":["También la utilización del procesador, la equidad, las prioridades y los recursos equilibrados.","Está orientado al usuario.","Está orientado al usuario.","Está orientado al usuario.","Están orientados al usuario."]},{"s":"niv","c":"critsist","q":"¿Qué exige el criterio de equidad?","o":["Que los procesos se traten por igual y ninguno sufra inanición.","Que cada proceso reciba siempre el mismo quantum, sin importar su prioridad.","Que se favorezca a los de mayor prioridad.","Que el mismo proceso tarde lo mismo sea cual sea la carga del sistema en cada ejecución.","Mantener ocupados los recursos."],"e":["Vale en ausencia de directrices del usuario o del sistema.","No es la definición.","Ese es el criterio de prioridades.","Esa es la previsibilidad.","Esos son los recursos equilibrados."]},{"s":"niv","c":"aprop","q":"¿Qué tipo de planificación se usa más en los SO actuales?","o":["La apropiativa.","La no apropiativa.","La no apropiativa en móviles y la apropiativa en escritorio.","Ninguna de las dos: los SO actuales dejan que cada proceso decida cuándo ceder la CPU.","Solo la de prioridades fijas."],"e":["Pregunta de la Sesión 10: todos los planificadores actuales de la unidad expulsan procesos.","Los SO interactivos actuales necesitan expulsar procesos.","Android también es apropiativo.","Eso sería no apropiativa.","No es la respuesta."]},{"s":"niv","c":"aprop","q":"¿Qué es una planificación no apropiativa?","o":["Una vez asignada la CPU, no se quita al proceso salvo que termine o pida una E/S.","Al proceso se le puede quitar la CPU en cualquier momento.","Solo se quita la CPU al agotar el quantum.","La CPU se reparte en fracciones iguales entre todos los procesos que están preparados.","La que usa prioridades dinámicas para que los procesos largos no retrasen a los cortos."],"e":["No le afectan las interrupciones.","Eso es la apropiativa.","Eso es apropiativa.","Eso es Round Robin, que es apropiativo.","No es la definición."]},{"s":"niv","c":"noaprop","q":"¿Cuál es el inconveniente de la planificación no apropiativa?","o":["Que los procesos largos retrasan a los cortos.","Que cada cambio de proceso tiene un coste extra.","Que requiere muchos procesos en memoria.","Que los procesos nuevos de alta prioridad desplazan continuamente a los que ya estaban esperando.","Que no sirve en sistemas por lotes."],"e":["A cambio, el trato es más justo y los tiempos de retorno más predecibles.","Eso es de la apropiativa.","Eso es de la apropiativa.","Eso no ocurre en la no apropiativa.","No es lo que dicen."]},{"s":"niv","c":"noaprop","q":"¿Qué coste tiene la planificación apropiativa?","o":["Cada cambio de proceso supone un gasto extra.","Los procesos largos retrasan a los cortos.","Pierde los tiempos de retorno predecibles de la no apropiativa, que es su única desventaja.","No permite tiempo real.","Impide usar prioridades."],"e":["Para que compense, debe haber muchos procesos en memoria.","Eso es de la no apropiativa.","Su coste principal es el del cambio de proceso.","Es útil para tiempo real.","No."]},{"s":"clas","c":"quantum","q":"¿Qué es el intervalo de tiempo o quantum?","o":["La fracción de tiempo de CPU que se asigna a un proceso en Round Robin.","El tiempo total que necesita un proceso para terminar.","El tiempo que dura un cambio de proceso.","El tiempo que un proceso pasa bloqueado esperando que termine una operación de E/S.","La prioridad de un proceso, que determina cuántas fracciones de CPU recibe en cada vuelta."],"e":["Pregunta de la Sesión 10.","No es la definición.","Es la sobrecarga del SO.","No es la definición.","No."]},{"s":"clas","c":"quantum","q":"En Round Robin con N procesos preparados, ¿qué parte de la CPU recibe cada uno?","o":["1/N.","N.","1/(N − 1).","Una parte proporcional a su prioridad, porque los procesos importantes reciben más fracciones.","Todo el tiempo hasta terminar."],"e":["Los procesos forman una cola circular.","No es una fracción.","No es el reparto.","Eso no es Round Robin.","Eso sería no apropiativo."]},{"s":"clas","c":"qcalc","q":"En Round Robin, el quantum es de 20 ms y un cambio de proceso cuesta 5 ms. ¿Qué porcentaje de CPU gasta el SO?","o":["20 %.","25 %.","5 %.","75 %, porque los procesos solo usan la CPU en los 5 ms que no son de gestión.","Menos del 1 %."],"e":["5 / (20 + 5) = 20 %.","Resulta de dividir 5 entre 20, olvidando que el ciclo dura 25 ms.","No es el cálculo.","Es al revés.","Es el caso con quantum de 500 ms."]},{"s":"clas","c":"qcalc","q":"Con un quantum de 45 ms y un cambio de proceso de 5 ms, ¿qué porcentaje de CPU gasta el SO?","o":["10 %.","11,1 %.","20 %.","90 %, que es el tiempo de cada ciclo que el SO dedica a planificar.","5 %."],"e":["5 / (45 + 5) = 10 %.","Resulta de dividir 5 entre 45.","Es el caso de 20 ms de quantum.","El 90 % lo usan los procesos.","No es el cálculo."]},{"s":"clas","c":"qtam","q":"¿Qué pasa si el quantum es demasiado grande?","o":["La respuesta a los usuarios interactivos es mala.","Se pierde mucha eficiencia en cambios de proceso.","Aumenta la sobrecarga del SO.","Los procesos cortos responden antes, porque terminan en una sola fracción sin ser expulsados.","Nada, porque los procesos cortos terminan igual en una sola fracción."],"e":["Con 500 ms y 10 procesos, el último espera unos 5 s.","Eso ocurre con quantum pequeño.","Disminuye.","El problema es la espera de los demás.","Empeora la respuesta."]},{"s":"clas","c":"qtam","q":"¿Qué valor de compromiso para el quantum dan los apuntes?","o":["Entre 2 y 20 ms.","Entre 100 y 500 ms.","Exactamente 5 ms.","El mismo que dura el cambio de proceso, para que la sobrecarga sea siempre del 50 %.","Entre 1 y 2 s."],"e":["No existe un valor ideal.","Daría mala respuesta interactiva.","No es el dato.","No es el compromiso.","Demasiado grande."]},{"s":"clas","c":"prio","q":"¿Qué problema tienen las prioridades fijas?","o":["La inanición: un proceso puede esperar indefinidamente si siguen llegando otros de mayor prioridad.","El interbloqueo entre los procesos de prioridad más alta, que retienen recursos sin liberarlos.","La fragmentación.","Que los procesos de mayor prioridad nunca llegan a ejecutarse si hay muchos de menor prioridad.","Que gastan mucha memoria."],"e":["Se evita con envejecimiento.","No es el problema descrito.","No tiene relación.","Es al revés.","No es el problema."]},{"s":"clas","c":"prio","q":"¿Qué hace el envejecimiento (aging) en la planificación por prioridades?","o":["Decrementa la prioridad del proceso en ejecución.","Aumenta la prioridad del proceso en ejecución.","Elimina los procesos más antiguos.","Asigna más quantum a los procesos que llevan más tiempo en el sistema para que terminen antes.","Fija las prioridades para siempre."],"e":["Así los de alta prioridad no se ejecutan indefinidamente.","La decrementa.","No.","No es lo que dicen los apuntes.","Las cambia."]},{"s":"clas","c":"priodin","q":"Con la prioridad dinámica 1/f, un proceso usa 2 ms de un plazo de 100 ms. ¿Qué prioridad recibe?","o":["50.","0,02.","2.","98, porque se le suma el tiempo de CPU que no ha usado.","1."],"e":["1 / (2/100) = 50.","Es f, no 1/f.","Es la prioridad si usa 50 ms.","No es el cálculo.","Es la prioridad si usa todo el quantum."]},{"s":"clas","c":"priodin","q":"Con la prioridad dinámica 1/f y plazos de 100 ms, un proceso usa 25 ms. ¿Qué prioridad recibe y qué procesos favorece esta regla?","o":["4; favorece a los que usan poca CPU.","4; favorece a los que usan mucha CPU.","25; favorece a los que usan poca CPU.","0,25; favorece a los procesos interactivos, que suelen agotar entero su quantum.","75; favorece a los largos."],"e":["1 / (25/100) = 4.","Cuanto menos CPU, mayor prioridad.","25 es el tiempo, no la prioridad.","0,25 es f y los interactivos usan poca CPU.","No es el cálculo."]},{"s":"clas","c":"mlfq","q":"¿Qué diferencia hay entre MLQ y MLFQ?","o":["En MLQ cada proceso tiene una cola fija; en MLFQ cambia de cola según su tiempo de ejecución.","En MLFQ cada proceso tiene una cola fija.","MLQ usa una sola cola.","En MLQ los procesos suben de cola al usar mucha CPU y en MLFQ bajan.","Son lo mismo: las dos siglas designan colas de distinta prioridad con procesos que cambian de cola."],"e":["MLFQ es la variante con realimentación.","Es al revés.","Usa varias.","En MLQ no cambian de cola.","No."]},{"s":"clas","c":"mlfq","q":"En MLFQ, ¿qué ocurre con un proceso que necesita más de un plazo para completarse?","o":["Pasa a una cola de menor prioridad.","Pasa a una cola de mayor prioridad.","Sale del sistema.","Se queda en la misma cola pero con un quantum más corto para no perjudicar a los demás.","Se bloquea hasta que terminen los procesos cortos."],"e":["Así se da preferencia a los procesos cortos.","Baja de cola.","Sale si termina en un plazo.","Baja de cola; en la variante, los niveles bajos tienen más plazos.","No."]},{"s":"clas","c":"familias","q":"¿Qué planificadores actuales pertenecen a la familia del reparto proporcional?","o":["Los de Linux y Android.","Los de Windows y FreeBSD.","Solo el de macOS.","Todos los de la unidad, porque todos reparten la CPU en proporción a la prioridad de cada hilo.","Ninguno."],"e":["Windows y FreeBSD son de colas multinivel con realimentación; macOS combina ambas.","Son de la familia MLFQ.","Combina ambas familias.","Hay dos familias.","Linux y Android lo son."]},{"s":"clas","c":"familias","q":"¿Desde cuándo tiene Windows la base de su planificador?","o":["Desde Windows NT 3.1, en 1993.","Desde Windows 11, en 2021.","Desde 2023, con EEVDF.","Desde Windows 10, cuando se añadió la compresión de memoria y el User-Mode Scheduling.","Desde 2003."],"e":["Es un planificador expulsivo basado en 32 prioridades.","Es mucho más antiguo.","EEVDF es de Linux.","No es la fecha de los apuntes.","Esa es la fecha de ULE en FreeBSD."]},{"s":"real","c":"eevdf","q":"¿Desde qué versión del kernel usa Linux EEVDF y a qué planificador sustituyó?","o":["Desde la 6.6 (2023), sustituyendo a CFS.","Desde la 2.6, sustituyendo a ULE.","Desde la 6.12, sustituyendo a sched_ext.","Desde la 6.1, sustituyendo a MGLRU, que pasó a encargarse solo de la memoria.","Desde Windows NT 3.1, adaptado de su planificador de prioridades."],"e":["CFS era el Completely Fair Scheduler.","ULE es de FreeBSD.","sched_ext es una extensión de 2024.","MGLRU es de gestión de memoria.","No es de Linux."]},{"s":"real","c":"eevdf","q":"En EEVDF, ¿qué es V?","o":["El tiempo virtual del sistema: la media de los vruntime de las tareas listas.","El tiempo de CPU que ha recibido una tarea.","El intervalo que pide cada tarea.","El plazo virtual de la tarea que se va a ejecutar a continuación en el procesador.","El valor nice medio de todas las tareas que están listas para ejecutarse."],"e":["Es lo que cada tarea debería llevar con un reparto perfecto.","Eso es el vruntime.","Es el intervalo solicitado.","El plazo es vruntime más el intervalo.","No."]},{"s":"real","c":"eleg","q":"En EEVDF, ¿cuándo es elegible una tarea?","o":["Cuando su vruntime es menor o igual que V.","Cuando su vruntime es mayor que V.","Cuando tiene el plazo más temprano.","Cuando su valor nice es negativo, porque eso indica que tiene más prioridad que las demás.","Siempre que esté lista."],"e":["No ha recibido más de lo que le corresponde.","Entonces ya ha recibido de más.","Eso decide cuál se ejecuta entre las elegibles.","No es la condición.","No."]},{"s":"real","c":"eleg","q":"En EEVDF, ¿cómo se calcula el plazo virtual de una tarea?","o":["vruntime + intervalo de ejecución solicitado.","V + intervalo solicitado.","vruntime − V.","vruntime multiplicado por el valor nice de la tarea, para que las prioritarias terminen antes.","Intervalo / vruntime."],"e":["Se ejecuta la elegible con el plazo más temprano.","Se usa el vruntime de la tarea.","No es el plazo.","No es la fórmula.","No."]},{"s":"real","c":"eevdfej","q":"En EEVDF, con V = 0,33, las tareas A y B tienen vruntime 0 y piden 3 ms, y C tiene vruntime 1 y pide 1 ms. ¿Cuál se ejecuta?","o":["A (o B), porque C no es elegible: su vruntime supera a V.","C, porque su plazo es el más temprano.","C, porque pide el intervalo más corto.","Ninguna, porque V es menor que 1 y el sistema espera a que se recalcule el tiempo virtual.","Las tres a la vez, una en cada núcleo disponible."],"e":["Es el paso 2 del ejemplo: primero se filtra y después se ordena.","C no es elegible.","Pedir trozos cortos no salta la elegibilidad.","A y B son elegibles.","No."]},{"s":"real","c":"eevdfej","q":"En EEVDF, con V = 1,33, B tiene vruntime 0 y pide 3 ms, y C tiene vruntime 1 y pide 1 ms. ¿Cuál se ejecuta?","o":["C: ambas son elegibles y su plazo (2) es anterior al de B (3).","B: tiene el vruntime más bajo.","B: su plazo es 3 y el de C es 1.","Ninguna, porque C ya se ejecutó en el paso anterior y no puede repetir de forma seguida.","A."],"e":["Es el paso 3 del ejemplo.","Entre elegibles se ordena por plazo.","El plazo de C es 1 + 1 = 2.","No hay tal regla.","A ya no está entre las candidatas del enunciado."]},{"s":"real","c":"nice","q":"¿Qué significa en Linux un valor nice de −20?","o":["La máxima prioridad.","La mínima prioridad.","Que la tarea está bloqueada.","Que la tarea pide intervalos de 20 ms, lo que adelanta su plazo virtual.","Que no es elegible."],"e":["El rango va de −20 (máxima) a +19 (mínima).","Esa es +19.","No.","No es su significado.","No."]},{"s":"real","c":"nice","q":"En EEVDF, ¿pedir intervalos de ejecución cortos da más CPU en total a una tarea?","o":["No, solo hace que se atienda más a menudo.","Sí, porque su plazo virtual es siempre el más temprano.","Sí, el doble.","Sí, porque su vruntime avanza más despacio que el de las tareas que piden intervalos largos.","No, pierde toda la CPU."],"e":["La elegibilidad mantiene el reparto justo.","Si ya ha recibido de más, no es elegible.","No.","Lo que hace avanzar más despacio el vruntime es la prioridad.","No."]},{"s":"real","c":"eas","q":"En Android, ¿qué decide EAS y qué decide EEVDF?","o":["EAS decide en qué núcleo se ejecuta la tarea; EEVDF, qué tarea se ejecuta en cada núcleo y cuándo.","EAS decide el orden y EEVDF el núcleo.","Los dos deciden el núcleo, y el orden se resuelve por Round Robin entre las tareas de cada núcleo.","EAS sustituye a EEVDF en los móviles para ahorrar batería en todas las decisiones.","EEVDF decide la frecuencia del procesador."],"e":["EAS actúa una vez por cada despertar.","Es al revés.","No.","Trabajan juntos.","No es su papel."]},{"s":"real","c":"eas","q":"¿Cuándo deja EAS de buscar el ahorro de energía?","o":["Cuando algún núcleo supera el 80 % de carga: entonces prima el rendimiento.","Cuando la batería baja del 20 %.","Nunca: EAS siempre elige el núcleo de menor consumo.","Cuando la aplicación está en segundo plano, porque entonces se envía siempre a los núcleos grandes.","Cuando hay más de 8 tareas."],"e":["Es la excepción de los apuntes.","No es la regla.","Hay una excepción.","Las de segundo plano suelen ir a los pequeños.","No es la regla."]},{"s":"real","c":"easej","q":"EAS con coste por unidad de trabajo 1 (pequeño, frecuencia baja, hasta 300), 2 (pequeño, alta, hasta 500) y 4 (grande). P necesita 200; CPU0 tiene 200 y CPU1 tiene 100. ¿Dónde coloca EAS a P?","o":["En CPU1: ambos pequeños caben en frecuencia baja y la energía es 500.","En CPU0: energía 1000.","En el núcleo grande: energía 1100.","En el núcleo grande, porque es el más rápido y EAS siempre prima el rendimiento.","En CPU0, porque ya tiene trabajo y así el grupo mantiene la frecuencia: energía 400."],"e":["(200 + 300) × 1 = 500.","Con 400 se supera 300 y el grupo sube a frecuencia alta: (400 + 100) × 2.","300 × 1 + 200 × 4 = 1100.","Como sobra capacidad, EAS ahorra energía.","No es el cálculo."]},{"s":"real","c":"easej","q":"En ese ejemplo de EAS, ¿por qué
