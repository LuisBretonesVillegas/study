<script>
/* Lógica pura del test (sin DOM): muestreo, barajado y puntuación. Se usa en el navegador y en las pruebas de Node. */
const SSII = (() => {
  'use strict';

  // Generador pseudoaleatorio reproducible (mulberry32) para las pruebas; en la app se usa Math.random.
  function makeRng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffle(arr, rnd) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function perm5(rnd) { return shuffle([0, 1, 2, 3, 4], rnd); }

  // Reparto de `total` unidades proporcional a `weights`, sin sesgo: cada parte recibe la parte entera
  // de su cuota exacta y una unidad extra con probabilidad igual a la parte fraccionaria (muestreo
  // sistemático con arranque aleatorio), de modo que la suma es siempre `total` y ningún apartado
  // pequeño queda excluido para siempre. `caps` limita cada parte.
  function apportion(weights, total, rnd, caps) {
    const W = weights.reduce((s, w) => s + w, 0);
    const n = weights.length;
    const cap = caps || weights.map(() => Infinity);
    const exact = weights.map(w => (W ? (w * total) / W : 0));
    const q = exact.map((x, i) => Math.min(Math.floor(x + 1e-9), cap[i]));
    let left = total - q.reduce((s, x) => s + x, 0);
    if (left > 0) {
      const order = shuffle([...Array(n).keys()], rnd);
      const frac = order.map(i => Math.max(0, Math.min(1, exact[i] - q[i])));
      const F = frac.reduce((s, x) => s + x, 0);
      if (F > 1e-9) {
        // Puntos u, u+1, …, u+left−1 sobre los fraccionarios reescalados a suma `left`.
        const scale = left / F, u = rnd();
        let cum = 0, m = 0;
        order.forEach((i, j) => {
          const a = cum; cum += frac[j] * scale;
          while (m < left && u + m < cum - 1e-12 && u + m >= a - 1e-12) {
            if (q[i] < cap[i]) { q[i]++; }
            m++;
          }
        });
        left = total - q.reduce((s, x) => s + x, 0);
      }
      // Ajuste final (redondeos o topes): reparte lo que falte entre las partes con hueco.
      let guard = 0;
      while (left > 0 && guard++ < 10000) {
        let progressed = false;
        for (const i of shuffle([...Array(n).keys()], rnd)) {
          if (left === 0) break;
          if (q[i] < cap[i]) { q[i]++; left--; progressed = true; }
        }
        if (!progressed) break;
      }
    }
    return q;
  }

  // Selecciona k preguntas de un tema: reparto proporcional al nº de conceptos de cada apartado,
  // como mucho una formulación por concepto.
  function sampleTema(tema, k, rnd) {
    const bySec = new Map();
    tema.qs.forEach((q, i) => {
      if (!bySec.has(q.s)) bySec.set(q.s, new Map());
      const concepts = bySec.get(q.s);
      if (!concepts.has(q.c)) concepts.set(q.c, []);
      concepts.get(q.c).push(i);
    });
    const secs = [...bySec.keys()];
    const counts = secs.map(s => bySec.get(s).size);
    const totalConcepts = counts.reduce((s, x) => s + x, 0);
    if (k > totalConcepts) throw new Error(`Tema ${tema.n}: se piden ${k} preguntas y solo hay ${totalConcepts} conceptos`);
    const quotas = apportion(counts, k, rnd, counts);
    const out = [];
    secs.forEach((s, si) => {
      const concepts = shuffle([...bySec.get(s).values()], rnd);
      for (let j = 0; j < quotas[si]; j++) {
        const forms = concepts[j];
        out.push(forms[Math.floor(rnd() * forms.length)]);
      }
    });
    return shuffle(out, rnd);
  }

  const EXAM_KINDS = {
    parcial: { label: 'Examen', temas: [1, 2, 3, 4], total: 50 }
  };

  // Examen: 50 preguntas equilibradas entre los temas (13/13/12/12 o 10×5), ordenadas por tema.
  function buildExam(bank, kind, rnd) {
    const def = EXAM_KINDS[kind];
    if (!def) throw new Error('Tipo de examen desconocido: ' + kind);
    const temas = def.temas.filter(t => bank[t]);
    const per = apportion(temas.map(() => 1), def.total, rnd);
    const items = [];
    temas.forEach((t, ti) => {
      for (const i of sampleTema(bank[t], per[ti], rnd)) items.push({ t, i, p: perm5(rnd) });
    });
    return { kind, temas, perTema: Object.fromEntries(temas.map((t, ti) => [t, per[ti]])), items };
  }

  // Práctica: preguntas de los temas elegidos, filtradas según las estadísticas guardadas.
  function practicePool(bank, temas, filter, stats) {
    const pool = [];
    for (const t of temas) {
      if (!bank[t]) continue;
      bank[t].qs.forEach((q, i) => {
        const st = stats && stats[qid(t, i)];
        if (filter === 'unseen' && st && st[0] > 0) return;
        if (filter === 'failed' && !(st && st[2] === 0)) return;
        pool.push({ t, i });
      });
    }
    return pool;
  }

  function buildPractice(bank, temas, opts, stats, rnd) {
    const o = Object.assign({ count: 'all', filter: 'all', order: 'random' }, opts || {});
    let pool = shuffle(practicePool(bank, temas, o.filter, stats), rnd);
    if (o.count !== 'all') pool = pool.slice(0, Math.max(0, +o.count));
    if (o.order === 'tema') pool.sort((a, b) => a.t - b.t || a.i - b.i);
    return pool.map(x => ({ t: x.t, i: x.i, p: perm5(rnd) }));
  }

  function qid(t, i) { return t + '-' + i; }

  // Puntuación: cada fallo resta un acierto; las preguntas en blanco no puntúan.
  function score(items, answers) {
    const per = {};
    let A = 0, F = 0, B = 0;
    items.forEach((it, k) => {
      const a = answers[k];
      const r = per[it.t] || (per[it.t] = { n: 0, A: 0, F: 0, B: 0 });
      r.n++;
      if (a === null || a === undefined) { B++; r.B++; }
      else if (a === 0) { A++; r.A++; }
      else { F++; r.F++; }
    });
    const N = items.length;
    const net = A - F;
    const nota = N ? Math.max(0, net) / N * 10 : 0;
    const notaBruta = N ? A / N * 10 : 0;
    for (const r of Object.values(per)) {
      r.net = r.A - r.F;
      r.nota = r.n ? Math.max(0, r.net) / r.n * 10 : 0;
    }
    return { N, A, F, B, net, nota, notaBruta, perTema: per };
  }

  return { makeRng, shuffle, perm5, apportion, sampleTema, buildExam, buildPractice, practicePool, score, qid, EXAM_KINDS };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = SSII;

</script>
<script>

const BANK = {"1":{"n":1,"nombre":"Visión general de los sistemas operativos","secs":{"hw":["Estructura y funcionamiento básico de un ordenador","Unidad 1 §1.1.1"],"mem":["Jerarquía de memoria y memoria virtual","Unidad 1 §1.1.2–1.1.3"],"int":["Entrada/Salida e interrupciones","Unidad 1 §1.1.4–1.1.5"],"func":["Definición y funciones del sistema operativo","Unidad 1 §1.2.1"],"serv":["Obtención de servicios: modos y llamadas al sistema","Unidad 1 §1.2.2"],"proc":["Procesos, concurrencia e hilos","Unidad 1 §1.2.3–1.2.4"],"multi":["Sistemas operativos de multiprogramación","Unidad 1 §1.2.5"],"arq":["Arquitecturas: capas y cliente-servidor","Unidad 1 §1.3 y Sesión 4"],"usu":["Visión de los usuarios","Unidad 1 §1.4"],"virt":["Máquinas virtuales y contenedores","Unidad 1 §1.5"],"unid":["Unidades de medida","Unidad 1 §1.6"]},"qs":[{"s":"hw","c":"vonneumann","q":"¿Cuál fue la aportación más importante del modelo de Von Neumann (1946)?","o":["Construir un ordenador con programa almacenado.","Introducir la memoria caché entre la CPU y la memoria principal.","Separar físicamente la memoria de datos de la memoria de instrucciones para acelerar el acceso.","Definir los modos usuario y núcleo como esquema de protección.","Crear la primera máquina con varios procesadores que compartían memoria."],"e":["Es la aportación que destacan los apuntes: datos e instrucciones residen en la misma memoria.","La caché es muy posterior y no forma parte del modelo básico.","Eso describe la arquitectura Harvard, justo lo contrario del programa almacenado.","Los modos de funcionamiento son un mecanismo de protección de las CPU, no la aportación de Von Neumann.","Eso es el multiprocesamiento simétrico, ajeno al modelo de 1946."]},{"s":"hw","c":"vonneumann","q":"¿Cuál de estos elementos NO es una de las cuatro unidades básicas de la arquitectura de un ordenador personal?","o":["La unidad de gestión de memoria (MMU).","La memoria principal.","La unidad central de proceso, con su unidad de control y su unidad aritmético-lógica.","Las unidades de entrada/salida o controladoras.","Los buses."],"e":["Sí es la respuesta: la MMU traduce direcciones virtuales, pero las cuatro unidades básicas son memoria principal, CPU, E/S y buses.","Sí es una unidad básica: celdas direccionables que guardan datos e instrucciones.","Sí es una unidad básica.","Sí es una unidad básica: transfieren información con los periféricos.","Sí es una unidad básica: caminos por los que circulan instrucciones y datos."]},{"s":"hw","c":"ddrpines","q":"¿Cuántos pines tiene un módulo de memoria DDR4?","o":["288.","240.","184.","128, igual que la capacidad máxima en GB que puede alcanzar un módulo de su generación.","512."],"e":["DDR4 tiene 288 pines.","Ese es el número de pines de DDR2 y DDR3.","Ese es el número de pines del DDR original.","128 GB es la capacidad que podrá alcanzar DDR5, no un número de pines.","No corresponde a ninguna generación DDR de los apuntes."]},{"s":"hw","c":"ddrpines","q":"Un técnico identifica un módulo DIMM por su número de contactos: tiene 240. ¿De qué generación puede ser?","o":["DDR2 o DDR3.","Solo DDR2.","DDR4, que fue la primera en superar los 200 contactos.","DDR, la primera generación de doble tasa de transferencia.","DDR5."],"e":["Ambas generaciones tienen 240 pines; se distinguen, entre otras cosas, por la posición de la muesca.","DDR3 también tiene 240 pines.","DDR4 tiene 288 pines.","DDR tiene 184 pines.","Los apuntes no le atribuyen 240 pines; DDR5 destaca por su menor consumo y su ancho de banda."]},{"s":"hw","c":"ddrtrans","q":"¿Cuántas transferencias por ciclo de reloj realiza un módulo DDR2?","o":["Cuatro.","Dos.","Ocho.","Una, como la memoria SDRAM tradicional de una sola tasa.","Dieciséis."],"e":["DDR2 trabaja al doble de la frecuencia del núcleo: cuatro transferencias por ciclo.","Eso es DDR: dos transferencias por ciclo.","Los apuntes dicen que DDR3 transfiere ocho veces más rápido que DDR; no es el dato de DDR2.","Precisamente DDR significa doble tasa; ya DDR hace dos.","No es un dato de los apuntes."]},{"s":"hw","c":"ddrtrans","q":"¿Qué afirmación sobre las generaciones de memoria DDR es correcta según los apuntes?","o":["DDR3 puede hacer transferencias de datos ocho veces más rápido que DDR.","DDR4 consume más que DDR3 a cambio de más rendimiento.","DDR5 aumenta el consumo para alcanzar un ancho de banda de 6,4 GB/s.","DDR realiza una transferencia por ciclo de reloj y DDR2 dos, porque trabajan a la misma frecuencia que el núcleo.","Todas las generaciones tienen el mismo número de pines y solo cambia la muesca."],"e":["Es el dato que dan los apuntes para DDR3.","DDR4 tiene mayor rendimiento y menor consumo que las anteriores.","DDR5 reduce considerablemente el consumo.","DDR hace dos transferencias por ciclo y DDR2 cuatro.","El número de pines varía: 184, 240, 240 y 288."]},{"s":"hw","c":"ddr45","q":"¿Qué capacidad de almacenamiento por módulo atribuyen los apuntes a DDR4?","o":["De 4 GB a 16 GB.","Hasta 128 GB.","De 1600 a 3200 GB.","De 2133 a 4266 MB por módulo, que coincide con su rango de frecuencias en MHz.","De 256 MB a 2 GB."],"e":["Además: de 2133 a 4266 MHz y de 1600 a 3200 MB/s.","Esa es la capacidad que podrá alcanzar DDR5.","Esas cifras son la velocidad de transferencia en MB/s, no la capacidad.","2133 a 4266 es la frecuencia de reloj en MHz.","No es un dato de los apuntes para DDR4."]},{"s":"hw","c":"ddr45","q":"¿Qué características atribuyen los apuntes a DDR5?","o":["Menor consumo, ancho de banda de 6,4 GB/s y hasta 128 GB.","288 pines, de 2133 a 4266 MHz y de 4 a 16 GB.","Cuatro transferencias por ciclo de reloj, 240 pines y la mitad de consumo que DDR4.","Mayor consumo que DDR4, compensado con un ancho de banda de 51,2 GB/s.","Un único canal de 8 bits y capacidad máxima de 16 GB."],"e":["Su tasa máxima es de 51,2 Gb/s.","Esas son las características de DDR4.","Las cuatro transferencias y los 240 pines son de DDR2.","DDR5 reduce el consumo; 51,2 es su tasa en Gb/s, no en GB/s.","No son datos de los apuntes."]},{"s":"hw","c":"mts","q":"¿Por qué es más adecuado expresar la velocidad de una memoria DDR en MT/s que en MHz?","o":["Porque DDR hace dos transferencias por ciclo y la frecuencia ya no coincide con las transferencias por segundo.","Porque los MHz miden la capacidad del módulo y no su velocidad.","Porque MT/s incluye el ancho del bus y así da directamente los MB/s.","Porque la frecuencia de la memoria DDR no es constante y varía con cada acceso, así que no se puede medir en hercios.","Porque MT/s cuenta los ciclos de reloj de la CPU, no los de la memoria."],"e":["Con un ciclo por transferencia daba igual; con DDR ya no.","Los MHz miden frecuencia, no capacidad.","El ancho de banda se obtiene multiplicando los MT/s por los bytes del bus.","La frecuencia es constante; lo que cambia es cuántas transferencias se hacen por ciclo.","MT/s cuenta millones de transferencias de la memoria por segundo."]},{"s":"hw","c":"mts","q":"Una memoria DDR trabaja a 400 MHz con un bus de 64 bits. ¿Cuál es su ancho de banda?","o":["6400 MB/s.","3200 MB/s.","51200 MB/s.","800 MB/s, porque las 800 MT/s ya expresan directamente megabytes por segundo.","4800 MB/s."],"e":["400 MHz × 2 = 800 MT/s; 800 M × 8 bytes = 6400 MB/s.","Es el resultado de olvidar que DDR hace dos transferencias por ciclo.","Es el resultado de multiplicar por 64 bits en lugar de por 8 bytes.","Hay que multiplicar las transferencias por los bytes que mueve cada una.","Es el resultado del ejemplo de los apuntes, que usa 300 MHz."]},{"s":"hw","c":"ucalu","q":"¿Qué hace la unidad de control de la CPU?","o":["Sincroniza las acciones de cada una de las unidades funcionales del ordenador.","Realiza las operaciones aritméticas y lógicas sobre los operandos.","Traduce las direcciones virtuales en direcciones físicas.","Gestiona la transferencia de información entre periféricos y memoria principal.","Almacena de forma temporal los datos más usados de la memoria principal para acelerar su acceso."],"e":["Es la definición de los apuntes.","Eso lo hace la unidad aritmético-lógica (ALU).","Eso lo hace la MMU.","Eso es el canal.","Eso es la memoria caché."]},{"s":"hw","c":"ucalu","q":"¿Qué componente realiza operaciones aritméticas y lógicas sobre operandos que vienen de la memoria principal o de los registros?","o":["La unidad aritmético-lógica (ALU).","La unidad de control.","El controlador de interrupciones.","La controladora de E/S, que procesa los datos antes de enviarlos al periférico.","El bus de datos, que combina los operandos mientras los transporta entre memoria y registros."],"e":["Es la unidad de la CPU encargada de esas operaciones.","Sincroniza las unidades funcionales; no opera los datos.","Gestiona las interrupciones.","Las controladoras transfieren información con los periféricos.","Los buses solo transportan información; no operan sobre ella."]},{"s":"hw","c":"ht","q":"Para el sistema operativo, ¿cuántas CPU tiene un Intel Core i9-13900KS (8 P-cores y 16 E-cores con Hyper-Threading)?","o":["32.","24.","48, porque Hyper-Threading duplica cada uno de los 24 núcleos.","16.","40."],"e":["16 de los E-cores + 8 P-cores × 2 por Hyper-Threading.","Es el número de núcleos físicos, sin contar Hyper-Threading.","Hyper-Threading solo se aplica a los P-cores.","Es el número de hilos que aportan solo los P-cores.","Resultaría de duplicar los E-cores en lugar de los P-cores."]},{"s":"hw","c":"ht","q":"Un procesador Intel tiene 6 P-cores y 8 E-cores. Con Hyper-Threading, ¿cuántos procesadores lógicos ve el SO?","o":["20.","28, porque Hyper-Threading duplica todos los núcleos del procesador.","14.","22.","12."],"e":["6 × 2 + 8 = 20: Hyper-Threading solo duplica los P-cores.","En Intel, Hyper-Threading solo se puede usar con los P-cores.","Es el número de núcleos físicos.","Resultaría de duplicar los E-cores y no los P-cores.","Solo cuenta los hilos de los P-cores."]},{"s":"hw","c":"monitor","q":"Si una pantalla usa 24 bits por píxel, ¿cuántos colores distintos puede mostrar cada píxel?","o":["16.777.216.","256.","65.536.","24.","1.920 × 1.080, que es el número de píxeles de una pantalla FHD."],"e":["2^24 = 16.777.216.","Son los colores con 8 bits por píxel.","Corresponde a 16 bits por píxel.","Confunde el número de bits con el de colores.","Eso es la resolución, no los colores por píxel."]},{"s":"hw","c":"monitor","q":"¿Qué atributo de una pantalla se mide en PPI (puntos por pulgada)?","o":["La densidad de píxeles.","El número de imágenes que se muestran cada segundo.","La proporción entre píxeles horizontales y verticales.","El número de bits por píxel, que determina cuántos colores puede tener cada punto de la pantalla.","La resolución máxima recomendada por el fabricante."],"e":["A más píxeles en el mismo tamaño, mayor densidad y mejor imagen.","Eso son los FPS.","Eso es el formato de resolución (3:2, 4:3, 16:10).","Eso son los BPP.","La resolución se expresa en píxeles (por ejemplo 1920 × 1080)."]},{"s":"hw","c":"canal","q":"¿Qué elemento gestiona la transferencia de información entre las unidades periféricas y la memoria principal?","o":["El canal.","La unidad de control.","Los buses.","La MMU, que traduce las direcciones de los periféricos en direcciones de memoria principal.","La memoria caché."],"e":["Es la definición de canal de los apuntes.","Sincroniza las unidades funcionales.","Son los caminos por los que circulan datos e instrucciones, no quien gestiona la transferencia.","La MMU traduce direcciones virtuales de los programas.","Guarda la información más usada de la memoria principal."]},{"s":"hw","c":"canal","q":"¿Qué son los buses en la arquitectura de un ordenador?","o":["Los caminos por los que circulan instrucciones y datos entre las unidades.","Las unidades que gestionan la transferencia entre periféricos y memoria principal.","Las memorias auxiliares y las unidades de comunicación con el usuario.","Los registros de la CPU donde se guardan los operandos de forma temporal antes de operar.","Las controladoras que cargan datos y programas en la memoria principal."],"e":["Es la definición de los apuntes.","Eso es el canal.","Eso son las unidades periféricas.","Los registros son memoria de la CPU.","Esas son las unidades de E/S."]},{"s":"hw","c":"overclock","q":"¿Qué es el overclocking?","o":["Superar los límites oficiales de frecuencia del hardware para aumentar su velocidad.","Añadir núcleos lógicos a un procesador mediante Hyper-Threading.","Bajar la frecuencia de la CPU y de la memoria para reducir el consumo y la temperatura del equipo.","Usar la caché L3 como memoria principal cuando la RAM se llena, lo que acelera el sistema sin riesgos.","Sincronizar el reloj de la CPU con el de la memoria DDR."],"e":["No todos los modelos lo soportan y puede dañar el hardware.","Hyper-Threading emula procesadores lógicos; no cambia la frecuencia.","Es lo contrario: el overclocking la sube.","No tiene relación con el overclocking.","No es la definición de los apuntes."]},{"s":"hw","c":"overclock","q":"Según los apuntes, ¿a qué hardware se puede aplicar el overclocking?","o":["A procesadores (CPU o GPU) y a módulos RAM, si el modelo lo soporta.","Solo a la CPU, porque es el único componente con reloj propio.","A cualquier componente sin ningún riesgo.","Solo a la memoria caché, porque es la única que trabaja a la misma frecuencia que el núcleo.","Solo a los discos, para aumentar su velocidad de rotación y acercarla a la de la memoria principal."],"e":["Es el ejemplo de los apuntes; además conlleva riesgo de dañar el hardware.","Los apuntes citan también la GPU y la RAM.","No todos los modelos lo soportan y hay riesgo de daño.","No es lo que dicen los apuntes.","Los apuntes no hablan de discos."]},{"s":"mem","c":"jerarquia","q":"¿Qué niveles de la jerarquía de memoria forman la memoria externa?","o":["La secundaria por disco y la auxiliar (niveles 4 y 5).","La caché y la principal (niveles 2 y 3).","Los registros, la caché y la principal.","La principal, la secundaria y la auxiliar, porque están fuera de la CPU.","Solo la auxiliar, porque la secundaria por disco se considera parte de la memoria interna."],"e":["La memoria interna son los niveles 1, 2 y 3.","Forman parte de la memoria interna.","Esos tres forman la memoria interna.","La principal es memoria interna.","La secundaria por disco también es externa."]},{"s":"mem","c":"jerarquia","q":"¿Cómo son las memorias a medida que se sube en la jerarquía?","o":["Más rápidas, más pequeñas y más caras.","Más rápidas, más grandes y más baratas.","Más lentas, más pequeñas y más caras.","Más rápidas y más grandes, aunque más caras, porque se integran en la CPU.","Igual de rápidas, pero más pequeñas."],"e":["Al bajar, más lentas, más grandes y más baratas.","Al subir disminuye la capacidad y aumenta el coste.","Al subir aumenta la velocidad.","Al subir disminuye la capacidad.","La velocidad sí cambia con el nivel."]},{"s":"mem","c":"jermov","q":"En la jerarquía de memoria, ¿qué ocurre con una información modificada en un nivel superior?","o":["El sistema la hace descender para actualizarla en el nivel inferior.","Se pierde al apagar el equipo porque solo existe en el nivel superior.","Pasa directamente al nivel auxiliar para conservarla.","Se queda en el nivel superior, porque los niveles inferiores solo guardan copias de lectura.","Se duplica en todos los niveles a la vez."],"e":["Lo poco usado queda abajo, sube cuando se necesita y baja si se modifica.","El sistema la devuelve al nivel inferior para actualizarla.","Desciende para actualizarse, no salta al último nivel.","Si se modifica, se actualiza en el nivel inferior.","No es el funcionamiento descrito."]},{"s":"mem","c":"jermov","q":"¿Dónde se sitúan, en general, los datos poco utilizados y los archivos de datos?","o":["En el nivel inferior de la jerarquía.","En la caché, para que estén disponibles cuanto antes.","En los registros de la CPU.","En la memoria principal, que es la que comparten todos los procesos del sistema.","Repartidos al azar entre todos los niveles."],"e":["Si se necesitan, el sistema los transfiere al nivel superior.","La caché guarda lo más usado.","Los registros son el nivel más rápido y pequeño.","Lo poco usado queda abajo, en la memoria externa.","Se ubican según su uso."]},{"s":"mem","c":"cache","q":"Según los apuntes, ¿cuántos niveles de caché hay dentro de la CPU en los procesadores Intel descritos?","o":["Dos: L1 y L2.","Tres: L1, L2 y L3.","Uno: L1.","Ninguno: todas las cachés están en la placa base, entre la memoria principal y la CPU.","Cuatro."],"e":["La L3 se sitúa externa al procesador, entre la memoria principal y la CPU.","Según los apuntes, la L3 está fuera del procesador.","L2 también está dentro de la CPU.","L1 y L2 están dentro de la CPU.","Los apuntes describen tres niveles en total."]},{"s":"mem","c":"cache","q":"¿Qué tamaño típico tiene la caché L1 según los apuntes?","o":["Entre 16 KiB y 128 KiB por núcleo.","Entre 256 KiB y 512 KiB por núcleo.","Entre 2 MiB y 64 MiB.","Hasta 13,75 MiB.","Entre 8 y 128 bits, como los registros de la CPU con los que comparte nivel."],"e":["Está dentro del propio núcleo.","Es el tamaño típico de L2.","Es el tamaño típico de L3.","Es el máximo de capacidad de la caché en la tabla de la jerarquía.","Esa es la capacidad de los registros."]},{"s":"mem","c":"mmu","q":"En un sistema con memoria virtual, ¿quién genera las direcciones virtuales?","o":["El programa.","La MMU.","El controlador de interrupciones.","El sistema operativo, al cargar el programa en memoria principal.","El bus de direcciones."],"e":["El conjunto de direcciones virtuales forma el espacio de direcciones virtual.","La MMU traduce las direcciones virtuales a físicas.","No interviene en la generación de direcciones.","Las genera el propio programa.","El bus transporta la dirección física ya traducida."]},{"s":"mem","c":"mmu","q":"¿Por qué la MMU se implementa en hardware?","o":["Porque es más rápido que hacerlo por software.","Porque el software no puede acceder a la memoria principal.","Porque así la dirección que se escribe en el bus es la virtual.","Porque permite que cada programa genere directamente direcciones físicas sin traducción.","Porque solo el hardware puede ampliar la capacidad física de la memoria principal."],"e":["Es la razón que dan los apuntes.","No es la razón dada.","En el bus se escribe la dirección física.","Precisamente traduce direcciones virtuales.","La memoria virtual emula una memoria mayor; no la amplía físicamente."]},{"s":"int","c":"esrazones","q":"¿Cuál NO es una de las razones por las que el SO controla los dispositivos de E/S?","o":["Que los usuarios accedan directamente al hardware de cada periférico.","Que la interfaz hardware de la mayoría de periféricos es compleja.","Que los periféricos son recursos compartidos que el SO protege y asigna.","Ofrecer una interfaz consistente, uniforme y flexible para todos los periféricos.","Permitir referenciar los dispositivos por su nombre y hacer operaciones de alto nivel."],"e":["Sí es la respuesta: el SO hace lo contrario, ofrece una interfaz uniforme para no tener que conocer la configuración.","Sí es una de las tres razones.","Sí es una de las tres razones.","Sí es una de las tres razones.","Sí forma parte de la tercera razón."]},{"s":"int","c":"esrazones","q":"Un programa abre un dispositivo por su nombre y hace una operación de alto nivel sin conocer la configuración de la máquina. ¿Qué razón del control de la E/S por el SO lo permite?","o":["La interfaz consistente, uniforme y flexible que ofrece el SO.","La complejidad de la interfaz hardware de los periféricos.","Que los periféricos son recursos compartidos.","La memoria virtual, que asigna a cada dispositivo una dirección dentro del espacio del programa.","La multiprogramación de tiempo compartido."],"e":["Es la tercera razón de los apuntes.","Es otra razón, pero no explica el acceso por nombre.","Justifica la protección y la asignación.","No es lo que explican los apuntes.","No tiene relación con la interfaz de E/S."]},{"s":"int","c":"intdef","q":"¿Qué es una interrupción según los apuntes?","o":["Una respuesta a un suceso asíncrono o excepcional que guarda el estado de la CPU y transfiere el control a una rutina específica.","Una llamada voluntaria del programa al núcleo para pedir un servicio.","La finalización de un proceso por un error, como una división por cero, que obliga al SO a liberar sus recursos.","Un cambio de la CPU de modo núcleo a modo usuario que se produce al terminar cualquier operación de E/S.","Un mecanismo de la MMU para traducir direcciones."],"e":["Es la definición de la Unidad 1.","Eso es la llamada al sistema, aunque se gestione mediante una interrupción.","Un error puede generar una interrupción, pero no es la definición.","No es la definición.","No tiene relación con la MMU."]},{"s":"int","c":"intdef","q":"¿Qué afirmación sobre las interrupciones es correcta?","o":["Una interrupción puede ser interrumpida por otra de mayor prioridad.","Tras gestionarla, siempre continúa el proceso interrumpido.","Las gestiona la MMU, que guarda el estado de la CPU y salta a la rutina de tratamiento.","Nunca se interrumpe una interrupción, porque la CPU deshabilita todas las demás mientras la trata.","Solo las provocan los dispositivos de E/S."],"e":["Se agrupan y se les asignan prioridades.","Puede continuar o la CPU puede asignarse a otro proceso.","Las gestiona el controlador de interrupciones.","Una de mayor prioridad sí puede interrumpirla.","También las provocan programas, el reloj, fallos hardware y llamadas al núcleo."]},{"s":"int","c":"inttipos","q":"Un programa intenta dividir por cero. ¿Qué tipo de interrupción se genera?","o":["De programa.","Por fallo de hardware.","De E/S.","Llamada al núcleo o supervisor, porque el programa necesita que el SO trate el error.","De reloj."],"e":["Igual que el desbordamiento, la instrucción ilegal o el acceso fuera del espacio permitido.","Esa la provocan un corte de energía o un error de paridad de memoria.","La genera un controlador de E/S.","Esa se usa para gestionar llamadas al sistema.","La genera el reloj interno del procesador."]},{"s":"int","c":"inttipos","q":"¿Qué tipo de interrupción permite al SO llevar a cabo ciertas funciones con regularidad?","o":["La de reloj.","La de E/S.","La de programa.","La llamada al núcleo o supervisor, que el SO se envía a sí mismo de forma periódica.","La de fallo de hardware."],"e":["La genera un reloj interno del procesador.","Indica que una operación de E/S ha terminado o ha fallado.","La provoca la ejecución de una instrucción.","Gestiona llamadas al sistema.","La provoca un corte de energía o un error de paridad."]},{"s":"func","c":"sodef","q":"¿Cuál NO es una de las tres funciones principales del SO según los apuntes?","o":["Compilar los programas de usuario antes de ejecutarlos.","Iniciar el sistema (hardware y software).","Actuar como máquina extendida.","Actuar como gestor de recursos.","Presentar al usuario una máquina más fácil de programar."],"e":["Sí es la respuesta: las funciones son iniciar el sistema, máquina extendida y gestor de recursos.","Sí es una de las tres funciones.","Sí es una de las tres funciones.","Sí es una de las tres funciones.","Sí: es la función de máquina extendida."]},{"s":"func","c":"sodef","q":"¿Qué definición de sistema operativo dan los apuntes?","o":["Programas que controlan los recursos, resuelven conflictos, optimizan el rendimiento y hacen de interfaz entre programas y hardware.","El firmware que se ejecuta al encender el ordenador.","El programa que carga el núcleo en memoria tras inicializar el hardware, localizado por un programa que ejecuta la UEFI.","El intérprete de órdenes con el que el usuario dialoga de forma interactiva con el ordenador.","El hardware que traduce direcciones virtuales en físicas."],"e":["Además, da soporte para escribir y ejecutar programas.","Eso es la BIOS/UEFI.","Eso es el bootloader.","Es una forma de pedir servicios al SO, no su definición.","Eso es la MMU."]},{"s":"func","c":"bios","q":"¿Dónde se almacena la BIOS y cuándo se ejecuta?","o":["En una memoria ROM, y se ejecuta cada vez que se enciende el ordenador.","En la memoria RAM, y se carga al iniciar el sistema operativo.","En el disco duro, junto al núcleo del sistema operativo.","En la caché L1, porque necesita ejecutarse antes que cualquier otro programa del sistema.","En la tabla de páginas del primer proceso, para que el SO la pueda ejecutar al arrancar."],"e":["Así no se borra al apagar.","Está en ROM para que no se borre.","Está en ROM.","No es lo que dicen los apuntes.","No tiene relación."]},{"s":"func","c":"bios","q":"Durante el arranque con UEFI, ¿quién carga el núcleo del SO en memoria?","o":["El bootloader, que localiza un programa ejecutado por la UEFI.","La propia UEFI, directamente.","El intérprete de órdenes.","El controlador de interrupciones, al recibir la interrupción de reloj del encendido.","El hipervisor, que se carga antes que el SO y le cede el control tras inicializar el hardware."],"e":["La UEFI inicializa el hardware y ejecuta un programa que localiza el bootloader.","Ejecuta un programa que localiza el bootloader, que es quien carga el kernel.","Se ejecuta después, cuando el SO ya está cargado.","No es su función.","Solo existe en sistemas con máquinas virtuales y no carga el núcleo."]},{"s":"func","c":"maqext","q":"¿Qué significa que el SO actúa como máquina extendida?","o":["Que presenta una máquina virtual más fácil de programar que el hardware real.","Que amplía la memoria física con memoria virtual.","Que reparte los recursos entre los usuarios y resuelve sus conflictos.","Que ejecuta máquinas virtuales con otros sistemas operativos huéspedes sobre el hardware del anfitrión.","Que inicializa el hardware al arrancar."],"e":["Oculta la complejidad del hardware.","Eso es la memoria virtual, no la función de máquina extendida.","Eso es la función de gestor de recursos.","Eso es un hipervisor.","Eso es la función de iniciar el sistema."]},{"s":"func","c":"maqext","q":"En el ejemplo del controlador NEC PD765 del disco flexible, ¿qué ve el usuario gracias al SO?","o":["Una colección de archivos que puede manipular.","Los 16 comandos del controlador, que debe usar para leer y escribir.","Las pistas y sectores del disco.","Una lista de procesos esperando el disco, que se envían uno a uno como en la impresora.","La tabla de páginas del disco."],"e":["Aunque el controlador tiene 16 comandos de bajo nivel.","Eso es precisamente lo que el SO oculta.","El usuario no trabaja a ese nivel.","Ese es el ejemplo del gestor de recursos.","No tiene relación."]},{"s":"func","c":"gestor","q":"¿Qué dos actividades realiza el SO como gestor de recursos?","o":["Asignación de recursos y protección.","Traducción de direcciones y paginación.","Planificación y despacho.","Inicialización del hardware y carga del núcleo mediante el bootloader en cada arranque.","Compilación y ejecución."],"e":["Asigna según disponibilidad y prioridad, y protege a los usuarios entre sí.","Son tareas de gestión de memoria, no las dos actividades citadas.","No son las actividades que cita la Unidad 1.","Eso es la función de iniciar el sistema.","No son funciones del SO como gestor."]},{"s":"func","c":"gestor","q":"Dos usuarios mandan a la vez un documento a la misma impresora. ¿Qué hace el SO?","o":["Mantiene una lista de archivos a imprimir y los envía uno a uno.","Rechaza el segundo trabajo.","Imprime los dos documentos a la vez, intercalando las páginas de cada usuario según llegan.","Asigna la impresora al usuario de mayor prioridad y cancela el trabajo del otro para evitar conflictos.","Pide al usuario que lo intente más tarde."],"e":["Es el ejemplo del SO como gestor de recursos.","Lo encola.","Eso es lo que evita.","No cancela trabajos; los encola.","El SO gestiona la cola."]},{"s":"serv","c":"modos","q":"¿Qué no está permitido en modo usuario?","o":["Las operaciones de E/S y otras instrucciones determinadas.","Las operaciones aritméticas.","El acceso a memoria principal.","Cualquier instrucción, porque en modo usuario el programa solo puede hacer llamadas al sistema.","Las llamadas al sistema, que solo pueden hacerse desde un programa que ya esté en modo núcleo."],"e":["Sí se permiten las aritméticas y el acceso a memoria principal.","Están permitidas.","Está permitido cuando no requiere servicio del SO.","Muchas instrucciones están permitidas.","Son precisamente la forma de pedir servicios desde modo usuario."]},{"s":"serv","c":"modos","q":"¿En qué modo se ejecutan los programas de usuario y en cuál el núcleo del SO?","o":["Programas en modo usuario; núcleo en modo núcleo o supervisor.","Ambos en modo núcleo.","Programas en modo núcleo; núcleo en modo usuario.","Ambos en modo usuario, y solo el hardware puede pasar a modo supervisor durante una interrupción.","Depende de la prioridad del proceso."],"e":["Es un esquema de protección.","Los programas de usuario no tienen todas las instrucciones permitidas.","Es al revés.","El núcleo se ejecuta en modo supervisor.","No depende de la prioridad."]},{"s":"serv","c":"llamada","q":"¿Para qué se utilizan las llamadas al sistema?","o":["Para pedir un servicio al SO, conmutando de modo usuario a modo núcleo.","Para que el SO llame a un programa de usuario.","Para traducir las direcciones virtuales que genera el programa en las direcciones físicas del bus.","Para pasar de modo núcleo a modo usuario cuando el programa necesita más instrucciones.","Para comunicar dos ordenadores de una red."],"e":["Pregunta de la Sesión 3: el programa nunca accede directamente al hardware.","Es el programa quien llama al SO.","Eso lo hace la MMU.","La conmutación inicial es de usuario a núcleo.","No es su definición."]},{"s":"serv","c":"llamada","q":"¿Cuál es la última fase de una llamada al sistema?","o":["Devolver el control al programa y conmutar de modo núcleo a modo usuario.","El SO determina el servicio tratando la interrupción.","El programa llama al núcleo mediante una función de librería.","El SO localiza y llama a la rutina que gestiona el servicio solicitado por el programa.","El SO apaga el proceso que hizo la llamada."],"e":["Las fases son: llamada, determinar servicio, ejecutar rutina y devolver control.","Es la segunda fase.","Es la primera fase.","Es la tercera fase.","No forma parte de las fases."]},{"s":"serv","c":"interfaz","q":"Además de las llamadas al sistema, ¿cómo se pueden pedir servicios al SO?","o":["Mediante la interfaz de usuario: el intérprete de comandos ejecuta las órdenes.","Solo mediante llamadas al sistema.","Escribiendo directamente en los registros de la controladora.","Mediante interrupciones de reloj, que el usuario puede provocar en cualquier momento desde el teclado.","Desde la BIOS/UEFI, que sigue atendiendo peticiones del usuario mientras el SO está en marcha."],"e":["Hoy las más populares son las interfaces gráficas.","También mediante la interfaz de usuario.","Eso es acceso directo al hardware.","No es la forma descrita.","La BIOS/UEFI se usa antes de cargar el SO."]},{"s":"serv","c":"interfaz","q":"¿Qué componente del SO dialoga de forma interactiva con el usuario y ejecuta sus órdenes usando los servicios del SO?","o":["El intérprete de comandos.","El controlador de interrupciones.","El hipervisor.","El bootloader, que se queda en memoria tras cargar el núcleo para atender al usuario.","La MMU."],"e":["Es parte de la interfaz de usuario.","Gestiona las interrupciones.","Gestiona máquinas virtuales.","Su función es cargar el núcleo.","Traduce direcciones."]},{"s":"proc","c":"procprog","q":"¿Por qué un programa es un concepto estático y un proceso uno dinámico?","o":["Porque el programa es solo código y el proceso añade la pila y los registros del procesador.","Porque el programa está en disco y el proceso en caché.","Porque el proceso no tiene código propio.","Porque un programa solo puede dar lugar a un proceso y un proceso a varios programas a la vez.","Porque el programa lo crea el SO y el proceso el usuario."],"e":["Por ejemplo el contador de programa y los acumuladores.","No es la distinción de los apuntes.","El proceso incluye el programa.","Un programa puede estar en varios procesos (código reentrante).","No es la distinción."]},{"s":"proc","c":"procprog","q":"Varios procesos ejecutan la misma secuencia de instrucciones de un compilador, cada uno con sus propios datos. ¿Qué ilustra?","o":["Que un programa puede estar involucrado en más de un proceso (código reentrante).","Que un proceso puede ejecutar varios programas.","Una condición de carrera.","Que el compilador se ejecuta en modo núcleo porque lo usan varios usuarios a la vez.","Un interbloqueo, porque todos los procesos esperan a que los demás terminen de usar el mismo código."],"e":["Los procesos son independientes y comparten el código.","Es otro caso distinto.","No comparten datos modificables.","No es lo que ilustra el ejemplo.","No hay espera circular: el código reentrante se comparte sin problemas."]},{"s":"proc","c":"concurrencia","q":"¿En qué sistemas hay concurrencia real o paralelismo?","o":["Solo en sistemas multiprocesador.","En cualquier sistema con multiprogramación.","En sistemas uniprocesador con tiempo compartido.","En sistemas uniprocesador con hilos, porque los hilos de un mismo proceso se ejecutan siempre a la vez.","En ninguno."],"e":["En uniprocesador la concurrencia es aparente o ficticia.","Con un solo procesador es aparente.","Ahí los procesos se alternan.","Con un procesador los hilos también se alternan.","Existe en multiprocesadores."]},{"s":"proc","c":"concurrencia","q":"¿Cuándo se dice que hay procesado concurrente según los apuntes?","o":["Cuando varios procesos están en un estado intermedio entre su estado inicial y final.","Cuando varios procesos se ejecutan en el mismo instante en distintas CPU.","Cuando un proceso tiene varios hilos.","Cuando los procesos se ejecutan estrictamente uno detrás de otro, sin solaparse en el tiempo.","Cuando un proceso espera una E/S."],"e":["Es la definición de la Unidad 1.","Eso es concurrencia real, un caso particular.","No es la definición.","Eso es procesado secuencial.","No es la definición."]},{"s":"proc","c":"contextos","q":"Una aplicación se implementa como un conjunto de procesos concurrentes. ¿Qué tipo de procesos usa?","o":["Procesos cooperantes.","Procesos independientes.","Procesos del núcleo.","Procesos huérfanos, porque la aplicación termina antes que ellos.","Procesos bloqueados."],"e":["Es el contexto de aplicaciones estructuradas.","Esos son los del contexto de varias aplicaciones.","Ese es el contexto de la estructura del SO.","No es un concepto de la unidad.","No describe el contexto."]},{"s":"proc","c":"contextos","q":"¿Cuál NO es una ventaja de la programación concurrente según los apuntes?","o":["Que es más fácil de depurar que la secuencial.","La forma natural de algunas soluciones.","Mayor velocidad.","Mayor aprovechamiento de los recursos.","Atender a más usuarios."],"e":["Sí es la respuesta: es más difícil de escribir, depurar, modificar y probar.","Sí es una ventaja.","Sí es una ventaja.","Sí es una ventaja.","Sí es una ventaja."]},{"s":"proc","c":"hilodef","q":"¿Qué es un hilo según la Unidad 1?","o":["La unidad básica de utilización de la CPU, con código, datos, pila y atributos.","Un proceso sin código propio.","Un programa almacenado en disco, con su código y sus datos inicializados, listo para ejecutarse.","Un conjunto de procesos que comparten memoria y se comunican mediante el SO.","Una interrupción de software."],"e":["También se llama hebra o thread.","El código se asocia a los hilos.","Eso es un programa, concepto estático.","Es al revés: un proceso agrupa hilos.","No tiene relación."]},{"s":"proc","c":"hilodef","q":"¿Un sistema que utiliza hilos tiene procesos?","o":["Sí: cada proceso está formado por uno o más hilos.","No: los hilos sustituyen por completo a los procesos.","Solo si el sistema es multiprocesador.","Solo si los hilos son de usuario, porque los hilos del núcleo no pertenecen a ningún proceso.","Solo procesos sin hilos."],"e":["Pregunta de la Sesión 3.","Los procesos siguen existiendo.","No depende del número de CPU.","En los SO con hilos, los procesos están formados por hilos.","Contradice la definición."]},{"s":"proc","c":"hilobenef","q":"¿Por qué es más eficiente implementar una aplicación con hilos que con procesos separados?","o":["Crear, terminar y conmutar hilos es más rápido y su comunicación no necesita al SO.","Porque los hilos no comparten memoria.","Porque los hilos se ejecutan siempre en paralelo.","Porque cada hilo tiene su propio espacio de direcciones y no necesita protección del SO.","Porque los hilos no usan la CPU: esperan en segundo plano mientras el proceso principal calcula."],"e":["Con procesos el SO interviene para dar protección y comunicación.","No es el motivo dado.","Con un procesador se alternan.","No es lo que explican los apuntes.","El hilo es la unidad básica de utilización de la CPU."]},{"s":"proc","c":"hilobenef","q":"¿Cuál es un uso típico de los hilos según la Unidad 1?","o":["Ejecutar tareas en segundo plano (como E/S a disco) mientras se interactúa con el usuario.","Sustituir a las interrupciones de reloj.","Traducir direcciones virtuales en físicas para que el proceso principal no tenga que esperar a la MMU.","Aislar por completo dos aplicaciones distintas para que un fallo de una no afecte a la otra.","Cargar el núcleo en el arranque."],"e":["Es el ejemplo de los apuntes.","No es un uso de los hilos.","Lo hace la MMU, que es hardware.","Eso se consigue con procesos separados.","Lo hace el bootloader."]},{"s":"proc","c":"modhilo","q":"En el modelo muchos-a-muchos, ¿cómo se relacionan los hilos de usuario y del núcleo?","o":["Varios hilos de usuario se multiplexan en un número igual o menor de hilos del núcleo.","Cada hilo de usuario se asigna a un hilo del núcleo.","Todos los hilos de usuario de un proceso van a un único hilo del núcleo.","Siempre hay más hilos del núcleo que de usuario, para que ningún hilo de usuario espere.","No existen hilos del núcleo: la biblioteca de usuario reparte la CPU directamente entre los hilos."],"e":["Es la definición de la Unidad 1.","Eso es uno-a-uno.","Eso es muchos-a-uno.","El número de hilos del núcleo es igual o menor.","El modelo multiplexa los hilos de usuario sobre hilos del núcleo."]},{"s":"proc","c":"modhilo","q":"Varios hilos de usuario de un mismo proceso se canalizan a un único hilo del núcleo. ¿Qué modelo es?","o":["Muchos-a-uno.","Uno-a-uno.","Muchos-a-muchos.","Uno-a-muchos, en el que un hilo de usuario se reparte entre varios hilos del núcleo.","Cliente-servidor."],"e":["Es su definición.","Asigna un hilo del núcleo a cada hilo de usuario.","Multiplexa en varios hilos del núcleo.","No es un modelo de los apuntes.","Es una arquitectura de SO."]},{"s":"multi","c":"multitarea","q":"¿Qué es la multitarea según los apuntes?","o":["Un solo procesador con varios procesos que se ejecutan concurrentemente (concurrencia ficticia).","Un sistema con varios procesadores hardware.","Un sistema que soporta varios usuarios.","Un sistema que soporta múltiples accesos simultáneos al mismo recurso desde distintos terminales.","Un sistema que ejecuta los procesos uno tras otro."],"e":["El multiprocesamiento, en cambio, tiene varios procesadores.","Eso es el multiproceso o multiprocesamiento.","Eso es multiusuario.","Eso es multiacceso.","Eso es monoprogramación."]},{"s":"multi","c":"multitarea","q":"¿Qué diferencia hay entre un SO multiusuario y uno multiacceso?","o":["El multiusuario soporta múltiples usuarios; el multiacceso, múltiples accesos.","Son lo mismo: ambos términos indican que el sistema admite varios usuarios conectados a la vez.","El multiusuario tiene varios procesadores.","El multiacceso tiene varios procesadores y el multiusuario uno solo con tiempo compartido.","El multiacceso no permite concurrencia."],"e":["Son las definiciones de los apuntes.","Los apuntes los distinguen.","Eso es multiprocesamiento.","No es la distinción.","No es lo que dicen los apuntes."]},{"s":"multi","c":"asmp","q":"¿Qué caracteriza al multiproceso asimétrico (ASMP)?","o":["Un procesador ejecuta el SO y los demás trabajos de usuario; fácil de implementar, difícil de transportar.","El SO puede ejecutarse en cualquier procesador libre.","Si falla un procesador, el SO sigue en otro.","Todos los procesadores ejecutan el SO a la vez y comparten la memoria entre ellos.","Un sistema con un solo procesador que reparte su tiempo entre el código del sistema operativo y los trabajos de los usuarios."],"e":["Es la descripción de los apuntes.","Eso es SMP.","Esa robustez es de SMP.","Eso describe SMP.","ASMP es un sistema multiproceso, con varios procesadores."]},{"s":"multi","c":"asmp","q":"¿Por qué el multiproceso simétrico (SMP) es más robusto que el asimétrico?","o":["Porque si un procesador falla, el SO puede ejecutarse en otro.","Porque cada procesador tiene su propia memoria privada.","Porque es más fácil de implementar.","Porque dedica un procesador exclusivo al SO, que así no se ve afectado por los trabajos de usuario.","Porque no necesita SO: cada procesador ejecuta directamente los trabajos de usuario que recibe."],"e":["Además aprovecha mejor los procesadores.","En SMP la memoria se comparte.","Eso se dice del asimétrico.","Eso es el asimétrico.","Sí necesita SO."]},{"s":"multi","c":"multiprog","q":"¿Qué afirmación sobre la multiprogramación es correcta?","o":["Los SO de multiprogramación son multitarea, pero no todo SO multitarea es de multiprogramación.","Todo SO multitarea es de multiprogramación.","Solo puede darse con varios procesadores.","Es lo mismo que el multiprocesamiento, porque ambos ejecutan varios programas a la vez.","La que excluye la gestión de memoria y de archivos y se limita a ejecutar programas concurrentemente."],"e":["Lo contrario no es cierto, dicen los apuntes.","Lo contrario no es cierto.","También con uno.","Son conceptos distintos.","La multiprogramación incluye gestión de memoria y de archivos."]},{"s":"multi","c":"multiprog","q":"¿Puede un sistema de multiprocesamiento ser multiprogramado?","o":["Sí, y es lo habitual: cada procesador alterna entre varios procesos.","No, son conceptos excluyentes.","Solo si es asimétrico, porque el procesador del SO es el único que puede alternar procesos.","Solo si tiene tantos procesos como procesadores, uno en cada CPU sin alternarse.","Solo en sistemas de tiempo real."],"e":["Pregunta de la Sesión 3.","Son independientes y se combinan.","Puede ser cualquiera.","Justamente suele haber más procesos que procesadores.","No hay esa restricción."]},{"s":"multi","c":"tcomp","q":"En la multiprogramación de tiempo compartido, ¿cuándo se quita la CPU a un proceso?","o":["Al agotar su quantum, al entrar en una E/S o al terminar.","Solo cuando termina o cuando el usuario lo interrumpe desde el teclado.","Solo cuando hace una E/S.","Cuando otro proceso tiene más memoria asignada, aunque el actual no haya agotado su quantum.","Nunca, el proceso la cede voluntariamente."],"e":["Son los tres casos de los apuntes.","Eso sería un sistema sin tiempo compartido.","También al agotar el quantum o terminar.","No es un criterio de los apuntes.","El SO la retira."]},{"s":"multi","c":"tcomp","q":"¿Cuáles son las ventajas de la multiprogramación según los apuntes?","o":["El aprovechamiento de la memoria y de los tiempos muertos del procesador.","Un menor consumo de energía, porque el procesador puede apagarse mientras espera la E/S.","Eliminar las interrupciones.","Que no necesita protección entre procesos porque cada uno se ejecuta en su propio procesador.","Que los programas son más fáciles de depurar."],"e":["Mientras un proceso espera, la CPU ejecuta otro.","No se cita.","No es una ventaja de la multiprogramación.","No es lo que dicen los apuntes.","No se cita."]},{"s":"arq","c":"capas","q":"En un SO estructurado en capas, ¿a qué código puede invocar un nivel?","o":["Solo al de los niveles más bajos.","Al de cualquier nivel.","Solo al de los niveles más altos.","Al del nivel inmediatamente superior y al del inmediatamente inferior, nunca a otros.","A ninguno: cada capa es independiente y se comunica con las demás por mensajes."],"e":["Es la regla de la arquitectura por capas.","Rompería la estratificación.","Es al revés.","Puede invocar cualquier nivel inferior.","Los módulos se invocan entre sí; los mensajes son propios del modelo cliente-servidor."]},{"s":"arq","c":"capas","q":"¿Cuál fue el primer SO estructurado por capas?","o":["THE, de Dijkstra (1968), con 6 capas.","Mach.","Multics, con 6 capas impuestas por software.","VMS.","Unix."],"e":["En VMS o Multics la estratificación la impone incluso el hardware.","Es un ejemplo de cliente-servidor.","En Multics la estratificación la impone el hardware; no fue el primero.","No fue el primero.","No es el ejemplo de los apuntes."]},{"s":"arq","c":"capasvent","q":"¿Cuál NO es una ventaja de la arquitectura por capas?","o":["Que se depura empezando por los niveles más altos.","Que limita la dispersión del código.","Que se puede reemplazar una capa sin afectar al resto.","Que cada nivel accede solo a las interfaces de nivel inferior que necesita.","Que facilita la mejora del SO."],"e":["Sí es la respuesta: se depura empezando por los niveles más bajos.","Sí es una ventaja.","Sí es una ventaja.","Sí es una ventaja.","Sí es una ventaja."]},{"s":"arq","c":"capasvent","q":"Se quiere sustituir el módulo de gestión de memoria de un SO por capas. ¿Qué ventaja de esta arquitectura se aprovecha?","o":["Se puede reemplazar una capa sin afectar a las otras partes del sistema.","Que un servidor puede fallar y reiniciarse.","Que los servidores pueden ejecutarse en ordenadores distintos.","Que todo el SO se ejecuta en modo usuario y por tanto no hay que recompilar el núcleo.","Que no hay núcleo: todo el SO se ejecuta como procesos de usuario que se comunican por mensajes."],"e":["Es una de sus ventajas.","Es una ventaja del modelo cliente-servidor.","Es propio del cliente-servidor.","No es una ventaja de las capas.","Eso se parece al modelo cliente-servidor, no a las capas."]},{"s":"arq","c":"cs","q":"En el modelo cliente-servidor, ¿en qué modo se ejecutan los servidores?","o":["En modo usuario, como procesos de usuario.","En modo núcleo, junto con el micronúcleo que les entrega los mensajes.","En modo supervisor solo los de memoria.","En modo núcleo, salvo el servidor de terminal que dialoga con el usuario.","En el hipervisor."],"e":["El núcleo queda mínimo (micronúcleo).","Se ejecutan en modo usuario.","Todos en modo usuario.","No es lo que dicen los apuntes.","No tiene relación."]},{"s":"arq","c":"cs","q":"¿Qué incluye el núcleo mínimo del SO Mach?","o":["Planificación de tareas, paso de mensajes, memoria virtual y controladores.","Solo el paso de mensajes.","Los sistemas de archivos y las redes.","Todo el SO, porque es un sistema monolítico parecido a Unix.","Solo las API, mientras que la planificación, los archivos y las redes se ejecutan como servidores."],"e":["El resto (API, archivos, redes) va en modo usuario.","Algunos núcleos cliente-servidor son así, pero no Mach.","Van en modo usuario.","Es cliente-servidor con núcleo mínimo.","Las API, los archivos y las redes van en modo usuario."]},{"s":"arq","c":"csdist","q":"¿Puede usarse el modelo cliente-servidor en un sistema con un único ordenador?","o":["Sí: es una forma de estructurar el SO y la distribución es una ventaja añadida.","No, solo sirve en sistemas distribuidos.","Solo si tiene varios procesadores, uno por servidor, para que los mensajes no compitan entre sí.","Solo si el núcleo se ejecuta en modo usuario junto con los servidores.","No, porque necesita una red para los mensajes."],"e":["Pregunta de la Sesión 4.","Funciona igual en una sola máquina.","No es necesario.","El micronúcleo sigue en modo núcleo.","Los mensajes los transporta el núcleo."]},{"s":"arq","c":"csdist","q":"¿Qué ventaja de fiabilidad aporta el modelo cliente-servidor?","o":["Un servidor puede fallar y reiniciarse sin afectar al resto del SO.","Si falla un servidor cae todo el sistema.","Se depura empezando por los niveles más bajos.","Elimina la necesidad de mensajes entre componentes porque comparten todo el espacio de memoria.","Que evita la multiprogramación, porque cada servidor se ejecuta solo en su propio procesador."],"e":["Cada servidor es un proceso independiente.","Es lo contrario.","Es una ventaja de las capas.","Se comunican por mensajes.","No tiene relación."]},{"s":"arq","c":"unix","q":"¿Cuál es una razón de la popularidad de UNIX planteada en la Sesión 4?","o":["Su portabilidad, al estar escrito casi por completo en C.","Que es monoprogramado.","Que no tiene sistema de archivos jerárquico.","Que solo funciona en un tipo de procesador, lo que lo hace más estable.","Que no permite redes, lo que lo hacía más seguro frente a los ataques remotos."],"e":["Además: multiusuario, shell potente y código fuente disponible.","Es multitarea desde su origen.","Sí lo tiene.","Es lo contrario: es portable.","Integra TCP/IP."]},{"s":"arq","c":"unix","q":"¿Cuál NO es una razón de la popularidad de UNIX?","o":["Que su código fuente nunca estuvo disponible fuera de la empresa que lo creó.","Que es multiusuario y multitarea.","Que tiene un intérprete de órdenes potente.","Que trata los dispositivos como archivos.","Que integra soporte de redes."],"e":["Sí es la respuesta: su disponibilidad para universidades favoreció su difusión.","Sí es una razón.","Sí es una razón.","Sí es una razón.","Sí es una razón."]},{"s":"usu","c":"usuarios","q":"Cuando actuamos como programadores de sistemas, ¿qué tipo de usuarios somos?","o":["Usuarios de las llamadas al sistema.","Usuarios del lenguaje de órdenes.","Administradores del hipervisor.","Usuarios del lenguaje de órdenes, porque los programas se compilan desde el terminal.","Ninguno de los dos: somos administradores del sistema, que es una tercera clase de usuario."],"e":["Pregunta de la Sesión 4.","Lo seríamos al teclear órdenes o lanzar scripts.","No es una de las dos clases.","La clasificación depende de cómo se accede al servicio.","Los apuntes solo distinguen dos clases; somos usuarios de las llamadas al sistema."]},{"s":"usu","c":"usuarios","q":"¿Qué relación hay entre las llamadas al sistema y las funciones accesibles con órdenes?","o":["Las llamadas al sistema son un superconjunto de ellas.","Son un subconjunto, porque las órdenes incluyen además funciones de gestión del sistema.","Son exactamente las mismas.","No tienen ninguna relación, porque las órdenes las ejecuta el hardware directamente.","Las órdenes dan más control."],"e":["Dan más control y acceso más directo al hardware, sobre todo a la E/S.","Es al revés.","Las llamadas ofrecen más.","Las órdenes usan los servicios del SO.","Es al revés."]},{"s":"usu","c":"ordenes","q":"¿Cómo obtienen los servicios del SO los usuarios del lenguaje de órdenes?","o":["Con órdenes en el terminal, en un entorno gráfico o en scripts (batch).","Solo mediante llamadas al sistema en sus programas.","Escribiendo sus órdenes directamente en la ROM para que el SO las ejecute al arrancar.","Mediante el hipervisor, que traduce sus órdenes a las de cada máquina virtual del sistema.","Solo con interfaces gráficas."],"e":["Los lenguajes de órdenes son específicos de cada sistema.","Eso es la otra clase de usuario.","No es posible.","No es lo descrito.","También terminal y scripts."]},{"s":"usu","c":"ordenes","q":"¿Qué afirmación sobre los lenguajes de órdenes es correcta?","o":["Son específicos de cada sistema, aunque sus funciones suelen parecerse.","Son iguales en todos los SO, porque las órdenes se definen en un estándar común.","Dan más control que las llamadas al sistema.","Solo permiten gestionar archivos, sin activar programas ni consultar información de estado.","No existen en sistemas con interfaz gráfica."],"e":["Es lo que dicen los apuntes.","Son específicos.","Es al revés.","Sus clases funcionales incluyen activar programas e información de estado.","Siguen existiendo."]},{"s":"virt","c":"vm","q":"¿Qué hace el hipervisor o VMM?","o":["Crea una abstracción del hardware del anfitrión y se la ofrece al SO de cada máquina virtual.","Comparte el kernel del anfitrión con cada aplicación.","Traduce direcciones virtuales a físicas.","Aísla procesos con cgroups y namespaces sobre el kernel de Linux.","Planifica los hilos de usuario de cada máquina virtual sobre los hilos del núcleo del anfitrión."],"e":["Es la definición de los apuntes.","Eso describe los contenedores.","Eso lo hace la MMU.","Eso es lo que usa Docker.","No es su función."]},{"s":"virt","c":"vm","q":"¿Puede Windows ejecutar aplicaciones construidas para otro SO?","o":["Sí, mediante una máquina virtual con ese SO como huésped.","No, nunca.","Sí, directamente, porque todas las llamadas al sistema son iguales.","Solo si el SO de la aplicación comparte el kernel de Windows mediante un contenedor.","Solo con overclocking."],"e":["Pregunta de la Sesión 4.","Con virtualización sí.","Cada SO tiene sus propias llamadas.","Un contenedor comparte el kernel del anfitrión, así que sirve para aplicaciones del mismo SO.","No tiene relación."]},{"s":"virt","c":"cont","q":"¿Qué caracteriza a un contenedor?","o":["Se instala sobre el SO anfitrión y comparte su kernel, binarios y librerías.","Tiene su propio SO completo.","Necesita un hipervisor que emule el hardware.","Ofrece aislamiento completo y por eso es más seguro que una máquina virtual.","Tarda minutos en arrancar porque tiene que iniciar su propio SO completo con su kernel."],"e":["Por eso es muy ligero.","Eso es una máquina virtual.","Eso es propio de las máquinas virtuales.","Su aislamiento es a nivel de proceso.","Arranca en milisegundos: comparte el kernel del anfitrión."]},{"s":"virt","c":"cont","q":"¿Qué características del kernel de Linux usa Docker para que cada contenedor se ejecute de forma independiente?","o":["cgroups y namespaces.","Un hipervisor integrado como ESXi.","Las fibras.","La tabla de páginas compartida, que permite que todos los contenedores vean la misma memoria.","El modo supervisor."],"e":["Aislamiento de recursos y espacios de nombres.","ESXi es un SO anfitrión de VMware para máquinas virtuales.","No las cita la Unidad 1.","No es lo que dicen los apuntes.","No es la característica citada."]},{"s":"virt","c":"vmcont","q":"¿Qué diferencia de virtualización hay entre máquinas virtuales y contenedores?","o":["La VM virtualiza a nivel de hardware; el contenedor, a nivel de SO.","Ambas virtualizan a nivel de hardware.","La VM virtualiza el SO y el contenedor el hardware.","Ninguna virtualiza: las dos ejecutan las aplicaciones sobre el hardware real sin capas intermedias.","La VM no tiene SO propio: ejecuta sus aplicaciones sobre el kernel del anfitrión."],"e":["Es una fila de la tabla comparativa.","El contenedor virtualiza el SO.","Es al revés.","Ambas virtualizan.","Cada VM tiene su propio SO; eso describe los contenedores."]},{"s":"virt","c":"vmcont","q":"¿Qué afirmación de la comparativa entre máquinas virtuales y contenedores es correcta?","o":["La máquina virtual está completamente aislada y es más segura.","El contenedor tiene rendimiento limitado y la VM nativo.","La máquina virtual arranca en milisegundos porque reutiliza el SO del anfitrión.","El contenedor es más pesado porque incluye su propio SO completo además de la aplicación.","Los contenedores no comparten SO."],"e":["El contenedor aísla a nivel de proceso.","Es al revés.","Arranca en minutos.","Es ligero: comparte el SO anfitrión.","Comparten el SO anfitrión."]},{"s":"unid","c":"kib","q":"¿Cuántos bytes son 1 KiB?","o":["2^10 = 1024 bytes.","10^3 = 1000 bytes.","2^20 bytes.","1024 bits, porque las unidades binarias se expresan en bits.","10^6 bytes."],"e":["Es una unidad binaria de ISO/IEC 80000-13.","Eso es 1 KB en el Sistema Internacional.","Eso es 1 MiB.","Son bytes.","Eso es 1 MB."]},{"s":"unid","c":"kib","q":"Un disco anunciado como 1 TB aparece en el SO como unos 931 GiB. ¿Por qué?","o":["El fabricante usa 10^12 bytes y el SO cuenta en GiB (2^30 bytes).","Porque el SO reserva un 7 % para sí mismo.","Porque 1 TB son 2^40 bytes y el SO cuenta en GB decimales.","Porque parte del disco se usa como memoria virtual y no se cuenta como espacio libre.","Porque el SO formatea el disco con sectores más grandes de los que usa el fabricante."],"e":["10^12 / 2^30 ≈ 931.","La diferencia viene de las unidades.","Es al revés.","No explica la diferencia.","La diferencia viene de las unidades, no del formato."]},{"s":"unid","c":"hzpal","q":"¿Por qué la velocidad en Hz no es una buena forma de comparar procesadores?","o":["Porque unos necesitan varios ciclos por instrucción y otros ejecutan varias por ciclo.","Porque los Hz miden el tamaño de la caché del procesador y no la velocidad de su reloj interno.","Porque todos los procesadores tienen la misma frecuencia.","Porque los Hz solo son válidos para medir la velocidad de la memoria DDR y no la de la CPU.","Porque los Hz no tienen relación con la velocidad."],"e":["Es la razón de los apuntes.","Miden ciclos de reloj por segundo.","No es cierto.","Miden la frecuencia del reloj de la CPU.","Sí tienen relación, pero no permiten comparar."]},{"s":"unid","c":"hzpal","q":"¿Qué es una palabra en un ordenador?","o":["Una cadena de bits que el ordenador usa como unidad, típicamente de 16, 32 o 64 bits.","Siempre 8 bits en cualquier arquitectura, igual que un byte, para que los tipos de datos sean portables.","El tamaño de una página de memoria virtual.","Un número de bits fijo e igual en todas las arquitecturas, para que los programas sean portables.","Un carácter de texto."],"e":["Se usa en transferencias CPU-memoria, registros y tipos de datos.","Eso es un byte.","No es la definición.","Varía entre arquitecturas.","No es la definición."]}]},"2":{"n":2,"nombre":"Comunicación y sincronización de procesos","secs":{"conc":["Introducción y condiciones de carrera","Unidad 2 §2.1–2.2.1 y Sesión 5"],"sc":["Exclusión mutua y secciones críticas","Unidad 2 §2.2.2 y Sesión 5"],"sync":["Sincronización, comunicación, interbloqueo y alternación","Unidad 2 §2.2.3–2.2.6 y Sesiones 5–6"],"prob":["Problemas típicos","Unidad 2 §2.3"],"hw":["Inhabilitar interrupciones y TSL","Unidad 2 §2.4.1–2.4.2 y Sesión 6"],"sen":["Señales","Unidad 2 §2.4.3"],"sem":["Semáforos","Unidad 2 §2.4.4 y Sesiones 6–7"],"mon":["Monitores","Unidad 2 §2.4.5 y Sesión 8"],"tub":["Tuberías","Unidad 2 §2.4.6"],"msg":["Paso de mensajes y memoria compartida","Unidad 2 §2.4.7–2.4.8 y Sesión 8"]},"qs":[{"s":"conc","c":"coop","q":"¿Por qué los procesos suelen ser independientes entre sí?","o":["Por seguridad: no deben interferir unos con otros.","Porque el hardware no permite que compartan memoria bajo ningún concepto.","Porque cada proceso necesita su propio procesador.","Porque la comunicación entre procesos está prohibida en los SO multiprogramados actuales.","Por eficiencia, ya que cooperar siempre es más lento."],"e":["Eso permite además ejecutarlos de forma concurrente.","Pueden compartir memoria con los servicios del SO.","Varios procesos pueden compartir un procesador.","El SO ofrece servicios de comunicación y sincronización.","No es la razón que dan los apuntes."]},{"s":"conc","c":"coop","q":"¿Qué diferencia hay entre comunicación y sincronización de procesos?","o":["Comunicar es intercambiar datos y órdenes; sincronizar es coordinar el orden de sus acciones.","Son sinónimos: los dos términos designan el intercambio de datos y órdenes entre procesos que cooperan.","La comunicación coordina el orden de ejecución y la sincronización intercambia datos.","La sincronización solo existe en multiprocesadores y la comunicación solo en uniprocesadores.","La comunicación necesita siempre memoria compartida."],"e":["Ambas son necesarias cuando los procesos cooperan.","Los apuntes las distinguen.","Es al revés.","No dependen del número de CPU.","También hay archivos, tuberías y mensajes."]},{"s":"conc","c":"recursos","q":"¿Cuál de estos es un recurso no compartible?","o":["Un archivo de escritura.","La CPU.","Un archivo de solo lectura.","Un área de memoria no modificable que contiene el código de un programa usado por varios.","El código reentrante de un compilador."],"e":["La acción de un proceso interferiría en la de otro.","Es compartible.","Es compartible: nadie lo modifica.","Es compartible.","Se comparte entre procesos."]},{"s":"conc","c":"recursos","q":"¿Puede un archivo con permisos de solo lectura ser un recurso compartible?","o":["Sí, porque nadie lo modifica y el resultado no depende del orden.","No, ningún archivo es compartible.","Solo si lo usa un único proceso cada vez mediante exclusión mutua.","No, porque la lectura de un archivo es una operación de E/S y la E/S nunca se comparte entre procesos.","Solo en monoprogramación."],"e":["Pregunta de la Sesión 5.","Los archivos de lectura son compartibles.","Al no modificarse, no hace falta exclusión mutua.","Los apuntes citan los archivos de lectura como compartibles.","En monoprogramación no hay varios procesos que compartan."]},{"s":"conc","c":"carrera","q":"¿Cuándo se produce una condición de carrera?","o":["Cuando procesos comparten un recurso que leen y escriben y el resultado depende del orden.","Cuando dos procesos compiten por la CPU.","Cuando un proceso espera indefinidamente un recurso que otro proceso nunca llega a liberar.","Cuando dos procesos leen a la vez un archivo de solo lectura que comparten varios usuarios.","Cuando se agota el quantum de un proceso mientras está escribiendo en un recurso que comparte con otros."],"e":["Es la definición de los apuntes.","Competir por la CPU no basta.","Eso es inanición o interbloqueo.","Sin escritura no depende del orden.","Agotar el quantum no basta: hace falta que el resultado dependa del orden."]},{"s":"conc","c":"carrera","q":"¿Pueden darse condiciones de carrera en monoprogramación?","o":["No.","Sí, siempre que haya E/S.","Sí, entre el proceso y el SO, porque ambos acceden a la memoria principal a la vez.","Solo con interrupciones de reloj.","Solo si el programa usa hilos."],"e":["Los apuntes indican que este problema no sucede en monoprogramación.","Con un solo proceso no hay otro que compita.","No es lo que dicen los apuntes.","No es el caso.","Los apuntes no lo plantean así."]},{"s":"conc","c":"spooler","q":"En el ejemplo del spooler de impresora, ¿qué indica la variable IN?","o":["La próxima ranura libre del directorio.","El próximo archivo a imprimir.","El número de archivos ya impresos.","El identificador del proceso que tiene la impresora asignada en ese momento.","El tamaño del directorio."],"e":["OUT indica el próximo archivo a imprimir.","Eso es OUT.","No es su significado.","No es su significado.","No es su significado."]},{"s":"conc","c":"spooler","q":"A lee IN = 7 y se cambia a B; B guarda su archivo en la ranura 7 y pone IN = 8; vuelve A. ¿Qué ocurre?","o":["A guarda su archivo en la ranura 7, pisa el de B y el archivo de B nunca se imprime.","A detecta el cambio y usa la ranura 8.","Se imprimen ambos archivos en orden.","El SO detecta la condición de carrera y bloquea a B hasta que A termine de escribir su archivo.","Se produce un interbloqueo, porque A y B esperan a que el otro termine de escribir en la ranura 7."],"e":["Es el resultado del ejemplo.","A usa el valor que leyó antes del cambio.","El de B se pierde.","Sin exclusión mutua nada lo detecta.","No hay espera circular."]},{"s":"sc","c":"scdef","q":"¿Qué es una sección crítica?","o":["Un fragmento de código que accede a recursos no compartibles.","Un proceso que tiene la máxima prioridad.","La parte del SO que se ejecuta en modo núcleo.","Una zona de memoria que el hardware protege contra cualquier escritura de los procesos.","El código que se ejecuta con las interrupciones inhabilitadas."],"e":["Es la definición de los apuntes.","No es la definición.","No es la definición.","No es la definición.","Es una forma de proteger una sección crítica, no su definición."]},{"s":"sc","c":"scdef","q":"¿Qué es la exclusión mutua?","o":["Asegurar que un recurso no compartible lo use un solo proceso a la vez.","Impedir que dos procesos se comuniquen mientras alguno de ellos usa un recurso compartido.","Ejecutar los procesos estrictamente por turnos alternos, aunque uno de ellos no necesite el recurso.","Asignar a cada proceso su propio procesador.","Bloquear a todos los procesos menos al de mayor prioridad."],"e":["Evita las condiciones de carrera.","No es la definición.","Eso es la alternación estricta.","No es la definición.","No es la definición."]},{"s":"sc","c":"variassc","q":"¿Pueden ejecutarse a la vez dos secciones críticas diferentes que no usan las mismas variables compartidas?","o":["Sí: la exclusión mutua solo se exige entre secciones críticas del mismo recurso.","No, nunca puede haber dos secciones críticas a la vez.","Solo si las protege el mismo semáforo.","Solo en sistemas con varios procesadores, porque en uno solo la exclusión mutua se aplica a todo el código.","Solo si están en el mismo proceso, porque la exclusión mutua se aplica entre procesos distintos."],"e":["Pregunta de la Sesión 5.","Solo se excluyen las del mismo recurso.","Cada recurso se protege con su propio mecanismo.","No depende del número de CPU.","No es la condición."]},{"s":"sc","c":"variassc","q":"¿Qué aportan las secciones críticas condicionales?","o":["Sincronización además de exclusión mutua: se entra solo si se cumple una condición.","Permiten que varios procesos estén a la vez en la misma sección crítica.","Eliminan la necesidad de exclusión mutua.","Obligan al proceso a mantener el recurso bloqueado mientras espera a que se cumpla la condición.","Solo sirven en monoprogramación, porque con varios procesos la condición podría cambiar mientras se comprueba."],"e":["El proceso espera en una cola especial sin impedir que otros usen el recurso.","Siguen garantizando la exclusión mutua.","La mantienen.","Precisamente no impiden que otros usen el recurso.","No es así."]},{"s":"sc","c":"condiciones","q":"¿Cuál NO es una de las cuatro condiciones para evitar las condiciones de carrera?","o":["Conocer la velocidad de los procesos y el número de CPU.","Dos procesos no pueden estar a la vez en sus secciones críticas.","Un proceso parado fuera de su sección crítica no bloquea a otros.","Ningún proceso espera mucho tiempo para entrar en su sección crítica.","No hacer suposiciones sobre las velocidades de los procesos."],"e":["Sí es la respuesta: la condición es no hacer suposiciones sobre ellos.","Sí es una condición.","Sí es una condición.","Sí es una condición.","Sí forma parte de una condición."]},{"s":"sc","c":"condiciones","q":"¿Por qué un proceso no debe bloquearse dentro de su propia sección crítica?","o":["Porque normalmente provoca un interbloqueo.","Porque provoca una condición de carrera.","Porque el SO lo termina automáticamente.","Porque las secciones críticas se ejecutan con las interrupciones inhabilitadas y el bloqueo es imposible.","Porque pierde su prioridad y el planificador lo manda al final de la cola de preparados."],"e":["Por eso las secciones críticas deben ser lo más rápidas posible.","La exclusión mutua sigue, pero los demás no pueden entrar.","No es lo que dicen los apuntes.","No es la razón dada.","No es la razón."]},{"s":"sc","c":"peterson","q":"¿Qué caracteriza al algoritmo de Peterson?","o":["Es una solución software para 2 procesos que usa espera ocupada.","Es una solución hardware basada en TSL, válida para cualquier número de procesos.","Sirve para cualquier número de procesos sin espera ocupada.","Bloquea al proceso en una cola del semáforo en vez de gastar tiempo de CPU mientras espera entrar.","Es un mecanismo del núcleo para enviar señales."],"e":["Es la descripción de los apuntes.","Es software.","Solo 2 procesos y con espera ocupada.","Usa espera ocupada.","No tiene relación."]},{"s":"sc","c":"peterson","q":"¿Qué es la espera ocupada (busy waiting)?","o":["Seguir intentando entrar en la sección crítica hasta agotar el tiempo de CPU.","Bloquear al proceso en una cola hasta que se libere el recurso.","Esperar a que termine una E/S en estado bloqueado.","Dormir al proceso un tiempo fijo y comprobar después si el recurso está libre.","Ceder voluntariamente la CPU a otro proceso hasta que el recurso quede libre."],"e":["También se llama espera activa.","Eso es lo que hacen semáforos y mensajes.","No es espera ocupada.","No es la definición.","Es lo contrario."]},{"s":"sync","c":"sincdef","q":"Para sumar los 100 primeros naturales, A suma del 1 al 50 y B del 51 al 100. ¿Qué necesita el proceso principal?","o":["Sincronizarse: esperar a que A y B terminen para calcular TOTAL = A + B.","Exclusión mutua sobre A y B, para que no sumen a la vez sobre la misma variable TOTAL.","Nada, puede calcular el total en cualquier momento.","Un monitor que reparta los números entre A y B para que ninguno sume dos veces el mismo valor.","Inhabilitar las interrupciones."],"e":["Es el ejemplo de sincronización de los apuntes.","No comparten variables modificables.","Necesita los resultados de A y B.","El reparto es fijo; lo necesario es esperar.","No resuelve la espera."]},{"s":"sync","c":"sincdef","q":"¿Cuál de estos mecanismos NO aparece entre los de sincronización en los apuntes?","o":["La memoria compartida.","Los semáforos.","Las señales.","Los monitores.","Los mutex y las variables condicionales."],"e":["Sí es la respuesta: aparece solo entre los mecanismos de comunicación.","Sí es de sincronización.","Sí es de sincronización.","Sí es de sincronización.","Sí es de sincronización."]},{"s":"sync","c":"comunic","q":"¿Qué mecanismos sirven a la vez para sincronización y para comunicación?","o":["Las tuberías y el paso de mensajes.","Los semáforos y los monitores.","Los archivos y la memoria compartida.","Las señales, porque además de avisar a otro proceso pueden transportar cualquier dato.","Solo la memoria compartida."],"e":["Son los dos que aparecen en ambas listas.","Solo sincronizan.","Solo comunican.","Los apuntes las citan solo para sincronizar.","Solo comunica."]},{"s":"sync","c":"comunic","q":"¿Cuál de estos es un mecanismo de comunicación según los apuntes?","o":["Los archivos.","Los semáforos.","Los monitores.","La inhabilitación de interrupciones, que permite pasar datos entre procesos sin que el SO intervenga.","La instrucción TSL."],"e":["Junto con tuberías, paso de mensajes y memoria compartida.","Son de sincronización.","Son de sincronización.","Es una solución de exclusión mutua.","Es de exclusión mutua."]},{"s":"sync","c":"interbloqueo","q":"¿Pueden producirse interbloqueos con tres procesos ejecutándose concurrentemente?","o":["Sí: A espera a B, B espera a C y C espera a A.","No, solo pueden darse entre dos procesos que compiten por exactamente dos recursos.","Solo si hay un solo procesador.","No, porque con tres procesos siempre queda uno libre que puede liberar los recursos de los demás.","Solo con semáforos binarios."],"e":["Pregunta de la Sesión 6.","Pueden darse con más.","No depende de las CPU.","Pueden bloquearse los tres en cadena.","No depende del mecanismo."]},{"s":"sync","c":"interbloqueo","q":"¿Puede producirse un interbloqueo cuando los procesos tienen acceso exclusivo a un dispositivo?","o":["Sí: el acceso exclusivo es lo que lo hace posible.","No, el acceso exclusivo lo impide.","Solo si el dispositivo es compartible.","No, porque el SO asigna los dispositivos en orden de llegada y nunca hay espera circular.","Solo en sistemas distribuidos, donde cada dispositivo está en una máquina distinta."],"e":["Pregunta de la Sesión 6: cada uno retiene un dispositivo y espera el de otro.","Es justo lo que lo provoca.","Con recursos compartibles no habría interbloqueo.","Puede haberla.","No es una condición."]},{"s":"sync","c":"alternacion","q":"¿Cuál es el inconveniente de la alternación estricta?","o":["Un proceso puede
