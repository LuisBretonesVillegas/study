/* ---------- Sección ---------- */
function renderArea(id){
  const a = AREAS.find(x=>x.id===id);
  let list = inArea(id);
  let chips = "";
  if (id==="udemy"){
    chips = `<div class="chips">${Object.entries(TYPES).map(([k,t])=>`<button class="chip ${typeFilter.has(k)?"on":""}" data-t="${k}" style="${cv(k)}">${t.label}</button>`).join("")}</div>`;
    if (typeFilter.size) list = list.filter(d=>typeFilter.has(d.type));
  }
  if (id==="liang"){
    chips = `<div class="chips">${PRIORITY.map((p,k)=>`<button class="chip ${prioFilter.has(k)?"on":""}" data-p="${k}" style="${pv(k)}">${p.label}</button>`).join("")}</div>`
      + `<div class="chips" style="margin-top:0">${LEVELS.map((l,k)=>`<button class="chip ${levelFilter.has(k)?"on":""}" data-l="${k}" style="${lv(k)}">${l.label}</button>`).join("")}</div>`;
    if (prioFilter.size) list = list.filter(d=>prioFilter.has(d.priority));
    if (levelFilter.size) list = list.filter(d=>levelFilter.has(d.level));
  }
  let html = `<div class="page"><div class="kicker">Sección</div><h1 class="title-xl">${a.name}</h1><p class="intro">${a.desc}</p>${chips}`;
  let n = 0;
  for (const [sub, ds] of groupBy(list)){
    const sp = splitSub(sub), unit = id==="udemy"||id==="liang" ? (ds.length===1?"ejercicio":"ejercicios") : (ds.length===1?"apunte":"apuntes");
    html += `<div class="block">${sp.kick?`<div class="subkick">${esc(sp.kick)}</div>`:""}<div class="subhead"><h2>${esc(sp.title)}</h2><span class="count">${ds.length} ${unit}</span></div><div class="list">` + ds.map(d=>`<a class="row" href="#/${d.key}">
      <span class="n">${String(++n).padStart(2,"0")}</span><b>${esc(d.title)}</b><span class="go">Leer →</span>
      ${d.desc?`<p>${esc(d.desc)}</p>`:""}${d.type?`<span class="tags"><span class="tag" style="${cv(d.type)}">${TYPES[d.type].label.toLowerCase()}</span>${levelTags(d)}${d.files.length>1?`<span class="tag" style="--c:var(--text-muted);--cl:var(--line)">${d.files.length} archivos</span>`:""}</span>`:""}
    </a>`).join("") + `</div></div>`;
  }
  if (!list.length) html += `<p class="empty" style="margin-top:30px">No hay ejercicios de ese tipo.</p>`;
  app.innerHTML = html + `</div>`;
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    const [set, k] = b.dataset.p!==undefined ? [prioFilter, +b.dataset.p] : b.dataset.l!==undefined ? [levelFilter, +b.dataset.l] : [typeFilter, b.dataset.t];
    set.has(k)?set.delete(k):set.add(k); renderArea(id);
  });
}

// etiquetas de prioridad, dificultad y nota de los ejercicios de Liang
const levelTags = d => (d.priority!=null ? `<span class="tag" style="${pv(d.priority)}">${PRIORITY[d.priority].label.toLowerCase()}</span>` : "")
  + (d.level!=null ? `<span class="tag" style="${lv(d.level)}">${LEVELS[d.level].label.toLowerCase()}</span>` : "")
  + (d.note ? `<span class="tag" style="--c:var(--text-muted);--cl:var(--line)">${esc(d.note.toLowerCase())}</span>` : "");

/* ---------- Búsqueda ---------- */
function renderSearch(q){
  const s = document.getElementById("search"); if (document.activeElement!==s) s.value = q;
  const ql = q.toLowerCase(), re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
  const hits = [];
  if (q) for (const d of docs){
    const text = d.files.map(f=>cache.get(f.path)?.text||"").join("\n");
    const inTitle = d.title.toLowerCase().includes(ql), i = text.toLowerCase().indexOf(ql);
    if (!inTitle && i<0) continue;
    const count = (text.match(re)||[]).length;
    let snip = "";
    if (i>=0){ const a=Math.max(0,i-70); snip=(a?"…":"")+text.slice(a,i+q.length+90).replace(/\s+/g," ")+"…"; }
    hits.push({d,count:count+(inTitle?100:0),snip});
  }
  hits.sort((a,b)=>b.count-a.count);
  app.innerHTML = `<div class="page"><div class="kicker">Búsqueda</div><h1 class="title-xl">«${esc(q)}»</h1>
    <p class="intro">${hits.length} ${hits.length===1?"apunte":"apuntes"} con coincidencias.</p>
    <div class="list" style="margin-top:28px">${hits.map((h,i)=>`<a class="row" href="#/${h.d.key}?q=${encodeURIComponent(q)}">
      <span class="n">${String(i+1).padStart(2,"0")}</span><b>${esc(h.d.title)}</b><span class="go">${AREAS.find(a=>a.id===h.d.area).name} →</span>
      ${h.snip?`<div class="snippet">${esc(h.snip).replace(new RegExp(re.source,"gi"),m=>`<mark>${m}</mark>`)}</div>`:""}</a>`).join("")}</div></div>`;
}

/* ---------- Documento ---------- */
async function renderDoc(d, q){
  let body = "";
  for (const f of d.files){
    const text = await getText(f), name = f.path.split("/").pop();
    if (name.endsWith(".md")) body += marked.parse(text);
    else if (isStatement(f.path)) body += `<h2>Enunciado</h2><div class="statement">${esc(text.trim())}</div>`;
    else {
      const m = text.match(/^\s*\/\*([\s\S]*?)\*\/\s*/), single = d.files.length === 1;
      const stmt = m ? (d.area==="liang" ? liangHead(m[1]).rest : m[1]) : "";
      if (m && single) body += `<h2>Enunciado</h2><div class="statement">${esc(stmt.replace(/^\s*\* ?/gm,"").trim())}</div>`;
      body += `${single?"<h2>Solución</h2>":""}<div class="filehead">${esc(name)}</div><pre><code class="language-java">${esc(m && single ? text.slice(m[0].length) : text)}</code></pre>`;
    }
  }
  if (!d.key.endsWith(".md")) body = `<h1>${esc(d.title)}</h1>` + body;

  const area = AREAS.find(a=>a.id===d.area), list = inArea(d.area), idx = list.indexOf(d);
  let side = `<div class="eyebrow">Sección</div><a class="area" href="#s/${area.id}">${area.name}</a>`;
  for (const [sub, ds] of groupBy(list)){
    const collapse = (d.area==="udemy"||d.area==="liang") && sub!==d.sub;      // en Udemy y Liang solo se despliega la sección actual
    side += collapse
      ? `<a class="sub closed" href="#/${ds[0].key}">${subLabel(sub)} <span style="font:500 11px var(--mono)">(${ds.length})</span></a>`
      : `<div class="sub">${subLabel(sub)}</div>` + ds.map(x=>`<a class="it ${x===d?"on":""}" href="#/${x.key}">${esc(x.title)}</a>`).join("");
  }
  const prev = list[idx-1], next = list[idx+1];
  const pager = `<div class="pager">${prev?`<a href="#/${prev.key}"><span class="eyebrow">← Anterior</span><b>${esc(prev.title)}</b></a>`:""}${next?`<a class="next" href="#/${next.key}"><span class="eyebrow">Siguiente →</span><b>${esc(next.title)}</b></a>`:""}</div>`;

  app.innerHTML = `<div class="layout">
    <aside class="side">${side}</aside>
    <article class="content"><div class="kicker">${area.name} // ${esc(d.sub)}</div><div class="md">${body}</div>${pager}</article>
    <aside class="toc" id="toc"></aside></div>`;
  const md = app.querySelector(".md");

  const h1 = md.querySelector("h1");
  const tags = d.type ? `<span class="tag" style="${cv(d.type)}">${TYPES[d.type].label.toLowerCase()}</span>${levelTags(d)}` : "";
  h1?.insertAdjacentHTML("afterend", `<div class="meta">${tags}<span class="path">src/${esc(d.key)} · editado ${new Date(d.mtime/1e6).toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"})}</span></div>`);
  md.querySelectorAll("pre code").forEach(el=>hljs.highlightElement(el));

  // enlaces relativos entre apuntes y anclas internas
  const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9\s-]/g,"").trim().replace(/\s+/g,"-");
  const hs = [...md.querySelectorAll("h2,h3")]; hs.forEach(h=>{ if(!h.id) h.id = slug(h.textContent); });
  const jump = id => md.querySelector("#"+CSS.escape(id))?.scrollIntoView({behavior:"smooth",block:"start"});
  md.querySelectorAll("a[href]").forEach(a=>{
    const href = a.getAttribute("href");
    if (/^https?:/.test(href)) { a.target = "_blank"; return; }
    if (href.startsWith("#")) { a.onclick = e=>{ e.preventDefault(); jump(href.slice(1)); }; return; }
    const base = d.key.split("/").slice(0,-1);
    for (const part of href.split("#")[0].split("/")) part===".."?base.pop():part!=="."&&base.push(part);
    const target = decodeURIComponent(base.join("/"));
    if (byKey(target)) a.setAttribute("href","#/"+target);
  });

  // índice derecho con seguimiento de la sección visible
  const h2s = hs.filter(h=>h.tagName==="H2");
  const toc = document.getElementById("toc");
  if (h2s.length >= 2){
    toc.innerHTML = `<span class="eyebrow">En esta página</span>` + h2s.map(h=>`<a href="#${h.id}" data-id="${h.id}">${esc(h.textContent)}</a>`).join("");
    toc.querySelectorAll("a").forEach(a=>a.onclick=e=>{ e.preventDefault(); jump(a.dataset.id); });
    const obs = new IntersectionObserver(es=>{
      for (const e of es) if (e.isIntersecting){
        toc.querySelectorAll("a").forEach(a=>a.classList.toggle("on", a.dataset.id===e.target.id));
      }
    }, {rootMargin:"-70px 0px -70% 0px"});
    h2s.forEach(h=>obs.observe(h));
  }

  // resaltar término de búsqueda
  if (q){
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"), t = new RegExp(re.source,"i");
    const w = document.createTreeWalker(md, NodeFilter.SHOW_TEXT), nodes=[];
    while (w.nextNode()) if (t.test(w.currentNode.nodeValue)) nodes.push(w.currentNode);
    for (const n of nodes){ const s=document.createElement("span"); s.innerHTML=esc(n.nodeValue).replace(re,m=>`<mark>${m}</mark>`); n.replaceWith(s); }
    md.querySelector("mark")?.scrollIntoView({block:"center"});
  }
}

async function poll(){
  // Versión estática (study.luisbretones.dev): los apuntes vienen incrustados y no hay servidor.
  if (window.EMBEDDED){
    files = window.EMBEDDED.files.map(f=>{ cache.set(f.path,{mtime:f.mtime,text:f.text}); return {path:f.path, mtime:f.mtime}; });
    build(); await render(false); return;
  }
  try{
    const first = !sig;
    const list = await (await fetch(first ? "/api/tree?full=1" : "/api/tree")).json();
    for (const f of list) if (f.text !== undefined){ cache.set(f.path,{mtime:f.mtime,text:f.text}); delete f.text; }
    const s = list.map(f=>f.path+":"+f.mtime).join("|");
    if (s !== sig){
      files = list;
      await Promise.all(files.map(getText));   // títulos, descripciones y búsqueda
      build();
      await render(!first);
      sig = s;                                 // solo se marca como visto si se ha pintado bien
    }
  }catch(e){ console.warn("Visor:", e); }      // servidor parado o error: se reintenta
  setTimeout(poll, 1200);
}
poll();
</script>
</body>
</html>
