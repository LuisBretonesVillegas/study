<style>
/* Tokens de luisbretones.dev */
:root{
  --bg:#f5f0e8; --bg-card:#ede8df; --text:#111111; --text-2:#2a2a2a; --text-muted:#616874;
  --accent:#1a5c00; --accent-line:rgba(26,92,0,.35); --accent-soft:rgba(26,92,0,.07);
  --line:rgba(17,17,17,.09);
  --serif:"Playfair Display",Georgia,serif; --sans:"DM Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --c-green:#1a5c00; --c-green-l:rgba(26,92,0,.4);
  --c-blue:#336aa1;  --c-blue-l:#a3c4e8;
  --c-orange:#a25125;--c-orange-l:#dda882;

}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
::selection{background:rgba(26,92,0,.18)}
.eyebrow{font:600 13px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
.kicker{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1,h2,h3,.serif{font-variant-numeric:lining-nums}

/* ---------- Cabecera ---------- */
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);height:var(--header)}
.bar{max-width:1320px;height:100%;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:32px}
.brand{text-decoration:none;line-height:1.15;flex:none}
.brand b{display:block;font-weight:500;font-size:15px}
.brand small{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.tabs{display:flex;gap:24px;height:100%}
.tabs a{display:flex;align-items:center;font-size:13.6px;font-weight:500;color:var(--text-muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--text)}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}
#search{margin-left:auto;width:240px;padding:7px 12px;border:1px solid var(--line);border-radius:2px;background:transparent;color:var(--text);font:14px var(--sans)}
#search:focus{outline:none;border-color:var(--accent-line)}
#menuBtn{display:none;background:none;border:1px solid var(--accent-line);color:var(--accent);border-radius:2px;padding:5px 10px;font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase}

/* ---------- Contenedores ---------- */
.page{max-width:1040px;margin:0 auto;padding:56px 24px 100px}
.layout{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr) 210px;gap:48px;padding:0 24px}
.side{position:sticky;top:var(--header);align-self:start;max-height:calc(100vh - var(--header));overflow-y:auto;padding:36px 0 40px}
.content{padding:40px 0 100px;min-width:0}
.toc{position:sticky;top:var(--header);align-self:start;max-height:calc(100vh - var(--header));overflow-y:auto;padding:40px 0}

/* lateral de la sección */
.side .area{font:700 22px var(--serif);text-decoration:none;display:block;margin:4px 0 18px}
.side .sub{display:block;margin:26px 0 8px;font:700 17px/1.3 var(--serif);color:var(--text);text-decoration:none}
.side .sub small{display:block;font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.side a.sub.closed{color:var(--text-muted);font-size:15px;margin:14px 0 4px}
.side a.sub.closed:hover{color:var(--text)}
.subhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 6px}
.subhead h2{font:800 clamp(28px,3.6vw,36px)/1.15 var(--serif);letter-spacing:-.015em;margin:0}
.subhead .count{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
.subkick{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.side a.it{display:block;padding:6px 10px;margin-left:-12px;border-left:2px solid transparent;font-size:14px;line-height:1.4;color:var(--text-muted);text-decoration:none}
.side a.it:hover{color:var(--text)}
.side a.it.on{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft);font-weight:500}

/* índice derecho */
.toc .eyebrow{margin-bottom:10px;display:block}
.toc a{display:block;font-size:13px;line-height:1.4;color:var(--text-muted);text-decoration:none;padding:4px 0 4px 12px;border-left:1px solid var(--line)}
.toc a:hover{color:var(--text)}
.toc a.on{color:var(--accent);border-left:2px solid var(--accent);padding-left:11px}

/* ---------- Documento ---------- */
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:-6px 0 34px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.meta .path{font:500 12px var(--mono);color:var(--text-muted);word-break:break-all}
.tag{font:500 12px var(--mono);padding:2px 7px;border-radius:2px;color:var(--c);border:1px solid var(--cl);white-space:nowrap}
.md{max-width:760px}
.md h1{font:800 clamp(32px,4.6vw,44px)/1.12 var(--serif);letter-spacing:-.02em;margin:10px 0 22px}
.md h2{font:700 25px/1.25 var(--serif);margin:2.3em 0 .7em;scroll-margin-top:calc(var(--header) + 20px)}
.md h3{font:600 17px var(--sans);margin:1.7em 0 .5em;scroll-margin-top:calc(var(--header) + 20px)}
.md p,.md li{color:var(--text-2)}
.md a{color:var(--accent);text-underline-offset:3px}
.md strong{font-weight:600;color:var(--text)}
.md hr{border:0;border-top:1px solid var(--line);margin:2.6em 0}
.md table{border-collapse:collapse;width:100%;margin:16px 0 24px;font-size:14px;display:block;overflow-x:auto;background:rgba(255,255,255,.35);border:1px solid var(--line)}
.md th{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);text-align:left;background:var(--bg-card);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.md td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.md tr:last-child td{border-bottom:0}
.md code{font:500 .86em var(--mono);background:var(--bg-card);padding:1px 5px;border-radius:2px;overflow-wrap:anywhere}
.md pre code{overflow-wrap:normal}
.md pre{background:var(--bg-card);border:1px solid var(--line);padding:16px 18px;border-radius:2px;overflow-x:auto;font-size:13px;line-height:1.6}
.md pre code{background:none;padding:0;font-size:inherit}
.md pre code.hljs{background:transparent;padding:0}
.md blockquote{margin:18px 0;padding:12px 18px;border-left:2px solid var(--accent);background:var(--accent-soft)}
.md blockquote p{margin:.3em 0}
.md mark{background:rgba(26,92,0,.2);color:inherit;padding:0 1px;border-radius:2px}
.btns{display:flex;gap:10px;margin:26px 0 4px;flex-wrap:wrap}
.btn{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:10px 15px;border-radius:2px;text-decoration:none;border:1px solid var(--accent)}
.btn.solid{background:var(--accent);color:var(--bg)}
.btn.ghost{color:var(--accent)}
.md details{margin:26px 0;border:1px solid var(--accent-line);border-radius:3px;background:rgba(255,255,255,.3)}
.md details>summary{cursor:pointer;list-style:none;padding:14px 18px;font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.md details>summary::-webkit-details-marker{display:none}
.md details>summary::before{content:"+ "}
.md details[open]>summary::before{content:"− "}
.md details[open]>summary{border-bottom:1px solid var(--line)}
.md details>*:not(summary){margin-left:18px;margin-right:18px}
.md details>pre{margin-left:18px;margin-right:18px}
.md details>:last-child{margin-bottom:18px}
.statement{white-space:pre-wrap;background:var(--bg-card);border:1px solid var(--line);border-left:2px solid var(--accent);padding:18px 20px;border-radius:2px;font-size:14.5px;color:var(--text-2)}
.filehead{font:500 12px var(--mono);letter-spacing:.06em;color:var(--accent);margin:28px 0 8px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:760px;margin-top:64px;padding-top:28px;border-top:1px solid var(--line)}
.pager a{display:block;text-decoration:none;border:1px solid var(--line);border-radius:3px;padding:14px 16px;background:rgba(255,255,255,.28)}
.pager a:hover{border-color:var(--accent-line)}
.pager a.next{text-align:right;grid-column:2}
.pager b{display:block;font:700 16px/1.3 var(--serif);margin-top:4px}

/* ---------- Portada y secciones ---------- */
.hero h1{font:800 clamp(42px,6.5vw,62px)/1.05 var(--serif);letter-spacing:-.02em;margin:10px 0 12px}
.hero .sub{color:var(--text-muted);font-size:17px;margin:0 0 6px}
.hero p{color:#3a3a3a;max-width:580px}
.block{margin-top:56px;padding-top:30px;border-top:1px solid var(--line)}
.steps{counter-reset:s;margin-top:14px;border:1px solid var(--line);border-radius:3px;background:rgba(255,255,255,.28)}
.steps a{counter-increment:s;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:6px 14px;padding:16px 20px;text-decoration:none;border-bottom:1px solid var(--line)}
.steps a:last-child{border-bottom:0}
.steps a::before{content:counter(s,decimal-leading-zero);font:600 12px var(--mono);color:var(--accent)}

.steps b{font:700 18px/1.3 var(--serif);display:block}
.steps small{color:var(--text-muted);font-size:14px}
.go{font:600 12px var(--mono);color:var(--accent);white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:14px}
.card{display:flex;flex-direction:column;text-decoration:none;background:rgba(255,255,255,.28);border:1px solid var(--line);border-radius:3px;padding:20px}
.card:hover{border-color:var(--accent-line);background:rgba(255,255,255,.5)}
.card h3{font:700 22px/1.25 var(--serif);margin:6px 0 8px}
.card p{margin:0 0 16px;color:var(--text-muted);font-size:14.5px;flex:1}

.row{display:grid;grid-template-columns:52px 1fr auto;gap:4px 16px;align-items:baseline;padding:16px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.row:hover{background:rgba(255,255,255,.35)}
.row .n{font:600 12px var(--mono);color:var(--accent)}
.row b{font:700 18px/1.3 var(--serif)}
.row p{grid-column:2;margin:2px 0 0;color:var(--text-muted);font-size:14.5px}
.row .tags{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 6px}
.chip{font:400 12.5px var(--sans);padding:4px 10px;border-radius:2px;background:var(--bg);cursor:pointer;color:var(--c);border:1px solid var(--cl)}
.chip.on{background:var(--c);color:var(--bg);border-color:var(--c)}
.intro{color:var(--text-muted);font-size:17px;max-width:640px;margin:0}
.title-xl{font:800 clamp(36px,5vw,50px)/1.1 var(--serif);letter-spacing:-.02em;margin:10px 0 12px}
.empty{color:var(--text-muted)}
.snippet{grid-column:2;color:var(--text-muted);font-size:14px;margin-top:4px}
.snippet mark{background:rgba(26,92,0,.2);color:var(--text)}

@media (max-width:1180px){ .layout{grid-template-columns:240px minmax(0,1fr)} .toc{display:none} }

<script>window.EMBEDDED = {"built": 1794051396000, "files": [{"path": "preparationIntroductionToProgramingExam/Notes/Contenidos_Extra.md", "mtime": 1793790318000000000, "size": 3450, "text": "# Contenidos extra para el examen de IP\n\nComplementa:\n- `../resumeOfContentAndFormulas/udemyCourse/Resumen_Secciones05-09.md`\n- `../resumeOfContentAndFormulas/ipCollegeClass/Resumen_IP2027_Sesiones01-05.md`\n- `../resumeOfContentAndFormulas/ipCollegeClass/Analisis_Examenes_IP.md`\n- `../resumeOfContentAndFormulas/ipCollegeClass/contenidosPOOExamen/` (temas de POO que aún no se han dado)\n- `Seleccion_Ejercicios_Libro_Java.md` (ejercicios del libro de Liang)\n\n---\n\n## 1. Plan de estudio por fases\n| Fase | Qué hacer | Material |\n|---|---|---|\n| 1 | Menú + lectura validada de memoria, sin mirar | `Resumen_IP2027…` (esqueleto de menú) |\n| 2 | Algoritmos 1D: invertir, máx/mín, duplicados, mezcla lineal, Fisher-Yates, binaria | libro, cap. 7 |\n| 3 | Matrices: traspuesta, triangulares, diagonales, rotar, suma de filas/columnas, 2 mejores | libro, cap. 8 |\n| 4 | Clase modelo + `toString`/`equals`/`compareTo` | `contenidosPOOExamen/01-02`, libro caps. 9, 11 y 13 |\n| 5 | Parser con `split` + excepción propia + contenedor + inserción | `contenidosPOOExamen/03-06`, libro cap. 12 |\n| 6 | Exámenes cronometrados (2 h) en papel, del más antiguo al más reciente | `../practiceExams/` |\n| 7 | Rehacer la práctica de la **sesión 10 de IP2027** cuando salga | la más parecida al examen |\n\n## 2. Errores típicos que restan puntos\n- Inicializar el máximo o el mínimo a `0` en vez de a `v[0]` (te pasa en `section09/MinimumElement`).\n- Recorrer hasta `array.length` en un array con contador (huecos `null` → `NullPointerException`).\n- Comparar `String` con `==`.\n- Olvidar `break` en un `switch` clásico.\n- Hacer `nextInt()` seguido de `nextLine()` sin vaciar el buffer.\n- Traspuesta: calcularla y después **mostrar la original** (le pasa a la solución oficial del extra. 23/24, `mostrarMatriz(matriz)`).\n- No comprobar \"primero ejecuta la opción 1\" antes de las demás opciones del menú.\n- En `split`, no escapar `|` o `.`.\n- `compareTo` con `double` hecho con resta y *cast* a `int`.\n- No copiar el formato exacto de `toString` del enunciado.\n- `Random.nextInt(n)` da `0..n-1`; para `[a,b]` es `nextInt(b-a+1)+a`.\n\n## 3. Chuleta de API permitida y habitual\n```java\nMath.random(), Math.sqrt, Math.pow, Math.abs, Math.max/min, Math.round\nnew Random().nextInt(n)\nInteger.parseInt, Double.parseDouble, Integer.compare, Double.compare\nString: length, charAt, equals, equalsIgnoreCase, compareTo, split, trim, substring,\n        indexOf, contains, startsWith, toUpperCase, String.format, String.valueOf\nStringBuilder: append, reverse, toString, insert, deleteCharAt\nLocalDate.parse, LocalDate.now(), Period.between(a,b).getYears()\nSystem.out.printf(\"%d %5.2f %-10s %n\")\narray.clone(), System.arraycopy(src, 0, dst, 0, n)\n```\n\n## 4. Simulacros\nHay dos simulacros completos con formato de examen, salida esperada, solución (plegada) y criterios de corrección,\ntodos probados en Java:\n\n- [Simulacro 1: convocatoria ordinaria](../practiceExams/Simulacro_01_Ordinario.md): `BuscadorApp` (validar orden, eliminar duplicados, búsqueda binaria) + biblioteca (`Libro`, `Comparable` doble, parser con `FormatoLibroException`, inserción).\n- [Simulacro 2: convocatoria extraordinaria](../practiceExams/Simulacro_02_Extraordinario.md): `TemperaturasApp` (matriz de reales, medias por columna, rachas) + liga de fútbol (`Comparable` triple, parser con `ResultadoInvalidoException`, burbuja).\n"}, {"path": "preparationIntroductionToProgramingExam/Notes/Seleccion_Ejercicios_Libro_Java.md", "mtime": 1793790624000000000, "size": 7582, "text": "# Ejercicios recomendados de *Introduction to Java Programming and Data Structures* (Liang, 11.ª ed. Global)\n\nLibro: Y. Daniel Liang, *Introduction to Java Programming and Data Structures*, 11.ª edición (Global Edition), Pearson.\nLos números son los de los **Programming Exercises** al final de cada capítulo (edición *Global*;\nalgunos números difieren de la edición de EE. UU.). Los asteriscos `*` del libro indican la dificultad.\n\nPrioridad: **Alta** = imprescindible (se parece a algo que ya ha caído) · **Media** = muy recomendable · **Baja** = si sobra tiempo\n\n---\n\n## Bloque A: ejercicio 1 del examen (arrays y matrices)\n\n### Capítulo 7: Single-Dimensional Arrays\n| Ej. | Título | Por qué | Prioridad |\n|---|---|---|---|\n| 7.3 | Count occurrence of numbers | array de contadores (moda, cifrado César) | Alta |\n| 7.9 / 7.10 | Find the (index of the) largest element | máximo y su posición | Alta |\n| 7.12 | Reverse an array | invertir **en el mismo array** | Alta |\n| 7.15 | Eliminate duplicates | candidato fuerte para el ej. 1 | Alta |\n| **7.19** | Sorted? | **validar que un array está ordenado** (ord. 23/24) | Alta |\n| 7.20 | Descending Bubble Sort | burbuja a mano | Alta |\n| **7.31** | Merge two sorted lists | **mezcla lineal** (ord. 23/24) | Alta |\n| 7.13 | Random number selector | aleatorio excluyendo valores (sorteo sin repetidos) | Media |\n| 7.17 | Sort students | ordenar dos arrays en paralelo (preparación para arrays de objetos) | Media |\n| 7.21 | Normalizing integers | recorrer con fórmula | Media |\n| 7.32 | Partition of a list | intercambios en un array | Media |\n| 7.6 | The Sieve of Eratosthenes | array de booleanos | Baja |\n| 7.23 | Game: locker puzzle | bucles + array de booleanos | Baja |\n\nLee también la **sección 7.10 (Searching Arrays)**, con búsqueda lineal y binaria, y la **7.11 (Sorting Arrays)**, con selección.\n\n### Capítulo 8: Multidimensional Arrays\n| Ej. | Título | Por qué | Prioridad |\n|---|---|---|---|\n| **8.1** | Sum elements row by row | **suma por filas o columnas** (extra. 25/26) | Alta |\n| **8.2** | Average the major diagonal | **diagonales** (extra. 25/26) | Alta |\n| 8.5 | Algebra: add two matrices | suma de matrices | Alta |\n| 8.6 | Algebra: multiply two matrices | producto (sesión 05) | Alta |\n| **8.10** | Largest row and column | **fila o columna máxima** con matriz aleatoria | Alta |\n| 8.13 | Locate the smallest element | posición `[i][j]` del mínimo | Alta |\n| 8.3 | Sort students on grades | notas en una matriz (extra. 24/25) | Media |\n| 8.14 | Explore matrix | filas, columnas y diagonales con todos los valores iguales | Media |\n| 8.16 | Sort two-dimensional array | ordenar filas por su primer elemento | Media |\n| 8.26 / 8.27 | Row sorting / Column sorting | ordenar dentro de una matriz | Media |\n| 8.28 / 8.29 | (Strictly) identical arrays | comparar matrices | Media |\n| 8.35 | Largest block | reto: submatriz máxima | Baja |\n| 8.9 | Game: tic-tac-toe | diagonales + menú | Baja |\n\n**Extras que no vienen en el libro pero conviene programar:** traspuesta, triangular inferior/superior,\nrotar 90° (derecha e izquierda), matriz simétrica, recorrido en espiral.\n\n---\n\n## Bloque B: ejercicio 2 del examen (POO)\n\n### Capítulo 9: Objects and Classes\n| Ej. | Título | Por qué | Prioridad |\n|---|---|---|---|\n| 9.1 | The Rectangle class | clase completa con constructor y getters | Alta |\n| 9.2 | The Stock class | atributos y métodos de cálculo | Media |\n| 9.7 | The Account class | `LocalDate`/`Date`, validaciones | Media |\n| 9.4 | Use the Random class | `Random` con semilla | Baja |\n\n### Capítulo 10: Object-Oriented Thinking\n| Ej. | Título | Por qué | Prioridad |\n|---|---|---|---|\n| **10.9** | The Course class | **clase contenedora array + contador** (`addStudent`, `dropStudent`) | Alta |\n| 10.1 | The Time class | varios constructores, `toString` | Media |\n| 10.3 | The MyInteger class | métodos `static` y de instancia, `equals` | Media |\n| 10.4 | The MyPoint class | distancia entre objetos | Media |\n| 10.13 | MyRectangle2D class | métodos que reciben otro objeto (`contains`, `overlaps`) | Baja |\n| 10.26 | New string split method | **entender `split` por dentro** | Media |\n\nLee también las **secciones 10.10-10.11**: `String`, `StringBuilder`, `split` y expresiones regulares.\n\n### Capítulo 11: Inheritance and Polymorphism\n| Ej. | Título | Por qué | Prioridad |\n|---|---|---|---|\n| **11.1** | The Triangle class | `extends GeometricObject`, `toString` | Alta |\n| **11.2** | Person, Student, Employee, Faculty, Staff | jerarquía y `toString` sobrescrito | Alta |\n| 11.3 | Subclasses of Account | `super(...)` y métodos sobrescritos | Media |\n| 11.4 | Maximum element in ArrayList | (hazlo con un array de objetos en vez de `ArrayList`) | Media |\n\nLee la sección **\"The Object's equals Method\"** (cap. 11, justo después de 11.10 *Casting Objects*): la plantilla que piden en el examen.\n\n### Capítulo 12: Exception Handling\n| Ej. | Título | Por qué | Prioridad |\n|---|---|---|---|\n| **12.1** | NumberFormatException | `try/catch` con `Integer.parseInt` | Alta |\n| 12.3 | InputMismatchException | validar lectura con `Scanner` | Alta |\n| 12.2 | ArrayIndexOutOfBoundsException | capturar índices fuera de rango | Media |\n| **12.5** | IllegalTriangleException | **excepción propia** lanzada en el constructor | Alta |\n| 12.4 | IllegalArgumentException | `throw` en un setter | Media |\n| **12.8 / 12.9** | HexFormatException / BinaryFormatException | **excepción propia en un \"parser\"** (= `MiParseadoException`) | Alta |\n| 12.7 / 12.10 | Checked Exception / Fraction | excepción *checked* + clase `Fraccion` (vista en el tema 06) | Media |\n\n### Capítulo 13: Abstract Classes and Interfaces\n| Ej. | Título | Por qué | Prioridad |\n|---|---|---|---|\n| **13.5** | Enable GeometricObject comparable | **`implements Comparable` + `compareTo`** | Alta |\n| **13.6** | The ComparableCircle class | `compareTo` en una subclase | Alta |\n| Enable Circle / Rectangle comparable | (mismo bloque de ejercicios) | `compareTo` + `equals` coherentes | Alta |\n| 13.1 | Triangle class (abstract) | clase abstracta | Media |\n| 13.7 | The Colorable interface | interfaz propia | Media |\n| 13.17 | Math: The Complex class | clase `Complejo` (tema 06) | Media |\n| 13.22 | The ComparableSquare class | `Comparable` | Baja |\n| Octagon / Sum the areas | (mismo bloque) | `Comparable` + `Cloneable` + polimorfismo | Baja |\n\n### Capítulo 23: Sorting (solo la teoría)\n- **23.2 Insertion Sort** y **23.3 Bubble Sort**: son los dos algoritmos que se piden en el examen.\n- Ejercicio **23.1 (Generic bubble sort)**: burbuja con `Comparable[]`. (Alta)\n\n---\n\n## Plan mínimo si vas con poco tiempo (≈ 20 ejercicios)\n`7.12, 7.15, 7.19, 7.31, 8.1, 8.2, 8.10, 8.13, 9.1, 10.9, 11.1, 11.2, 12.1, 12.5, 12.8, 13.5, 13.6, 23.1`\ny además los 6 exámenes de `practiceExams` **cronometrados (2 h)**.\n\n## Cómo practicarlos para que se parezcan al examen\n1. Mete los ejercicios de los capítulos 7-8 dentro de un **menú `do-while` + `switch`** con la opción \"primero lee los datos\".\n2. En los de los capítulos 9-13, añade siempre `toString`, `equals` y `compareTo` con **criterio doble**, aunque el ejercicio no lo pida.\n3. Para cada clase, crea un `FuenteDeDatos` con `String[]` tipo `\"TIPO;campo1;campo2\"` y un **parser con excepción propia**.\n4. No uses `ArrayList` ni `Arrays.sort`: usa **array + contador** y la **inserción programada a mano**.\n"}, {"path": "preparationIntroductionToProgramingExam/exercisesLiang/section07/prioridadAlta/CountOcurrenceOfNumbers7_3.java", "mtime": 1794051257000000000, "size": 1027, "text": "/* 2 stars\nWrite a program that reads the integers between\n1 and 50 and counts the occurrences of each. Assume the input ends with 0. Here\nis a sample run of the program:\n */\npackage preparationIntroductionToProgramingExam.exercisesLiang.section07.prioridadAlta;\n\nimport java.util.Scanner;\n\npublic class CountOcurrenceOfNumbers7_3 {\n\n    public static void main(String[] args) {\n\n        int[] array = new int[51];\n\n        Scanner sc = new Scanner(System.in);\n        int number;\n        System.out.println(\"Enter the integers between 1 and 50: \");\n        do {\n            number = sc.nextInt();\n\n            for (int i = 0; i < array.length; i++) {\n                if(i+1 == number) array[i] += 1;\n            }\n\n        } while (number != 0);\n\n        for(int i = 0; i< array.length; i++){\n            if(array[i] == 1) System.out.println((i+1) + \" occurs \" + array[i] + \" time\");\n            if(array[i] > 1) System.out.println((i+1) + \" occurs \" + array[i] + \" times\");\n        }\n    }\n}\n"}, {"path": "preparationIntroductionToProgramingExam/exercisesLiang/section07/prioridadAlta/DescendingBubbleSort7_20.java", "mtime": 1794051257000000000, "size": 1783, "text": "/* 1 star\nWrite a sort method that uses the bubble-sort algorithm. The bub-\nble-sort algorithm makes several passes through the array. On each pass, suc-\ncessive neighboring pairs are compared. If a pair is not in order, its values are\nswapped; otherwise, the values remain unchanged. The technique is called a\nbubble sort or sinking sort because the smaller values gradually “bubble” their\nway to the top, and the larger values “sink” to the bottom. Write a test program\nthat reads in 10 double numbers, invokes the method, and displays the sorted\nnumbers.\n */\npackage preparationIntroductionToProgramingExam.exercisesLiang.section07.prioridadAlta;\n\nimport java.util.Scanner;\n\npublic class DescendingBubbleSort7_20 {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        double[] list = new double[10];\n        System.out.println(\"Enter 10 numbers: \");\n        for(int i = 0; i<list.length; i++){\n            list[i] = sc.nextDouble();\n        }\n        bubbleSort(list);\n    }\n    public static void bubbleSort(double[] list) {\n        boolean needNextPass = true;\n        //Bubble method inverted\n        for (int k = 1; k < list.length && needNextPass; k++) {\n            // si no hay intercambios en la pasada, el array ya está ordenado\n            needNextPass = false;\n            for (int i = 0; i < list.length - k; i++) {\n                if (list[i] < list[i + 1]) {\n                    double aux = list[i+1];\n                    list[i+1] = list[i];\n                    list[i] = aux;\n                    needNextPass = true;\n                }\n            }\n        }\n        for(int i = 0; i<list.length;i++){\n            System.out.print(list[i] + \" \");\n        }\n    }\n}\n"}, {"path": "preparationIntroductionToProgramingExam/exercisesLiang/section07/prioridadAlta/EliminateDuplicates7_15.java", "mtime": 1794051257000000000, "size": 3392, "text": "/* 0 star // REPETIR\nWrite a method that returns a new array by eliminating the\nduplicate values in the array using the following method header:\npublic static int[] eliminateDuplicates(int[] list)\nWrite a test program that reads in 10 integers, invokes the method, and displays\nthe distinct numbers separated by exactly one space. Here is a sample run of the\nprogram:\n\nHINT 1:\n1. Necesitas un segundo array (o un contador) para guardar solo los valores únicos. No intentes borrar del array original: los arrays tienen tamaño fijo y no se puede quitar un elemento.\n2. Recorre el array original elemento por elemento. Antes de añadir cada uno al array de únicos, pregúntate: ¿este valor ya está en el array de únicos?\n3. Esa pregunta se responde con otro bucle, que recorre solo la parte ya rellenada del array de únicos. Un metodo auxiliar tipo contains(array, count, value) que devuelva boolean te deja el código más limpio.\n4. Lleva un contador de cuántos únicos has guardado hasta ahora. Sirve para dos cosas:\n   - saber en qué posición insertar el siguiente;\n   - limitar el bucle de búsqueda, para no comparar contra los ceros de las posicion, un 0 real en la entrada parecería un duplicado.\n\nHINT 2:\n  1. Tienes un valor x que quieres comprobar y un array donde ya has guardado los valores únicos.\n  2. Recorres ese array con un for, solo hasta el contador de los que llevas guardados.\n  3. En cada vuelta comparas array[i] con x.\n  4. Si son iguales, ya sabes que x había salido. No hace falta seguir buscando, así que puedes cortar ahí.\n  5. Si terminas el bucle sin haber encontrado ninguna coincidencia, x es nuevo.\n */\npackage preparationIntroductionToProgramingExam.exercisesLiang.section07.prioridadAlta;\n\nimport java.util.Arrays;\nimport java.util.Scanner;\n\npublic class EliminateDuplicates7_15 {\n\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int[] array = new int[10];\n        System.out.println(\"Enter 10 positive numbers: \");\n        for (int i = 0; i < 10; i++) {\n            array[i] = sc.nextInt();\n        }\n        System.out.println(Arrays.toString(eliminateDuplicates(array)));\n    }\n\n    public static int[] eliminateDuplicates(int[] list) {\n\n        int[] auxArray = new int[list.length];\n        int count = 0;\n        boolean isDuplicate;\n        for (int i = 0; i < list.length; i++) {\n            isDuplicate = false;\n            //compares a aux array with the list and looks for duplicates\n            //Only searches until count so it skips default zeros that appear when duplicates start appearing\n            for (int j = 0; j < count; j++) {\n                if (auxArray[j] == list[i]) {\n                    isDuplicate = true;\n                }\n            }\n            //Only adds element if duplicate is false, values are sorted consecutively\n            if (isDuplicate == false) {\n                auxArray[count] = list[i];\n                count++;\n            }\n        }\n        //List is bigger than needed so we copy only the first count elements into a count size array\n        int[] arrayWithoutDuplicates = new int[count];\n        for (int i = 0; i < arrayWithoutDuplicates.length; i++) {\n            arrayWithoutDuplicates[i] = auxArray[i];\n        }\n        return arrayWithoutDuplicates;\n    }\n\n\n}\n"}, {"path": "preparationIntroductionToProgramingExam/exercisesLiang/section07/prioridadAlta/FindTheIndexOfTheLargestElement7_10.java", "mtime": 1794051257000000000, "size": 1291, "text": "/* 0 stars\n Write a method that returns the index of the\nlargest element in an array of integers. If there is more than one element, return\nthe largest index. Use the following header:\npublic static int indexOfLargestElement(double[] array)\nWrite a test program that prompts the user to enter 10 numbers, invokes this\nmethod to return the index of the largest element, and displays the index and the\nelement itself.\n */\npackage preparationIntroductionToProgramingExam.exercisesLiang.section07.prioridadAlta;\n\nimport java.util.Scanner;\n\npublic class FindTheIndexOfTheLargestElement7_10 {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        double[] array = new double[10];\n        System.out.println(\"Enter ten positive numbers: \");\n        for (int i = 0; i < array.length; i++) {\n            array[i] = sc.nextDouble();\n        }\n        System.out.println(\"The largest element is on index: \" + indexOfLargestElement(array));\n    }\n\n    public static int indexOfLargestElement(double[] array) {\n        int largestElementIndex = 0;\n        for (int i = 0; i < array.length; i++) {\n            if (array[i] > largestElementIndex) largestElementIndex = i;\n        }\n        return largestElementIndex;\n\n    }\n\n}\n"}, {"path": "preparationIntroductionToProgramingExam/exercisesLiang/section07/prioridadAlta/FindTheLargestElement7_9.java", "mtime": 1794051257000000000, "size": 1201, "text": "/* 0 stars\nWrite a test program that prompts the user to enter ten numbers, invokes this\nmethod to return the maximum value, and displays the maximum value. Here is\na sample run of the program:\npublic static double max(double[] array)\nWrite a test program that prompts the user to enter ten numbers, invokes this\nmethod to return the maximum value, and displays the maximum value. Here is\na sample run of the program:\n */\npackage preparationIntroductionToProgramingExam.exercisesLiang.section07.prioridadAlta;\n\nimport java.util.Scanner;\n\npublic class FindTheLargestElement7_9 {\n    public static void main(String[] args) {\n        double[] array = new double[10];\n        Scanner sc = new Scanner(System.in);\n        System.out.println(\"Enter 10 positive numbers: \");\n        for (int i = 0; i < 10; i++) {\n            array[i] = sc.nextDouble();\n        }\n        System.out.println(\"The maximum number is: \" + max(array));\n    }\n\n    public static double max(double[] array) {\n        double maxValue = array[0];\n        for (int i = 0; i < array.length; i++) {\n            if (array[i] > maxValue) maxValue = array[i];\n        }\n\n        return maxValue;\n    }\n\n}\n"}, {"path": "preparationIntroductionToProgramingExam/exercisesLiang/section07/prioridadAlta/IsSorted7_19.java", "mtime": 1794051257000000000, "size": 1922, "text": "/* 2 stars\nWrite the following method that returns true if the list is already sorted\nin decreasing order.\npublic static boolean isSorted(int[] list)\nWrite a test program that prompts the user to enter a list and displays whether\nthe list is sorted or not. Here is a sample run. Note that the first number in the\ninput indicates the number of the elements in the list. This number is not part\nof the list.\n */\n\npackage preparationIntroductionToProgramingExam.exercisesLiang.section07.prioridadAlta;\n\nimport java.util.Arrays;\nimport java.util.Scanner;\n\npublic class IsSorted7_19 {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int[] array = new int[10];\n        System.out.println(\"Enter positive 10 numbers: \");\n        for (int i = 0; i < 10; i++) {\n            array[i] = sc.nextInt();\n        }\n        if (isSorted(array) == true) System.out.println(\"The list is sorted.\");\n        else System.out.println(\"The list is not sorted. \");\n    }\n\n    public static boolean isSorted(int[] list) {\n        //Copy with the Arrays.copyOf method, it can also be done with:\n        /*\n        for(int i = 0; i<list.length; i++){\n        sortedList[i] = list[i];\n        }\n         */\n        int[] sortedList = Arrays.copyOf(list, list.length);\n        //Sort the array with Array.sort method\n        Arrays.sort(sortedList);\n        //Generate a array to invert the sorted one\n        int[] decreasingOrderSortedList = new int[sortedList.length];\n\n        int j = sortedList.length - 1;\n        for (int i = 0; i < sortedList.length; i++) {\n            decreasingOrderSortedList[i] = sortedList[j];\n            j--;\n        }\n\n\n        //Compare list to sorted list. Need to use Arrays.equals bcs == compares hashes\n        if (Arrays.equals(list, decreasingOrderSortedList)) return true;\n        else return false;\n    }\n}\n"}, {"path": "preparationIntroductionToProgramingExam/exercisesLiang/section07/prioridadAlta/MergeTwoSortedLists7_31.java", "mtime": 1794051257000000000, "size": 1926, "text": "/* 2 stars\nWrite the following method that merges two sorted lists\ninto a new sorted list:\npublic static int[] merge(int[] list1, int[] list2)\nImplement the method in a way that takes at most list1.length + list2.\nl e n g t h comparisons. See liveexample.pearsoncmg.com/dsanimation/\nMergeSortNeweBook.html for an animation of the implementation. Write a test\nprogram that prompts the user to enter two sorted lists and displays the merged\nlist. Here is a sample run. Note the first number in the input indicates the number\nof the elements in the list. This number is not part of the list.\n */\npackage preparationIntroductionToProgramingExam.exercisesLiang.section07.prioridadAlta;\n\nimport java.util.Arrays;\nimport java.util.Scanner;\n\npublic class MergeTwoSortedLists7_31 {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n\n        System.out.println(\"Enter list1 size and contents: \");\n        int size = sc.nextInt();\n        int[] list1 = new int[size];\n        for(int i = 0; i<size; i++){\n            list1[i] = sc.nextInt();\n        }\n        System.out.println(\"Enter list2 size and contents: \");\n        int size2 = sc.nextInt();\n        int[] list2 = new int[size2];\n        for(int i = 0; i<size2; i++){\n            list2[i] = sc.nextInt();\n        }\n        int[] mergedLists = merge(list1, list2);\n        System.out.println(\"The merged list is: \" + Arrays.toString(mergedLists));\n    }\n    public static int[] merge(int[] list1, int[] list2) {\n        int[] mergedLists = new int[list1.length + list2.length];\n\n        for(int i = 0; i<list1.length; i++){\n            mergedLists[i] = list1[i];\n        }\n        int j = 0;\n        for(int i = list1.length; i<mergedLists.length; i++){\n            mergedLists[i] = list2[j];\n            j++;\n        }\n        Arrays.sort(mergedLists);\n       return mergedLists;\n    }\n\n}\n"}, {"path": "preparationIntroductionToProgramingExam/exercisesLiang/section07/prioridadAlta/ReverseAnArray7_12.java", "mtime": 1794051257000000000, "size": 1393, "text": "/* 1 star\nThe reverse method in Section 7.7 reverses an array by\ncopying it to a new array. Rewrite the method that reverses the array passed in\nthe argument and returns this array. Write a test program that prompts the user to\nenter 10 numbers, invokes the method to reverse the numbers, and displays the\nnumbers.\n */\npackage preparationIntroductionToProgramingExam.exercisesLiang.section07.prioridadAlta;\n\nimport java.util.Arrays;\nimport java.util.Scanner;\n\npublic class ReverseAnArray7_12 {\n\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int[] array = new int[10];\n        System.out.println(\"Enter positive 10 numbers: \");\n        for (int i = 0; i < 10; i++) {\n            array[i] = sc.nextInt();\n        }\n        System.out.println(\"The reversed array is: \" + Arrays.toString(reverseArray(array))); //Arrays.toString para q no se vea el hashcode del array sino el array\n    }\n\n    public static int[] reverseArray(int[] array) {\n        int[] arrayCopy = new int[array.length];\n        int j = array.length - 1;\n        for (int i = 0; i < array.length; i++) {\n            arrayCopy[j] = array[i];\n            j--;\n        }\n        /*\n        se peude reemplazar por\n         for (int k : array) {\n        arrayCopy[j] = k;\n        j--;\n    }\n         */\n        return arrayCopy;\n    }\n\n}\n"}, {"path": "preparationIntroductionToProgramingExam/practiceExams/Simulacro_01_Ordinario.md", "mtime": 1793790318000000000, "size": 16882, "text": "# Simulacro 1: convocatoria ordinaria\n\n**Introducción a la Programación · Simulacro estilo UAL · Duración: 2 horas · Sin apuntes ni ordenador**\n\nSigue el esquema de siempre: **Ejercicio 1 (5 puntos): arrays** y **Ejercicio 2 (5 puntos): POO**.\nEstá basado en lo que ha caído en los ordinarios 23/24 (validar orden + mezcla lineal) y 25/26\n(parser + `ParseException` + ordenación), con algoritmos que aún no han salido: **eliminar duplicados** y **búsqueda binaria**.\n\n> Hazlo primero en papel y cronometrado. Las soluciones están al final de cada ejercicio, plegadas.\n\n---\n\n## Ejercicio 1 (5 puntos)\n\nEscribe un programa **`BuscadorApp`** en Java que trabaje con un array de enteros **ordenado**.\nHay que implementar el programa completo con métodos estáticos.\n\n**1. (1 punto)** Escribe el código que presente el siguiente Menú Principal y lea la opción introducida por el usuario.\nLas opciones 2 y 3 solo se pueden ejecutar si antes se ha ejecutado la opción 1; si no, se muestra un mensaje de error.\nTras cada opción se vuelve a mostrar el menú.\n```\n--- Menú principal ---\n1. Lectura y validación de datos\n2. Eliminar duplicados\n3. Búsqueda binaria\n4. Salir\nElige una opción:\n```\n\n**2. (1,5 puntos)** *Lectura y validación de datos.* Pide el tamaño del array (mayor que 0) y sus elementos, validando que\ncada número esté en el rango **[-50, 50]** y que el array quede **ordenado de forma ascendente** (se permiten repetidos).\nSi un valor no es válido, se vuelve a pedir esa misma posición.\n```\nElige una opción: 1\nIntroduce el tamaño del array: 6\nValor 1: -3\nValor 2: 60\nEl número debe estar entre -50 y 50.\nValor 2: 2\nValor 3: 2\nValor 4: 7\nValor 5: 5\nEl array debe estar ordenado de forma ascendente.\nValor 5: 7\nValor 6: 12\nArray leído y validado correctamente.\n```\n\n**3. (1 punto)** *Eliminar duplicados.* Muestra el array original y crea un **array nuevo, del tamaño justo**, sin elementos\nrepetidos. Ese nuevo array pasa a ser el array con el que trabaja el programa.\n```\nElige una opción: 2\nArray original: -3 2 2 7 7 12\nSin duplicados: -3 2 7 12\n```\n\n**4. (1,5 puntos)** *Búsqueda binaria.* Pide un valor y búscalo con el algoritmo de **búsqueda binaria** (no vale la búsqueda lineal).\nMuestra la posición en la que está o un mensaje si no está.\n```\nElige una opción: 3\nValor a buscar: 7\nEncontrado en la posición 2.\nElige una opción: 3\nValor a buscar: 5\nEl valor 5 no está en el array.\n```\n\n<details>\n<summary>Ver solución del ejercicio 1<\/summary>\n\n```java\nimport java.util.Scanner;\n\npublic class BuscadorApp {\n\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int[] datos = null;\n        int opcion;\n        do {\n            System.out.println(\"--- Menú principal ---\");\n            System.out.println(\"1. Lectura y validación de datos\");\n            System.out.println(\"2. Eliminar duplicados\");\n            System.out.println(\"3. Búsqueda binaria\");\n            System.out.println(\"4. Salir\");\n            System.out.print(\"Elige una opción: \");\n            opcion = sc.nextInt();\n            switch (opcion) {\n                case 1:\n                    datos = leerYValidar(sc);\n                    System.out.println(\"Array leído y validado correctamente.\");\n                    break;\n                case 2:\n                    if (datos == null) {\n                        System.out.println(\"Primero debe ejecutar la opción 1.\");\n                    } else {\n                        System.out.print(\"Array original: \");\n                        mostrar(datos);\n                        datos = eliminarDuplicados(datos);\n                        System.out.print(\"Sin duplicados: \");\n                        mostrar(datos);\n                    }\n                    break;\n                case 3:\n                    if (datos == null) {\n                        System.out.println(\"Primero debe ejecutar la opción 1.\");\n                    } else {\n                        System.out.print(\"Valor a buscar: \");\n                        int x = sc.nextInt();\n                        int pos = busquedaBinaria(datos, x);\n                        if (pos >= 0) System.out.println(\"Encontrado en la posición \" + pos + \".\");\n                        else System.out.println(\"El valor \" + x + \" no está en el array.\");\n                    }\n                    break;\n                case 4:\n                    System.out.println(\"Saliendo...\");\n                    break;\n                default:\n                    System.out.println(\"Opción no válida.\");\n            }\n        } while (opcion != 4);\n        sc.close();\n    }\n\n    public static int[] leerYValidar(Scanner sc) {\n        int n;\n        do {\n            System.out.print(\"Introduce el tamaño del array: \");\n            n = sc.nextInt();\n            if (n <= 0) System.out.println(\"El tamaño debe ser mayor que 0.\");\n        } while (n <= 0);\n        int[] v = new int[n];\n        for (int i = 0; i < n; i++) {\n            System.out.print(\"Valor \" + (i + 1) + \": \");\n            v[i] = sc.nextInt();\n            if (v[i] < -50 || v[i] > 50) {\n                System.out.println(\"El número debe estar entre -50 y 50.\");\n                i--;                                    // se repite la misma posición\n            } else if (i > 0 && v[i] < v[i - 1]) {\n                System.out.println(\"El array debe estar ordenado de forma ascendente.\");\n                i--;\n            }\n        }\n        return v;\n    }\n\n    // Como el array está ordenado, los repetidos están siempre juntos.\n    public static int[] eliminarDuplicados(int[] v) {\n        int[] aux = new int[v.length];\n        int k = 0;\n        for (int i = 0; i < v.length; i++) {\n            if (i == 0 || v[i] != v[i - 1]) {\n                aux[k] = v[i];\n                k++;\n            }\n        }\n        int[] resultado = new int[k];                   // array del tamaño justo\n        for (int i = 0; i < k; i++) resultado[i] = aux[i];\n        return resultado;\n    }\n\n    public static int busquedaBinaria(int[] v, int x) {\n        int ini = 0, fin = v.length - 1;\n        while (ini <= fin) {\n            int medio = (ini + fin) / 2;\n            if (v[medio] == x) return medio;\n            if (v[medio] < x) ini = medio + 1;\n            else fin = medio - 1;\n        }\n        return -1;\n    }\n\n    public static void mostrar(int[] v) {\n        for (int i = 0; i < v.length; i++) System.out.print(v[i] + \" \");\n        System.out.println();\n    }\n}\n```\n\n**Criterios de corrección orientativos**\n- 1: menú en `do-while` + `switch`, opción por defecto y control \"primero la opción 1\".\n- 2: validar tamaño, rango y orden; volver a pedir la **misma** posición (`i--`).\n- 3: aprovechar que está ordenado (comparar con el anterior); array nuevo de tamaño `k`.\n- 4: `ini`, `fin`, `medio`; condición `ini <= fin`; devolver `-1` si no está.\n\n<\/details>\n\n---\n\n## Ejercicio 2 (5 puntos)\n\nBasándose en el siguiente diagrama de clases, implemente en Java **únicamente** los apartados que se piden para gestionar\nlos libros de una biblioteca.\n\n| Clase | Atributos | Métodos |\n|---|---|---|\n| `Libro` *implements* `Comparable` | `- isbn: String`<br>`- titulo: String`<br>`- autor: String`<br>`- año: int`<br>`- paginas: int` | `Libro(isbn, titulo, autor, año, paginas)`<br>`toString(): String`<br>`equals(o: Object): boolean`<br>`compareTo(o: Object): int` |\n| `Estanteria` | `- libros: Libro[]`<br>`- numLibros: int` | `Estanteria(capacidad: int)`<br>`contiene(l: Libro): boolean`<br>`agregar(l: Libro): boolean`<br>`ordenar(): void`<br>`mostrar(): void` |\n| «final» `LibroParser` | | `parse(linea: String): Libro throws FormatoLibroException` |\n| `FormatoLibroException` *extends* `Exception` | | `FormatoLibroException(message: String)`<br>`FormatoLibroException(message: String, cause: Throwable)` |\n| «final» `FuenteDeDatos` | `DATOS: String[]` | |\n| `BibliotecaApp` | | `main(args: String[]): void` |\n\n**Relaciones:** `Estanteria` ◆── 0..* `Libro` (composición) · `LibroParser` crea `Libro` y lanza `FormatoLibroException` ·\n`BibliotecaApp` usa `FuenteDeDatos`, `LibroParser` y `Estanteria`.\n\n**1. (1 punto)** Implemente la clase **`Libro`** con su constructor y los métodos `toString()` y `equals()`.\nDos libros son iguales si tienen el **mismo ISBN**. Formato de `toString()`:\n```\nLibro [ISBN-003, Rayuela, Cortázar, 1963, 600 págs]\n```\n\n**2. (1 punto)** Haga que `Libro` implemente **`Comparable`**. El método `compareTo` debe ordenar primero por **autor**\n(alfabéticamente) y, si el autor coincide, por **año, del más reciente al más antiguo**.\n\n**3. (1,5 puntos)** Implemente la excepción **`FormatoLibroException`**, que hereda de `java.lang.Exception`, y la clase de utilidad\n**`LibroParser`** con el método estático `parse(String)`, que recibe una cadena con el formato\n`\"LIBRO;isbn;titulo;autor;año;paginas\"` y devuelve el objeto `Libro`. Debe lanzar `FormatoLibroException` si:\nel número de campos no es 6, la etiqueta no es `LIBRO`, el año o las páginas no son números, o las páginas son ≤ 0.\n\n**4. (1,5 puntos)** Implemente la clase **`Estanteria`** (array de libros + contador):\n- `agregar(Libro l)` añade el libro si hay sitio y **no está ya** (usa `equals` mediante `contiene`). Devuelve `true` si lo añade.\n- `ordenar()` ordena los libros con el algoritmo de **ordenación por inserción** usando `compareTo`.\n- `mostrar()` muestra los libros.\n\nY la clase **`BibliotecaApp`**, que crea una `Estanteria` con capacidad para todos los datos, recorre `FuenteDeDatos.DATOS`\nusando el parser (**capturando** las excepciones sin detener el programa), avisa de los repetidos y muestra los libros\nantes y después de ordenarlos.\n\n```java\npublic final class FuenteDeDatos {\n    public static final String[] DATOS = {\n        \"LIBRO;ISBN-001;Cien años de soledad;García Márquez;1967;471\",\n        \"LIBRO;ISBN-002;El amor en los tiempos del cólera;García Márquez;1985;368\",\n        \"LIBRO;ISBN-003;Rayuela;Cortázar;1963;600\",\n        \"LIBRO;ISBN-001;Cien años de soledad;García Márquez;2007;496\",\n        \"REVISTA;Muy Interesante;2024\",\n        \"LIBRO;ISBN-006;La sombra del viento;Ruiz Zafón;dos mil uno;565\",\n        \"LIBRO;ISBN-007;Marina;Ruiz Zafón;1999;292\",\n        \"LIBRO;ISBN-008;El juego del ángel;Ruiz Zafón;2008;672\"\n    };\n}\n```\nSalida esperada:\n```\nRepetido o estantería llena: ISBN-001\nLínea ignorada -> Formato incorrecto: REVISTA;Muy Interesante;2024\nLínea ignorada -> Año o páginas no numéricos: LIBRO;ISBN-006;La sombra del viento;Ruiz Zafón;dos mil uno;565\n--- Libros cargados ---\nLibro [ISBN-001, Cien años de soledad, García Márquez, 1967, 471 págs]\nLibro [ISBN-002, El amor en los tiempos del cólera, García Márquez, 1985, 368 págs]\nLibro [ISBN-003, Rayuela, Cortázar, 1963, 600 págs]\nLibro [ISBN-007, Marina, Ruiz Zafón, 1999, 292 págs]\nLibro [ISBN-008, El juego del ángel, Ruiz Zafón, 2008, 672 págs]\n--- Libros ordenados ---\nLibro [ISBN-003, Rayuela, Cortázar, 1963, 600 págs]\nLibro [ISBN-002, El amor en los tiempos del cólera, García Márquez, 1985, 368 págs]\nLibro [ISBN-001, Cien años de soledad, García Márquez, 1967, 471 págs]\nLibro [ISBN-008, El juego del ángel, Ruiz Zafón, 2008, 672 págs]\nLibro [ISBN-007, Marina, Ruiz Zafón, 1999, 292 págs]\n```\n\n<details>\n<summary>Ver solución del ejercicio 2<\/summary>\n\n**2.1 y 2.2: `Libro`**\n```java\npublic class Libro implements Comparable {\n    private String isbn;\n    private String titulo;\n    private String autor;\n    private int año;\n    private int paginas;\n\n    public Libro(String isbn, String titulo, String autor, int año, int paginas) {\n        this.isbn = isbn;\n        this.titulo = titulo;\n        this.autor = autor;\n        this.año = año;\n        this.paginas = paginas;\n    }\n\n    public String getIsbn()  { return isbn; }\n    public String getAutor() { return autor; }\n    public int getAño()      { return año; }\n\n    @Override\n    public String toString() {\n        return \"Libro [\" + isbn + \", \" + titulo + \", \" + autor + \", \" + año + \", \" + paginas + \" págs]\";\n    }\n\n    // Dos libros son iguales si tienen el mismo ISBN.\n    @Override\n    public boolean equals(Object obj) {\n        if (this == obj) return true;\n        if (obj == null || getClass() != obj.getClass()) return false;\n        Libro other = (Libro) obj;\n        return isbn.equals(other.isbn);\n    }\n\n    // 1º autor (alfabético), 2º año (del más reciente al más antiguo).\n    @Override\n    public int compareTo(Object o) {\n        Libro otro = (Libro) o;\n        int c = this.autor.compareTo(otro.autor);\n        if (c != 0) return c;\n        return Integer.compare(otro.año, this.año);   // invertido: descendente\n    }\n}\n```\n\n**2.3: `FormatoLibroException` y `LibroParser`**\n```java\npublic class FormatoLibroException extends Exception {\n    public FormatoLibroException(String message) {\n        super(message);\n    }\n    public FormatoLibroException(String message, Throwable cause) {\n        super(message, cause);\n    }\n}\n\npublic final class LibroParser {\n    // Formato: \"LIBRO;isbn;titulo;autor;año;paginas\"\n    public static Libro parse(String linea) throws FormatoLibroException {\n        if (linea == null || linea.isEmpty())\n            throw new FormatoLibroException(\"Línea vacía\");\n        String[] c = linea.split(\";\");\n        if (c.length != 6 || !c[0].equals(\"LIBRO\"))\n            throw new FormatoLibroException(\"Formato incorrecto: \" + linea);\n        try {\n            int año = Integer.parseInt(c[4].trim());\n            int paginas = Integer.parseInt(c[5].trim());\n            if (paginas <= 0)\n                throw new FormatoLibroException(\"Número de páginas no válido: \" + paginas);\n            return new Libro(c[1].trim(), c[2].trim(), c[3].trim(), año, paginas);\n        } catch (NumberFormatException e) {\n            throw new FormatoLibroException(\"Año o páginas no numéricos: \" + linea, e);\n        }\n    }\n}\n```\n\n**2.4: `Estanteria` y `BibliotecaApp`**\n```java\npublic class Estanteria {\n    private Libro[] libros;\n    private int numLibros;\n\n    public Estanteria(int capacidad) {\n        libros = new Libro[capacidad];\n        numLibros = 0;\n    }\n\n    public boolean contiene(Libro l) {\n        for (int i = 0; i < numLibros; i++)          // hasta numLibros, no hasta length\n            if (libros[i].equals(l)) return true;\n        return false;\n    }\n\n    public boolean agregar(Libro l) {\n        if (numLibros == libros.length || contiene(l)) return false;\n        libros[numLibros] = l;\n        numLibros++;\n        return true;\n    }\n\n    public void ordenar() {                           // inserción\n        for (int i = 1; i < numLibros; i++) {\n            Libro aux = libros[i];\n            int j = i - 1;\n            while (j >= 0 && libros[j].compareTo(aux) > 0) {\n                libros[j + 1] = libros[j];\n                j--;\n            }\n            libros[j + 1] = aux;\n        }\n    }\n\n    public void mostrar() {\n        for (int i = 0; i < numLibros; i++)\n            System.out.println(libros[i]);\n    }\n}\n\npublic class BibliotecaApp {\n    public static void main(String[] args) {\n        Estanteria estanteria = new Estanteria(FuenteDeDatos.DATOS.length);\n        for (String linea : FuenteDeDatos.DATOS) {\n            try {\n                Libro l = LibroParser.parse(linea);\n                if (!estanteria.agregar(l))\n                    System.out.println(\"Repetido o estantería llena: \" + l.getIsbn());\n            } catch (FormatoLibroException e) {\n                System.out.println(\"Línea ignorada -> \" + e.getMessage());   // el programa sigue\n            }\n        }\n        System.out.println(\"--- Libros cargados ---\");\n        estanteria.mostrar();\n        estanteria.ordenar();\n        System.out.println(\"--- Libros ordenados ---\");\n        estanteria.mostrar();\n    }\n}\n```\n\n**Criterios de corrección orientativos**\n- 2.1: atributos `private`, constructor completo, `toString` con el formato exacto, `equals` con la plantilla (`Object`, `getClass`, cast).\n- 2.2: `implements Comparable`, criterio doble y el segundo **descendente**.\n- 2.3: `extends Exception`, `throws` en la cabecera, `split(\";\")`, comprobar longitud y etiqueta, capturar `NumberFormatException` y relanzarla como excepción propia.\n- 2.4: recorrer hasta `numLibros`, no duplicar (usa `equals`), inserción correcta, `try/catch` **dentro** del bucle.\n\n<\/details>\n"}, {"path": "preparationIntroductionToProgramingExam/practiceExams/Simulacro_02_Extraordinario.md", "mtime": 1793790318000000000, "size": 17974, "text": "# Simulacro 2: convocatoria extraordinaria\n\n**Introducción a la Programación · Simulacro estilo UAL · Duración: 2 horas · Sin apuntes ni ordenador**\n\nSigue el esquema de siempre: **Ejercicio 1 (5 puntos): matrices** y **Ejercicio 2 (5 puntos): POO**.\nEstá basado en los extraordinarios 24/25 (matriz de reales con `printf`, media por fila, las 2 mejores por columna) y\n25/26 (matriz aleatoria + parser con excepción propia), y añade lo que todavía no ha caído: **recorrer por columnas**,\n**detectar rachas** en una fila, **criterio triple** en `compareTo` y **ordenación por burbuja**.\n\n> Hazlo primero en papel y cronometrado. Las soluciones están al final de cada ejercicio, plegadas.\n\n---\n\n## Ejercicio 1 (5 puntos)\n\nEscribe un programa **`TemperaturasApp`** en Java que trabaje con una matriz de **reales** (`double[][]`), donde cada fila es\nuna semana y cada columna un día (lunes a domingo). Hay que implementar el programa completo con métodos estáticos.\n\n**1. (1 punto)** Escribe el código que presente el siguiente Menú Principal y lea la opción introducida por el usuario.\nLas opciones 2 y 3 solo se pueden ejecutar si antes se ha ejecutado la opción 1.\n```\n--- Menú principal ---\n1. Generar temperaturas\n2. Media de cada día de la semana\n3. Detectar olas de calor\n4. Salir\nElige una opción:\n```\n\n**2. (1 punto)** *Generar temperaturas.* Pide el número de semanas, validando que esté entre **1 y 10**. Crea la matriz\n`semanas × 7` con temperaturas **reales aleatorias en [20.0, 42.0)** y muéstrala con `printf` (una cifra decimal),\ncon la cabecera de los días:\n```\nElige una opción: 1\nNúmero de semanas (1-10): 0\nDebe estar entre 1 y 10.\nNúmero de semanas (1-10): 3\n            Lun   Mar   Mié   Jue   Vie   Sáb   Dom\nSemana 1:  24,1  36,6  39,6  23,1  24,0  21,1  37,7\nSemana 2:  37,2  32,8  24,6  41,2  37,0  24,6  36,4\nSemana 3:  33,3  21,9  36,6  41,0  23,2  32,8  25,7\n```\n\n**3. (1 punto)** *Media de cada día de la semana.* Calcula y muestra la temperatura media de **cada columna**\n(la media de todos los lunes, de todos los martes…):\n```\nElige una opción: 2\nLun: 31,5 ºC\nMar: 30,4 ºC\nMié: 33,6 ºC\nJue: 35,1 ºC\nVie: 28,1 ºC\nSáb: 26,2 ºC\nDom: 33,3 ºC\n```\n\n**4. (2 puntos)** *Detectar olas de calor.* Una **ola de calor** son **3 o más días seguidos** de la misma semana por encima\nde **35 ºC**. Para cada semana que tenga alguna, muestra la duración de la ola **más larga** y el día en que empieza.\nSi ninguna semana tiene, muestra un mensaje.\n```\nElige una opción: 3\nSemana 1: ola de calor de 3 días desde el Mar.\nSemana 2: ola de calor de 4 días desde el Jue.\n```\n*(Ejemplo con la semana 1 = `30 36 37 38 30 36 36` y la semana 2 = `36 36 20 36 36 36 36`.)*\n\n<details>\n<summary>Ver solución del ejercicio 1<\/summary>\n\n```java\nimport java.util.Scanner;\n\npublic class TemperaturasApp {\n\n    public static final String[] DIAS = {\"Lun\", \"Mar\", \"Mié\", \"Jue\", \"Vie\", \"Sáb\", \"Dom\"};\n\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        double[][] temp = null;\n        int opcion;\n        do {\n            System.out.println(\"--- Menú principal ---\");\n            System.out.println(\"1. Generar temperaturas\");\n            System.out.println(\"2. Media de cada día de la semana\");\n            System.out.println(\"3. Detectar olas de calor\");\n            System.out.println(\"4. Salir\");\n            System.out.print(\"Elige una opción: \");\n            opcion = sc.nextInt();\n            switch (opcion) {\n                case 1:\n                    int semanas;\n                    do {\n                        System.out.print(\"Número de semanas (1-10): \");\n                        semanas = sc.nextInt();\n                        if (semanas < 1 || semanas > 10) System.out.println(\"Debe estar entre 1 y 10.\");\n                    } while (semanas < 1 || semanas > 10);\n                    temp = generarTemperaturas(semanas);\n                    mostrar(temp);\n                    break;\n                case 2:\n                    if (temp == null) System.out.println(\"Primero debe ejecutar la opción 1.\");\n                    else mediaPorDia(temp);\n                    break;\n                case 3:\n                    if (temp == null) System.out.println(\"Primero debe ejecutar la opción 1.\");\n                    else detectarOlasDeCalor(temp);\n                    break;\n                case 4:\n                    System.out.println(\"Saliendo...\");\n                    break;\n                default:\n                    System.out.println(\"Opción no válida.\");\n            }\n        } while (opcion != 4);\n        sc.close();\n    }\n\n    // Reales aleatorios en [20.0, 42.0): min + Math.random() * (max - min)\n    public static double[][] generarTemperaturas(int semanas) {\n        double[][] t = new double[semanas][7];\n        for (int i = 0; i < t.length; i++)\n            for (int j = 0; j < t[i].length; j++)\n                t[i][j] = 20 + Math.random() * 22;\n        return t;\n    }\n\n    public static void mostrar(double[][] t) {\n        System.out.print(\"         \");\n        for (String d : DIAS) System.out.printf(\"%6s\", d);\n        System.out.println();\n        for (int i = 0; i < t.length; i++) {\n            System.out.printf(\"Semana %d:\", i + 1);\n            for (int j = 0; j < t[i].length; j++) System.out.printf(\"%6.1f\", t[i][j]);\n            System.out.println();\n        }\n    }\n\n    // Recorrido por COLUMNAS: el bucle externo es j (día) y el interno i (semana).\n    public static void mediaPorDia(double[][] t) {\n        for (int j = 0; j < 7; j++) {\n            double suma = 0;\n            for (int i = 0; i < t.length; i++) suma += t[i][j];\n            System.out.printf(\"%s: %.1f ºC%n\", DIAS[j], suma / t.length);\n        }\n    }\n\n    // Racha más larga de días > 35 en cada fila.\n    public static void detectarOlasDeCalor(double[][] t) {\n        boolean alguna = false;\n        for (int i = 0; i < t.length; i++) {\n            int racha = 0, inicio = -1, mejorRacha = 0, mejorInicio = -1;\n            for (int j = 0; j < t[i].length; j++) {\n                if (t[i][j] > 35) {\n                    if (racha == 0) inicio = j;      // empieza una racha nueva\n                    racha++;\n                    if (racha > mejorRacha) { mejorRacha = racha; mejorInicio = inicio; }\n                } else {\n                    racha = 0;                       // se corta la racha\n                }\n            }\n            if (mejorRacha >= 3) {\n                System.out.printf(\"Semana %d: ola de calor de %d días desde el %s.%n\",\n                        i + 1, mejorRacha, DIAS[mejorInicio]);\n                alguna = true;\n            }\n        }\n        if (!alguna) System.out.println(\"No hay ninguna ola de calor.\");\n    }\n}\n```\n\n**Criterios de corrección orientativos**\n- 1: menú y control \"primero la opción 1\".\n- 2: validación `do-while`, fórmula del aleatorio real, `printf(\"%6.1f\")` y cabecera.\n- 3: recorrido por columnas y división entre el número de **filas**.\n- 4: contador de racha que se reinicia, guardar el inicio y la racha máxima, mensaje si no hay ninguna.\n\n<\/details>\n\n---\n\n## Ejercicio 2 (5 puntos)\n\nBasándose en el siguiente diagrama de clases, implemente en Java **únicamente** los apartados que se piden para\ncalcular la clasificación de una liga de fútbol a partir de los resultados de los partidos.\n\n| Clase | Atributos | Métodos |\n|---|---|---|\n| `Equipo` *implements* `Comparable` | `- nombre: String`<br>`- ciudad: String`<br>`- puntos: int`<br>`- golesFavor: int`<br>`- golesContra: int` | `Equipo(nombre, ciudad)`<br>`getDiferencia(): int`<br>`sumarResultado(favor: int, contra: int): void`<br>`toString(): String`<br>`equals(o: Object): boolean`<br>`compareTo(o: Object): int` |\n| `Partido` | `- local, visitante: String`<br>`- golesLocal, golesVisitante: int` | `Partido(local, visitante, golesLocal, golesVisitante)` + getters |\n| `Liga` | `- nombre: String`<br>`- equipos: Equipo[]`<br>`- numEquipos: int` | `Liga(nombre: String, maxEquipos: int)`<br>`agregarEquipo(e: Equipo): void`<br>`buscar(nombre: String): Equipo`<br>`registrar(p: Partido): void throws ResultadoInvalidoException`<br>`ordenar(): void`<br>`mostrarClasificacion(): void` |\n| «final» `PartidoParser` | | `parse(linea: String): Partido throws ResultadoInvalidoException` |\n| `ResultadoInvalidoException` *extends* `Exception` | | `ResultadoInvalidoException(message: String)` |\n| «final» `FuenteDeDatos` | `EQUIPOS: String[]`<br>`PARTIDOS: String[]` | |\n| `LigaApp` | | `main(args: String[]): void` |\n\n**Relaciones:** `Liga` ◆── 0..* `Equipo` (composición) · `PartidoParser` crea `Partido` y lanza `ResultadoInvalidoException` ·\n`LigaApp` usa `FuenteDeDatos`, `PartidoParser` y `Liga`.\n\n**1. (1 punto)** Implemente la clase **`Equipo`**: constructor (puntos y goles empiezan en 0), `getDiferencia()`\n(goles a favor − goles en contra), `sumarResultado(favor, contra)` (suma los goles y **3 puntos** si gana, **1** si empata,\n**0** si pierde), `toString()` con el formato de la salida y `equals()`: dos equipos son iguales si tienen el\n**mismo nombre, sin distinguir mayúsculas**.\n\n**2. (1,5 puntos)** Haga que `Equipo` implemente **`Comparable`** con un **criterio triple**, el de una clasificación:\n1º más **puntos**, 2º mejor **diferencia de goles**, 3º **nombre** alfabéticamente.\n\n**3. (1 punto)** Implemente **`ResultadoInvalidoException`** (hereda de `Exception`) y **`PartidoParser.parse(String)`**, que procesa\ncadenas con el formato `\"PARTIDO;local;visitante;golesLocal;golesVisitante\"` y lanza la excepción si el formato es incorrecto,\nlos goles no son números, hay goles **negativos** o un equipo juega **contra sí mismo**.\n\n**4. (1,5 puntos)** Implemente de la clase **`Liga`**:\n- `buscar(nombre)`, que devuelve el equipo con ese nombre o `null` (**usando `equals`**).\n- `registrar(Partido p)`, que actualiza a los dos equipos y lanza `ResultadoInvalidoException` si alguno **no está inscrito**.\n- `ordenar()`, con el algoritmo de **burbuja** usando `compareTo`.\n- `mostrarClasificacion()`, que ordena y muestra la tabla numerada.\n\nY **`LigaApp`**, que inscribe los equipos de `FuenteDeDatos.EQUIPOS` (formato `\"nombre;ciudad\"`), registra los partidos de\n`FuenteDeDatos.PARTIDOS` **capturando** los errores sin parar el programa y muestra la clasificación.\n\n```java\npublic final class FuenteDeDatos {\n    public static final String[] EQUIPOS = {\"Almería;Almería\", \"Granada;Granada\", \"Málaga;Málaga\", \"Cádiz;Cádiz\"};\n    public static final String[] PARTIDOS = {\n        \"PARTIDO;Almería;Granada;2;1\",\n        \"PARTIDO;Málaga;Cádiz;0;0\",\n        \"PARTIDO;Granada;Málaga;3;0\",\n        \"PARTIDO;Cádiz;Almería;1;2\",\n        \"PARTIDO;Almería;Sevilla;1;0\",\n        \"PARTIDO;Málaga;Granada;-1;2\",\n        \"PARTIDO;Granada;Cádiz;1;1\",\n        \"PARTIDO;Almería;Málaga;dos;0\",\n        \"PARTIDO;Málaga;Almería;1;1\"\n    };\n}\n```\nSalida esperada (fíjate en que Cádiz y Málaga empatan a puntos y se desempatan por la diferencia de goles):\n```\nPartido ignorado -> Equipo no inscrito en la liga: Sevilla\nPartido ignorado -> Goles negativos: PARTIDO;Málaga;Granada;-1;2\nPartido ignorado -> Goles no numéricos: PARTIDO;Almería;Málaga;dos;0\n--- Clasificación Liga Andaluza ---\n1. Almería     7 pts  GF  5  GC  3  DG +2\n2. Granada     4 pts  GF  5  GC  3  DG +2\n3. Cádiz       2 pts  GF  2  GC  3  DG -1\n4. Málaga      2 pts  GF  1  GC  4  DG -3\n```\n\n<details>\n<summary>Ver solución del ejercicio 2<\/summary>\n\n**2.1 y 2.2: `Equipo`**\n```java\npublic class Equipo implements Comparable {\n    private String nombre;\n    private String ciudad;\n    private int puntos;\n    private int golesFavor;\n    private int golesContra;\n\n    public Equipo(String nombre, String ciudad) {\n        this.nombre = nombre;\n        this.ciudad = ciudad;\n        this.puntos = 0;\n        this.golesFavor = 0;\n        this.golesContra = 0;\n    }\n\n    public String getNombre()  { return nombre; }\n    public int getPuntos()     { return puntos; }\n    public int getDiferencia() { return golesFavor - golesContra; }\n\n    public void sumarResultado(int favor, int contra) {\n        golesFavor += favor;\n        golesContra += contra;\n        if (favor > contra) puntos += 3;\n        else if (favor == contra) puntos += 1;\n    }\n\n    @Override\n    public String toString() {\n        return String.format(\"%-10s %2d pts  GF %2d  GC %2d  DG %+d\",\n                nombre, puntos, golesFavor, golesContra, getDiferencia());\n    }\n\n    @Override\n    public boolean equals(Object obj) {\n        if (this == obj) return true;\n        if (obj == null || getClass() != obj.getClass()) return false;\n        Equipo other = (Equipo) obj;\n        return nombre.equalsIgnoreCase(other.nombre);\n    }\n\n    // 1º puntos (desc), 2º diferencia de goles (desc), 3º nombre (asc).\n    @Override\n    public int compareTo(Object o) {\n        Equipo otro = (Equipo) o;\n        if (this.puntos != otro.puntos) return otro.puntos - this.puntos;\n        if (this.getDiferencia() != otro.getDiferencia()) return otro.getDiferencia() - this.getDiferencia();\n        return this.nombre.compareTo(otro.nombre);\n    }\n}\n```\n\n**2.3: `ResultadoInvalidoException` y `PartidoParser`** (`Partido` es una clase con constructor y getters)\n```java\npublic class ResultadoInvalidoException extends Exception {\n    public ResultadoInvalidoException(String message) {\n        super(message);\n    }\n}\n\npublic final class PartidoParser {\n    // Formato: \"PARTIDO;local;visitante;golesLocal;golesVisitante\"\n    public static Partido parse(String linea) throws ResultadoInvalidoException {\n        String[] c = linea.split(\";\");\n        if (c.length != 5 || !c[0].equals(\"PARTIDO\"))\n            throw new ResultadoInvalidoException(\"Formato incorrecto: \" + linea);\n        int gl, gv;\n        try {\n            gl = Integer.parseInt(c[3].trim());\n            gv = Integer.parseInt(c[4].trim());\n        } catch (NumberFormatException e) {\n            throw new ResultadoInvalidoException(\"Goles no numéricos: \" + linea);\n        }\n        if (gl < 0 || gv < 0)\n            throw new ResultadoInvalidoException(\"Goles negativos: \" + linea);\n        if (c[1].trim().equalsIgnoreCase(c[2].trim()))\n            throw new ResultadoInvalidoException(\"Un equipo no puede jugar contra sí mismo: \" + linea);\n        return new Partido(c[1].trim(), c[2].trim(), gl, gv);\n    }\n}\n```\n\n**2.4: `Liga` y `LigaApp`**\n```java\npublic class Liga {\n    private String nombre;\n    private Equipo[] equipos;\n    private int numEquipos;\n\n    public Liga(String nombre, int maxEquipos) {\n        this.nombre = nombre;\n        this.equipos = new Equipo[maxEquipos];\n        this.numEquipos = 0;\n    }\n\n    public void agregarEquipo(Equipo e) {\n        if (numEquipos < equipos.length && buscar(e.getNombre()) == null) {\n            equipos[numEquipos] = e;\n            numEquipos++;\n        }\n    }\n\n    // Usa equals: se crea un equipo \"de búsqueda\" con ese nombre.\n    public Equipo buscar(String nombre) {\n        Equipo clave = new Equipo(nombre, \"\");\n        for (int i = 0; i < numEquipos; i++)\n            if (equipos[i].equals(clave)) return equipos[i];\n        return null;\n    }\n\n    public void registrar(Partido p) throws ResultadoInvalidoException {\n        Equipo local = buscar(p.getLocal());\n        Equipo visitante = buscar(p.getVisitante());\n        if (local == null || visitante == null)\n            throw new ResultadoInvalidoException(\"Equipo no inscrito en la liga: \"\n                    + (local == null ? p.getLocal() : p.getVisitante()));\n        local.sumarResultado(p.getGolesLocal(), p.getGolesVisitante());\n        visitante.sumarResultado(p.getGolesVisitante(), p.getGolesLocal());   // al revés\n    }\n\n    public void ordenar() {                                  // burbuja\n        for (int i = 0; i < numEquipos - 1; i++)\n            for (int j = 0; j < numEquipos - 1 - i; j++)\n                if (equipos[j].compareTo(equipos[j + 1]) > 0) {\n                    Equipo aux = equipos[j];\n                    equipos[j] = equipos[j + 1];\n                    equipos[j + 1] = aux;\n                }\n    }\n\n    public void mostrarClasificacion() {\n        ordenar();\n        System.out.println(\"--- Clasificación \" + nombre + \" ---\");\n        for (int i = 0; i < numEquipos; i++)\n            System.out.println((i + 1) + \". \" + equipos[i]);\n    }\n}\n\npublic class LigaApp {\n    public static void main(String[] args) {\n        Liga liga = new Liga(\"Liga Andaluza\", FuenteDeDatos.EQUIPOS.length);\n        for (String e : FuenteDeDatos.EQUIPOS) {\n            String[] c = e.split(\";\");\n            liga.agregarEquipo(new Equipo(c[0], c[1]));\n        }\n        for (String linea : FuenteDeDatos.PARTIDOS) {\n            try {\n                liga.registrar(PartidoParser.parse(linea));\n            } catch (ResultadoInvalidoException ex) {\n                System.out.println(\"Partido ignorado -> \" + ex.getMessage());\n            }\n        }\n        liga.mostrarClasificacion();\n    }\n}\n```\n\n**Criterios de corrección orientativos**\n- 2.1: `sumarResultado` con los 3/1/0 puntos, `toString` con `String.format`, `equals` con `equalsIgnoreCase`.\n- 2.2: los dos primeros criterios **descendentes** (`otro - this`) y el tercero ascendente.\n- 2.3: validar longitud y etiqueta, `NumberFormatException` → excepción propia, goles negativos y mismo equipo.\n- 2.4: `buscar` con `equals`, el visitante suma los goles **al revés**, burbuja hasta `numEquipos`, `try/catch` dentro del bucle.\n\n<\/details>\n"}, {"path": "preparationIntroductionToProgramingExam/resumeOfContentAndFormulas/ipCollegeClass/Analisis_Examenes_IP.md", "mtime": 1793789732000000000, "size": 6336, "text": "# Análisis de los exámenes de IP (UAL), cursos 23/24 a 25/26\n\nExámenes analizados: 6 distintos, todos en `../../practiceExams/`.\nLos PDF de `IP/EXAMENES` están repetidos (2023-ORD = 23/24 ord, 2024-EXTRA = 23/24 extra,\n2025-ORD = 25/26 ord); se han usado las versiones oficiales de los repositorios del curso.\n\n## 1. Estructura fija\n- **Ejercicio 1 (5 puntos): arrays o matrices** dentro de un programa con **menú `do-while` + `switch`**.\n- **Ejercicio 2 (5 puntos): POO** a partir de un **diagrama de clases** (a veces solo se describe en el texto).\n- Siempre se programa a mano, en papel, sin `Arrays.sort` ni colecciones.\n\n## 2. Tabla de exámenes\n\n| Convocatoria | Ej. 1 (arrays) | Reparto | Ej. 2 (POO) | Reparto |\n|---|---|---|---|---|\n| Ord. 23/24 (16-ene-24) | `OrdenarApp`: leer 2 arrays **validando que estén ordenados** + **mezcla lineal** | 1 + 1,5 + 2,5 | Elecciones: `Provincia` (`toString`, `equals`), `Votacion` (`compareTo`), **parsear con `split`**, reparto mayoritario + **D'Hondt** usando `ordenacionInsercion(Comparable[])` | 1+1+1+1+2 |\n| Extra. 23/24 (02-feb-24) | `MatricesApp` cuadrada: generar **aleatoria [-10,10]**, mostrar con `[ ]`, **traspuesta**, **triangular inferior** | 1×5 | Mesas electorales: `Ciudadano` (`compareTo` por apellido1, apellido2, nombre; `LocalDate`, `getEdad`), **parsear con separadores `# : ; ,`**, **sorteo aleatorio sin repetidos** | 1,5+1,5+2 |\n| Ord. 24/25 (15-ene-25) | `MatrizApp` filas×columnas: leer **validando [0,10]**, contar pares/impares, **rotar 90° a la derecha** | 1+1+1+2 | Baraja: `Carta` (`toString`, `equals`), `CartaEspañola.compareTo` (palo y número), `BarajaEspañola` completa, **`cortarBaraja()`** (índice aleatorio, intercambiar bloques) | 1+1+1+2 |\n| Extra. 24/25 (03-feb-25) | `NotasApp` `double[][]`: notas aleatorias con `printf`, **media por fila**, **las 2 mejores notas por columna** | 1+1+1+2 | Baraja francesa: `obtenerIndicePalo`, `compareTo` (número y palo), `BarajaFrancesa.crearBaraja` (52 cartas), **`barajar()` (Fisher-Yates)**, **`ordenar()` por inserción** | 1+1+1,5+1,5 |\n| Ord. 25/26 (15-ene-26) | `AleatorizarApp`: leer array **validando [1,100]** + **Fisher-Yates** | 1 + 1,5 + 2,5 | Canciones: `Cancion` (constructor, `toString`, `equals`), **`Comparable`** (duración y título), `ListaDeReproduccion.agregarCancion` + **ordenar (inserción/burbuja)**, `CancionParser.parse` con **`ParseException`**, App con `try/catch` | 1+1,5+2,5 |\n| Extra. 25/26 (03-feb-26) | `MatricesApp` N×N aleatoria [-10,10]: **diagonales principal y secundaria**, **fila de suma mayor** | 1+1+1+2 | Álbumes: `Album` (composición con `Cancion[]`, `toString` tipo ficha, `equals`), `Comparable` (año y título), **excepción propia `MiParseadoException extends Exception`**, `AlbumParser.parse` de formato anidado `ALBUM;…;CANCION;…` | 1,5+1+2,5 |\n\n## 3. Patrones detectados\n\n### Ejercicio 1 (arrays/matrices)\n1. **Menú siempre (1 punto)**: `do { … switch … } while (opcion != SALIR)` con el control \"primero ejecuta la opción 1\".\n2. **Lectura con validación (1-1,5 p)**: rango (`[0,10]`, `[1,100]`), tamaño positivo, orden ascendente.\n   Patrón: `do { leer } while (fuera de rango)` o `i--` al detectar un error.\n3. **Algoritmo \"estrella\" (2-2,5 p)**: se alterna entre:\n   - Array 1D: **mezcla lineal**, **Fisher-Yates**. Candidatos próximos: búsqueda binaria, eliminar duplicados, invertir, rotar k posiciones, moda.\n   - Matriz: **traspuesta, triangular, rotar 90°, diagonales, suma de filas/columnas, 2 mejores por columna**. Candidatos: simétrica, matriz identidad, producto de matrices, máximo y su posición, rotar a la izquierda, espiral.\n4. **Ordinario ⇒ suele ser array 1D; extraordinario ⇒ matriz.** Excepción: el ordinario 24/25 fue de matriz.\n5. Aleatorios: `(int)(Math.random()*21) - 10` para `[-10,10]`; reales `Math.random()*10`.\n6. `printf(\"%4d\")`, `printf(\"%.2f\")` para mostrar.\n\n### Ejercicio 2 (POO)\nLo que **cae siempre**:\n| Elemento | Veces (de 6) |\n|---|---|\n| Clase \"modelo\" con constructor + `toString()` | 6/6 |\n| `equals(Object)` sobrescrito | 4/6 |\n| `compareTo` / `implements Comparable` con **criterio doble** (A y, si empata, B) | 6/6 |\n| **Parsear un `String` con `split`** y construir objetos (`Integer.parseInt`, `LocalDate.parse`) | 4/6 |\n| Clase contenedora con **array de objetos + contador** (`agregar`, `mostrar`) | 5/6 |\n| **Algoritmo sobre el array de objetos**: inserción, barajar (Fisher-Yates), cortar, sorteo aleatorio sin repetidos, D'Hondt | 6/6 |\n| **Excepciones**: `throw`, `try/catch`, **excepción propia** | 2/6 (las 2 de 25/26, tendencia al alza) |\n| Herencia (`CartaEspañola extends Carta`, `BarajaEspañola extends Baraja`) | 2/6 |\n| Clase `final` con constantes `static final String[]` (FuenteDeDatos, PALOS_VALIDOS) | 3/6 |\n\n### El patrón más importante\n**El ejercicio 2 del examen es casi igual que la práctica de la sesión 10 de ese curso:**\n- Curso 24/25: la sesión 10 fue `Baraja`, `Carta`, `CartaEspañola`, `CartaFrancesa`, `BarajasApp` → **examen de barajas**.\n- Curso 25/26: la sesión 10 fue `Cancion`, `ListaDeReproduccion`, `FuenteDeDatos`, `MultimediaParser`, `ParseException` → **examen de canciones/álbumes**.\n\nIgual con el ejercicio 1, que sale de las sesiones 04-06 (`MezclaLineal`, `Matrices`, `Estadistica`).\n**Cuando la sesión 10 de IP2027 esté publicada, esa es la práctica que hay que dominar.**\n\n## 4. Predicción para la convocatoria 26/27\n- Ej. 1: menú + lectura validada + un algoritmo de array/matriz no repetido (búsqueda binaria,\n  eliminar duplicados, rotar, matriz simétrica, fila/columna máxima, espiral…).\n- Ej. 2: dominio nuevo (biblioteca, tienda, liga deportiva, vuelos…) con:\n  `toString` + `equals` + `Comparable` (doble criterio) + **parser con `split` y excepción propia** +\n  clase contenedora con array y **ordenación por inserción**, o barajar/sorteo.\n\n## 5. ¿Hacen falta más exámenes?\nCon 6 exámenes de 3 cursos el patrón es estable. Serían útiles:\n- Exámenes **22/23 o anteriores** (para ver si la herencia o las interfaces propias pesan más).\n- Exámenes **parciales o de evaluación continua** de IP2027, si
