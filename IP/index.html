r for 100 is 001). The logic above for the method numberToWords will print \"One\", but that is incorrect. It should print \"One Zero Zero\". To solve this problem, write a third method called getDigitCount.\nThe method getDigitCount should have one int parameter called number and return the count of the digits in that number. If the number is negative, return -1 to indicate an invalid value.\nFor example, if the number has a value of 100, the method getDigitCount should return 3 since the number 100 has 3 digits (1, 0, 0).\nExample Input/Output - getDigitCount method\n    getDigitCount(0); should return 1 since there is only 1 digit\n    getDigitCount(123); should return 3\n    getDigitCount(-12); should return -1 since the parameter is negative\n    getDigitCount(5200); should return 4 since there are 4 digits in the number\nExample Input/Output - reverse method\n    reverse(-121); should  return -121\n    reverse(1212); should return  2121\n    reverse(1234); should return 4321\n    reverse(100); should return 1\nExample Input/Output - numberToWords method\n    numberToWords(123); should print \"One Two Three\".\n    numberToWords(1010); should print \"One Zero One Zero\".\n    numberToWords(1000); should print \"One Zero Zero Zero\".\n    numberToWords(-12); should print \"Invalid Value\" since the parameter is negative.\nHINT: Use a for loop to print zeroes after reversing the number. As seen in a previous example, 100 reversed becomes 1, but the method numberToWords should print \"One Zero Zero\". To get the number of zeroes, check the difference between the digit count from the original number and the reversed number.\nNOTE: When printing words, each word can be in its own line. For example, numberToWords(123); can be:\n    One\n    Two\n    Three\nThey don't have to be separated by a space.\nNOTE: The methods numberToWords, getDigitCount, reverse should be defined as public static like we have been doing so far in the course.\nNOTE: In total, you have to write 3 methods.\nNOTE: Do not add a main method to the solution code.\n */\npackage section06;\n\npublic class NumberToWords {\n\n   public static int getDigitCount(int number) {\n        if (number < 0) return -1;\n        if (number == 0)return 1;\n        int count = 0;\n        for (int i = 1; i <= number; i *= 10) {\n            count++;\n        }\n        return count;\n    }\n\n    public static int reverse(int number) {\n        int reversed = 0;\n        while (number != 0) {\n            reversed = reversed * 10 + number % 10;\n            number /= 10;\n        }\n        return reversed;\n    }\n\n\n    public static void numberToWords(int number) {\n\n       //Special cases\n        if (number < 0) System.out.println(\"Invalid Value\");\n        if (number == 0) System.out.println(\"Zero\");\n\n        int reversed = reverse(number); //Have to do this because reverse(number) /= 10 gives an error. same with getDigitCount(reverse(number)) it just dosen´t work\n        int leadingZeroes = getDigitCount(number) - getDigitCount(reversed);\n        while (reversed != 0) {\n            int lastDigit = reversed % 10;\n            switch (lastDigit) {\n                case 0 -> System.out.println(\"Zero\");\n                case 1 -> System.out.println(\"One\");\n                case 2 -> System.out.println(\"Two\");\n                case 3 -> System.out.println(\"Three\");\n                case 4 -> System.out.println(\"Four\");\n                case 5 -> System.out.println(\"Five\");\n                case 6 -> System.out.println(\"Six\");\n                case 7 -> System.out.println(\"Seven\");\n                case 8 -> System.out.println(\"Eight\");\n                case 9 -> System.out.println(\"Nine\");\n            }\n            reversed /= 10;\n        }\n         for (int i = 0; i < leadingZeroes; i++) {\n            System.out.println(\"Zero\");\n        }\n    }\n}\n\n"}, {"path": "section06/PaintJob.java", "mtime": 1792345018000000000, "size": 5087, "text": "/*\nBob is a wall painter and he needs your help. You have to write a program that helps Bob calculate how many buckets of paint he needs to buy before going to work. Bob might also have some extra buckets at home. He also knows the area that he can cover with one bucket of paint.\n1. Write a method named getBucketCount with 4 parameters. The first parameter should be named width of type double. This parameter represents the width of the wall.\nThe second parameter should be named height of type double. This parameter represents the height of the wall.\nThe third parameter should be named areaPerBucket. This parameter represents the area that can be covered with one bucket of paint.\nThe fourth parameter should be named extraBuckets. This parameter represents the bucket count that Bob has at home.\nThe method needs to return a value of type int that represents the number of buckets that Bob needs to buy before going to work. To calculate the bucket count, refer to the notes below.\nIf one of the parameters width, height or areaPerBucket is less or equal to 0 or if extraBuckets is less than 0, the method needs to return -1 to indicate an invalid value.\nIf all parameters are valid, the method needs to calculate the number of buckets and return it.\nExamples of input/output:\n    getBucketCount(-3.4, 2.1, 1.5, 2); → should return -1 since the width parameter is invalid\n    getBucketCount(3.4, 2.1, 1.5, 2); → should return 3 since the wall area is 7.14, a single bucket can cover an area of 1.5 and Bob has 2 extra buckets home.\n    getBucketCount(2.75, 3.25, 2.5, 1); → should return 3 since the wall area is 8.9375, a single bucket can cover an area of 2.5 and Bob has 1 extra bucket at home.\n2. Bob does not like to enter 0 for the extraBuckets parameter so he needs another method.\nWrite another overloaded method named getBucketCount with 3 parameters namely width, height, and areaPerBucket (all of type double).\nThis method needs to return a value of type int that represents the number of buckets that Bob needs to buy before going to work. To calculate the bucket count, refer to the notes below.\nIf one of the parameters width, height or areaPerBucket is less or equal to 0, the method needs to return -1 to indicate an invalid value.\nIf all parameters are valid, the method needs to calculate the number of buckets and return it.\nExamples of input/output:\n    getBucketCount(-3.4, 2.1, 1.5); → should return -1 since the width parameter is invalid\n    getBucketCount(3.4, 2.1, 1.5); → should return 5 since the wall area is 7.14, and a single bucket can cover an area of 1.5.\n    getBucketCount(7.25, 4.3, 2.35); → should return 14 since the wall area is 31.175, and a single bucket can cover an area of 2.35.\n3. In some cases, Bob does not know the width and height of the wall but he knows the area of a wall. He needs you to write another method.\nWrite another overloaded method named getBucketCount with 2 parameters namely, area and areaPerBucket (both of type double).\nThe method needs to return a value of type int that represents the number of buckets that Bob needs to buy before going to work. To calculate the bucket count, refer to the notes below.\nIf one of the parameters area or areaPerBucket is less or equal to 0, the method needs to return -1to indicate an invalid value.\nIf all parameters are valid, the method needs to calculate the number of buckets and return it.\nExamples of input/output:\n    getBucketCount(3.4, 1.5); → should return 3 since the area is 3.4 and a single bucket can cover an area of 1.5\n    getBucketCount(6.26, 2.2); → should return 3 since the wall area is 6.26 and a single bucket can cover an area of 2.2.\n    getBucketCount(3.26, 0.75); → should return 5 since the wall area is 3.26, and a single bucket can cover an area of 0.75 .\nDo your best to help Bob .\nNOTE: Use the method Math.ceil to round the number of calculated buckets (double) then convert it into an int before returning the value from the methods.\nNOTE: All ​methods should be defined as public static like we have been doing so far in the course.\nNOTE: Do not add the main method to the solution code.\n */\npackage section06;\n\npublic class PaintJob {\n\n    public static int getBucketCount(double width, double height, double areaPerBucket, int extraBuckets) {\n\n        if (width <= 0 || height <= 0 || areaPerBucket <= 0 || extraBuckets < 0) return -1;\n\n        double areaOfTheWall = width * height;\n\n        return (int) Math.ceil((areaOfTheWall / areaPerBucket)) - extraBuckets;\n    }\n\n    public static int getBucketCount(double width, double height, double areaPerBucket) {\n\n        if (width <= 0 || height <= 0 || areaPerBucket <= 0) return -1;\n\n        double areaOfTheWall = width * height;\n\n        return (int) Math.ceil((areaOfTheWall / areaPerBucket));\n    }\n\n    public static int getBucketCount(double area, double areaPerBucket) {\n\n        if (area <= 0 || areaPerBucket <= 0) return -1;\n\n        return (int) Math.ceil((area / areaPerBucket));\n    }\n}\n"}, {"path": "section06/PerfectNumber.java", "mtime": 1791727105000000000, "size": 1816, "text": "/*\nWhat is the perfect number?\nA perfect number is a positive integer which is equal to the sum of its proper positive divisors.\nProper positive divisors are positive integers that fully divide the perfect number without leaving a remainder and exclude the perfect number itself.\nFor example, take the number 6:\nIts proper divisors are 1, 2, and 3 (since 6 is the value of the perfect number, it is excluded), and the sum of its proper divisors is 1 + 2 + 3 = 6.\nTherefore, 6 is a perfect number (as well as the first perfect number).\nWrite a method named isPerfectNumber with one parameter of type int named number.\nIf number is < 1, the method should return false.\nThe method must calculate if the number is perfect. If the number is perfect, the method should return true; otherwise, it should return false.\nEXAMPLE INPUT/OUTPUT:\n    isPerfectNumber(6); should return true since its proper divisors are 1, 2, 3 and the sum is 1 + 2 + 3 = 6\n    isPerfectNumber(28); should return true since its proper divisors are 1, 2, 4, 7, 14 and the sum is 1 + 2 + 4 + 7 + 14 = 28\n    isPerfectNumber(5); should return false since its only proper divisor is 1 and the sum is 1 not 5\n    isPerfectNumber(-1); should return false since the number is < 1\nHINT: Use a while or for loop.\nHINT: Use the remainder operator.\nNOTE: The method isPerfectNumber ​should be defined as public static like we have been doing so far in the course.\nNOTE: Do not add a main method to the solution code.\n */\npackage section06;\n\npublic class PerfectNumber {\n\n    public static boolean isPerfectNumber(int number) {\n\n        if (number < 1) return false;\n        int sum = 0;\n        for (int i = 1; i <= number; i++) {\n            if (number % i == 0) sum += i;\n        }\n        return number == sum;\n    }\n}\n"}, {"path": "section06/SharedDigit.java", "mtime": 1791571629000000000, "size": 1379, "text": "/*\nWrite a method named hasSharedDigit with two parameters of type int.\nEach number should be within the range of 10 (inclusive) - 99 (inclusive). If one of the numbers is not within the range, the method should return false.\nThe method should return true if there is a digit that appears in both numbers, such as 2 in 12 and 23; otherwise, the method should return false.\nEXAMPLE INPUT/OUTPUT:\n    hasSharedDigit(12, 23); → should return true since the digit 2 appears in both numbers\n    hasSharedDigit(9, 99); → should return false since 9 is not within the range of 10-99\n    hasSharedDigit(15, 55); → should return true since the digit 5 appears in both numbers\nNOTE: The method hasSharedDigit​ should be defined as public static like we have been doing so far in the course.\nNOTE: Do not add a main method to the solution code.\n */\npackage section06;\n\npublic class SharedDigit  {\n public static boolean hasSharedDigit(int a, int b) {\n\n     if (a < 10 || a > 99 || b < 10 || b > 99) return false;\n\n     int aLeftDigit = a / 10;\n     int aRightDigit = a % 10;\n     int bLeftDigit = b / 10;\n     int bRightDigit = b % 10;\n\n     boolean firstShared = aLeftDigit == bLeftDigit || aLeftDigit == bRightDigit;\n     boolean secondShared = aRightDigit == bLeftDigit || aRightDigit == bRightDigit;\n\n     return firstShared || secondShared;\n }\n}\n\n"}, {"path": "section06/SumOddRange.java", "mtime": 1791532701000000000, "size": 2041, "text": "/*\nWrite a method called isOdd with an int parameter and call it number. The method needs to return a boolean.\nCheck that number is > 0, if it is not return false.\nIf number is odd return true, otherwise return false.\nWrite a second method called sumOdd that has 2 int parameters start and end, which represent a range of numbers.\nThe method should use a for loop to sum all odd numbers in that range including the end and return the sum.\nIt should call the method isOdd to check if each number is odd.\nThe parameter end needs to be greater than or equal to start and both start and end parameters have to be greater than 0.\nIf those conditions are not satisfied return -1 from the method to indicate invalid input.\nExample input/output:\n    sumOdd(1, 100); → should return 2500\n    sumOdd(-1, 100); → should return -1\n    sumOdd(100, 100); → should return 0\n    sumOdd(13, 13); → should return 13 (This set contains one number, 13, and it is odd)\n    sumOdd(100, -100); → should return -1\n    sumOdd(100, 1000); → should return 247500\nTIP: use the remainder operator to check if the number is odd\nNOTE: Both methods needs to be defined as public static like we have been doing so far in the course.\nNOTE: Do not add a main method to solution code.\n */\npackage section06;\n\npublic class SumOddRange {\n        public static boolean isOdd(int number) {\n            if (number < 0) return false;\n            else if (number % 2 == 0) return false;\n            else return true;\n        }\n\n        public static int sumOdd(int start, int end) {\n            int sum = 0;\n            if (start > 0 && end > 0 && start < end) {\n                for (int i = start; start <= end; start++) {\n                    if (isOdd(start)) sum += start;\n                }\n                return sum;\n            } else if (start == end && !isOdd(start)) {\n                return 0;\n            } else if (start == end && isOdd(start)) {\n                return start;\n            } else return -1;\n        }\n}"}, {"path": "section07/ComplexNumber.java", "mtime": 1792520662000000000, "size": 4272, "text": "/*\nA complex number is a number that can be expressed in the form a + bi, where a and b are real numbers,\nand i is a solution of the equation x2 = −1. Because no real number satisfies this equation, i is called an imaginary number.\nFor the complex number a + bi, a is called the real part, and b is called the imaginary part. To add or subtract two complex numbers,\njust add or subtract the corresponding real and imaginary parts. For instance, the sum of 5 + 3i and 4 + 2i is 9 + 5i. For another,\nthe sum of 3 + i and –1 + 2i is 2 + 3i.\nWrite a class with the name ComplexNumber. The class needs two fields (instance variables) with name real and imaginary of type double.\nIt represents the Complex Number.\nThe class needs to have one constructor. The constructor has parameters real and imaginary of type double and it needs to initialize the fields.\nWrite the following methods (instance methods):\n    Method named getReal without any parameters, it needs to return the value of real field.\n    Method named getImaginary without any parameters, it needs to return the value of imaginary field.\n    Method named add with two parameters real and imaginary of type double, it needs to add parameters to fields.\n        In other words, it needs to do a complex number add operation as described above.\n    Method named add with one parameter of type ComplexNumber. It needs to add the ComplexNumber parameter to the corresponding instance variables.\n    Method named subtract with two parameters real and imaginary of type double,\n        it needs to subtract parameters from fields, in other words, it needs to do a complex number subtract operation as described above.\n    Method named subtract with one parameter of type ComplexNumber. It needs to subtract the other parameter from this complex number.\nTEST EXAMPLE\n→ TEST CODE:\n    ComplexNumber one = new ComplexNumber(1.0, 1.0);\n    ComplexNumber number = new ComplexNumber(2.5, -1.5);\n    one.add(1,1);\n    System.out.println(\"one.real= \" + one.getReal());\n    System.out.println(\"one.imaginary= \" + one.getImaginary());\n    one.subtract(number);\n    System.out.println(\"one.real= \" + one.getReal());\n    System.out.println(\"one.imaginary= \" + one.getImaginary());\n    number.subtract(one);\n    System.out.println(\"number.real= \" + number.getReal());\n    System.out.println(\"number.imaginary= \" + number.getImaginary());\n→ OUTPUT\n    one.real= 2.0\n    one.imaginary= 2.0\n    one.real= -0.5\n    one.imaginary= 3.5\n    number.real= 3.0\n    number.imaginary= -5.0\nNOTE: Try to avoid duplicated code.\nNOTE: All ​methods should be defined as public NOT public static.\nNOTE: In total, you have to write 6 methods.\nNOTE: Do not add a main method to the solution code.\n */\npackage section07;\n\npublic class ComplexNumber {\n    public static void main(String[] args) { //Added main method to check the solution\n        ComplexNumber one = new ComplexNumber(1.0, 1.0);\n        ComplexNumber number = new ComplexNumber(2.5, -1.5);\n        one.add(1, 1);\n        System.out.println(\"one.real= \" + one.getReal());\n        System.out.println(\"one.imaginary= \" + one.getImaginary());\n        one.subtract(number);\n        System.out.println(\"one.real= \" + one.getReal());\n        System.out.println(\"one.imaginary= \" + one.getImaginary());\n        number.subtract(one);\n        System.out.println(\"number.real= \" + number.getReal());\n        System.out.println(\"number.imaginary= \" + number.getImaginary());\n    }\n\n    private double real, imaginary;\n\n    public ComplexNumber(double real, double imaginary) {\n        this.real = real;\n        this.imaginary = imaginary;\n    }\n\n    public double getReal() {\n        return real;\n    }\n\n    public double getImaginary() {\n        return imaginary;\n    }\n\n    public void add(double real, double imaginary) {\n        this.real += real;\n        this.imaginary += imaginary;\n    }\n\n    public void add(ComplexNumber a) {\n        add(a.real, a.imaginary);\n    }\n\n    public void subtract(double real, double imaginary) {\n        this.real -= real;\n        this.imaginary -= imaginary;\n    }\n\n    public void subtract(ComplexNumber a) {\n        subtract(a.real, a.imaginary);\n    }\n}\n"}, {"path": "section07/Person.java", "mtime": 1792483992000000000, "size": 3630, "text": "/*\nWrite a class with the name Person. The class needs three fields (instance variables) with the names firstName, lastName of type String and age of type int.\nWrite the following methods (instance methods):\n    Method named getFirstName without any parameters, it needs to return the value of the firstName field.\n    Method named getLastName without any parameters, it needs to return the value of the lastName field.\n    Method named getAge without any parameters, it needs to return the value of the age field.\n    Method named setFirstName with one parameter of type String, it needs to set the value of the firstName field.\n    Method named setLastName with one parameter of type String, it needs to set the value of the lastName field.\n    Method named setAge with one parameter of type int, it needs to set the value of the age field. If the parameter is less than 0 or greater than 100, it needs to set the age field value to 0.\n    Method named isTeen without any parameters, it needs to return true if the value of the age field is greater than 12 and less than 20, otherwise, return false.\n    Method named getFullName without any parameters, it needs to return the full name of the person.\n        In case both firstName and lastName fields are empty, Strings return an empty String.\n        In case lastName is an empty String, return firstName.\n        In case firstName is an empty String, return lastName.\nTo check if s String is empty, use the method isEmpty from the String class. For example, firstName.isEmpty() returns true if the String is empty or in other words, when the String does not contain any characters.\nTEST EXAMPLE\nTEST CODE:\n    Person person = new Person();\n    person.setFirstName(\"\");   // firstName is set to empty string\n    person.setLastName(\"\");    // lastName is set to empty string\n    person.setAge(10);\n    System.out.println(\"fullName= \" + person.getFullName());\n    System.out.println(\"teen= \" + person.isTeen());\n    person.setFirstName(\"John\");    // firstName is set to John\n    person.setAge(18);\n    System.out.println(\"fullName= \" + person.getFullName());\n    System.out.println(\"teen= \" + person.isTeen());\n    person.setLastName(\"Smith\");    // lastName is set to Smith\n    System.out.println(\"fullName= \" + person.getFullName());\nOUTPUT\n    fullName=\n    teen= false\n    fullName= John\n    teen= true\n    fullName= John Smith\nNOTE: All ​methods should be defined as public NOT public static.\nNOTE: In total, you have to write 8 methods.\nNOTE: Do not add the main method to the solution code.\n */\npackage section07;\n\npublic class Person {\n\n    private String firstName;\n    private String lastName;\n    private int age;\n\n    public String getFirstName() {\n        return firstName;\n    }\n\n    public String getLastName() {\n        return lastName;\n    }\n\n    public int getAge() {\n        return age;\n    }\n\n    public void setFirstName(String firstName) {\n        this.firstName = firstName;\n    }\n\n    public void setLastName(String lastName) {\n        this.lastName = lastName;\n    }\n\n    public void setAge(int age) {\n        this.age = age;\n        if (age < 0 || age > 100) this.age = 0;\n    }\n\n    public boolean isTeen() {\n        return (getAge() > 12 && getAge() < 20);\n    }\n\n    public String getFullName() {\n        if (getFirstName().isEmpty() && getLastName().isEmpty()) return \"\";\n        else if (getLastName().isEmpty()) return getFirstName();\n        else if (getFirstName().isEmpty()) return getLastName();\nelse return getFirstName() + \" \" + getLastName();\n\n    }\n}\n"}, {"path": "section07/Point.java", "mtime": 1792520662000000000, "size": 2968, "text": "/*\nYou have to represent a point in 2D space. Write a class with the name Point.\nThe class needs two fields (instance variables) with name x and y of type int.\nThe class needs to have two constructors.\nThe first constructor does not have any parameters (no-arg constructor).\nThe second constructor has parameters x and y of type int and it needs to initialize the fields.\nWrite the following methods (instance methods):\n    Method named getX without any parameters, it needs to return the value of x field.\n    Method named getY without any parameters, it needs to return the value of y field.\n    Method named setX with one parameter of type int, it needs to set the value of the x field.\n    Method named setY with one parameter of type int, it needs to set the value of the y field.\n    Method named distance without any parameters, it needs to return the distance between this\n        Point and Point (0, 0) as a double.\n    Method named distance with parameter of type Point, it needs to return the distance\n        between this Point and the parameter Point as a double.\n    Method named distance with two parameters x, y both of type int, it needs to return\n        the distance between this Point and Point x, y as a double.\nHow to find the distance between two points\nTo find a distance between points A(xA,yA) and B(xB,yB), we use the formula:\nd(A,B)=√ (xB − xA) * (xB - xA) + (yB − yA) * (yB - yA)\nWhere √ represents square root.\nTEST EXAMPLE\n→ TEST CODE:\n    Point first = new Point(6, 5);\n    Point second = new Point(3, 1);\n    System.out.println(\"distance(0,0)= \" + first.distance());\n    System.out.println(\"distance(second)= \" + first.distance(second));\n    System.out.println(\"distance(2,2)= \" + first.distance(2, 2));\n    Point point = new Point();\n    System.out.println(\"distance()= \" + point.distance());\nOUTPUT\n    distance(0,0)= 7.810249675906654\n    distance(second)= 5.0\n    distance(2,2)= 5.0\n    distance()= 0.0\nNOTE: Use Math.sqrt to calculate the square root √.\nNOTE: Try to avoid duplicated code\nNOTE: All ​methods should be defined as public NOT public static.\nNOTE: In total, you have to write 7 methods.\nNOTE: Do not add a main method to the solution code\n */\npackage section07;\n\n\n\npublic class Point {\n\n    private int x;\n    private int y;\n\n    public Point() {}\n\n    public Point(int x, int y) {\n    setX(x);\n    setY(y);\n    }\n\n    public int getX() {\n        return x;\n    }\n\n    public void setX(int x) {\n        this.x = x;\n    }\n\n    public int getY() {\n        return y;\n    }\n\n    public void setY(int y) {\n        this.y = y;\n    }\n\n    public double distance() {\n        return distance(0, 0);\n    }\n\n    public double distance(Point a) {\n        return distance(a.x, a.y);\n    }\n\n    public double distance(int x, int y) {\n\n        return Math.sqrt((this.x - x) * (this.x - x) + (this.y - y) * (this.y - y));\n    }\n}\n\n\n"}, {"path": "section07/SimpleCalculator.java", "mtime": 1792396649000000000, "size": 3298, "text": "/*\nWrite a class with the name SimpleCalculator. The class needs two fields (instance variables) with names firstNumber and secondNumber both of type double.\nWrite the following methods (instance methods):\n    Method named getFirstNumber without any parameters, it needs to return the value of firstNumber field.\n    Method named getSecondNumber without any parameters, it needs to return the value of secondNumber field.\n    Method named setFirstNumber with one parameter of type double, it needs to set the value of the firstNumber field.\n    Method named setSecondNumber with one parameter of type double, it needs to set the value of the secondNumberfield.\n    Method named getAdditionResult without any parameters, it needs to return the result of adding the field values of firstNumber and secondNumber.\n    Method named getSubtractionResult without any parameters, it needs to return the result of subtracting the field values of secondNumber from the firstNumber.\n    Method named getMultiplicationResult without any parameters, it needs to return the result of multiplying the field values of firstNumber and secondNumber.\n    Method named getDivisionResult without any parameters it needs to return the result of dividing the field values of firstNumber by the secondNumber. In case the value of secondNumber is 0 then return 0.\nTEST EXAMPLE\nTEST CODE:\n    SimpleCalculator calculator = new SimpleCalculator();\n    calculator.setFirstNumber(5.0);\n    calculator.setSecondNumber(4);\n    System.out.println(\"add= \" + calculator.getAdditionResult());\n    System.out.println(\"subtract= \" + calculator.getSubtractionResult());\n    calculator.setFirstNumber(5.25);\n    calculator.setSecondNumber(0);\n    System.out.println(\"multiply= \" + calculator.getMultiplicationResult());\n    System.out.println(\"divide= \" + calculator.getDivisionResult());\nOUTPUT\n    add= 9.0\n    subtract= 1.0\n    multiply= 0.0\n    divide= 0.0\nTIPS:\n    add= 9.0 is printed because 5.0 + 4 is 9.0\n    subtract= 1.0 is printed because 5.0 - 4 is 1.0\n    multiply= 0.0 is printed because 5.25 * 0 is 0.0\n    divide= 0.0 is printed because secondNumber is set to 0\nNOTE: All ​methods should be defined as public NOT public static.\nNOTE: In total, you have to write 8 methods.\nNOTE: Do not add the main method to the solution code.\n */\npackage section07;\n\npublic class SimpleCalculator {\n\n    double firstNumber;\n    double secondNumber;\n\n    public SimpleCalculator() {\n\n    }\n\n\n    public double getFirstNumber() {\n        return firstNumber;\n    }\n\n    public double getSecondNumber() {\n        return secondNumber;\n    }\n\n    public void setFirstNumber(double firstNumber) {\n        this.firstNumber = firstNumber;\n    }\n\n    public void setSecondNumber(double secondNumber) {\n        this.secondNumber = secondNumber;\n    }\n\n    public double getAdditionResult() {\n        return firstNumber + secondNumber;\n    }\n\n    public double getSubtractionResult() {\n        return firstNumber - secondNumber;\n    }\n\n    public double getMultiplicationResult() {\n        return firstNumber * secondNumber;\n    }\n\n    public double getDivisionResult() {\n        if (secondNumber == 0) return 0;\n        return firstNumber / secondNumber;\n    }\n}\n"}, {"path": "section07/Wall.java", "mtime": 1792483992000000000, "size": 2567, "text": "/*\nWrite a class with the name Wall. The class needs two fields (instance variables) with name width and height of type double.\nThe class needs to have two constructors:\n    The first constructor does not have any parameters (no-args constructor).\n    The second constructor has parameters width and height of type double and it needs to initialize the fields.\nIn case the width parameter is less than 0 it needs to set the width field value to 0.\nIn case the height parameter is less than 0 it needs to set the height field value to 0.\nWrite the following methods (instance methods):\n    Method named getWidth without any parameters, it needs to return the value of width field.\n    Method named getHeight without any parameters, it needs to return the value of height field.\n    Method named setWidth with one parameter of type double, it needs to set the value of the width field. If the parameter is less than 0 it needs to set the width field value to 0.\n    Method named setHeight with one parameter of type double, it needs to set the value of the height field. If the parameter is less than 0 it needs to set the height field value to 0.\n    Method named getArea without any parameters, it needs to return the area of the wall.\nTEST EXAMPLE\n→ TEST CODE:\n    1 Wall wall = new Wall(5,4);\n    2 System.out.println(\"area= \" + wall.getArea());\n    3\n    4 wall.setHeight(-1.5);\n    5 System.out.println(\"width= \" + wall.getWidth());\n    6 System.out.println(\"height= \" + wall.getHeight());\n    7 System.out.println(\"area= \" + wall.getArea());\n→ OUTPUT:\n    area= 20.0\n    width= 5.0\n    height= 0.0\n    area= 0.0\nNOTE: All ​methods should be defined as public NOT public static.\nNOTE: In total, you have to write 5 methods and 2 constructors.\nNOTE: Do not add a main method to the solution code.\n */\npackage section07;\n\npublic class Wall {\n\n    private double width;\n    private double height;\n\n    public Wall() {\n\n    }\n\n    public Wall(double width, double height) {\n        setHeight(height);\n        setWidth(width);\n    }\n\n    public double getWidth() {\n        return this.width;\n    }\n\n    public double getHeight() {\n        return this.height;\n    }\n\n    public void setWidth(double width) {\n        this.width = width;\n        if (this.width < 0) this.width = 0;\n    }\n\n    public void setHeight(double height) {\n        this.height = height;\n        if (this.height < 0) this.height = 0;\n    }\n\n    public double getArea() {\n        return getHeight() * getWidth();\n    }\n\n}\n"}, {"path": "section07/exercise34/Calculator.java", "mtime": 1792520662000000000, "size": 338, "text": "package section07.exercise34;\n\npublic class Calculator {\n    private Floor floor;\n    private Carpet carpet;\n\n    public Calculator(Floor floor, Carpet carpet) {\n        this.floor = floor;\n        this.carpet = carpet;\n    }\n\n    public double getTotalCost() {\n        return floor.getArea() * carpet.getCost();\n    }\n\n}\n"}, {"path": "section07/exercise34/Carpet.java", "mtime": 1792520662000000000, "size": 262, "text": "package section07.exercise34;\n\npublic class Carpet {\n\n    private double cost;\n\n    public Carpet(double cost) {\n        this.cost = cost;\n        if (this.cost < 0) this.cost = 0;\n    }\n\n    public double getCost() {\n        return cost;\n    }\n}\n"}, {"path": "section07/exercise34/Floor.java", "mtime": 1792520662000000000, "size": 377, "text": "package section07.exercise34;\n\npublic class Floor {\n\n    private double width, length;\n\n    public Floor(double width, double length) {\n        this.width = width;\n        if (this.width < 0) this.width = 0;\n        this.length = length;\n        if (this.length < 0) this.length = 0;\n    }\n\n    public double getArea() {\n        return width * length;\n    }\n}\n"}, {"path": "section07/exercise34/Statement of the exercise", "mtime": 1792520662000000000, "size": 2648, "text": "The Carpet Company has asked you to write an application that calculates the price of carpeting for rectangular rooms.\nTo calculate the price, you multiply the area of the floor (width times length) by the price per square meter of carpet.\nFor example, the area of the floor that is 12 meters long and 10 meters wide is 120 square meters.\nTo cover the floor with a carpet that costs $8 per square meter would cost $960.\n1. Write a class with the name Floor. The class needs two fields (instance variables) with name width and length of type double.\nThe class needs to have one constructor with parameters width and length of type double and it needs to initialize the fields.\nIn case the width parameter is less than 0 it needs to set the width field value to 0, in case the length parameter is less than 0 it needs to\nset the length field value to 0.\nWrite the following methods (instance methods):\n    Method named getArea without any parameters, it needs to return the calculated area (width * length).\n2. Write a class with the name Carpet. The class needs one field (instance variable) with name cost of type double.\nThe class needs to have one constructor with parameter cost of type double and it needs to initialize the field.\nIn case the cost parameter is less than 0 it needs to set the cost field value to 0.\nWrite the following methods (instance methods):\n    Method named getCost without any parameters, it needs to return the value of cost field\n3. Write a class with the name Calculator. The class needs two fields (instance variables) with name floor of type Floor and carpet of type Carpet.\nThe class needs to have one constructor with parameters floor of type Floor and carpet of type Carpet and it needs to initialize the fields.\nWrite the following methods (instance methods):\n    Method named getTotalCost without any parameters, it needs to return the calculated total cost to cover the floor with a carpet.\nTEST EXAMPLE\n→ TEST CODE:\n    Carpet carpet = new Carpet(3.5);\n    Floor floor = new Floor(2.75, 4.0);\n    Calculator calculator = new Calculator(floor, carpet);\n    System.out.println(\"total= \" + calculator.getTotalCost());\n    carpet = new Carpet(1.5);\n    floor = new Floor(5.4, 4.5);\n    calculator = new Calculator(floor, carpet);\n    System.out.println(\"total= \" + calculator.getTotalCost());\n→ OUTPUT\n    total= 38.5\n    total= 36.45\nNOTE: All ​methods should be defined as public NOT public static.\nNOTE: In total, you have to write 3 classes.\nNOTE: Make sure to put each class in its own file. See tabs to the left.\nNOTE: Do not add a main method to the solution code."}, {"path": "section07/exercise36/Circle.java", "mtime": 1792591778000000000, "size": 358, "text": "package section07.exercise36;\n\npublic class Circle {\n\n    private double radius;\n\n    public Circle(double radius){\n        this.radius = radius;\n        if(this.radius < 0 ) this.radius = 0;\n    }\n\n    public double getRadius(){\n        return radius;\n    }\n    public double getArea(){\n        return radius * radius * Math.PI;\n    }\n\n}\n"}, {"path": "section07/exercise36/Cylinder.java", "mtime": 1792591778000000000, "size": 421, "text": "package section07.exercise36;\n\npublic class Cylinder extends Circle {\n    private double height;\n\n    public Cylinder(double radius, double height) {\n        super(radius);\n        this.height = height;\n        if (this.height < 0) this.height = 0;\n    }\n\n    public double getHeight() {\n        return height;\n    }\n\n    public double getVolume() {\n        return getHeight() * getArea();\n    }\n\n\n}\n"}, {"path": "section07/exercise36/Statement of the exercise", "mtime": 1792591778000000000, "size": 2275, "text": "1. Write a class with the name Circle. The class needs one field (instance variable) with name radius of type double.\nThe class needs to have one constructor with parameter radius of type double and it needs to initialize the fields.\nIn case the radius parameter is less than 0 it needs to set the radius field value to 0.\nWrite the following methods (instance methods):\n    Method named getRadius without any parameters, it needs to return the value of radius field.\n    Method named getArea without any parameters, it needs to return the calculated area (radius * radius * PI). For PI use Math.PI constant.\n2. Write a class with the name Cylinder that extends Circle class. The class needs one field (instance variable) with name height of type double.\nThe class needs to have one constructor with two parameters radius and height both of type double. It needs to call parent constructor and initialize a height field.\nIn case the height parameter is less than 0 it needs to set the height field value to 0.\nWrite the following methods (instance methods):\n    Method named getHeight without any parameters, it needs to return the value of height field.\n    Method named getVolume without any parameters, it needs to return the calculated volume. To calculate volume multiply the area with height.\nTEST EXAMPLE\n→ TEST CODE:\n    Circle circle = new Circle(3.75);\n    System.out.println(\"circle.radius= \" + circle.getRadius());\n    System.out.println(\"circle.area= \" + circle.getArea());\n    Cylinder cylinder = new Cylinder(5.55, 7.25);\n    System.out.println(\"cylinder.radius= \" + cylinder.getRadius());\n    System.out.println(\"cylinder.height= \" + cylinder.getHeight());\n    System.out.println(\"cylinder.area= \" + cylinder.getArea());\n    System.out.println(\"cylinder.volume= \" + cylinder.getVolume());\n→ OUTPUT\n    circle.radius= 3.75\n    circle.area= 44.178646691106465\n    cylinder.radius= 5.55\n    cylinder.height= 7.25\n    cylinder.area= 96.76890771219959\n    cylinder.volume= 701.574580913447\nNOTE: All ​methods should be defined as public NOT public static.\nNOTE: In total, you have to write 2 classes.\nNOTE: Make sure to put each class in its own file. See tabs to the left.\nNOTE: Do not add a main method to the solution code."}, {"path": "section07/exercise37/Cuboid.java", "mtime": 1792591778000000000, "size": 441, "text": "package section07.exercise37;\n\npublic class Cuboid extends Rectangle {\n    private double height;\n\n    public Cuboid(double width, double length, double height) {\n        super(width, length);\n        this.height = height;\n        if (this.height < 0) this.height = 0;\n    }\n\n    public double getHeight() {\n        return height;\n    }\n\n    public double getVolume() {\n        return getArea() * getHeight();\n    }\n\n\n}\n"}, {"path": "section07/exercise37/Rectangle.java", "mtime": 1792591778000000000, "size": 518, "text": "package section07.exercise37;\n\npublic class Rectangle {\n\n    private double width, length;\n\n    public Rectangle(double width, double length) {\n        this.width = width;\n        if (this.width < 0) this.width = 0;\n        this.length = length;\n        if (this.length < 0) this.length = 0;\n    }\n    public double getWidth(){\n        return width;\n    }\n    public double getLength(){\n        return length;\n    }\n    public double getArea(){\n        return this.width * this.length;\n    }\n\n}\n"}, {"path": "section07/exercise37/Statement of the exercise", "mtime": 1792591778000000000, "size": 2770, "text": "The Swimming Company has asked you to write an application that calculates the volume of cuboid shaped pools.\n\n\n1. Write a class with the name Rectangle. The class needs two fields (instance variable) with name width and length both of type double.\n\nThe class needs to have one constructor with parameters width and length both of type double and it needs to initialize the fields.\n\nIn case the width parameter is less than 0 it needs to set the width field value to 0.\n\nIn case the length parameter is less than 0 it needs to set the length field value to 0.\n\nWrite the following methods (instance methods):\n\n    Method named getWidth without any parameters, it needs to return the value of width field.\n\n    Method named getLength without any parameters, it needs to return the value of length field.\n\n    Method named getArea without any parameters, it needs to return the calculated area (width * length).\n\n\n2. Write a class with the name Cuboid that extends Rectangle class. The class needs one field (instance variable) with name height of type double.\n\nThe class needs to have one constructor with three parameters width, length, and height all of type double. It needs to call parent constructor and initialize a height field.\n\nIn case the height parameter is less than 0 it needs to set the height field value to 0.\n\nWrite the following methods (instance methods):\n\n    Method named getHeight without any parameters, it needs to return the value of height field.\n\n    Method named getVolume without any parameters, it needs to return the calculated volume. To calculate volume multiply the area with height.\n\n\nTEST EXAMPLE\n\n→ TEST CODE:\n\n    Rectangle rectangle = new Rectangle(5, 10);\n    System.out.println(\"rectangle.width= \" + rectangle.getWidth());\n    System.out.println(\"rectangle.length= \" + rectangle.getLength());\n    System.out.println(\"rectangle.area= \" + rectangle.getArea());\n    Cuboid cuboid = new Cuboid(5,10,5);\n    System.out.println(\"cuboid.width= \" + cuboid.getWidth());\n    System.out.println(\"cuboid.length= \" + cuboid.getLength());\n    System.out.println(\"cuboid.area= \" + cuboid.getArea());\n    System.out.println(\"cuboid.height= \" + cuboid.getHeight());\n    System.out.println(\"cuboid.volume= \" + cuboid.getVolume());\n\n→ OUTPUT\n\n    rectangle.width= 5.0\n    rectangle.length= 10.0\n    rectangle.area= 50.0\n    cuboid.width= 5.0\n    cuboid.length= 10.0\n    cuboid.area= 50.0\n    cuboid.height= 5.0\n    cuboid.volume= 250.0\n\n\nNOTE: All ​methods should be defined as public NOT public static.\n\nNOTE: In total, you have to write 2 classes.\n\nNOTE: Make sure to put each class in its own file. See tabs to the left.\n\nNOTE: Do not add a main method to the solution code."}, {"path": "section08/Printer.java", "mtime": 1793277660000000000, "size": 4386, "text": "/*\nIn this exercise you will create one class and name it Printer. This class will have two member variables of type int, tonerLevel and pagesPrinted, and one of type boolean called duplex. All three fields will have private access. The constructor will accept two of these variables, tonerLevel and duplex, as parameters following these rules:\n    tonerLevel must be greater than -1 but less than or equal to 100. If it does not meet these conditions then it should be initialized to -1.\n    duplex should be initialized to the value of the parameter.\nIn addition, pagesPrinted should be initialized to 0.\nThree other methods need to be defined in this way:\n    addToner will accept one parameter, tonerAmount of type int. First off, tonerAmount should be greater than 0 and less than or equal to 100. If this condition is met a second test must be included to test whether tonerLevel plus tonerAmount is greater than 100. If so, the method should return -1. If not then tonerLevel should have the incoming tonerAmount added to it and the new tonerLevel should then be returned by the method. Also, if the initial condition test fails, then the method should return -1.\n    printPages will accept one parameter, pages of type int. A variable called pagesToPrint should be created and initialized to the value of the incoming parameter.   A conditional check should be performed on whether the Printer class field, duplex, is either \"true\" or \"false\". If \"true\" then a calculation must be performed to determine the number of pages needed to print the job double sided. The pagesToPrint value is then added to the class field pagesPrinted, but the value of pagesToPrint should be returned by the method.\n    getPagesPrinted has no parameters and merely returns the value of the member variable pagesPrinted.\nExample input:\n    Printer printer = new Printer(50, true);\n    System.out.println(printer.addToner(50));\n    System.out.println(\"initial page count = \" +printer.getPagesPrinted());\n    int pagesPrinted = printer.printPages(4);\n    System.out.println(\"Pages printed was \" + pagesPrinted +\" new total print count for printer = \" +printer.getPagesPrinted());\n    pagesPrinted = printer.printPages(2);\n    System.out.println(\"Pages printed was \" + pagesPrinted +\" new total print count for printer = \" +printer.getPagesPrinted());\nExample output:\n    100\n    initial page count = 0\n    Printing in duplex mode\n    Pages printed was 2 new total print count for printer = 2\n    Printing in duplex mode\n    Pages printed was 1 new total print count for printer = 3\nTips:\n    Remember to only paste the code from Printer class into the exercise evaluator. The Main class does not need to be pasted in.\n    You can include a message in the printPages method which informs the user that the printer is printing in duplex mode if duplex is equal to \"true\" if you want.\n    When calculating pagesToPrint if duplex is equal to \"true\" remember that there are two operators which can help you with this. The division \"/\" operator divides a number and returns only the quotient without any remainder. And the modulo \"%\" operator divides the number and returns only the remainder, whether 0 or otherwise.\n */\npackage section08;\n\npublic class Printer {\n\n    private int tonerLevel;\n    private int pagesPrinted = 0;\n    private boolean duplex;\n\n    public Printer(int tonerLevel, boolean duplex) {\n        this.tonerLevel = tonerLevel;\n        if (this.tonerLevel < 0 || this.tonerLevel > 100) this.tonerLevel = -1;\n        this.duplex = duplex;\n    }\n\n    public int addToner(int tonerAmount) {\n        if (tonerAmount <= 0 || tonerAmount > 100) {\n            return -1;\n        }\n        if (tonerLevel + tonerAmount > 100) return -1;\n        return tonerLevel += tonerAmount;\n    }\n\n    public int printPages(int pages) {\n        int pagesToPrint = pages;\n        if (duplex == true) {\n            if (pagesToPrint % 2 == 0) {\n                pagesPrinted += pagesToPrint;\n                return pagesToPrint / 2;\n            } else {\n                pagesPrinted += pagesToPrint;\n                return pagesToPrint / 2 + 1;\n            }\n        } else {\n            pagesPrinted += pagesToPrint;\n            return pagesToPrint;\n        }\n    }\n\n    public int getPagesPrinted() {\n        return pagesPrinted;\n    }\n}\n"}, {"path": "section08/exercise38/Bed.java", "mtime": 1793102168000000000, "size": 758, "text": "package section08.exercise38;\n\npublic class Bed{\n\n\n    private String style;\n    private int pillows, height, sheets, quilt;\n\n    public Bed(String style, int pillows, int height, int sheets, int quilt){\n        this.style = style;\n        this.pillows = pillows;\n        this.height = height;\n        this.sheets = sheets;\n        this.quilt = quilt;\n    }\n\n    public void make(){\n        System.out.print(\"Bed -> Making | \");\n    }\n    public String getStyle(){\n        return style;\n    }\n    public int getPillows(){\n        return pillows;\n    }\n    public int getHeight(){\n        return height;\n    }\n    public int getSheets(){\n        return sheets;\n    }\n    public int getQuilt(){\n        return quilt;\n    }\n}\n"}, {"path": "section08/exercise38/Bedroom.java", "mtime": 1793102168000000000, "size": 730, "text": "package section08.exercise38;\n\npublic class Bedroom {\n\n    private String name;\n    private Wall wall1, wall2, wall3, wall4;\n    private Ceiling ceiling;\n    private Bed bed;\n    private Lamp lamp;\n\n    public Bedroom(String name, Wall wall1, Wall wall2, Wall wall3, Wall wall4, Ceiling ceiling, Bed bed, Lamp lamp) {\n        this.name = name;\n        this.wall1 = wall1;     this.wall2 = wall2;     this.wall3 = wall3;     this.wall4 = wall4;\n        this.ceiling = ceiling;\n        this.bed = bed;\n        this.lamp = lamp;\n    }\n\n    public Lamp getLamp(){\n        return lamp;\n    }\n    public void makeBed(){\n        System.out.println(\"Bedroom -> Making bed | \");\n        bed.make();\n    }\n\n\n}\n\n"}, {"path": "section08/exercise38/Ceiling.java", "mtime": 1793102168000000000, "size": 374, "text": "package section08.exercise38;\n\npublic class Ceiling{\n\n    private int height, paintedColor;\n\n    public Ceiling(int height, int paintedColor){\n        this.height = height;\n        this.paintedColor = paintedColor;\n    }\n\n    public int getHeight(){\n        return height;\n    }\n    public int getPaintedColor(){\n        return paintedColor;\n    }\n    \n}\n"}, {"path": "section08/exercise38/Lamp.java", "mtime": 1793102168000000000, "size": 598, "text": "package section08.exercise38;\n\npublic class Lamp{\n\n    private String style;\n    private boolean battery;\n    private int globRating;\n\n    public Lamp(String style, boolean battery, int globRating){\n        this.style = style;\n        this.battery = battery;\n        this.globRating = globRating;\n    }\n\n    public void turnOn(){\n        System.out.print(\"Lamp -> Turning on\");\n    }\n    public String getStyle(){\n        return style;\n    }\n    public boolean isBattery(){\n        return battery;\n    }\n    public int getGlobRating(){\n        return globRating;\n    }\n}\n"}, {"path": "section08/exercise38/Statement", "mtime": 1793102168000000000, "size": 3863, "text": "This is an exercise in Class Composition. To complete the exercise, you must create five classes with associated member variables and methods.\nThe five classes should be created as follows:\n1) Create a class and name it Lamp. Inside this class should be declared three member variables: style of type String, battery of type boolean, and globRating of     type int. All variables should be marked private. A constructor needs to be created which accepts the three member variables as parameters. In addition, four methods should also be created: turnOn() has no return type and should print a message that the lamp is being turned on; getStyle() returns the lamp style; isBattery returns the value of battery; and getGlobRating() returns the globRating of the lamp.\n2) Create a class and name it Bed. Five private member variables should be declared: style of type String, and pillows, height, sheets, quilt of type int. A constructor should be coded which accepts these five member variables as parameters. Also, six methods should be defined: make() has no return type and prints a message to the effect that the bed is being made; getStyle() which returns the value of style; getPillows() returns the number of pillows; getHeight() returns the height of the bed; getSheets() returns the number of sheets on the bed; and getQuilt() returns the value of quilt.\n3) Create a class with the name Ceiling. There are two member variables for this one, height and paintedColor, both of type int. There should also be a constructor which accepts both member variables as parameters. There are also two additional methods which should be defined: getHeight() shall return the value of height and getPaintedColor() should return the value of paintedColor.\n4) Create a class with the name Wall. It contains one member variable, direction, and is of type String. A constructor for Wall should accept one parameter for the member variable direction. A getter should also be defined for the direction field called getDirection().\n5) Create a class with the name Bedroom. This class contains eight member variables:\nname of type String; wall1, wall2, wall3, wall4 of type Wall; ceiling of type Ceiling; bed of type Bed, and lamp of type Lamp. The class constructor should accept all eight of the member variables as parameters, and there should also be two additional methods:\ngetLamp() which returns an object of type Lamp, and makeBed() which prints a message that the bed is being made and also calls the make() method in the Bed class.\nInput/Output:\nOnce you have completed coding your classes you should then use the following code in your main class to test your code and for correct output. This way you can be sure that your code works before pasting your five classes into the code evaluator.\n\n    Wall wall1 = new Wall(\"West\");\n    Wall wall2 = new Wall(\"East\");\n    Wall wall3 = new Wall(\"South\");\n    Wall wall4 = new Wall(\"North\");\n\n    Ceiling ceiling = new Ceiling(12, 55);\n\n    Bed bed = new Bed(\"Modern\", 4, 3, 2, 1);\n\n    Lamp lamp = new Lamp(\"Classic\", false, 75);\n\n    Bedroom bedRoom = new Bedroom(\"YOUR NAME HERE\", wall1, wall2, wall3, wall4, ceiling,bed, lamp);\n    bedRoom.makeBed();\n\n    bedRoom.getLamp().turnOn();\nTips:\nRemember that after testing you will not put your main method into the code evaluator. You will only paste in your five classes you have created in the exercise.\nTo be sure that the correct output is generated so your code passes the evaluation, use the following statements in your code:\n1) System.out.print(\"Bedroom -> Making bed | \"); should be used in the makeBed() method of the Bedroom class;\n2) System.out.print(\"Bed -> Making | \"); should be used in the make() method of the Bed class; and\n3) System.out.print(\"Lamp -> Turning on\"); should be used in the turnOn() method of the Lamp class."}, {"path": "section08/exercise38/Wall.java", "mtime": 1793102168000000000, "size": 242, "text": "package section08.exercise38;\n\npublic class Wall{\n\n    private String direction;\n\n    public Wall(String direction){\n        this.direction = direction;\n    }\n    public String getDirection(){\n        return direction;\n    }\n\n}\n"}, {"path": "section08/exercise40/Car.java", "mtime": 1793545951000000000, "size": 709, "text": "package section08.exercise40;\n\npublic class Car {\n\n    private boolean engine;\n    private int cylinders;\n    private String name;\n    private int wheels;\n\n    public Car(int cylinders, String name) {\n        this.cylinders = cylinders;\n        this.name = name;\n        this.engine = true;\n        this.wheels = 4;\n    }\n\n    public String startEngine() {\n        return \"Car -> startEngine()\";\n    }\n\n    public String accelerate() {\n        return \"Car -> accelerate()\";\n    }\n\n    public String brake() {\n        return \"Car -> brake()\";\n    }\n\n    public int getCylinders() {\n        return cylinders;\n    }\n\n    public String getName() {\n        return name;\n    }\n}\n"}, {"path": "section08/exercise40/Ford.java", "mtime": 1793545951000000000, "size": 444, "text": "package section08.exercise40;\n\npublic class Ford extends Car {\n\n    public Ford(int cylinders, String name) {\n        super(cylinders, name);\n    }\n\n    @Override\n    public String startEngine() {\n        return \"Ford -> startEngine()\";\n    }\n\n    @Override\n    public String accelerate() {\n        return \"Ford -> accelerate()\";\n    }\n\n    @Override\n    public String brake() {\n        return \"Ford -> brake()\";\n    }\n}\n"}, {"path": "section08/exercise40/Holden.java", "mtime": 1793545951000000000, "size": 454, "text": "package section08.exercise40;\n\npublic class Holden extends Car {\n\n    public Holden(int cylinders, String name) {\n        super(cylinders, name);\n    }\n\n    @Override\n    public String startEngine() {\n        return \"Holden -> startEngine()\";\n    }\n\n    @Override\n    public String accelerate() {\n        return \"Holden -> accelerate()\";\n    }\n\n    @Override\n    public String brake() {\n        return \"Holden -> brake()\";\n    }\n}\n"}, {"path": "section08/exercise40/Main.java", "mtime": 1793545951000000000, "size": 922, "text": "package section08.exercise40;\n\npublic class Main {\n    public static void main(String[] args) {\n        Car car = new Car(8, \"Base car\");\n        System.out.println(car.startEngine());\n        System.out.println(car.accelerate());\n        System.out.println(car.brake());\n\n        Mitsubishi mitsubishi = new Mitsubishi(6, \"Outlander VRX 4WD\");\n        System.out.println(mitsubishi.startEngine());\n        System.out.println(mitsubishi.accelerate());\n        System.out.println(mitsubishi.brake());\n\n        Ford ford = new Ford(6, \"Ford Falcon\");\n        System.out.println(ford.startEngine());\n        System.out.println(ford.accelerate());\n        System.out.println(ford.brake());\n\n        Holden holden = new Holden(6, \"Holden Commodore\");\n        System.out.println(holden.startEngine());\n        System.out.println(holden.accelerate());\n        System.out.println(holden.brake());\n    }\n}\n"}, {"path": "section08/exercise40/Mitsubishi.java", "mtime": 1793545951000000000, "size": 474, "text": "package section08.exercise40;\n\npublic class Mitsubishi extends Car {\n\n    public Mitsubishi(int cylinders, String name) {\n        super(cylinders, name);\n    }\n\n    @Override\n    public String startEngine() {\n        return \"Mitsubishi -> startEngine()\";\n    }\n\n    @Override\n    public String accelerate() {\n        return \"Mitsubishi -> accelerate()\";\n    }\n\n    @Override\n    public String brake() {\n        return \"Mitsubishi -> brake()\";\n    }\n}\n"}, {"path": "section08/exercise40/Statement", "mtime": 1793545951000000000, "size": 2945, "text": "For this exercise you will create four classes of vehicles. The first class should be named Car. This will be the base class for three other classes, Mitsubishi, Holden, and Ford.\n\nThe first class contains four member variables, or fields, with these names and conditions:\n\n    engine of type boolean\n\n    cylinders of type int\n\n    name of type String\n\n    wheels of type int\n\nAll four member variables should have private access.\n\nThe constructor should accept two parameters, cylinders and name. Also, all of these cars have an engine and four wheels. So the other two fields should be set to default values.\n\nIn addition, there are five other methods These methods should be defined as described below:\n\n    startEngine accepts no parameters and returns a message which says that the car's engine is starting.\n\n    accelerate accepts no parameters and returns a message that says the car is accelerating.\n\n    brake accepts no parameters and returns a message stating the car is braking.\n\nThe messages these methods return should somewhere contain the name of the class, Car.\n\nTwo getter methods should also be defined here for the member variables cylinders and name. All methods have public access.\n\nThe other three classes mentioned above are sub-classes of Car. These classes have no member variables and the constructor for each will call the parent constructor for object instantiation. Each of these classes will override the three parent methods startEngine, accelerate, and brake. The return messages for these methods should somewhere contain the name of the class to which the methods belong.\n\nExample input:\n\n    Car car = new Car(8, \"Base car\");\n    System.out.println(car.startEngine());\n    System.out.println(car.accelerate());\n    System.out.println(car.brake());\n\n    Mitsubishi mitsubishi = new Mitsubishi(6, \"Outlander VRX 4WD\");\n    System.out.println(mitsubishi.startEngine());\n    System.out.println(mitsubishi.accelerate());\n    System.out.println(mitsubishi.brake());\n\n    Ford ford = new Ford(6, \"Ford Falcon\");\n    System.out.println(ford.startEngine());\n    System.out.println(ford.accelerate());\n    System.out.println(ford.brake());\n\n    Holden holden = new Holden(6, \"Holden Commodore\");\n    System.out.println(holden.startEngine());\n    System.out.println(holden.accelerate());\n    System.out.println(holden.brake());\n\nExample output:\n\n    Car -> startEngine()\n    Car -> accelerate()\n    Car -> brake()\n    Mitsubishi -> startEngine()\n    Mitsubishi -> accelerate()\n    Mitsubishi -> brake()\n    Ford -> startEngine()\n    Ford -> accelerate()\n    Ford -> brake()\n    Holden -> startEngine()\n    Holden -> accelerate()\n    Holden -> brake()\n\nNotes:\n\n    Remember that your Main class is not included in the code evaluation.\n\n    You should paste the code from each of your classes into the respective class file in the code evaluator.\n\n"}, {"path": "section09/MinimumElement.java", "mtime": 1793789007000000000, "size": 2098, "text": "/*\nWrite a method called readInteger() that has no parameters and returns an int.\nIt needs to read in an integer from the user - this represents how many elements the user needs to enter.\nWrite another method called readElements() that has one parameter of type int\nThe method needs to read from the console until all the elements are entered, and then return an array containing the elements entered.\nAnd finally, write a method called findMin() with one parameter of type int[]. The method needs to return the minimum value in the array.\nThe scenario is:\n1. readInteger() is called.\n2. The number returned by readInteger() is then used to call readElements().\n3. The array returned from readElements() is used to call findMin().\n4. findMin() returns the minimum number.\n[Do not try and implement this. It is to give you an idea of how the methods will be used]\nTIP: Assume that the user will only enter numbers, never letters.\nTIP: Instantiate (create) the Scanner object inside the method. There are two scanner objects, one for each of the two methods that are reading in input from the user.\nTIP: Be extremely careful about spaces in the printed message.\nNOTE: All methods should be defined as private static.\nNOTE: Do not add a main method to the solution code.\nNOTE: Classes that are not in the java.lang package should be manually imported.\n */\npackage section09;\n\nimport java.util.Scanner;\n\npublic class MinimumElement {\n\n    private static int readInteger(){\n        Scanner sc = new Scanner(System.in);\n        return sc.nextInt();\n    }\n    private static int[] readElements(int length){\n        Scanner sc = new Scanner(System.in);\n        int [] array = new int [length];\n\n        for(int i = 0; i<array.length; i++){\n            array[i] = sc.nextInt();\n        }\n        return array;\n    }\n\n    private static int findMin(int[] array){\n        int minimumValue = array[0];\n        for(int i = 0; i < array.length; i++){\n            if(array[i] < minimumValue) minimumValue = array[i];\n        }\n\n        return minimumValue;\n    }\n}\n"}, {"path": "section09/SortedArray.java", "mtime": 1793708889000000000, "size": 3144, "text": "/*\nCreate a program using arrays that sorts a list of integers in descending order.\nDescending order is highest value to lowest.\nIn other words if the array had the values in it [106, 26, 81, 5, 15] your program should ultimately have an array with [106, 81, 26, 15, 5] in it.\nSet up the program so that the numbers to sort are read in from the keyboard (Scanner).\nImplement the following methods:\ngetIntegers has one parameter of type int which is the size of the array. It returns an array of entered integers from the keyboard.\nprintArray accepts an array and prints out the contents of the array. It should be printed in the following format:\n    Element 0 contents 106\n    Element 1 contents 81\n    Element 2 contents 26\n    Element 3 contents 15\n    Element 4 contents 5\nsortIntegers accepts the unsorted array. It should sort the array and return a new array containing the sorted numbers.\nThe scenario is:\n1. getIntegers() is called.\n2. The returned array from getIntegers() is then used to call sortIntegers().\n3. The returned array from sortIntegers() is then printed to the console.\n[Do not try and implement this. It is to give you an idea of how the methods will be used]\nTIP: you will have to figure out how to copy the array elements from the passed array into a new array and sort them and return the new sorted array.\nTIP: Instantiate (create) the Scanner object inside the method.\nTIP: Be extremely careful about spaces in the printed message.\nNOTE: All methods should be defined as public static NOT public.\nNOTE: Do not add a main method to the solution code.\nNOTE: Classes that are not in the java.lang package should be manually imported.\n */\npackage section09;\nimport java.util.Scanner;\nimport java.util.Arrays;\n\npublic class SortedArray {\n    //Can use -> int[] array; new int[] {106, 81, 26, 15, 5}; or int[] array = {106, 81, 26, 15, 5}; Also works ->int[] array = new int[] {106, 81, 26, 15, 5};\n    public static int[] getIntegers(int len) {\n        Scanner sc = new Scanner(System.in);\n        int[] array = new int[len];\n        for (int i = 0; i < array.length; i++) {\n            array[i] = sc.nextInt();\n        }\n        return array;\n    }\n\n    public static int[] sortIntegers(int[] sortArray) {\n        int[] sortedArray = Arrays.copyOf(sortArray, sortArray.length); //The sortArray parameter is the getIntegers return. In main method is more clear\n        Arrays.sort(sortedArray); //Sorts the array into ascending num order\n        int[] inversedSortedArray = new int[sortedArray.length];\n        int j = 0;\n        //There is a method to invert the arrays, but I didn't know about it, this solution is the one I designed without knowing that\n        //Inverts the array\n        for (int i = sortedArray.length - 1; i >= 0; i--) {\n            inversedSortedArray[j] = sortedArray[i];\n            j++;\n        }\n        return inversedSortedArray;\n    }\n\n    public static void printArray(int[] array) {\n        for (int i = 0; i < array.length; i++) {\n            System.out.println(\"Element \" + i + \" contents \" + array[i]);\n        }\n    }\n}\n"}]};</script>

// Dificultad del libro: la primera línea del comentario es "N star(s)", con una nota opcional tras "//"
const LEVELS = [{label:"Sin estrellas",c:"--c-teal"},{label:"★",c:"--c-blue"},{label:"★★",c:"--c-orange"},{label:"★★★",c:"--c-green"}];
const lv = n => `--c:var(${LEVELS[n].c});--cl:var(${LEVELS[n].c}-l)`;
// Prioridad: carpeta prioridadAlta / prioridadMedia / prioridadBaja dentro del capítulo (en la página, en inglés)
const PRIORITY = [{label:"High priority",c:"--c-orange"},{label:"Medium priority",c:"--c-blue"},{label:"Low priority",c:"--c-teal"}];
const pv = n => `--c:var(${PRIORITY[n].c});--cl:var(${PRIORITY[n].c}-l)`;
const priorityOf = rel => { const m = rel.match(/\/prioridad(alta|media|baja)\//i); return m ? ["alta","media","baja"].indexOf(m[1].toLowerCase()) : null; };
function liangHead(comment){
  const m = comment.match(/^\s*(\d)\s*stars?\b[ \t]*(?:\/\/[ \t]*(.*))?\r?\n/i);
  return m ? {level:Math.min(+m[1],3), note:(m[2]||"").trim(), rest:comment.slice(m[0].length)} : {level:null, note:"", rest:comment};
}
const SECTION = {"05":["Condicionales y métodos","cond"],"06":["Bucles y números","loop"],"07":["POO I · clases y herencia","poo"],"08":["POO II · composición y polimorfismo","poo"],"09":["Arrays","arr"]};

function place(path){
  const name = path.split("/").pop(); let m;
  if (path.startsWith(PREP)){
    const rel = path.slice(PREP.length);
    if (/ipCollegeClass\/Analisis/.test(rel)) return {area:"examen", sub:"Análisis", order:0};
    if (rel.includes("/contenidosPOOExamen/")) return {area:"examen", sub:"Fichas de POO", order: name==="README.md" ? 1 : 2 + parseInt(name)||9};
    if (/ipCollegeClass\//.test(rel)) return {area:"resumenes", sub:"IP2027", order:0};
    if (/udemyCourse\//.test(rel)) return {area:"resumenes", sub:"Udemy", order:1};
    if (rel.startsWith("practiceExams/")) return {area:"simulacros", sub:"Exámenes de práctica", order:parseInt((name.match(/\d+/)||[9])[0])};
    if ((m = rel.match(/^exercisesLiang\/(?:section|chapter)(\d+)\//))){
      const c = m[1].padStart(2,"0"), ch = CHAPTER[c] || ["",null];
      const n = name.match(/(\d+)_(\d+)\.java$/);
      return {area:"liang", sub:`Capítulo ${c}${ch[0]?" · "+ch[0]:""}`, order:parseInt(c), type:ch[1], priority:priorityOf(rel), num: n ? parseInt(n[1])*1000+parseInt(n[2]) : 1e9, numLabel: n ? `${n[1]}.${n[2]}` : ""};
    }
    if (rel.startsWith("Notes/")) return {area:"notas", sub:"Estudio", order:/Seleccion/.test(name)?0:1};
    return {area:"resumenes", sub:"Otros", order:5};
  }
  if ((m = path.match(/^section(\d+)\//))){
    const s = m[1].padStart(2,"0"), sec = SECTION[s] || ["",null];
    return {area:"udemy", sub:`Sección ${s} · ${sec[0]}`, order:parseInt(s), type:sec[1]};
  }
  return null;
}

let files=[], docs=[], cache=new Map();
const byKey = k => docs.find(d=>d.key===k);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isStatement = p => /statement/i.test(p.split("/").pop());
const plain = s => s.replace(/`([^`]*)`/g,"$1").replace(/\*\*?([^*]+)\*\*?/g,"$1").replace(/\[([^\]]+)\]\([^)]*\)/g,"$1").trim();

function build(){
  const map = new Map();
  for (const f of files){
    const pl = place(f.path); if (!pl) continue;
    const ex = f.path.match(/^(section\d+\/exercise\d+)\//);
    const key = ex ? ex[1] : f.path;
    if (!map.has(key)) map.set(key, {key, ...pl, files:[], folder:!!ex});
    map.get(key).files.push(f);
  }
  docs = [...map.values()];
  for (const d of docs){
    d.files.sort((a,b)=> isStatement(b.path)-isStatement(a.path) || a.path.localeCompare(b.path));
    d.mtime = Math.max(...d.files.map(f=>f.mtime));
    const last = d.key.split("/").pop();
    d.title = d.folder ? "Ejercicio " + last.replace("exercise","")
      : (d.numLabel ? d.numLabel + " · " : "") + last.replace(/\.(md|java)$/,"").replace(/\d+_\d+$/,"").replace(/([A-Za-z])(\d)/g,"$1 $2").replace(/_/g," ").replace(/([a-z])([A-Z])/g,"$1 $2");
    d.desc = "";
    const t = cache.get(d.files[0].path)?.text;
    if (t){
      if (d.key.endsWith(".md")){
        const h = t.match(/^#\s+(.+)$/m); if (h) d.title = plain(h[1]);
        const para = t.split(/\n\s*\n/).map(x=>x.trim()).find(x=>x && !/^[#|`>\-]/.test(x) && !/^\d+\./.test(x));
        if (para) d.desc = plain(para.replace(/\n/g," "));
      } else {
        let st = isStatement(d.files[0].path) ? t : (t.match(/\/\*([\s\S]*?)\*\//)||[])[1] || "";
        if (d.area==="liang"){ const h = liangHead(st); d.level = h.level; d.note = h.note; st = h.rest; }
        d.desc = st.replace(/^\s*\* ?/gm,"").replace(/\s+/g," ").trim();
      }
      if (d.desc.length > 170) d.desc = d.desc.slice(0,167).replace(/\s\S*$/,"") + "…";
    }
  }
  docs.sort((a,b)=> AREAS.findIndex(x=>x.id===a.area)-AREAS.findIndex(x=>x.id===b.area) || a.order-b.order || (a.priority??9)-(b.priority??9) || (a.num??0)-(b.num??0) || a.key.localeCompare(b.key,undefined,{numeric:true}));
}
const inArea = id => docs.filter(d=>d.area===id);
// "Sección 05 · Condicionales y métodos" → {kick:"Sección 05", title:"Condicionales y métodos"}
function splitSub(sub){ const m = sub.match(/^((?:Sección|Capítulo) \d+)(?: · (.+))?$/); return m ? {kick:m[2]?m[1]:"", title:m[2]||m[1]} : {kick:"", title:sub}; }
function subLabel(sub){ const sp = splitSub(sub); return (sp.kick?`<small>${esc(sp.kick)}</small>`:"") + esc(sp.title); }
function groupBy(list){ const g=new Map(); for (const d of list){ if(!g.has(d.sub)) g.set(d.sub,[]); g.get(d.sub).push(d); } return g; }

async function getText(f){
  const c = cache.get(f.path); if (c && c.mtime === f.mtime) return c.text;
  const r = await fetch("/" + f.path.split("/").map(encodeURIComponent).join("/") + "?t=" + f.mtime);
  const text = await r.text(); cache.set(f.path,{mtime:f.mtime,text}); return text;
}

/* ================= Rutas ================= */
// ""            portada
// #s/<area>     sección
// #/<ruta>?q=   documento (q = término a resaltar)
// #buscar/<q>   resultados
function parse(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("/")){ const [p,q] = h.slice(1).split("?q="); return {view:"doc", key:p, q:q||""}; }
  if (h.startsWith("s/")) return {view:"area", id:h.slice(2)};
  if (h.startsWith("buscar/")) return {view:"search", q:h.slice(7)};
  return {view:"home"};
}
const app = document.getElementById("app");
let typeFilter = new Set(), levelFilter = new Set(), prioFilter = new Set();

function renderTabs(r){
  const cur = r.view==="area" ? r.id : r.view==="doc" ? byKey(r.key)?.area : null;
  const html = `<a href="#" class="${r.view==="home"?"on":""}">Inicio</a>` + AREAS.map(a=>`<a href="#s/${a.id}" class="${cur===a.id?"on":""}">${a.name}</a>`).join("");
  document.getElementById("tabs").innerHTML = html;
}

async function render(keepScroll){
  const r = parse(), y = scrollY;
  document.body.classList.remove("menu");
  renderTabs(r);
  if (r.view==="doc" && byKey(r.key)) await renderDoc(byKey(r.key), r.q);
  else if (r.view==="area" && AREAS.some(a=>a.id===r.id)) renderArea(r.id);
  else if (r.view==="search") renderSearch(r.q);
  else renderHome();
  if (keepScroll) scrollTo(0,y);
  else if (!(r.view==="doc" && r.q)) scrollTo(0,0);
}
